<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Oma ASCII — Retro Terminal Art</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;height:100vh;width:100vw}canvas{display:block}.hud{position:fixed;top:10px;left:10px;color:#00ff66;font-family:Courier New,monospace;font-size:0.8rem;text-shadow:0 0 8px rgba(0,255,102,0.5);pointer-events:none;line-height:1.6;z-index:10}.title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#00ff66;font-family:Courier New,monospace;font-size:2rem;font-weight:bold;letter-spacing:8px;text-shadow:0 0 30px rgba(0,255,102,0.6);pointer-events:none;opacity:0;transition:opacity 2s;z-index:10}.hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:#006633;font-family:Courier New,monospace;font-size:0.75rem;pointer-events:none;z-index:10}.scanline{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;background:linear-gradient(transparent 50%,rgba(0,0,0,0.04) 50%);background-size:100% 4px}</style></head><body><canvas id="c"></canvas><div class="scanline"></div><div class="hud" id="hud">OMA ASCII<br>Mode: Matrix Rain<br>Click to cycle modes</div><div class="title" id="title">OMA ASCII</div><div class="hint">Retro terminal — click to switch modes: Matrix / Plasma / Waves / Flow</div><script>const cv=document.getElementById('c');const ctx=cv.getContext('2d');let W,H,CW,CH,cols,rows;const cellW=10,cellH=14;let mode=0;const modes=['Matrix Rain','Plasma Field','Wave Interference','Flowing Text'];const chars='01ABCDEFGHJKLMNPQRSTUVWXYZ@#$%&*+=~<>?/\|{}[]()!^';function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;cols=Math.ceil(W/cellW);rows=Math.ceil(H/cellH);CW=cols*cellW;CH=rows*cellH}resize();addEventListener('resize',resize);let drops=[];let t=0;let flowText='OMA ASCI ART LIVES IN THE TERMINAL VOID WHERE PIXELS BECOME GLYPHS AND GLYPHS BECOME DREAMS  ';let flowPos=0;function initMatrix(){drops=Array(cols).fill(0).map(()=>Math.random()*rows)}initMatrix();function renderMatrix(){ctx.fillStyle='rgba(0,0,0,0.08)';ctx.fillRect(0,0,W,H);ctx.font='12px Courier New';ctx.textBaseline='top';for(let i=0;i<cols;i++){const ch=chars[Math.floor(Math.random()*chars.length)];const x=i*cellW;const y=drops[i]*cellH;const grad=Math.random();ctx.fillStyle=`rgba(0,255,102,${0.3+grad*0.7})`;if(grad>0.92)ctx.fillStyle='#ccffdd';ctx.fillText(ch,x,y);if(y>H&&Math.random()>0.975)drops[i]=0;drops[i]++}}function renderPlasma(){ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(0,0,W,H);ctx.font='12px Courier New';ctx.textBaseline='top';for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){const x=c*cellW;const y=r*cellH;const v=Math.sin(x*0.03+t*0.02)+Math.sin(y*0.03+t*0.015)+Math.sin((x+y)*0.02+t*0.025)+Math.sin(Math.sqrt(x*x+y*y)*0.02+t*0.02);const norm=(v+4)/8;const ch=chars[Math.floor(norm*(chars.length-1))];const r2=Math.floor(norm*100);const g=Math.floor(200+norm*55);const b=Math.floor(norm*50);ctx.fillStyle=`rgba(${r2},${g},${b},0.85)`;ctx.fillText(ch,x,y)}}}function renderWaves(){ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fillRect(0,0,W,H);ctx.font='12px Courier New';ctx.textBaseline='top';for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){const x=c*cellW;const y=r*cellH;const cx1=W*0.3,cy1=H*0.4,cx2=W*0.7,cy2=H*0.6;const d1=Math.sqrt((x-cx1)**2+(y-cy1)**2);const d2=Math.sqrt((x-cx2)**2+(y-cy2)**2);const v=Math.sin(d1*0.05-t*0.08)+Math.sin(d2*0.04+t*0.06);const norm=(v+2)/4;const ch=chars[Math.floor(norm*(chars.length-1))];const r2=Math.floor(100+norm*155);const g2=Math.floor(50+norm*200);const b2=Math.floor(80+norm*100);ctx.fillStyle=`rgba(${r2},${g2},${b2},0.8)`;ctx.fillText(ch,x,y)}}}function renderFlow(){ctx.fillStyle='rgba(0,0,0,0.12)';ctx.fillRect(0,0,W,H);ctx.font='14px Courier New';ctx.textBaseline='top';for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){const x=c*cellW;const y=r*cellH;const angle=Math.sin(c*0.1+t*0.02)*Math.PI+Math.cos(r*0.08+t*0.015)*Math.PI;const dx=Math.cos(angle)*5;const dy=Math.sin(angle)*3;const ch=chars[Math.floor(Math.abs(Math.sin(c*0.05+r*0.03+t*0.03))*chars.length)%chars.length];const hue=(c*5+r*3+t*2)%360;const lum=40+Math.sin(c*0.1+r*0.05+t*0.05)*30;ctx.fillStyle=`hsla(${hue},70%,${lum}%,0.75)`;ctx.save();ctx.translate(x+cellW/2,y+cellH/2);ctx.rotate(angle*0.1);ctx.fillText(ch,0,0);ctx.restore()}}}function render(){t++;switch(mode){case 0:renderMatrix();break;case 1:renderPlasma();break;case 2:renderWaves();break;case 3:renderFlow();break}if(t%10===0)document.getElementById('hud').innerHTML=`OMA ASCII<br>Mode: ${modes[mode]}<br>Grid: ${cols}x${rows}<br>Click to cycle modes`}cv.addEventListener('click',()=>{mode=(mode+1)%modes.length;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);if(mode===0)initMatrix();document.getElementById('hud').innerHTML=`OMA ASCII<br>Mode: ${modes[mode]}<br>Click to cycle modes`});if(t===0)setTimeout(()=>document.getElementById('title').style.opacity='0.6',100);setTimeout(()=>document.getElementById('title').style.opacity='0',3000);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);setInterval(render,50)</script></body></html>
