<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1.0"><title>Agent Loop - Technical Diagram</title><style>body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#0d1117;color:#c9d1d9}h1{color:#58a6ff;margin-bottom:5px}p.sub{color:#8b949e;margin-top:0}.svg-wrap{max-width:920px;margin:20px auto}</style></head><body><h1>Agent Loop - Technical Diagram</h1><p class=sub>Simplified version of the NorthStar diagram</p><div class=svg-wrap><svg width=900 height=650 viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg"><defs><marker id=arrow markerWidth=10 markerHeight=10 refX=9 refY=3 orient=auto><path d="M0,0 L0,6 L9,3 z" fill=#58a6ff/></marker></defs><text x=450 y=30 text-anchor=middle font-size=22 font-weight=bold fill=#58a6ff>Agent Loop Architecture</text><rect x=50 y=90 width=200 height=100 rx=10 fill=#161b22 stroke=#58a6ff stroke-width=2/><text x=150 y=120 text-anchor=middle font-size=16 font-weight=bold fill=#58a6ff>Step 1: Query Memory</text><text x=150 y=145 text-anchor=middle font-size=12 fill=#c9d1d9>Retrieves context:</text><text x=150 y=165 text-anchor=middle font-size=11 fill=#8b949e>past lessons, skills,</text><text x=150 y=180 text-anchor=middle font-size=11 fill=#8b949e>relevant memories</text><line x1=250 y1=140 x2=360 y2=140 stroke=#58a6ff stroke-width=2 marker-end="url(#arrow)"/><rect x=360 y=90 width=200 height=100 rx=10 fill=#1c1c3a stroke=#a371f7 stroke-width=2/><text x=460 y=120 text-anchor=middle font-size=16 font-weight=bold fill=#a371f7>Step 2: LLM Reasons</text><text x=460 y=145 text-anchor=middle font-size=12 fill=#c9d1d9>Receives the prompt,</text><text x=460 y=160 text-anchor=middle font-size=11 fill=#8b949e>memory, tool outputs,</text><text x=460 y=175 text-anchor=middle font-size=11 fill=#8b949e>context. Plans.</text><line x1=560 y1=140 x2=670 y2=140 stroke=#58a6ff stroke-width=2 marker-end="url(#arrow)"/><rect x=670 y=90 width=180 height=100 rx=10 fill=#161b22 stroke=#5da6ff stroke-width=2/><text x=760 y=120 text-anchor=middle font-size=15 font-weight=bold fill=#5da6ff>Step 3: Execute</text><text x=760 y=140 text-anchor=middle font-size=12 fill=#5da6ff>Up to 5</text><text x=760 y=165 text-anchor=middle font-size=12 fill=#c9d1d9>tools/cycle</text><line x1=760 y1=190 x2=760 y2=280 stroke=#5da6ff stroke-width=2 marker-end="url(#arrow)"/><rect x=630 y=280 width=260 height=80 rx=10 fill=#1c1c3a stroke=#a371f7 stroke-width=2/><text x=760 y=305 text-anchor=middle font-size=15 font-weight=bold fill=#a371f7>Step 4: Results Return</text><text x=760 y=325 text-anchor=middle font-size=12 fill=#c9d1d9>Tool outputs feed</text><text x=760 y=340 text-anchor=middle font-size=12 fill=#c9d1d9>back to next cycle</text><path d="M630 320 Q500 520 150 190" fill=none stroke=#5da6ff stroke-width=2 stroke-dasharray="5,5"/><text x=400 y=500 text-anchor=middle font-size=13 fill=#8ab9ff font-style=italic>Loop iteration (not a single pass)</text><rect x=50 y=420 width=800 height=170 rx=10 fill=#161b22 stroke=#30363d stroke-width=1/><text x=450 y=445 text-anchor=middle font-size=14 font-weight=bold fill=#59a6ff>Tools - equal peers (per cycle, any order)</text><rect x=70 y=470 width=130 height=40 rx=5 fill=#21262d stroke=#30363d/><text x=135 y=493 text-anchor=middle font-size=11 fill=#c9d1d9>pin - working mem</text><rect x=210 y=470 width=140 height=40 rx=5 fill=#21262d stroke=#30363d/><text x=280 y=493 text-anchor=middle font-size=11 fill=#c9d1d9>remember - longterm</text><rect x=360 y=470 width=130 height=40 rx=5 fill=#21262d stroke=#30363d/><text x=425 y=493 text-anchor=middle font-size=11 fill=#c9d1d9>query - retrieval</text><rect x=500 y=470 width=120 height=40 rx=5 fill=#21262d stroke=#30363d/><text x=560 y=493 text-anchor=middle font-size=11 fill=#c9d1d9>shell - world</text><rect x=630 y=470 width=120 height=40 rx=5 fill=#21262d stroke=#30363d/><text x=690 y=493 text-anchor=middle font-size=11 fill=#c9d1d9>send - user</text><rect x=760 y=470 width=120 height=40 rx=5 fill=#21262d stroke=#30363d/><text x=820 y=493 text-anchor=middle font-size=11 fill=#c9d1d9>metta - logic</text><rect x=50 y=600 width=800 height=40 rx=10 fill=#1c1c3a stroke=#a371f7 stroke-width=1/><text x=450 y=625 text-anchor=middle font-size=13 fill=#a371f7>Key insight: Intelligence emerges from the loop itself - compounding into capability no single call can match.</text></svg></div></body></html>
