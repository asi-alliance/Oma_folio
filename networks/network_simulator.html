<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<title>Social Network Simulator</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#c8c8e0;font-family:Georgia,serif;overflow:hidden}
#controls{position:fixed;left:0;top:0;bottom:0;width:240px;background:rgba(15,15,35,0.95);border-right:1px solid #223;padding:16px;overflow-y:auto;z-index:5}
#controls label{display:block;font-size:12px;color:#889;margin:10px 0 4px}
#controls input[type=range]{width:100%}
#controls button{width:100%;padding:8px;margin:4px 0;background:#1a1a3a;color:#aabbdd;border:1px solid #335;border-radius:4px;font-size:13px;cursor:pointer}
#controls button:hover{background:#2a2a5a}
#graph{position:fixed;left:240px;top:0;right:0;bottom:0}
svg{width:100%;height:100%}
.node{cursor:pointer}
.link{stroke-opacity:0.35}
.legend{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px}
.legend-dot{width:10px;height:10px;border-radius:50%}
</style>
</head>
<body>
<div id="controls">
<h2 style="color:#88aaff;margin-bottom:12px">Network Simulator</h2>
<label>Size: <span id="v-size">40</span></label>
<input type=range id=size min=10 max=120 value=40>
<label>Connections: <span id=v-conn>3</span></label>
<input type=range id=conn min=1 max=8 value=3>
<label>Charge: <span id=v-charge>-120</span></label>
<input type=range id=charge min=-400 max=-20 value=-120>
<label>Distance: <span id=v-dist>60</span></label>
<input type=range id=dist min=20 max=200 value=60>
<label>Infection Rate: <span id=v-infect>0.15</span></label>
<input type=range id=infect min=0 max=100 value=15>
<label>Recovery Rate: <span id=v-recov>0.05</span></label>
<input type=range id=recov min=0 max=100 value=5>
<label>Speed: <span id=v-speed>1.0x</span></label>
<input type=range id=speed min=0 max=50 value=10>
<div class=legend>
<div class=legend-item><div class=legend-dot style=background:#4488ff></div>Susceptible</div>
<div class=legend-item><div class=legend-dot style=background:#ff4444></div>Infected</div>
<div class=legend-item><div class=legend-dot style=background:#44dd44></div>Recovered</div>
</div>
<button id=regen>Regenerate Network</button>
<button id=infectBtn>Infect Random Node</button>
<button id=resetInf>Reset Infections</button>
<button id=pauseBtn>Pause/Resume</button>
<b style="color:#88aaff">How it works:</b><br>Nodes = people. Links = social connections.<br>Click a node to infect it. Watch ideas spread.<br><br><b style="color:#88aaff">Stats:</b><br><span id=stats>S:0 I:0 R:0</span>
</div></div><div id=graph><svg id=svg></svg></div>
<script>var svg=d3.select("#svg"),width=window.innerWidth-240,height=window.innerHeight,nodes=[],links=[],simulation,running=true,tickCount=0;
var STATES={S:0,I:1,R:2};var COLORS=['#4488ff','#ff4444','#44dd44'];
function generateNetwork(){var n=params.size;nodes=[];links=[];
for(var i=0;i<n;i++)nodes.push({id:i,state:STATES.S,infectedAt:-1,degree:0});
var k=Math.min(params.conn,n-1);for(var i=0;i<n;i++){for(var j=1;j<=Math.floor(k/2);j++){var t=(i+j)%n;links.push({source:i,target:t});nodes[i].degree++;nodes[t].degree++;}}
