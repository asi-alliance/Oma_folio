<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Oma Racing - Full Throttle</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial,sans-serif;color:#fff;overflow:hidden}canvas{border:2px solid #0f3460;border-radius:8px;box-shadow:0 0 30px rgba(0,200,255,0.3)}#hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;gap:20px;font-size:16px;font-weight:bold;text-shadow:2px 2px 4px #000;z-index:10}.hud-box{background:rgba(0,0,0,0.6);padding:6px 16px;border-radius:6px;border:1px solid #0f3460}#minimap{position:absolute;bottom:10px;right:10px;border:1px solid #0f3460;border-radius:4px;background:rgba(0,0,0,0.5);z-index:10}#startScreen,#carScreen,#trackScreen,#resultsScreen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(10,10,30,0.92);z-index:20;text-align:center}#startScreen h1{font-size:48px;margin-bottom:10px;color:#00d9ff;text-shadow:0 0 20px rgba(0,217,255,0.5)}#startScreen p{font-size:18px;color:#aaa;margin-bottom:30px}.btn{background:linear-gradient(135deg,#0f3460,#16537e);color:#fff;border:2px solid #00d9ff;padding:14px 40px;font-size:20px;border-radius:10px;cursor:pointer;transition:all 0.3s;margin:8px}.btn:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(0,217,255,0.4)}.car-card{width:200px;height:260px;background:rgba(15,52,96,0.4);border:2px solid #0f3460;border-radius:12px;margin:12px;padding:16px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:all 0.3s}.car-card:hover,.car-card.sel{border-color:#00d9ff;box-shadow:0 0 20px rgba(0,217,255,0.3);transform:translateY(-5px)}.car-name{font-size:18px;font-weight:bold;margin:10px 0 6px}.car-stats{font-size:13px;color:#aaa;width:100%;line-height:1.6}.stat-bar{height:8px;background:#333;border-radius:4px;margin:2px 0;width:100%;overflow:hidden}.stat-fill{height:100%;border-radius:4px}#carSelect{display:flex;flex-wrap:wrap;justify-content:center;max-width:900px}.track-card{width:220px;height:160px;background:rgba(15,52,96,0.4);border:2px solid #0f3460;border-radius:12px;margin:12px;padding:16px;cursor:pointer;transition:all 0.3s;display:flex;flex-direction:column;justify-content:center;align-items:center}.track-card:hover,.track-card.sel{border-color:#00d9ff;box-shadow:0 0 20px rgba(0,217,255,0.3);transform:translateY(-5px)}.track-name{font-size:20px;font-weight:bold;margin-bottom:6px}.track-desc{font-size:13px;color:#aaa;text-align:center}h2{font-size:32px;margin-bottom:20px;color:#00d9ff}#boostMeter{width:120px;height:8px;background:#333;border-radius:4px;overflow:hidden;margin-top:4px}#boostFill{height:100%;background:linear-gradient(90deg,#ff6b00,#ffd700);transition:width 0.1s}.controls-hint{font-size:13px;color:#888;margin-top:20px}</style></head><body><canvas id="gameCanvas" width="900" height="600"></canvas><canvas id="minimap" width="180" height="120"></canvas><div id="hud"><div class="hud-box">Lap: <span id="lapCount">1/3</span></div><div class="hud-box">Time: <span id="raceTime">0:00.0</span></div><div class="hud-box">Pos: <span id="position">1st</span></div><div class="hud-box">Speed: <span id="speed">0</span> km/h</div><div class="hud-box">Boost: <div id="boostMeter"><div id="boostFill" style="width:100%"></div></div></div></div><div id="startScreen"><h1>OMA RACING</h1><p>Full Throttle Championship</p><button class="btn" onclick="document.getElementById('startScreen').style.display='none';document.getElementById('carScreen').style.display='flex'">START</button><div class="controls-hint">Arrow Keys / WASD to drive | Space for Boost | Shift for Handbrake</div></div><div id="carScreen" style="display:none"><h2>Select Your Racer</h2><div id="carSelect"></div><button class="btn" id="toTracksBtn" style="display:none" onclick="document.getElementById('carScreen').style.display='none';document.getElementById('trackScreen').style.display='flex'">Select Track</button></div><div id="trackScreen" style="display:none"><h2>Select a Track</h2><div id="trackSelect"></div><button class="btn" id="raceBtn" style="display:none" onclick="startRace()">RACE!</button></div><div id="resultsScreen" style="display:none"><h2 id="resultTitle">Race Complete!</h2><p id="resultTime" style="font-size:22px;color:#aaa;margin:10px 0"></p><p id="resultBest" style="font-size:16px;color:#ffd700;margin-bottom:30px"></p><button class="btn" onclick="location.reload()">Race Again</button></div><script>const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');const mc=document.getElementById('minimap');const mcx=mc.getContext('2d');const W=900,H=600;const CARS=[{name:'Velocity',color:'#ff3366',maxSpeed:8.5,accel:0.18,handling:0.055,grip:0.92,boost:2.5,desc:'Top speed monster'},{name:'Falcon',color:'#00d9ff',maxSpeed:7.0,accel:0.24,handling:0.075,grip:0.96,boost:2.0,desc:'Balanced all-rounder'},{name:'Bolt',color:'#ffd700',maxSpeed:6.0,accel:0.32,handling:0.095,grip:1.0,boost:1.5,desc:'Agile corner master'},{name:'Titan',color:'#4CAF50',maxSpeed:7.5,accel:0.15,handling:0.045,grip:0.88,boost:3.0,desc:'Heavy boost bruiser'},{name:'Phantom',color:'#9b59b6',maxSpeed:7.8,accel:0.22,handling:0.065,grip:0.94,boost:2.2,desc:'Tech racer'},{name:'Comet',color:'#ff6b00',maxSpeed:8.0,accel:0.20,handling:0.060,grip:0.93,boost:2.4,desc:'Speed demon'}];const TRACKS=[{name:'Sunset Circuit',desc:'Fast flowing curves',bg:'#2a1a3e',roadColor:'#444',lineColor:'#ff6b00',waypoints:[[450,500],[450,350],[350,250],[250,250],[150,350],[150,450],[250,520],[350,520],[450,500]],roadWidth:70,laps:3},{name:'Neon Valley',desc:'Tight technical track',bg:'#1a2a1e',roadColor:'#3a3a3a',lineColor:'#00ff88',waypoints:[[450,520],[350,480],[250,500],[150,400],[120,300],[200,200],[350,180],[450,220],[550,200],[700,250],[750,350],[700,450],[600,500],[450,520]],roadWidth:60,laps:3},{name:'Desert Storm',desc:'Long high-speed oval',bg:'#3e2a1a',roadColor:'#555',lineColor:'#ffd700',waypoints:[[450,520],[600,510],[750,450],[780,300],[750,150],[600,100],[300,100],[150,150],[120,300],[150,450],[300,510],[450,520]],roadWidth:80,laps:4},{name:'Ice Canyon',desc:'Slippery narrow path',bg:'#1a2a3e',roadColor:'#5a5a6a',lineColor:'#00ddff',waypoints:[[450,500],[500,400],[400,350],[300,380],[200,320],[250,220],[350,200],[450,250],[550,220],[650,280],[600,380],[500,420],[450,500]],roadWidth:50,laps:3}];let selCar=1,selTrack=0,gMode='menu';let player={},aiCars=[],curTrack=null,tPath=[],cps=[];let raceStart=0,lapStart=0,curLap=1,totalLaps=3;let boost=100,boosting=false,bestLap=999,lapTimes=[];let particles=[],skids=[];let keys={};let camX=0,camY=0;
CARS.forEach((c,i)=>{const el=document.createElement('div');el.className='car-card'+(i===selCar?' sel':'');el.onclick=()=>{selCar=i;document.querySelectorAll('.car-card').forEach((e,j)=>e.classList.toggle('sel',j===i));document.getElementById('toTracksBtn').style.display='inline-block'};el.innerHTML='<div style="font-size:40px;color:'+c.color+'">&#9650;</div><div class="car-name">'+c.name+'</div><div class="car-stats"><div>Speed</div><div class="stat-bar"><div class="stat-fill" style="width:'+c.maxSpeed/9*100+'%;background:'+c.color+'"></div></div><div>Accel</div><div class="stat-bar"><div class="stat-fill" style="width:'+c.accel/0.35*100+'%;background:'+c.color+'"></div></div><div>Handling</div><div class="stat-bar"><div class="stat-fill" style="width:'+c.handling/0.1*100+'%;background:'+c.color+'"></div></div><div style="margin-top:6px;color:#888">'+c.desc+'</div></div>';document.getElementById('carSelect').appendChild(el)});TRACKS.forEach((t,i)=>{const el=document.createElement('div');el.className='track-card'+(i===selTrack?' sel':'');el.onclick=()=>{selTrack=i;document.querySelectorAll('.track-card').forEach((e,j)=>e.classList.toggle('sel',j===i));document.getElementById('raceBtn').style.display='inline-block'};el.innerHTML='<div class="track-name">'+t.name+'</div><div class="track-desc">'+t.desc+'<br>'+t.laps+' Laps</div>';document.getElementById('trackSelect').appendChild(el)});document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;keys[e.key]=false});function buildTrack(ti){curTrack=TRACKS[ti];const pts=curTrack.waypoints;totalLaps=curTrack.laps;tPath=[];for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];for(let s=0;s<10;s++){const t=s/10;tPath.push({x:0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t*t+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t*t*t),y:0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t*t+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t*t*t)})}}cps=[];const sp=Math.floor(tPath.length/8);for(let i=0;i<tPath.length;i+=sp)cps.push({x:tPath[i].x,y:tPath[i].y})}
function isOnRoad(x,y){for(let i=0;i<tPath.length;i++){const dx=x-tPath[i].x,dy=y-tPath[i].y;if(dx*dx+dy*dy<curTrack.roadWidth*curTrack.roadWidth)return true}for(let i=0;i<tPath.length-1;i++){const ax=tPath[i].x,ay=tPath[i].y,bx=tPath[i+1].x,by=tPath[i+1].y;const dx=bx-ax,dy=by-ay;if(dx===0&&dy===0){if(Math.hypot(x-ax,y-ay)<curTrack.roadWidth)return true;continue}const t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy)));if(Math.hypot(x-(ax+t*dx),y-(ay+t*dy))<curTrack.roadWidth)return true}return false}function startRace(){document.getElementById('trackScreen').style.display='none';document.getElementById('hud').style.display='flex';buildTrack(selTrack);const cd=CARS[selCar];const sp=tPath[0],np=tPath[5];const ang=Math.atan2(np.y-sp.y,np.x-sp.x);player={x:sp.x,y:sp.y,angle:ang,speed:0,maxSpeed:cd.maxSpeed,accel:cd.accel,handling:cd.handling,grip:cd.grip,boostPower:cd.boost,color:cd.color,name:cd.name,laps:0,ncp:0,finished:false};aiCars=[];for(let i=0;i<3;i++){const ac=CARS[(selCar+i+1)%CARS.length];const off=30+(i+1)*25;const pa=ang+Math.PI/2;aiCars.push({x:sp.x+Math.cos(pa)*off,y:sp.y+Math.sin(pa)*off,angle:ang,speed:0,maxSpeed:ac.maxSpeed*0.92,accel:ac.accel*0.95,handling:ac.handling,color:ac.color,name:ac.name,pi:5+i*3,tspeed:ac.maxSpeed*0.85,laps:0,ncp:0,finished:false})}gMode='race';raceStart=performance.now();lapStart=raceStart;curLap=1;boost=100;boosting=false;lapTimes=[];particles=[];skids=[]}function checkCP(car){const cp=cps[car.ncp];if(!cp)return;const d=Math.hypot(car.x-cp.x,car.y-cp.y);if(d<curTrack.roadWidth+15){car.ncp=(car.ncp+1)%cps.length;if(car.ncp===0){car.laps++;if(car===player){const now=performance.now();const lt=(now-lapStart)/1000;lapTimes.push(lt);if(lt<bestLap)bestLap=lt;lapStart=now;curLap=car.laps+1;if(car.laps>=totalLaps){car.finished=true;endRace()}}}}}
function updatePlayer(){if(player.finished)return;if(keys['arrowup']||keys['w'])player.speed+=player.accel;else if(keys['arrowdown']||keys['s'])player.speed-=player.accel*1.2;else player.speed*=0.98;if(keys[' ']&&boost>0){boost=Math.max(0,boost-0.5);boosting=true;player.speed=Math.min(player.maxSpeed+player.boostPower,player.speed+player.accel*1.8)}else{boosting=false;boost=Math.min(100,boost+0.05)}if(keys['shift'])player.speed*=0.9;player.speed=Math.max(-player.maxSpeed*0.5,Math.min(player.maxSpeed+(boosting?player.boostPower:0),player.speed));const sa=player.handling*(Math.abs(player.speed)/player.maxSpeed||0.01);if(keys['arrowleft']||keys['a'])player.angle-=sa;if(keys['arrowright']||keys['d'])player.angle+=sa;const mx=Math.cos(player.angle)*player.speed,my=Math.sin(player.angle)*player.speed;const nx=player.x+mx,ny=player.y+my;if(isOnRoad(nx,ny)){player.x=nx;player.y=ny}else{player.speed*=0.85;player.x+=mx*0.3;player.y+=my*0.3;particles.push({x:player.x,y:player.y,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2,life:15,maxLife:15,color:'#aaa',size:3})}checkCP(player);if(boosting){for(let i=0;i<2;i++)particles.push({x:player.x-Math.cos(player.angle)*15,y:player.y-Math.sin(player.angle)*15,vx:-Math.cos(player.angle)*3+(Math.random()-0.5)*2,vy:-Math.sin(player.angle)*3+(Math.random()-0.5)*2,life:20,maxLife:20,color:'#ff6b
