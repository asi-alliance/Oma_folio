let g=G[7].map(r=>r.slice()),bpm=120,v=0.7,pl=false,mt=false,st=0,ac=null,tm=null;function ia(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)()}function pd(t){if(!ac)return;const n=ac.currentTime,vl=v;if(t===0){const o=ac.createOscillator(),gg=ac.createGain();o.frequency.setValueAtTime(120,n);o.frequency.exponentialRampToValueAtTime(40,n+.35);gg.gain.setValueAtTime(vl*.9,n);gg.gain.exponentialRampToValueAtTime(.001,n+.35);o.connect(gg);gg.connect(ac.destination);o.start(n);o.stop(n+.35)}else if(t===1){const b=ac.createBuffer(1,ac.sampleRate*.15,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=1500;const gg=ac.createGain();gg.gain.setValueAtTime(vl*.7,n);gg.gain.exponentialRampToValueAtTime(.001,n+.15);s.connect(f);f.connect(gg);gg.connect(ac.destination);s.start(n);s.stop(n+.15)}else if(t===2){const o=ac.createOscillator(),gg=ac.createGain();o.type='square';o.frequency.value=8000;gg.gain.setValueAtTime(vl*.3,n);gg.gain.exponentialRampToValueAtTime(.001,n+.05);o.connect(gg);gg.connect(ac.destination);o.start(n);o.stop(n+.05)}else if(t===3){const b=ac.createBuffer(1,ac.sampleRate*.25,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=6000;const gg=ac.createGain();gg.gain.setValueAtTime(vl*.25,n);gg.gain.exponentialRampToValueAtTime(.001,n+.25);s.connect(f);f.connect(gg);gg.connect(ac.destination);s.start(n);s.stop(n+.25)}else if(t===4){const b=ac.createBuffer(1,ac.sampleRate*.12,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++){const x=i/d.length;d[i]=(Math.random()*2-1)*Math.pow(1-x,2)}const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1500;f.Q.value=2;const gg=ac.createGain();gg.gain.se
