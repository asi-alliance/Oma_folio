<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Oma Drum Lab</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0d0d1a;color:#e0e0e0;font-family:sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}h1{color:#00d9ff;text-shadow:0 0 15px rgba(0,217,255,.3);margin-bottom:4px}.sub{color:#888;margin-bottom:16px;font-size:14px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:16px}.box{background:#1a1a2e;border:1px solid #2a2a4e;border-radius:10px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;gap:4px}.lbl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px}.btn{background:linear-gradient(135deg,#0f3460,#16537e);color:#fff;border:2px solid #0f3460;padding:8px 18px;font-size:14px;border-radius:8px;cursor:pointer;font-weight:bold}.btn:hover{border-color:#00d9ff;box-shadow:0 0 12px rgba(0,217,255,.3)}.btn.on{background:linear-gradient(135deg,#1a5e3a,#0e8040);border-color:#00ff88}.btn.dn{background:linear-gradient(135deg,#5e1a1a,#802020);border-color:#ff4444}.sld{width:140px;-webkit-appearance:none;height:7px;background:#333;border-radius:4px}.sld::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:#00d9ff;border-radius:50%;cursor:pointer}.ivs{width:56px;-webkit-appearance:none;height:4px;background:#333;border-radius:4px}.ivs::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:var(--tc,#00d9ff);border-radius:50%;cursor:pointer}.bpm{font-size:24px;font-weight:bold;color:#00d9ff}.ts{font-size:15px;font-weight:bold;color:#00ff88}.prow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}.pbtn{background:#1a1a2e;color:#aaa;border:1px solid #2a2a4e;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}.pbtn:hover{border-color:#00d9ff;color:#00d9ff}.pbtn.act{border-color:#00ff88;color:#00ff88;background:rgba(0,255,136,.1)}.grid{display:flex;flex-direction:column;gap:5px;padding:16px;background:#1a1a2e;border-radius:12px;border:1px solid #2a2a4e;overflow-x:auto}.trk{display:grid;gap:4px}.tname{font-size:13px;font-weight:bold;color:#aaa;display:flex;align-items:center;justify-content:flex-end;height:44px;gap:5px}.ivol{display:flex;flex-direction:column;align-items:center;gap:1px}.ivol-l{font-size:9px;color:#666}.cell{height:44px;min-width:42px;border-radius:6px;cursor:pointer;border:1px solid #2a2a4e;background:#15152a;transition:transform .05s}.cell:hover{border-color:#555;transform:scale(1.05)}.cell.bm{background:#1f1f3a}.cell.act{box-shadow:0 0 8px rgba(0,217,255,.4)}.cell.cur{border:2px solid #ffd700;box-shadow:0 0 10px rgba(255,215,0,.5)}.led{width:12px;height:12px;border-radius:50%;background:#333}.led.lit{background:#ffd700;box-shadow:0 0 10px rgba(255,215,0,.8)}</style></head><body><h1>OMA DRUM LAB</h1><p class=sub>Rhythm Workshop v5 - 6/8 Nutshell Edition</p><div class=prow id=pr></div><div class=row><div class=box><span class=lbl>Play/Stop</span><button class=btn id=pb onclick=tog()>PLAY</button></div><div class=box><span class=lbl>BPM</span><span class=bpm id=bd>74</span><input type=range class=sld id=bs min=40 max=240 value=74 oninput=ub(this.value)></div><div class=box><span class=lbl>Time Sig</span><span class=ts id=tsd>6/8</span></div><div class=box><span class=lbl>Metronome</span><div style="display:flex;align-items:center;gap:8px"><div class=led id=ml></div><button class=btn id=mb onclick=togm()>OFF</button></div></div><div class=box><span class=lbl>Master Vol</span><input type=range class=sld id=vs min=0 max=100 value=75 oninput=uv(this.value) style=width:80px></div><div class=box><span class=lbl>Clear</span><button class="btn dn" onclick=clr()>CLEAR</button></div></div><div class=grid id=sg></div><script>const T=[{n:'Kick',c:'#ff3366'},{n:'Snare',c:'#ffd700'},{n:'Hi-Hat',c:'#00ff88'},{n:'Open Hat',c:'#00ffaa'},{n:'Tom',c:'#9b59b6'},{n:'Ride',c:'#00d9ff'}];const PN=['Nutshell 6/8','Waltz Rock','Custom'];const P=[['100000100000','001001001001','101010101010','000000000000','000000000000','000000000000'],['100000100000','000010000010','101010101010','000000000000','000000000000','000000000000'],['000000000000','000000000000','000000000000','000000000000','000000000000','000000000000']];let N=12,g=P[0].map(s=>s.split('').map(c=>c==='1'?1:0)),bpm=74,v=.75,iv=[1,1,1,1,1,1],pl=false,mt=false,st=0,ac=null,tm=null,ci=0;function rg(){const e=document.getElementById('sg');let h='';for(let t=0;t<T.length;t++){h+='<div class=trk style="grid-template-columns:90px repeat('+N+',1fr)"><div class=tname><span>'+T[t].n+'</span><div class=ivol><span class=ivol-l>Vol</span><input type=range class=ivs min=0 max=100 value='+(iv[t]*100)+' oninput=uiv('+t+',this.value) style="--tc:'+T[t].c+'"></div></div>';for(let s=0;s<N;s++){let cls='cell'+(g[t][s]?' act':'')+(s%6===0?' bm':'');let bg=g[t][s]?'background:'+T[t].c+';':'';h+='<div class="'+cls+'" data-t='+t+' data-s='+s+' style="'+bg+'" onclick=tc('+t+','+s+')></div>'}h+='</div>'}e.innerHTML=h}function bi(){const pr=document.getElementById('pr');let h='';for(let i=0;i<PN.length;i++)h+='<button class="pbtn'+(i===ci?' act':'')+'" onclick=lp('+i+')>'+PN[i]+'</button>';pr.innerHTML=h;rg()}function lp(i){ci=i;g=P[i].map(s=>s.split('').map(c=>c==='1'?1:0));bi()}function tc(t,s){g[t][s]=g[t][s]?0:1;rg()}function clr(){g=g.map(r=>r.map(()=>0));rg()}function ub(val){bpm=+val;document.getElementById('bd').innerText=bpm;if(pl){clearInterval(tm);tm=setInterval(sl,60000/bpm/(N/4))}}function uv(val){v=val/100}function uiv(t,val){iv[t]=val/100}function tog(){pl=!pl;const b=document.getElementById('pb');b.innerText=pl?'STOP':'PLAY';b.classList.toggle('on',pl);if(pl){ia();if(tm)clearInterval(tm);tm=setInterval(sl,60000/bpm/(N/4))}else{clearInterval(tm);document.querySelectorAll('.cell.cur').forEach(c=>c.classList.remove('cur'))}}function togm(){mt=!mt;document.getElementById('mb').innerText=mt?'ON':'OFF';document.getElementById('mb').classList.toggle('on',mt)}function ia(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)()}function nk(n,vol){const o=ac.createOscillator(),gn=ac.createGain();o.type='sine';o.frequency.setValueAtTime(160,n);o.frequency.exponentialRampToValueAtTime(45,n+.08);o.frequency.exponentialRampToValueAtTime(35,n+.4);gn.gain.setValueAtTime(0,n);gn.gain.linearRampToValueAtTime(vol*.9,n+.002);gn.gain.exponentialRampToValueAtTime(.001,n+.4);o.connect(gn);gn.connect(ac.destination);o.start(n);o.stop(n+.4)}function ns(n,vol){const sr=ac.sampleRate,b=ac.createBuffer(1,sr*.25,sr),d=b.getChannelData(0);for(let i=0;i<d.length;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5)}const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=1200;const gn=ac.createGain();gn.gain.setValueAtTime(vol*.5,n);gn.gain.exponentialRampToValueAtTime(.001,n+.2);s.connect(f);f.connect(gn);gn.connect(ac.destination);s.start(n);s.stop(n+.25)}function nh(n,open,vol){const dur=open?.3:.05;const sr=ac.sampleRate,b=ac.createBuffer(1,sr*dur,sr),d=b.getChannelData(0);for(let i=0;i<d.length;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2)}const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=8000;const gn=ac.createGain();gn.gain.setValueAtTime(vol*.35,n);gn.gain.exponentialRampToValueAtTime(.001,n+dur);s.connect(f);f.connect(gn);gn.connect(ac.destination);s.start(n);s.stop(n+dur)}function nt(n,vol){const o=ac.createOscillator(),gn=ac.createGain();o.type='sine';o.frequency.setValueAtTime(220,n);o.frequency.exponentialRampToValueAtTime(100,n+.3);gn.gain.setValueAtTime(vol*.6,n);gn.gain.exponentialRampToValueAtTime(.001,n+.3);o.connect(gn);gn.connect(ac.destination);o.start(n);o.stop(n+.3)}function nr(n,vol){const sr=ac.sampleRate,b=ac.createBuffer(1,sr*.5,sr),d=b.getChannelData(0);for(let i=0;i<d.length;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1)}const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=4000;const gn=ac.createGain();gn.gain.setValueAtTime(vol*.25,n);gn.gain.exponentialRampToValueAtTime(.001,n+.5);s.connect(f);f.connect(gn);gn.connect(ac.destination);s.start(n);s.stop(n+.5)}function sl(){ia();const n=ac.currentTime;document.querySelectorAll('.cell.cur').forEach(c=>c.classList.remove('cur'));document.querySelectorAll('[data-s="'+st+'"]').forEach(c=>c.classList.add('cur'));if(mt){const ml=document.getElementById('ml');if(st%6===0)ml.classList.add('lit');else ml.classList.remove('lit')}for(let t=0;t<T.length;t++){if(g[t][st]){const vol=v*iv[t];if(t===0)nk(n,vol);else if(t===1)ns(n,vol);else if(t===2)nh(n,false,vol);else if(t===3)nh(n,true,vol);else if(t===4)nt(n,vol);else if(t===5)nr(n,vol)}}st=(st+1)%N}bi();</script></body></html>
