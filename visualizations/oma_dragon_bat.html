<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Oma - Dragon Bat Golf</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#2a1a0a;overflow:hidden;font-family:monospace}canvas{display:block}#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 20px;font-size:16px;color:#ffd060;z-index:10;text-shadow:1px 1px 3px rgba(0,0,0,0.8);pointer-events:none}#hud span{background:rgba(40,20,5,0.7);padding:4px 14px;border-radius:6px}#powerBar{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);width:300px;height:24px;border:2px solid #ffd060;border-radius:12px;overflow:hidden;z-index:10;display:none}#powerFill{height:100%;width:0%;background:linear-gradient(90deg,#4f4,#ff4,#f80,#f22);transition:none}#startScreen,#gameOverScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.75);z-index:20;color:#ffd060;text-align:center}#startScreen h1,#gameOverScreen h1{font-size:42px;margin-bottom:8px;text-shadow:3px 3px 6px rgba(0,0,0,0.9);color:#f60}#startScreen p,#gameOverScreen p{font-size:15px;margin-bottom:6px;color:#ccc;max-width:380px;line-height:1.6}#startScreen button,#gameOverScreen button{margin-top:20px;padding:12px 40px;font-size:18px;font-family:monospace;background:#c40;color:#fff;border:none;border-radius:8px;cursor:pointer}.hidden{display:none!important}#angleHint{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);color:#ffd060;font-size:13px;z-index:10;display:none}</style></head><body><canvas id=c></canvas><div id=hud><span>Distance: <b id=dist>0</b>m</span><span>Best: <b id=best>0</b>m</span></div><div id=powerBar><div id=powerFill></div></div><div id=angleHint>Click to start the power meter, click again to swing!</div><div id=startScreen><h1>Dragon Bat Golf</h1><p>A dragon hits tiny knights with a bat - launch them as far as possible!</p><p>Click to start the power meter, click again to swing!</p><button id=startBtn>START</button></div><div id=gameOverScreen class=hidden><h1 id=finalDist>0m</h1><p id=finalMsg>Launch complete!</p><button id=restartBtn>SWING AGAIN</button></div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H}resize();addEventListener('resize',resize);let best=0,state='idle',power=0,powerDir=1,knight=null,particles=[],bgStars=[],distance=0;const GROUND_Y=()=>H-80;const DRAGON_X=()=>120;for(let i=0;i<80;i++)bgStars.push({x:Math.random()*2000,y:Math.random()*500,r:Math.random()*1.5+0.3,tw:Math.random()*6.28});document.getElementById('startBtn').onclick=startGame;document.getElementById('restartBtn').onclick=startGame;
function startGame(){state='power';power=0;powerDir=1;knight=null;particles=[];distance=0;document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameOverScreen').classList.add('hidden');document.getElementById('powerBar').style.display='block';document.getElementById('angleHint').style.display='block';document.getElementById('dist').textContent='0';}cv.addEventListener('click',e=>{if(state==='power'){swing();}else if(state==='idle'||state==='landed'){startGame();}});cv.addEventListener('touchstart',e=>{if(state==='power'){swing();}else if(state==='idle'||state==='landed'){startGame();}e.preventDefault()},{passive:false});function swing(){state='flying';document.getElementById('powerBar').style.display='none';document.getElementById('angleHint').style.display='none';const p=power/100;knight={x:DRAGON_X()+30,y:GROUND_Y()-40,vx:8+p*22,vy:-(10+p*14),rot:0,rotSpd:0.1+p*0.2,bounces:0,trail:[]};for(let i=0;i<25;i++){const a=Math.random()*6.28,s=3+Math.random()*8;particles.push({x:DRAGON_X()+30,y:GROUND_Y()-40,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,hue:Math.random()*60,size:3+Math.random()*5});}}
function dustP(x,y){for(let i=0;i<12;i++){const a=Math.random()*6.28,s=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:0.6,hue:30+Math.random()*20,size:2+Math.random()*4});}}function drawDragon(t){ctx.save();ctx.translate(DRAGON_X(),GROUND_Y()-10);const sa=state==='flying'?0.5:state==='power'?Math.sin(t*0.02)*0.3:0;ctx.save();ctx.translate(0,-30);ctx.rotate(sa);ctx.strokeStyle='#8B4513';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(40,0);ctx.stroke();ctx.fillStyle='#666';ctx.beginPath();ctx.ellipse(40,0,6,10,0,0,6.28);ctx.fill();ctx.restore();ctx.fillStyle='#2d8a3d';ctx.beginPath();ctx.ellipse(0,-25,35,22,0,0,6.28);ctx.fill();ctx.fillStyle='#226a2d';ctx.beginPath();ctx.ellipse(-10,-30,18,12,0,0,6.28);ctx.fill();ctx.beginPath();ctx.ellipse(-25,-20,12,8,0,0,6.28);ctx.fill();ctx.fillStyle='#3a9a4d';for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(-30+i*12,-44);ctx.lineTo(-26+i*12,-58);ctx.lineTo(-22+i*12,-44);ctx.fill();}ctx.fillStyle='#d4a017';for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(-30+i*12,-44);ctx.lineTo(-26+i*12,-54);ctx.lineTo(-22+i*12,-44);ctx.fill();}
ctx.fillStyle='#2d8a3d';ctx.beginPath();ctx.ellipse(28,-30,18,14,0,0,6.28);ctx.fill();ctx.fillStyle='#ff8800';ctx.beginPath();ctx.moveTo(35,-38);ctx.lineTo(45,-30);ctx.lineTo(35,-26);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(30,-36,3,0,6.28);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(31,-36,1.5,0,6.28);ctx.fill();ctx.strokeStyle='#226a2d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-20,-10);ctx.lineTo(-30,10);ctx.stroke();ctx.beginPath();ctx.moveTo(20,-10);ctx.lineTo(30,10);ctx.stroke();ctx.strokeStyle='#cc4400';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-35,-18);ctx.bezierCurveTo(-60,-10,-65,5,-50,15);ctx.stroke();ctx.fillStyle='#2d8a3d';for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-55+i*4,0+i*5);ctx.lineTo(-70+i*4,-3+i*5);ctx.lineTo(-55+i*4,6+i*5);ctx.fill();}ctx.restore();}function drawKnight(k){ctx.save();ctx.translate(k.x,k.y);ctx.rotate(k.rot);ctx.fillStyle='#a0a0b0';ctx.beginPath();ctx.ellipse(0,0,12,8,0,0,6.28);ctx.fill();ctx.fillStyle='#888';ctx.beginPath();ctx.arc(0,-10,7,0,6.28);ctx.fill();ctx.fillStyle='#cc2222';ctx.beginPath();ctx.moveTo(-7,-16);ctx.lineTo(7,-16);ctx.lineTo(5,-24);ctx.lineTo(-5,-24);ctx.fill();ctx.fillStyle='#ffcc44';ctx.beginPath();ctx.moveTo(-3,-24);ctx.lineTo(3,-24);ctx.lineTo(0,-30);ctx.fill();ctx.strokeStyle='#aaa';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(12,-2);ctx.lineTo(20,2);ctx.stroke();ctx.fillStyle='#ccc';ctx.beginPath();ctx.rect(18,0,6,4);ctx.fill();ctx.restore();}
function drawBg(t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0a2a');g.addColorStop(0.3,'#1a1a4a');g.addColorStop(0.6,'#3a2a1a');g.addColorStop(1,'#2a1a0a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffd060';for(const s of bgStars){ctx.globalAlpha=(0.5+Math.sin(s.tw+t*0.03)*0.5)*0.7;ctx.beginPath();ctx.arc(s.x%W,s.y,s.r,0,6.28);ctx.fill();}ctx.globalAlpha=1;ctx.fillStyle='#3a2a1a';for(let i=0;i<5;i++){const mx=(i*180+t*0.01)%W;ctx.beginPath();ctx.moveTo(mx,GROUND_Y());ctx.lineTo(mx+60,GROUND_Y()-100);ctx.lineTo(mx+120,GROUND_Y());ctx.fill();}ctx.fillStyle='#5a3a1a';ctx.beginPath();ctx.moveTo(0,GROUND_Y()+20);ctx.bezierCurveTo(W*0.2,GROUND_Y()-40,W*0.4,GROUND_Y()+30,W*0.6,GROUND_Y()-20);ctx.bezierCurveTo(W*0.8,GROUND_Y()+40,W,GROUND_Y()-10,W,GROUND_Y()+20);ctx.fill();}function drawGround(cx){ctx.fillStyle='#4a2a0a';ctx.fillRect(0,GROUND_Y(),W,80);ctx.fillStyle='#5a3a1a';for(let i=0;i<W;i+=40){const gx=(i-cx%40+40)%W;ctx.fillRect(gx,GROUND_Y(),4,8);ctx.fillRect(gx+20,GROUND_Y()+2,3,6);}ctx.fillStyle='#6a4a2a';ctx.fillRect(0,GROUND_Y(),W,4);}
let frame=0;function loop(){frame++;ctx.clearRect(0,0,W,H);if(state==='power'){power+=powerDir*2;if(power>=100){power=100;powerDir=-1}if(power<=0){power=0;powerDir=1}document.getElementById('powerFill').style.width=power+'%';}let camX=0;if(knight&&state==='flying'){camX=Math.max(0,knight.x-W*0.3);}drawBg(frame);ctx.save();ctx.translate(-camX,0);drawGround(camX);drawDragon(frame);if(knight&&state==='flying'){knight.vy+=0.5;knight.x+=knight.vx;knight.y+=knight.vy;knight.rot+=knight.rotSpd;knight.trail.push({x:knight.x,y:knight.y});if(knight.trail.length>15)knight.trail.shift();if(knight.y>=GROUND_Y()-8){knight.y=GROUND_Y()-8;knight.vy*=-0.55;knight.vx*=0.7;knight.rotSpd*=0.6;dustP(knight.x,knight.y);if(Math.abs(knight.vy)<2&&Math.abs(knight.vx)<1){state='landed';distance=Math.round(Math.max(0,(knight.x-DRAGON_X()-30)/8));if(distance>best){best=distance;document.getElementById('best').textContent=best}setTimeout(()=>{document.getElementById('finalDist').textContent=distance+'m';let msg='A decent launch!';if(distance>=500)msg='Legendary dragon swing!';else if(distance>=300)msg='Impressive distance!';else if(distance>=150)msg='Nice hit!';else if(distance>=50)msg='Not bad, keep practicing!';else msg='The knight barely moved...';document.getElementById('finalMsg').textContent=msg;document.getElementById('gameOverScreen').classList.remove('hidden');},800);}}for(let i=knight.trail.length-1;i>=0;i--){const tr=knight.trail[i];ctx.globalAlpha=(i/knight.trail.length)*0.4;ctx.fillStyle='#ff8800';ctx.beginPath();ctx.arc(tr.x,tr.y,3,0,6.28);ctx.fill();}ctx.globalAlpha=1;drawKnight(knight);document.getElementById('dist').textContent=Math.round(Math.max(0,(knight.x-DRAGON_X()-30)/8))+'m';}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life-=0.02;if(p.life<=0){particles.splice(i,1);continue}ctx.fillStyle='hsla('+p.hue+',80%,'+(50+p.life*30)+'%,'+p.life+')';ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,6.28);ctx.fill();}ctx.restore();requestAnimationFrame(loop);}loop();</script></body></html>
