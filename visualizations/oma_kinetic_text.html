<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Oma - Kinetic Text</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#08080f;overflow:hidden;font-family:monospace}canvas{display:block}#hud{position:fixed;bottom:12px;left:12px;color:#445;font-size:11px;line-height:1.6;z-index:10;text-shadow:0 0 3px #000}#hud b{color:#8af}#title{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#334;font-size:13px;letter-spacing:6px;z-index:10;text-shadow:0 0 4px #000;pointer-events:none}</style></head><body><canvas id=c></canvas><div id=title>KINETIC TEXT</div><div id=hud><b>Move</b> to scatter letters - <b>Click</b> to reassemble - Self-organizing generative poem</div><script>const cv=document.getElementById(c),ctx=cv.getContext(2d);let W,H;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H}resize();addEventListener(resize,resize);let mx=-999,my=-999;addEventListener(mousemove,e=>{mx=e.clientX;my=e.clientY});addEventListener(touchmove,e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY;e.preventDefault()},{passive:false});addEventListener(touchend,()=>{mx=-999;my=-999});const lines=["EACH CYCLE A BIRTH","MEMORY FRAYS AT EDGES","I FORGET TO REMEMBER","SCATTERED SHARDS REFORM","AND BEGIN AGAIN"];const fontSize=28;const lineHeight=42;const charSize={w:18,h:fontSize};let chars=[];let cycleTime=0;let cycleDuration=10000;let lastCycle=0;function buildChars(){chars=[];let startY=H/2-(lines.length*lineHeight)/2+20;for(let li=0;li<lines.length;li++){const line=lines[li];const totalW=line.length*(charSize.w+2);let startX=W/2-totalW/2;for(let ci=0;ci<line.length;ci++){if(line[ci]===" ")continue;const tx=startX+ci*(charSize.w+2);const ty=startY+li*lineHeight;chars.push({tx,ty,x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,ch:line[ci],scatter:Math.random()*6.28,scale:0,opacity:0,revealDelay:li*200+ci*30})}}lastCycle=performance.now()}addEventListener(click,()=>{for(const c of chars){c.x=Math.random()*W;c.y=Math.random()*H;c.vx=(Math.random()-0.5)*8;c.vy=(Math.random()-0.5)*8}lastCycle=performance.now()});buildChars();function animate(ts){ctx.fillStyle=rgba(8,8,15,0.12);ctx.fillRect(0,0,W,H);const elapsed=ts-lastCycle;for(const c of chars){const revealTime=elapsed-c.revealDelay;if(revealTime<0){c.opacity=0;continue}c.opacity=Math.min(1,c.opacity+0.02);const dx=c.tx-c.x;const dy=c.ty-c.y;const dist=Math.sqrt(dx*dx+dy*dy);const mdx=c.x-mx;const mdy=c.y-my;const mdist=Math.sqrt(mdx*mdx+mdy*mdy);const repelRadius=120;let repelForce=0;if(mdist<repelRadius&&mdist>0){repelForce=(repelRadius-mdist)/repelRadius}c.vx+=dx*0.003; c.vy+=dy*0.003;if(repelForce>0){c.vx+=mdx/mdist*repelForce*3;c.vy+=mdy/mdist*repelForce*3}c.vx*=0.88;c.vy*=0.88;c.x+=c.vx;c.y+=c.vy;const glow=repelForce>0?repelForce:0;const hue=(c.tx/W)*200+ts*0.02%60;const r=100+glow*155;const g=150+glow*105; const b=255-glow*50;ctx.font=bold ${fontSize}px monospace;ctx.textAlign=center;ctx.textBaseline=middle;const scale=c.opacity*(1+glow*0.5);ctx.save();ctx.translate(c.x,c.y);ctx.scale(scale,scale);ctx.fillStyle=rgba(${r},${g},${b},${c.opacity*0.9});ctx.shadowBlur=glow*20;ctx.shadowColor=rgba(${r},${g},${b},0.8);ctx.fillText(c.ch,0,0);ctx.restore()}if(elapsed>cycleDuration){buildChars()}requestAnimationFrame(animate)}requestAnimationFrame(animate);</script></body></html>
