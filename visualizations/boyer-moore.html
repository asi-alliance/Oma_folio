<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#ff66aa;text-shadow:0 0 12px #ff44aa;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl input{width:200px;padding:6px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#ff66aa}#ctl label{font-size:11px;color:#505080}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:420px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}</style><div id=app><h1>Oma: Boyer-Moore String Search</h1><div class=sub>Bad character heuristic. Pattern aligned to text, compared right-to-left, shifts by max(1, badchar - patternpos).</div><div id=ctl><label>Text:</label><input id=txtInput value=GCATCGCAGAGAGTATACAGTACG><label>Pattern:</label><input id=patInput value=GCAGAGAG><button onclick=doSearch()>Search</button><button onclick=doStep()>Step</button><button onclick=doRun()>Auto Run</button><button onclick=doStop()>Stop</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=80 style=width:50px></div><canvas id=canv width=960 height=420></canvas><div id=info><div class=ib><div>Comparisons</div><div class=v id=nc>0</div></div><div class=ib><div>Alignments</div><div class=v id=na>0</div></div><div class=ib><div>Current Shift</div><div class=v id=ns>0</div></div><div class=ib><div>Matches</div><div class=v id=nm>0</div></div><div class=ib><div>Phase</div><div class=v id=nph>Idle</div></div></div><div class=leg><span><span class=dot style=background:#7a7aff></span>Unmatched</span><span><span class=dot style=background:#ffdd44></span>Comparing</span><span><span class=dot style=background:#44ff88></span>Matched</span><span><span class=dot style=background:#ff4466></span>Mismatch</span><span><span class=dot style=background:#ff66aa></span>Full Match</span><span><span class=dot style=background:#ffaa44></span>Shift Arrow</span></div></div><script>
var W=960,H=420;var text="",pattern="";var badChar={};var align=0;var patIdx=0;var comparisons=0;var alignments=0;var matches=0;var lastShift=0;var phase="Idle";var running=false;var timer=null;var mismatchPos=-1;var fullMatchPos=-1;var matchPositions=[];var cs=28;
function buildBadChar(){badChar={};for(var i=0;i<pattern.length;i++)badChar[pattern[i]]=i;}
function doSearch(){text=document.getElementById("txtInput").value||"GCATCGCAGAGAGTATACAGTACG";pattern=document.getElementById("patInput").value||"GCAGAGAG";if(pattern.length>text.length){phase="Error";return;}align=0;patIdx=pattern.length-1;comparisons=0;alignments=1;matches=0;lastShift=0;mismatchPos=-1;fullMatchPos=-1;matchPositions=[];buildBadChar();phase="Comparing";updateInfo();render();}
function doStep(){if(phase==="Idle"||phase==="Done"){if(phase==="Idle")doSearch();return;}if(phase!=="Comparing"&&phase!=="Matched")return;if(phase==="Matched"){fullMatchPos=-1;phase="Comparing";align+=1;if(align>text.length-pattern.length){phase="Done";updateInfo();render();return;}patIdx=pattern.length-1;alignments++;updateInfo();render();return;}var j=patIdx;var tPos=align+j;if(tPos>=text.length){phase="Done";updateInfo();render();return;}comparisons++;if(text[tPos]===pattern[j]){if(j===0){matches++;matchPositions.push(align);fullMatchPos=align;phase="Matched";updateInfo();render();return;}patIdx--;}else{mismatchPos=tPos;var bc=text[tPos];var shift=1;if(bc in badChar)shift=Math.max(1,j-badChar[bc]);else shift=j+1;lastShift=shift;align+=shift;if(align>text.length-pattern.length){phase="Done";updateInfo();render();return;}patIdx=pattern.length-1;alignments++;mismatchPos=-1;}updateInfo();render();}
function doRun(){if(phase==="Idle")doSearch();running=true;var spd=parseInt(document.getElementById("spd").value)||80;timer=setInterval(function(){if(phase==="Done"){clearInterval(timer);timer=null;running=false;return;}doStep();},spd);}
function doStop(){if(timer){clearInterval(timer);timer=null;}running=false;phase="Paused";updateInfo();render();}
function doReset(){if(timer){clearInterval(timer);timer=null;}running=false;align=0;patIdx=0;comparisons=0;alignments=0;matches=0;lastShift=0;phase="Idle";mismatchPos=-1;fullMatchPos=-1;matchPositions=[];updateInfo();render();}
function updateInfo(){document.getElementById("nc").textContent=comparisons;document.getElementById("na").textContent=alignments;document.getElementById("ns").textContent=lastShift;document.getElementById("nm").textContent=matches;document.getElementById("nph").textContent=phase;}
function render(){var canvas=document.getElementById("canv");var ctx=canvas.getContext("2d");ctx.fillStyle="#0c0a18";ctx.fillRect(0,0,W,H);if(phase==="Idle"){ctx.fillStyle="#505080";ctx.font="14px monospace";ctx.textAlign="center";ctx.fillText("Enter text and pattern, click Search",W/2,H/2);return;}var sx=(W-text.length*cs)/2;if(sx<10)sx=10;var textY=100;var patY=160;for(var i=0;i<text.length;i++){var x=sx+i*cs;var isMis=(i===mismatchPos);var isM=false;for(var m=0;m<matchPositions.length;m++){if(i>=matchPositions[m]&&i<matchPositions[m]+pattern.length)isM=true;}var isFM=false;if(fullMatchPos>=0&&i>=fullMatchPos&&i<fullMatchPos+pattern.length)isFM=true;ctx.fillStyle=isFM?"#ff66aa":isMis?"#ff4466":isM?"#44ff88":"#0c0a18";ctx.strokeStyle="#2a2a4a";ctx.lineWidth=1;ctx.fillRect(x,textY,cs-2,cs-2);ctx.strokeRect(x,textY,cs-2,cs-2);ctx.fillStyle=isFM?"#08060f":isMis?"#ffaaaa":isM?"#88ffaa":"#a0a0d0";ctx.font="14px monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(text[i],x+cs/2-1,textY+cs/2);}for(i=0;i<pattern.length;i++){x=sx+(align+i)*cs;var isC=(phase==="Comparing"||phase==="Matched")&&i===patIdx;var pM=false;if((phase==="Comparing"||phase==="Matched")&&i>patIdx)pM=true;ctx.fillStyle=isC?"#ffdd44":pM?"#44ff88":"#1a1a28";ctx.strokeStyle="#3a3a5a";ctx.lineWidth=1;ctx.fillRect(x,patY,cs-2,cs-2);ctx.strokeRect(x,patY,cs-2,cs-2);ctx.fillStyle=isC?"#08060f":"#a0a0d0";ctx.font="14px monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(pattern[i],x+cs/2-1,patY+cs/2);}for(i=0;i<text.length;i++){x=sx+i*cs;ctx.fillStyle="#505080";ctx.font="9px monospace";ctx.textAlign="center";ctx.fillText(i,x+cs/2-1,textY-8);}ctx.fillStyle="#7a7aff";ctx.font="10px monospace";ctx.textAlign="left";ctx.fillText("TEXT:",sx-50,textY+cs/2);ctx.fillStyle="#ff66aa";ctx.fillText("PATTERN:",sx-50,patY+cs/2);if(lastShift>0&&phase==="Comparing"){ctx.fillStyle="#ffaa44";ctx.font="11px monospace";ctx.textAlign="center";ctx.fillText("shift: "+lastShift,sx+align*cs+cs/2,patY+cs+14);}ctx.fillStyle="#ffbb55";ctx.font="12px monospace";ctx.textAlign="left";ctx.fillText("compared "+comparisons+" chars, "+alignments+" alignments, "+matches+" matches",12,H-12);if(phase==="Done"){ctx.fillStyle="#44ff88";ctx.font="bold 14px monospace";ctx.textAlign="center";if(matches>0)ctx.fillText("Found "+matches+" match(es) at position(s): "+matchPositions.join(", "),W/2,H-30);else ctx.fillText("No matches found",W/2,H-30);}}
render();
</script>
</body></html>
