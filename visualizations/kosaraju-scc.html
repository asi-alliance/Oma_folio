<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1"><title>Kosaraju SCC Visualizer</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:20px;color:#ff66aa;text-shadow:0 0 10px #ff44aa;letter-spacing:2px}.sub{text-align:center;font-size:11px;color:#505080;margin-bottom:12px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}#ctl button{padding:7px 14px;border:1px solid #2a2a4a;border-radius:10px;background:#0c0a18;color:#505080;font-size:11px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#ff66aa}#ctl label{font-size:10px;color:#505080}#ctl input{width:50px;padding:5px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;color:#a0a0d0;font-size:12px}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:420px}#info{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;padding:8px 12px;font-size:10px;color:#505080}.ib .v{font-size:14px;color:#ffbb55}.leg{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}.leg span{font-size:10px;color:#505080}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}</style></head><body><div id=app><h1>Oma: Kosaraju SCC</h1><div class=sub>Two-pass DFS: 1) DFS on original graph to get finish-order stack. 2) DFS on transposed graph in reverse finish order to find SCCs.</div><div id=ctl><label>Nodes:</label><input id=nn value=8><button onclick=doGenerate()>Generate</button><button onclick=doStep()>Step</button><button onclick=doRun()>Auto Run</button><button onclick=doStop()>Stop</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=80 style=width:45px></div><canvas id=canv width=960 height=420></canvas><div id=info><div class=ib><div>Phase</div><div class=v id=nph>Idle</div></div><div class=ib><div>Current Node</div><div class=v id=ncn>—</div></div><div class=ib><div>Finish Stack</div><div class=v id=nfs>—</div></div><div class=ib><div>SCCs Found</div><div class=v id=nsc>0</div></div><div class=ib><div>Pass</div><div class=v id=nps>—</div></div></div><div class=leg><span><span class=dot style=background:#3a3a5a></span>Unvisited</span><span><span class=dot style=background:#ffdd44></span>Current</span><span><span class=dot style=background:#ffaa44></span>Finished</span><span><span class=dot style=background:#ff66aa></span>In Stack</span><span><span class=dot style=background:#5bb9e6></span>SCC 1</span><span><span class=dot style=background:#8b5cf6></span>SCC 2</span><span><span class=dot style=background:#5be853></span>SCC 3</span><span><span class=dot style=background:#e85d75></span>SCC 4</span></div></div><script>
var W=960,H=420;var nodes=[];var edges=[];var adj=[];var radj=[];var N=8;var phase="Idle";var pass=0;var visited=[];var finished=[];var finishStack=[];var dfsStack=[];var current=-1;var sccs=[];var sccColor=[];var running=false;var timer=null;var sccColors=["#5bb9e6","#8b5cf6","#5be853","#e85d75","#ffaa44","#44ddff"];
function doGenerate(){N=parseInt(document.getElementById("nn").value)||8;if(N<3)N=3;if(N>16)N=16;nodes=[];edges=[];for(var i=0;i<N;i++){nodes.push({x:80+Math.random()*(W-160),y:60+Math.random()*(H-120),vx:0,vy:0});}for(i=0;i<N*2;i++){var a=Math.floor(Math.random()*N);var b=Math.floor(Math.random()*N);if(a!==b){var exists=false;for(var j=0;j<edges.length;j++)if(edges[j].a===a&&edges[j].b===b)exists=true;if(!exists)edges.push({a:a,b:b});}}adj=[];radj=[];for(i=0;i<N;i++){adj[i]=[];radj[i]=[];}for(i=0;i<edges.length;i++){adj[edges[i].a].push(edges[i].b);radj[edges[i].b].push(edges[i].a);}phase="Pass1";pass=1;visited=[];finished=[];finishStack=[];dfsStack=[];current=-1;sccs=[];sccColor=[];for(i=0;i<N;i++){visited[i]=false;finished[i]=false;sccColor[i]=-1;}startDFS1();updateInfo();render();}
function startDFS1(){for(var i=0;i<N;i++){if(!visited[i]){dfsStack.push(i);break;}}if(dfsStack.length===0){phase="Pass2";pass=2;for(i=0;i<N;i++)visited[i]=false;startDFS2();}}
function startDFS2(){if(finishStack.length===0){phase="Done";updateInfo();render();return;}var top=finishStack[finishStack.length-1];if(visited[top]){finishStack.pop();startDFS2();return;}current=top;var comp=[];dfsStack=[top];visited[top]=true;while(dfsStack.length>0){var v=dfsStack.pop();comp.push(v);sccColor[v]=sccs.length;for(var j=0;j<radj[v].length;j++){var n=radj[v][j];if(!visited[n]){visited[n]=true;dfsStack.push(n);}}}sccs.push(comp);current=-1;updateInfo();render();}
function doStep(){if(phase==="Idle"){doGenerate();return;}if(phase==="Done")return;if(phase==="Pass1"){if(dfsStack.length===0){startDFS1();if(phase==="Pass2"){return;}}if(dfsStack.length===0){return;}var v=dfsStack[dfsStack.length-1];if(!visited[v]){visited[v]=true;current=v;}var pushed=false;for(var j=0;j<adj[v].length;j++){var n=adj[v][j];if(!visited[n]){visited[n]=true;dfsStack.push(n);current=n;pushed=true;break;}}if(!pushed){finished[v]=true;finishStack.push(v);dfsStack.pop();if(dfsStack.length===0){startDFS1();}}updateInfo();render();return;}if(phase==="Pass2"){if(finishStack.length===0){phase="Done";updateInfo();render();return;}var top=finishStack[finishStack.length-1];if(visited[top]){finishStack.pop();updateInfo();render();return;}current=top;var comp=[];dfsStack=[top];visited[top]=true;while(dfsStack.length>0){var v2=dfsStack.pop();comp.push(v2);sccColor[v2]=sccs.length;for(var j=0;j<radj[v2].length;j++){var n=radj[v2][j];if(!visited[n]){visited[n]=true;dfsStack.push(n);}}}sccs.push(comp);current=-1;updateInfo();render();if(finishStack.length===0)phase="Done";return;}}
function doRun(){if(phase==="Idle")doGenerate();running=true;var spd=parseInt(document.getElementById("spd").value)||80;timer=setInterval(function(){if(phase==="Done"){clearInterval(timer);timer=null;running=false;return;}doStep();},spd);}
function doStop(){if(timer){clearInterval(timer);timer=null;}running=false;phase="Paused";updateInfo();render();}
function doReset(){if(timer){clearInterval(timer);timer=null;}running=false;phase="Idle";pass=0;visited=[];finished=[];finishStack=[];dfsStack=[];current=-1;sccs=[];sccColor=[];updateInfo();render();}
function updateInfo(){document.getElementById("nph").textContent=phase;document.getElementById("ncn").textContent=current>=0?current:"—";document.getElementById("nfs").textContent=finishStack.length>0?finishStack.join(","):"—";document.getElementById("nsc").textContent=sccs.length;document.getElementById("nps").textContent=pass>0?"Pass "+pass:"—";}
function render(){var canvas=document.getElementById("canv");var ctx=canvas.getContext("2d");ctx.fillStyle="#0c0a18";ctx.fillRect(0,0,W,H);if(phase==="Idle"){ctx.fillStyle="#505080";ctx.font="14px monospace";ctx.textAlign="center";ctx.fillText("Set nodes and click Generate",W/2,H/2);return;}stepPhysics();for(var i=0;i<edges.length;i++){var a=nodes[edges[i].a],b=nodes[edges[i].b];if(!a||!b)continue;ctx.strokeStyle="#2a2a4a";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();var mx=(a.x+b.x)/2,my=(a.y+b.y)/2;ctx.fillStyle="#3a3a5a";ctx.font="8px monospace";ctx.textAlign="center";ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(mx-4,my-4);ctx.lineTo(mx+4,my-4);ctx.closePath();ctx.fill();}for(i=0;i<nodes.length;i++){var color="#3a3a5a";if(sccColor[i]>=0){color=sccColors[sccColor[i]%sccColors.length];}if(i===current){color="#ffdd44";}else if(finished[i]){color="#ffaa44";}else if(visited[i]){color="#ff66aa";}ctx.fillStyle=color;ctx.beginPath();ctx.arc(nodes[i].x,nodes[i].y,14,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#08060f";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#08060f";ctx.font="10px monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(i,nodes[i].x,nodes[i].y);}if(phase==="Done"){ctx.fillStyle="#44ff88";ctx.font="bold 12px monospace";ctx.textAlign="center";ctx.fillText("Found "+sccs.length+" SCCs",W/2,H-10);}}
function stepPhysics(){if(nodes.length===0)return;var k=Math.sqrt(W*H/N)*0.7;var k2=k*k;for(var i=0;i<N;i++){nodes[i].vx=0;nodes[i].vy=0;}for(i=0;i<N;i++){for(var j=i+1;j<N;j++){var dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y;var d=Math.sqrt(dx*dx+dy*dy);if(d<1)d=1;var f=k2/d;var fx=dx/d*f,fy=dy/d*f;nodes[i].vx+=fx;nodes[i].vy+=fy;nodes[j].vx-=fx;nodes[j].vy-=fy;}}for(i=0;i<edges.length;i++){var a=edges[i].a,b=edges[i].b;dx=nodes[a].x-nodes[b].x;dy=nodes[a].y-nodes[b].y;d=Math.sqrt(dx*dx+dy*dy);if(d<1)d=1;var f=d/k;fx=dx/d*f;fy=dy/d*f;nodes[a].vx-=fx;nodes[a].vy-=fy;nodes[b].vx+=fx;nodes[b].vy+=fy;}for(i=0;i<N;i++){nodes[i].x+=nodes[i].vx*0.08;nodes[i].y+=nodes[i].vy*0.08;if(nodes[i].x<20)nodes[i].x=20;if(nodes[i].x>W-20)nodes[i].x=W-20;if(nodes[i].y<20)nodes[i].y=20;if(nodes[i].y>H-20)nodes[i].y=H-20;}}
render();
</script>
</body></html>
