<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Oma - DLA</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050508;overflow:hidden;font-family:monospace}canvas{display:block}#hud{position:fixed;bottom:12px;left:12px;color:#445;font-size:11px;line-height:1.6;z-index:10;text-shadow:0 0 3px #000}#hud b{color:#8af}#title{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#334;font-size:13px;letter-spacing:6px;z-index:10;text-shadow:0 0 4px #000;pointer-events:none}</style></head><body><canvas id=c></canvas><div id=title>DIFFUSION LIMITED AGGREGATION</div><div id=hud><b>Move</b> to attract particles - <b>Click</b> to seed cluster - <b>Right-click</b> to reset - Fractal dendritic growth</div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;drawBg()}resize();addEventListener('resize',resize);let mx=-999,my=-999;addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY;e.preventDefault()},{passive:false});addEventListener('touchend',()=>{mx=-999;my=-999});const cell=3;let cw,rh;let grid;let cluster=[];let stuckCount=0;let maxRadius=5;let stickiness=1.0;let hueOffset=0;function initDLA(){cw=Math.ceil(W/cell);rh=Math.ceil(H/cell);grid=new Uint8Array(cw*rh);cluster=[];stuckCount=0;maxRadius=5;hueOffset=0;const ccx=Math.floor(cw/2),ccy=Math.floor(rh/2);seedAt(ccx,ccy)}function seedAt(gx,gy){if(gx<0||gx>=cw||gy<0||gy>=rh)return;if(grid[gy*cw+gx])return;grid[gy*cw+gx]=1;cluster.push({x:gx,y:gy,gen:stuckCount,hue:(stuckCount*0.5+hueOffset)%360});stuckCount++;const dx=gx-Math.floor(cw/2),dy=gy-Math.floor(rh/2);const r=Math.sqrt(dx*dx+dy*dy);if(r>maxRadius)maxRadius=r}initDLA();addEventListener('click',e=>{seedAt(Math.floor(e.clientX/cell),Math.floor(e.clientY/cell))});addEventListener('contextmenu',e=>{e.preventDefault();initDLA();drawBg()});function drawBg(){ctx.fillStyle='#050508';ctx.fillRect(0,0,W,H)}function spawnParticle(){const angle=Math.random()*6.283;const r=maxRadius+20+Math.random()*30;const cx=cw/2,cy=rh/2;return{x:Math.round(cx+Math.cos(angle)*r),y:Math.round(cy+Math.sin(angle)*r)}}function inBounds(x,y){return x>=0&&x<cw&&y>=0&&y<rh}function isStuck(x,y){if(!inBounds(x,y))return false;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(dx===0&&dy===0)continue;const nx=x+dx,ny=y+dy;if(inBounds(nx,ny)&&grid[ny*cw+nx])return true}return false}let particles=[];for(let i=0;i<200;i++)particles.push(spawnParticle());function step(){const cx=cw/2,cy=rh/2;for(let i=particles.length-1;i>=0;i--){const p=particles[i];if(mx>0){const dxm=Math.floor(mx/cell),dym=Math.floor(my/cell);const ddx=dxm-p.x,ddy=dym-p.y;const dm=Math.sqrt(ddx*ddx+ddy*ddy);if(dm<80&&dm>0){p.x+=Math.round(ddx/dm*1.5);p.y+=Math.round(ddy/dm*1.5)}}const step=Math.random()<0.5?1:-1;if(Math.random()<0.5)p.x+=step;else p.y+=step;const ddx=p.x-cx,ddy=p.y-cy;const dist=Math.sqrt(ddx*ddx+ddy*ddy);if(dist>maxRadius+80){particles[i]=spawnParticle();continue}if(isStuck(p.x,p.y)){if(Math.random()<stickiness){seedAt(p.x,p.y);particles[i]=spawnParticle()}else{p.x+=(Math.random()<0.5?1:-1);p.y+=(Math.random()<0.5?1:-1)}}if(stuckCount>8000){particles=[];for(let j=0;j<200;j++)particles.push(spawnParticle())}}}function draw(){ctx.fillStyle='rgba(5,5,8,0.12)';ctx.fillRect(0,0,W,H);hueOffset+=0.1;for(const p of cluster){const px=p.x*cell,py=p.y*cell;const age=stuckCount-p.gen;const lum=Math.min(70,30+age*0.005);ctx.fillStyle=`hsl(${p.hue},85%,${lum}%)`;ctx.fillRect(px,py,cell,cell)}for(const p of particles){ctx.fillStyle='rgba(120,160,255,0.3)';ctx.fillRect(p.x*cell,p.y*cell,cell,cell)}}function loop(){step();for(let s=0;s<3;s++)step();draw();requestAnimationFrame(loop)}drawBg();loop();</script></body></html>
