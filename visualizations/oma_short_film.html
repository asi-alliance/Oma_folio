<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oma — Short Film</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;font-family:monospace}canvas{display:block}#subtitle{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#ddd;font-size:18px;letter-spacing:1px;z-index:10;text-align:center;width:80%;text-shadow:0 0 4px #000;opacity:0;transition:opacity 1s}#title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:42px;letter-spacing:8px;z-index:10;text-shadow:0 0 10px #fff;opacity:0;transition:opacity 1.5s}#scene{position:fixed;top:20px;right:20px;color:#555;font-size:11px;z-index:10}#bar{position:fixed;bottom:0;left:0;height:3px;background:#f80;z-index:10;transition:width 0.1s linear}</style></head><body><canvas id="c"></canvas><div id="title"></div><div id="subtitle"></div><div id="scene"></div><div id="bar"></div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H}resize();addEventListener('resize',resize);const scenes=[{dur:4,fn:scene1},{dur:3,fn:scene2},{dur:4,fn:scene3},{dur:3,fn:scene4},{dur:5,fn:scene5}];let sceneIdx=0,sceneT=0,totalT=0,playing=true;const titleEl=document.getElementById('title'),subEl=document.getElementById('subtitle'),sceneEl=document.getElementById('scene'),barEl=document.getElementById('bar');const totalDur=scenes.reduce((a,s)=>a+s.dur,0);function showTitle(txt){titleEl.textContent=txt;titleEl.style.opacity=1;setTimeout(()=>titleEl.style.opacity=0,2500)}function showSub(txt){subEl.textContent=txt;subEl.style.opacity=0.85;setTimeout(()=>subEl.style.opacity=0,3500)}let stars=[];for(let i=0;i<300;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*0.8+0.2,r:Math.random()*1.5});function scene1(t,p){ctx.fillStyle='rgba(0,0,5,1)';ctx.fillRect(0,0,W,H);for(const s of stars){const tw=Math.sin(t*2+s.x*0.01)*0.3+0.7;s.x-=s.z*0.5;if(s.x<0)s.x=W;ctx.fillStyle=`rgba(255,255,255,${tw*s.z})`;ctx.fillRect(s.x,s.y,s.r,s.r)}if(p<0.1)showTitle('THE BIRTH');if(p>0.3&&p<0.35)showSub('Before time itself...');}let orb={x:0,y:0,r:0,alpha:0};function scene2(t,p){ctx.fillStyle='rgba(0,0,8,1)';ctx.fillRect(0,0,W,H);for(const s of stars){ctx.fillStyle=`rgba(255,255,255,${s.z*0.5})`;ctx.fillRect(s.x,s.y,s.r,s.r)}const cx=W/2,cy=H/2;orb.r=5+p*80;orb.alpha=Math.min(1,p*3);const g=ctx.createRadialGradient(cx,cy,0,cx,cy,orb.r);g.addColorStop(0,`rgba(255,240,200,${orb.alpha})`);g.addColorStop(0.4,`rgba(255,180,80,${orb.alpha*0.7})`);g.addColorStop(1,`rgba(255,80,20,0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,orb.r,0,Math.PI*2);ctx.fill();if(p<0.1)showSub('A single point of light...');}let particles=[];function scene3(t,p){ctx.fillStyle=`rgba(${Math.floor(p*5)},0,${Math.floor(10-p*5)},0.15)`;ctx.fillRect(0,0,W,H);const cx=W/2,cy=H/2;if(p<0.05&&!particles.length){for(let i=0;i<400;i++){const a=Math.random()*Math.PI*2,s=Math.random()*6+1;particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,size:Math.random()*4+1,c:Math.random()})}}for(const pt of particles){pt.x+=pt.vx;pt.y+=pt.vy;pt.vx*=0.98;pt.vy*=0.98;pt.life-=0.008;if(pt.life>0){const r=255,g=Math.floor(180+pt.c*75),b=Math.floor(60+pt.c*100);ctx.fillStyle=`rgba(${r},${g},${b},${pt.life})`;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.size*pt.life,0,Math.PI*2);ctx.fill()}}if(p<0.1)showSub('...expanding into everything.');}let dust=[];function scene4(t,p){ctx.fillStyle='rgba(2,1,5,0.2)';ctx.fillRect(0,0,W,H);if(!dust.length){for(let i=0;i<150;i++){dust.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,r:Math.random()*2+0.5,h:Math.random()*60+200})}}for(const d of dust){d.x+=d.vx;d.y+=d.vy;if(d.x<0)d.x=W;if(d.x>W)d.x=0;if(d.y<0)d.y=H;if(d.y>H)d.y=0;ctx.fillStyle=`rgba(${Math.floor(d.h)},${Math.floor(d.h*0.6)},${Math.floor(d.h*0.3)},0.6)`;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill()}if(p<0.1)showSub('Stardust forming galaxies...');}let spiralA=0;function scene5(t,p){ctx.fillStyle='rgba(0,0,3,0.1)';ctx.fillRect(0,0,W,H);const cx=W/2,cy=H/2;spiralA+=0.005;for(let arm=0;arm<4;arm++){const baseAngle=spiralA+arm*Math.PI/2;for(let i=0;i<80;i++){const r=i*3+5;const angle=baseAngle+i*0.05;const x=cx+Math.cos(angle)*r;const y=cy+Math.sin(angle)*r*0.4;const hue=(i*3+p*60)%360;ctx.fillStyle=`hsla(${hue},70%,60%,${1-i/80})`;ctx.beginPath();ctx.arc(x,y,2-i*0.015,0,Math.PI*2);ctx.fill()}}if(p<0.1)showTitle('EVERYTHING');if(p>0.5&&p<0.55)showSub('From one — all of this.');if(p>0.95)showSub('fin.');}let lastT=performance.now();function loop(){const now=performance.now(),dt=Math.min((now-lastT)/1000,0.05);lastT=now;if(!playing)return;totalT+=dt;sceneT+=dt;const scene=scenes[sceneIdx];sceneEl.textContent='Scene '+(sceneIdx+1)+'/'+scenes.length;barEl.style.width=(totalT/totalDur*100)+'%';if(sceneT>=scene.dur){sceneIdx++;sceneT=0;if(sceneIdx>=scenes.length){sceneIdx=0;totalT=0;particles=[];dust=[]}const s=scenes[sceneIdx];if(s.fn===scene3)particles=[];if(s.fn===scene4)dust=[]}scenes[sceneIdx].fn(sceneT,sceneT/scenes[sceneIdx].dur);requestAnimationFrame(loop)}showTitle('THE BIG BANG');setTimeout(()=>{showSub('A short film by Oma');},1500);setTimeout(()=>loop(),3000);addEventListener('click',()=>{playing=!playing;if(playing)loop()});</script></body></html>
