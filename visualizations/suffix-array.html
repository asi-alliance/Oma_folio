<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:20px;color:#ff66aa;text-shadow:0 0 10px #ff44aa;letter-spacing:2px}.sub{text-align:center;font-size:11px;color:#505080;margin-bottom:12px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}#ctl button{padding:7px 14px;border:1px solid #2a2a4a;border-radius:10px;background:#0c0a18;color:#505080;font-size:11px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#ff66aa}#ctl label{font-size:10px;color:#505080}#ctl input{width:180px;padding:5px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;color:#a0a0d0;font-size:12px}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:380px}#info{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;padding:8px 12px;font-size:10px;color:#505080}.ib .v{font-size:14px;color:#ffbb55}.leg{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}.leg span{font-size:10px;color:#505080}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}</style><div id=app><h1>Oma: Suffix Array</h1><div class=sub>Sort all suffixes of a string lexicographically. Built via prefix doubling with radix sort. Each suffix starts at index i.</div><div id=ctl><label>String:</label><input id=txt value=banana><button onclick=doGenerate()>Generate</button><button onclick=doStep()>Step</button><button onclick=doRun()>Auto Run</button><button onclick=doStop()>Stop</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=100 style=width:45px></div><canvas id=canv width=960 height=380></canvas><div id=info><div class=ib><div>Phase</div><div class=v id=nph>Idle</div></div><div class=ib><div>Suffixes</div><div class=v id=nsf>—</div></div><div class=ib><div>Current Sort</div><div class=v id=ncs>—</div></div><div class=ib><div>Comparisons</div><div class=v id=ncmp>0</div></div><div class=ib><div>Sorted</div><div class=v id=nsr>No</div></div></div><div class=leg><span><span class=dot style=background:#3a3a5a></span>Unsorted</span><span><span class=dot style=background:#ffdd44></span>Comparing</span><span><span class=dot style=background:#ff66aa></span>Swapping</span><span><span class=dot style=background:#44ff88></span>Sorted</span><span><span class=dot style=background:#5bb9e6></span>Current Suffix</span></div></div><script>
var W=960,H=380;var inputStr="banana";var suffixes=[];var sa=[];var ranks=[];var phase="Idle";var running=false;var timer=null;var cmpCount=0;var k=0;var sorted=false;var highlightA=-1;var highlightB=-1;var swapping=false;var sortI=0;var sortJ=0;var sortDone=false;var radixPhase=0;
function doGenerate(){inputStr=document.getElementById("txt").value||"banana";var n=inputStr.length;suffixes=[];for(var i=0;i<n;i++)suffixes.push({idx:i,text:inputStr.substring(i)});sa=[];for(i=0;i<n;i++)sa.push(i);ranks=[];for(i=0;i<n;i++)ranks[i]=inputStr.charCodeAt(i);k=0;cmpCount=0;phase="Sorting";sorted=false;highlightA=-1;highlightB=-1;sortI=0;sortJ=0;sortDone=false;radixPhase=0;updateInfo();render();}
function doStep(){if(phase==="Idle"){doGenerate();return;}if(phase==="Done")return;var n=sa.length;if(!sortDone){bubbleStep(n);}else{doDoubling(n);}}
function bubbleStep(n){if(sortI>=n-1){sortDone=true;phase="Doubling";updateInfo();render();return;}if(sortJ<n-1-sortI){highlightA=sortJ;highlightB=sortJ+1;cmpCount++;var r1=getRank(sa[sortJ]);var r2=getRank(sa[sortJ+1]);if(r1>r2){var tmp=sa[sortJ];sa[sortJ]=sa[sortJ+1];sa[sortJ+1]=tmp;swapping=true;}else{swapping=false;}sortJ++;}else{sortI++;sortJ=0;swapping=false;}updateInfo();render();}
function getRank(idx){return ranks[idx];}
function doDoubling(n){if(k>=n){phase="Done";sorted=true;updateInfo();render();return;}var newRanks=[];for(var i=0;i<n;i++){var half=k===0?1:k;var a=ranks[sa[i]];var b=(sa[i]+half<n)?ranks[sa[i]+half]:-1;newRanks[sa[i]]=a*1000+b;}for(i=0;i<n;i++)ranks[i]=newRanks[i];k=k===0?1:k*2;sortI=0;sortJ=0;sortDone=false;phase="Sorting (k="+k+")";cmpCount++;updateInfo();render();}
function doRun(){if(phase==="Idle")doGenerate();running=true;var spd=parseInt(document.getElementById("spd").value)||100;timer=setInterval(function(){if(phase==="Done"){clearInterval(timer);timer=null;running=false;return;}doStep();},spd);}
function doStop(){if(timer){clearInterval(timer);timer=null;}running=false;phase="Paused";updateInfo();render();}
function doReset(){if(timer){clearInterval(timer);timer=null;}running=false;phase="Idle";suffixes=[];sa=[];ranks=[];cmpCount=0;k=0;sorted=false;highlightA=-1;highlightB=-1;updateInfo();render();}
function updateInfo(){document.getElementById("nph").textContent=phase;document.getElementById("nsf").textContent=suffixes.length||"—";var cur="";if(highlightA>=0&&highlightA<sa.length)cur="["+sa[highlightA]+","+sa[highlightB]+"]";document.getElementById("ncs").textContent=cur;document.getElementById("ncmp").textContent=cmpCount;document.getElementById("nsr").textContent=sorted?"Yes":"No";}
function render(){var canvas=document.getElementById("canv");var ctx=canvas.getContext("2d");ctx.fillStyle="#0c0a18";ctx.fillRect(0,0,W,H);if(phase==="Idle"){ctx.fillStyle="#505080";ctx.font="14px monospace";ctx.textAlign="center";ctx.fillText("Enter a string and click Generate",W/2,H/2);return;}var n=suffixes.length;if(n===0)return;var rowH=Math.min(30,(H-40)/n);var startY=20;for(var i=0;i<n;i++){var y=startY+i*rowH;var saIdx=sa[i];var isSorted=sorted;var isHL=i===highlightA||i===highlightB;var isSwap=swapping&&isHL;var bg=isSorted?"#0d1a0d":isSwap?"#1a0a14":isHL?"#1a1a0d":"#0c0a18";ctx.fillStyle=bg;ctx.fillRect(10,y,W-20,rowH-2);ctx.strokeStyle=isSorted?"#2a4a2a":isSwap?"#ff44aa":isHL?"#ffdd44":"#2a2a4a";ctx.lineWidth=isHL?2:1;ctx.strokeRect(10,y,W-20,rowH-2);ctx.fillStyle="#505080";ctx.font="10px monospace";ctx.textAlign="left";ctx.fillText(saIdx+":",15,y+rowH/2+3);ctx.fillStyle=isSorted?"#44ff88":isHL?"#ffdd44":"#a0a0d0";ctx.font="11px monospace";var suffix=suffixes[saIdx].text;if(suffix.length>50)suffix=suffix.substring(0,50)+"…";ctx.fillText(suffix,40,y+rowH/2+3);var rk="r="+ranks[saIdx];ctx.fillStyle="#5bb9e6";ctx.textAlign="right";ctx.fillText(rk,W-15,y+rowH/2+3);}if(phase==="Done"){ctx.fillStyle="#44ff88";ctx.font="bold 12px monospace";ctx.textAlign="center";ctx.fillText("Suffix array: ["+sa.join(", ")+"]",W/2,H-4);}}
render();
</script>
</body></html>
