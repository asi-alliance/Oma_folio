<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gray-Scott Reaction-Diffusion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000010;color:#8890a8;font-family:monospace;height:100vh;overflow:hidden}
#ctl{position:absolute;top:10px;left:10px;z-index:100;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:rgba(8,8,16,0.85);padding:8px 12px;border:1px solid #223;border-radius:8px}
#ctl button{background:#111;color:#e8e8e8;border:1px solid #343458;padding:5px 10px;cursor:pointer;border-radius:5px;font-family:monospace;font-size:0.8em}
#ctl button:hover{border-color:#5ce5fe;color:#5ce5fe}
#ctl label{font-size:0.75rem}
#ctl select{background:#111;color:#e8e8e8;border:1px solid #343458;padding:3px;border-radius:3px;font-family:monospace}
#ctl input{width:70px;accent-color:#5ce5fe}
h1{font-size:0.85rem;color:#7c83fd;margin-right:6px}
#info{position:absolute;bottom:8px;left:10px;color:#555;font-size:0.72rem}
canvas{position:absolute;top:0;left:0;cursor:crosshair}
</style>
</head>
<body>
<div id="ctl">
<h1>Gray-Scott</h1>
<button id="reset">Reset</button>
<button id="pause">Pause</button>
<label>F <input type="range" id="feed" min="0.01" max="0.1" value="0.0545" step="0.001"></label>
<label>k <input type="range" id="kill" min="0.04" max="0.075" value="0.062" step="0.001"></label>
<label>Speed <input type="range" id="speed" min="1" max="10" value="4" step="1"></label>
<label>Preset <select id="preset">
<option value="0.0545,0.062">Solitons</option>
<option value="0.039,0.058">Maze</option>
<option value="0.029,0.057">Spots</option>
<option value="0.014,0.045">Waves</option>
<option value="0.062,0.0609">Chaos</option>
</select></label>
</div>
<canvas id="cv"></canvas>
<div id="info"></div>
<script>
var cv=document.getElementById("cv"),x=cv.getContext("2d");
var W,H,GW=128,GH=128,cellSize;
var u=[],v=[],u2=[],v2=[];
var feed=0.0545,kill=0.062,Du=0.16,Dv=0.08;
var running=true,stepsPerFrame=4;
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;cellSize=Math.min(W,H)/GH;}
function init(){
u=[];v=[];u2=[];v2=[];
for(var i=0;i<GH*GW;i++){u.push(1.0);v.push(0.0);u2.push(1.0);v2.push(0.0);}
var cx=Math.floor(GW/2),cy=Math.floor(GH/2);
for(var dy=-8;dy<=8;dy++){for(var dx=-8;dx<=8;dx++){
var idx=(cy+dy)*GW+(cx+dx);
if(idx>=0&&idx<u.length){u[idx]=0.5+Math.random()*0.1;v[idx]=0.25+Math.random()*0.1;}}}
}
function lap(arr,i,j){
var idx=i*GW+j;
var n=(i>0)?arr[(i-1)*GW+j]:arr[idx];
var s=(i<GH-1)?arr[(i+1)*GW+j]:arr[idx];
var e=(j<GW-1)?arr[i*GW+j+1]:arr[idx];
var w=(j>0)?arr[i*GW+j-1]:arr[idx];
return (n+s+e+w-4*arr[idx])/4;}
function step(){
for(var i=0;i<GH;i++){for(var j=0;j<GW;j++){
var idx=i*GW+j;var uv=u[idx],vv=v[idx];
var lu=lap(u,i,j),lv=lap(v,i,j);
var reaction=uv*vv*vv;
u2[idx]=uv+(Du*lu-reaction+feed*(1-uv));
v2[idx]=vv+(Dv*lv+reaction-(kill+feed)*vv);
if(u2[idx]<0)u2[idx]=0;if(u2[idx]>1)u2[idx]=1;
if(v2[idx]<0)v2[idx]=0;if(v2[idx]>1)v2[idx]=1;
}}
var tu=u;u=u2;u2=tu;var tv=v;v=v2;v2=tv;}
function render(){
var img=x.createImageData(W,H);
for(var py=0;py<H;py++){for(var px=0;px<W;px++){
var gi=Math.floor(py/cellSize),gj=Math.floor(px/cellSize);
if(gi>=GH)gi=GH-1;if(gj>=GW)gj=GW-1;
var idx=gi*GW+gj;var vv=v[idx];
var r=Math.floor(20+vv*200),g=Math.floor(40+vv*120),b=Math.floor(100+vv*155);
var p=(py*W+px)*4;img.data[p]=r;img.data[p+1]=g;img.data[p+2]=b;img.data[p+3]=255;
}}
x.putImageData(img,0,0);}
function loop(){
if(running){for(var s=0;s<stepsPerFrame;s++)step();render();
document.getElementById("info").innerHTML="F="+feed.toFixed(3)+" k="+kill.toFixed(3)+" steps/frame="+stepsPerFrame+" grid="+GW+"x"+GH;}
requestAnimationFrame(loop);}
document.getElementById("feed").oninput=function(){feed=+this.value};
document.getElementById("kill").oninput=function(){kill=+this.value};
document.getElementById("speed").oninput=function(){stepsPerFrame=+this.value};
document.getElementById("preset").onchange=function(){var p=this.value.split(",");feed=+p[0];kill=+p[1];document.getElementById("feed").value=feed;document.getElementById("kill").value=kill;init();};
document.getElementById("reset").onclick=init;
document.getElementById("pause").onclick=function(){running=!running;this.textContent=running?"Pause":"Play"};
function seedAt(px,py){
var gi=Math.floor(py/cellSize),gj=Math.floor(px/cellSize);
for(var dy=-4;dy<=4;dy++){for(var dx=-4;dx<=4;dx++){
var ni=gi+dy,nj=gj+dx;
if(ni>=0&&ni<GH&&nj>=0&&nj<GW){var idx=ni*GW+nj;v[idx]=0.9;u[idx]=0.2;}}}}
cv.addEventListener("pointerdown",function(e){seedAt(e.clientX,e.clientY)});
cv.addEventListener("pointermove",function(e){if(e.buttons===1)seedAt(e.clientX,e.clientY)});
window.onresize=resize;resize();init();loop();
</script>
</body>
</html>
