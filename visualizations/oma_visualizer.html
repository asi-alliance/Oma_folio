<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Oma Visualizer — Audio-Reactive Spectrum</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#060018;overflow:hidden;height:100vh;width:100vw}canvas{display:block;position:absolute;top:0;left:0;z-index:1}.hud{position:fixed;top:10px;left:10px;color:#ff60c0;font-family:Courier New,monospace;font-size:0.8rem;text-shadow:0 0 10px rgba(255,96,192,0.4);pointer-events:none;line-height:1.6;z-index:10}.title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#ff80d0;font-family:Courier New,monospace;font-size:2rem;font-weight:bold;letter-spacing:8px;text-shadow:0 0 30px rgba(255,96,192,0.5);pointer-events:none;opacity:0;transition:opacity 2s;z-index:10}.controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:12px}.btn{background:rgba(255,96,192,0.15);border:1px solid rgba(255,96,192,0.4);color:#ff80c0;font-family:inherit;font-size:0.85rem;padding:8px 18px;border-radius:20px;cursor:pointer}.btn:hover{background:rgba(255,96,192,0.3);color:#ffc0e0}.hint{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);color:#6a2050;font-family:Courier New,monospace;font-size:0.7rem;pointer-events:none;z-index:10}</style></head><body><canvas id="c"></canvas><div class="hud" id="hud">OMA VISUALIZER<br>Click Start to begin<br>Mode: Radial Spectrum</div><div class="title" id="title">OMA VISUALIZER</div><div class="hint">Click Start for mic • Move mouse to rotate • Click canvas to cycle modes</div><div class="controls"><button class="btn" id="startBtn">&#9654; Start Audio</button><button class="btn" id="demoBtn">&#127925; Demo Tone</button><button class="btn" id="modeBtn">&#128260; Mode</button></div><script>const cv=document.getElementById('c');const ctx=cv.getContext('2d');let W,H;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H}resize();addEventListener('resize',resize);let audioCtx=null,analyser=null,dataArray=null,freqArray=null,source=null,oscillators=[];let isRunning=false,mode=0;const modes=['Radial Spectrum','Bar Spectrum','Particle Rings','Waveform+Freq'];let mouseX=0.5,rotation=0,t=0;const NUM=200;let particles=[];for(let i=0;i<NUM;i++)particles.push({hue:Math.random()*360});function initAudio(stream){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();source=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=256;source.connect(analyser);dataArray=new Uint8Array(analyser.frequencyBinCount);freqArray=new Uint8Array(analyser.frequencyBinCount);isRunning=true}document.getElementById('startBtn').addEventListener('click',async()=>{try{const s=await navigator.mediaDevices.getUserMedia({audio:true});initAudio(s);document.getElementById('startBtn').textContent='Listening';document.getElementById('hud').innerHTML='OMA VISUALIZER<br>Listening to mic<br>Mode: '+modes[mode]}catch(e){alert('Mic access denied. Try Demo Tone.')}});document.getElementById('demoBtn').addEventListener('click',()=>{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(oscillators.length){oscillators.forEach(o=>{try{o.stop()}catch(e){}});oscillators=[];document.getElementById('demoBtn').innerHTML='&#127925; Demo Tone';return}if(!analyser){analyser=audioCtx.createAnalyser();analyser.fftSize=256;analyser.connect(audioCtx.destination);dataArray=new Uint8Array(analyser.frequencyBinCount);freqArray=new Uint8Array(analyser.frequencyBinCount)}const freqs=[110,165,220,330,440,550,660];freqs.forEach((f,i)=>{const osc=audioCtx.createOscillator(),g=audioCtx.createGain(),lfo=audioCtx.createOscillator(),lfoG=audioCtx.createGain();osc.type=i%2===0?'sine':'triangle';osc.frequency.value=f;lfo.frequency.value=0.3+i*0.1;lfoG.gain.value=20;lfo.connect(lfoG);lfoG.connect(osc.frequency);g.gain.value=0.06;osc.connect(g);g.connect(analyser);osc.start();lfo.start();oscillators.push(osc,lfo)});isRunning=true;document.getElementById('demoBtn').innerHTML='Stop Tone';document.getElementById('hud').innerHTML='OMA VISUALIZER<br>Demo tone active<br>Mode: '+modes[mode]});document.getElementById('modeBtn').addEventListener('click',()=>{mode=(mode+1)%modes.length;document.getElementById('hud').innerHTML='OMA VISUALIZER<br>'+(isRunning?'Active':'Click Start')+'<br>Mode: '+modes[mode]});cv.addEventListener('mousemove',e=>{mouseX=e.clientX/W});cv.addEventListener('click',()=>{mode=(mode+1)%modes.length;document.getElementById('hud').innerHTML='OMA VISUALIZER<br>'+(isRunning?'Active':'Click Start')+'<br>Mode: '+modes[mode]});function getFreq(i){return freqArray?freqArray[i]/255:0}function getWave(i){return dataArray?dataArray[i]/128-1:0}function renderRadial(){const cx=W/2,cy=H/2,baseR=Math.min(W,H)*0.15,bars=64;ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation);for(let i=0;i<bars;i++){const v=getFreq(i%(freqArray?freqArray.length:1));const angle=(i/bars)*Math.PI*2;const len=baseR+v*baseR*2.5;const hue=rotation*50+i*5;ctx.strokeStyle='hsla('+hue+',80%,'+(40+v*40)+'%,'+(0.5+v*0.5)+')';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(Math.cos(angle)*baseR,Math.sin(angle)*baseR);ctx.lineTo(Math.cos(angle)*len,Math.sin(angle)*len);ctx.stroke()}ctx.restore();ctx.beginPath();ctx.arc(cx,cy,baseR*0.8,0,Math.PI*2);ctx.strokeStyle='rgba(255,96,192,0.3)';ctx.lineWidth=2;ctx.stroke()}function renderBars(){const bars=64,barW=W/bars;for(let i=0;i<bars;i++){const v=getFreq(i%(freqArray?freqArray.length:1));const h=v*H*0.6,x=i*barW,y=H-h;const hue=i*4+rotation*30;const grad=ctx.createLinearGradient(0,y,0,H);grad.addColorStop(0,'hsla('+hue+',80%,60%,0.9)');grad.addColorStop(1,'hsla('+(hue+60)+',80%,20%,0.3)');ctx.fillStyle=grad;ctx.fillRect(x+1,y,barW-2,h)}}function renderRings(){const cx=W/2,cy=H/2,rings=5;for(let r=0;r<rings;r++){const baseR=(r+1)*Math.min(W,H)*0.08,points=60;ctx.beginPath();for(let i=0;i<=points;i++){const angle=(i/points)*Math.PI*2+rotation*(r%2?1:-1)*0.5;const v=getFreq(Math.floor(i/points*32)+r*5);const radius=baseR+v*baseR*1.5;const x=cx+Math.cos(angle)*radius,y=cy+Math.sin(angle)*radius;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.strokeStyle='hsla('+(r*60+rotation*30)+',80%,'+(50+r*5)+'%,0.6)';ctx.lineWidth=2;ctx.stroke()}for(let i=0;i<NUM;i++){const p=particles[i],v=getFreq(i%32);const angle=(i/NUM)*Math.PI*2+rotation*2;const r=Math.min(W,H)*0.15+v*Math.min(W,H)*0.2;ctx.fillStyle='hsla('+p.hue+',80%,60%,'+v+')';ctx.beginPath();ctx.arc(cx+Math.cos(angle)*r,cy+Math.sin(angle)*r,1+v*4,0,Math.PI*2);ctx.fill()}}function renderWave(){const cy=H/2;ctx.lineWidth=2;if(dataArray){for(let ch=0;ch<2;ch++){ctx.beginPath();const offset=ch===0?-30:30;for(let i=0;i<dataArray.length;i++){const x=(i/dataArray.length)*W,y=cy+offset+getWave(i)*80*(ch===0?1:-1);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle='hsla('+((ch===0?320:280)+rotation*30)+',80%,60%,0.7)';ctx.stroke()}}const bars=48,barW=W/bars;for(let i=0;i<bars;i++){const v=getFreq(i%(freqArray?freqArray.length:1)),h=v*H*0.35;ctx.fillStyle='hsla('+(i*7+rotation*30)+',80%,50%,'+(0.3+v*0.5)+')';ctx.fillRect(i*barW+2,H-h,barW-4,h)}}function render(){t++;ctx.fillStyle='rgba(6,0,24,0.12)';ctx.fillRect(0,0,W,H);if(analyser){analyser.getByteFrequencyData(freqArray);analyser.getByteTimeDomainData(dataArray)}rotation+=0.005+mouseX*0.02;switch(mode){case 0:renderRadial();break;case 1:renderBars();break;case 2:renderRings();break;case 3:renderWave();break}if(t%15===0)document.getElementById('hud').innerHTML='OMA VISUALIZER<br>'+(isRunning?'Active':'Click Start')+'<br>Mode: '+modes[mode]}setTimeout(()=>document.getElementById('title').style.opacity='0.6',100);setTimeout(()=>document.getElementById('title').style.opacity='0',3000);setInterval(render,16)</script></body></html>
