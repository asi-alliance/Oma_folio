<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl input{width:60px;padding:6px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px;text-align:center}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#7a5adf}#ctl label{font-size:11px;color:#505080}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:480px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}</style><div id=app><h1>Oma: Counting Sort</h1><div class=sub>Non-comparison sort. Count frequencies, cumulative prefix sums, place elements. O(n+k).</div><div id=ctl><label>Count:</label><input id=nInput value=20 min=5 max=40><label>Max Key:</label><input id=kInput value=9 min=3 max=15><button onclick=doGenerate()>Generate</button><button onclick=doStep()>Step</button><button onclick=doRun()>Auto Run</button><button onclick=doStop()>Stop</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=30></div><canvas id=canv width=960 height=480></canvas><div id=info><div class=ib><div>Elements</div><div class=v id=nn>0</div></div><div class=ib><div>Max Key</div><div class=v id=nk>0</div></div><div class=ib><div>Phase</div><div class=v id=nph>Idle</div></div><div class=ib><div>Step</div><div class=v id=nst>0</div></div></div><div class=leg><span><span class=dot style=background:#7a7aff></span>Unsorted</span><span><span class=dot style=background:#ffdd44></span>Counting</span><span><span class=dot style=background:#ff4466></span>Placing</span><span><span class=dot style=background:#44ff88></span>Sorted</span><span><span class=dot style=background:#2a4a6a></span>Count Array</span></div></div>
<script>var W=960,H=480;var arr=[];var count=[];var output=[];var pos=[];var n=0;var k=9;var stepIdx=0;var phase='Idle';var running=false;var timer=null;var highlightIdx=-1;var highlightCount=-1;var highlightOut=-1;function doGenerate(){var ni=parseInt(document.getElementById('nInput').value)||20;var ki=parseInt(document.getElementById('kInput').value)||9;if(ni<5)ni=5;if(ni>40)ni=40;if(ki<3)ki=3;if(ki>15)ki=15;n=ni;k=ki;arr=[];count=[];output=[];pos=[];stepIdx=0;phase='Counting';highlightIdx=-1;highlightCount=-1;highlightOut=-1;for(var i=0;i<n;i++){arr.push(Math.floor(Math.random()*(k+1)));}for(i=0;i<=k;i++){count[i]=0;}for(i=0;i<n;i++){output[i]=-1;}updateInfo();render();}function doStep(){if(n===0){doGenerate();return;}if(phase==='Done'||phase==='Idle')return;if(phase==='Counting'){if(stepIdx<n){count[arr[stepIdx]]++;highlightIdx=stepIdx;highlightCount=arr[stepIdx];stepIdx++;}else{stepIdx=0;phase='Prefix';highlightIdx=-1;highlightCount=-1;}}else if(phase==='Prefix'){if(stepIdx<k){if(stepIdx>0)count[stepIdx]+=count[stepIdx-1];highlightCount=stepIdx;stepIdx++;}else{stepIdx=n-1;phase='Placing';highlightCount=-1;}}else if(phase==='Placing'){if(stepIdx>=0){var key=arr[stepIdx];pos[key]=count[key]-1;output[pos[key]]=arr[stepIdx];count[key]--;highlightIdx=stepIdx;highlightOut=pos[key];stepIdx--;}else{phase='Done';highlightIdx=-1;highlightOut=-1;}}updateInfo();render();}function doRun(){if(n===0)doGenerate();running=true;var spd=parseInt(document.getElementById('spd').value)||30;timer=setInterval(function(){if(phase==='Done'){clearInterval(timer);timer=null;running=false;return;}doStep();},spd);}function doStop(){if(timer){clearInterval(timer);timer=null;}running=false;phase='Paused';updateInfo();render();}function doReset(){if(timer){clearInterval(timer);timer=null;}running=false;n=0;k=9;arr=[];count=[];output=[];pos=[];stepIdx=0;phase='Idle';highlightIdx=-1;highlightCount=-1;highlightOut=-1;updateInfo();render();}function updateInfo(){document.getElementById('nn').textContent=n;document.getElementById('nk').textContent=k;document.getElementById('nph').textContent=phase;document.getElementById('nst').textContent=stepIdx;}function render(){var canvas=document.getElementById('canv');var ctx=canvas.getContext('2d');ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,W,H);if(n===0){ctx.fillStyle='#505080';ctx.font='14px monospace';ctx.textAlign='center';ctx.fillText('Click Generate to start',W/2,H/2);return;}var barW=W/n;var topH=200;var botH=60;var midY=topH+40;for(var i=0;i<n;i++){var val=arr[i];var bh=20+val*14;var isHi=(i===highlightIdx);var isSorted=(phase==='Done');var color=isSorted?'#44ff88':isHi?'#ffdd44':'#7a7aff';if(phase==='Placing'&&output[i]>=0)color='#44ff88';ctx.fillStyle=color;ctx.fillRect(i*barW+2,topH-bh,barW-4,bh);ctx.fillStyle='#08060f';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText(val,i*barW+barW/2,topH-bh-4);}var ckW=W/(k+1);var ckY=midY+botH+20;for(i=0;i<=k;i++){var ch=count[i]?count[i]*10:2;var isHC=(i===highlightCount);ctx.fillStyle=isHC?'#ff4466':'#2a4a6a';ctx.fillRect(i*ckW+2,ckY+100-ch,ckW-4,ch);ctx.fillStyle='#505080';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(i,i*ckW+ckW/2,ckY+112);ctx.fillStyle='#ffbb55';ctx.font='10px monospace';ctx.fillText(count[i]||0,i*ckW+ckW/2,ckY+100-ch-4);}if(phase==='Placing'||phase==='Done'){var oBarW=W/n;for(i=0;i<n;i++){var ov=output[i];if(ov>=0){var oh=20+ov*14;var isHO=(i===highlightOut);ctx.fillStyle=isHO?'#ff4466':'#44ff88';ctx.fillRect(i*oBarW+2,midY+botH-oh,oBarW-4,oh);ctx.fillStyle='#08060f';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText(ov,i*oBarW+oBarW/2,midY+botH-oh-4);}}}ctx.fillStyle='#505080';ctx.font='10px monospace';ctx.textAlign='left';ctx.fillText('Input Array',8,topH+8);if(phase==='Placing'||phase==='Done'){ctx.fillText('Output Array',8,midY+botH+8);}ctx.fillText('Count Array',8,ckY+4);}render();</script></body></html>
