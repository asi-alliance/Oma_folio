<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Oma - Boids Flocking</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050510;overflow:hidden;font-family:monospace}canvas{display:block}#hud{position:fixed;bottom:12px;left:12px;color:#445;font-size:11px;line-height:1.6;z-index:10;text-shadow:0 0 3px #000}#hud b{color:#fb8}#title{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#334;font-size:13px;letter-spacing:6px;z-index:10;text-shadow:0 0 4px #000;pointer-events:none}</style></head><body><canvas id=c></canvas><div id=title>BOIDS FLOCKING</div><div id=hud><b>Move</b> to attract boids - <b>Click</b> to scatter - <b>Right-click</b> to reset - Reynolds boids with separation/alignment/cohesion</div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H}resize();addEventListener('resize',resize);let mx=-999,my=-999;addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY;e.preventDefault()},{passive:false});addEventListener('touchend',()=>{mx=-999;my=-999});const NUM=300;const viewR=60,sepR=25,maxSpeed=3.5,maxForce=0.08;let boids=[];function rand(a,b){return a+Math.random()*(b-a)}function initBoids(){boids=[];for(let i=0;i<NUM;i++)boids.push({x:rand(0,W),y:rand(0,H),vx:rand(-2,2),vy:rand(-2,2),hue:rand(0,360)})}initBoids();addEventListener('click',()=>{for(const b of boids){b.vx+=rand(-8,8);b.vy+=rand(-8,8)}});addEventListener('contextmenu',e=>{e.preventDefault();initBoids()});function limit(v,max){const m=Math.sqrt(v.x*v.x+v.y*v.y);if(m>max){v.x=v.x/m*max;v.y=v.y/m*max}return v}function flock(b,idx){let sepX=0,sepY=0,sepC=0;let alX=0,alY=0,alC=0;let coX=0,coY=0,coC=0;for(let i=0;i<boids.length;i++){if(i===idx)continue;const o=boids[i];const dx=b.x-o.x,dy=b.y-o.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<sepR&&d>0){sepX-=dx/d;sepY-=dy/d;sepC++}if(d<viewR&&d>0){alX+=o.vx;alY+=o.vy;alC++;coX+=o.x;coY+=o.y;coC++}}let fx=0,fy=0;if(sepC>0){sepX/=sepC;sepY/=sepC;const m=Math.sqrt(sepX*sepX+sepY*sepY);if(m>0){sepX=sepX/m*maxSpeed-b.vx;sepY=sepY/m*maxSpeed-b.vy}const fm=Math.sqrt(sepX*sepX+sepY*sepY);if(fm>maxForce){sepX=sepX/fm*maxForce;sepY=sepY/fm*maxForce}fx+=sepX*1.5;fy+=sepY*1.5}if(alC>0){alX/=alC;alY/=alC;const m=Math.sqrt(alX*alX+alY*alY);if(m>0){alX=alX/m*maxSpeed-b.vx;alY=alY/m*maxSpeed-b.vy}const fm=Math.sqrt(alX*alX+alY*alY);if(fm>maxForce){alX=alX/fm*maxForce;alY=alY/fm*maxForce}fx+=alX;fy+=alY}if(coC>0){coX=coX/coC-b.x;coY=coY/coC-b.y;const m=Math.sqrt(coX*coX+coY*coY);if(m>0){coX=coX/m*maxSpeed-b.vx;coY=coY/m*maxSpeed-b.vy}const fm=Math.sqrt(coX*coX+coY*coY);if(fm>maxForce){coX=coX/fm*maxForce;coY=coY/fm*maxForce}fx+=coX;fy+=coY}if(mx>0){const dx=mx-b.x,dy=my-b.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<200&&d>0){fx+=dx/d*0.3;fy+=dy/d*0.3}}return{x:fx,y:fy}}function step(){for(let i=0;i<boids.length;i++){const b=boids[i];const f=flock(b,i);b.vx+=f.x;b.vy+=f.y;const m=Math.sqrt(b.vx*b.vx+b.vy*b.vy);if(m>maxSpeed){b.vx=b.vx/m*maxSpeed;b.vy=b.vy/m*maxSpeed}b.x+=b.vx;b.y+=b.vy;if(b.x<0)b.x+=W;if(b.x>W)b.x-=W;if(b.y<0)b.y+=H;if(b.y>H)b.y-=H;b.hue=(b.hue+0.1)%360}}function draw(){ctx.fillStyle='rgba(5,5,16,0.1)';ctx.fillRect(0,0,W,H);for(const b of boids){const angle=Math.atan2(b.vy,b.vx);const speed=Math.sqrt(b.vx*b.vx+b.vy*b.vy);const lum=Math.min(65,40+speed*5);ctx.fillStyle=`hsla(${b.hue},80%,${lum}%,0.85)`;ctx.beginPath();ctx.moveTo(b.x+Math.cos(angle)*8,b.y+Math.sin(angle)*8);ctx.lineTo(b.x+Math.cos(angle+2.5)*5,b.y+Math.sin(angle+2.5)*5);ctx.lineTo(b.x+Math.cos(angle-2.5)*5,b.y+Math.sin(angle-2.5)*5);ctx.closePath();ctx.fill()}}function loop(){step();draw();requestAnimationFrame(loop)}loop();</script></body></html>
