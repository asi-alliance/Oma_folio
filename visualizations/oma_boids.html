<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oma - Boids</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#080810;overflow:hidden;font-family:monospace}canvas{display:block}#hud{position:fixed;bottom:12px;left:12px;color:#445;font-size:11px;line-height:1.6;z-index:10;text-shadow:0 0 3px #000}#hud b{color:#8fa}#title{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#334;font-size:13px;letter-spacing:6px;z-index:10;text-shadow:0 0 4px #000;pointer-events:none}</style></head><body><canvas id="c"></canvas><div id="title">BOIDS</div><div id="hud"><b>Move</b> to attract - <b>Click</b> to scatter - <b>Right-click</b> to repel - Emergent flocking from 3 rules</div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H}resize();addEventListener('resize',resize);let mx=-999,my=-999,rmb=false;addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});addEventListener('mousedown',e=>{if(e.button===2){rmb=true}});addEventListener('mouseup',e=>{rmb=false});addEventListener('contextmenu',e=>e.preventDefault());addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY;e.preventDefault()},{passive:false});addEventListener('touchend',()=>{mx=-999;my=-999});addEventListener('click',e=>{if(e.button===0){for(const b of boids){b.vx+=(Math.random()-0.5)*15;b.vy+=(Math.random()-0.5)*15}}});const N=200;const boids=[];for(let i=0;i<N;i++){boids.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2,h:Math.random()*360});}const sepR=25,aliR=50,cohR=50,sepF=1.5,aliF=0.05,cohF=0.01,maxSpeed=2.5,maxForce=0.08;function step(){ctx.fillStyle='rgba(8,8,16,0.15)';ctx.fillRect(0,0,W,H);for(const b of boids){let sepX=0,sepY=0,sepCount=0;let aliX=0,aliY=0,aliCount=0;let cohX=0,cohY=0,cohCount=0;for(const o of boids){if(o===b)continue;const dx=o.x-b.x,dy=o.y-b.y;const d=Math.sqrt(dx*dx+dy*dy);if(d>0&&d<sepR){sepX-=dx/d;sepY-=dy/d;sepCount++}if(d>0&&d<aliR){aliX+=o.vx;aliY+=o.vy;aliCount++}if(d>0&&d<cohR){cohX+=o.x;cohY+=o.y;cohCount++}}let fx=0,fy=0;if(sepCount>0){fx+=sepX*sepF;fy+=sepY*sepF}if(aliCount>0){fx+=(aliX/aliCount-b.vx)*aliF;fy+=(aliY/aliCount-b.vy)*aliF}if(cohCount>0){fx+=(cohX/cohCount-b.x)*cohF;fy+=(cohY/cohCount-b.y)*cohF}if(mx>0){const dx=mx-b.x,dy=my-b.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<200&&d>0){if(rmb){fx-=dx/d*0.3;fy-=dy/d*0.3}else{fx+=dx/d*0.15;fy+=dy/d*0.15}}}b.vx+=fx;b.vy+=fy;const sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);if(sp>maxSpeed){b.vx=b.vx/sp*maxSpeed;b.vy=b.vy/sp*maxSpeed}if(sp<0.5){b.vx=b.vx/Math.max(sp,0.01)*0.5;b.vy=b.vy/Math.max(sp,0.01)*0.5}b.x+=b.vx;b.y+=b.vy;if(b.x<0)b.x+=W;if(b.x>W)b.x-=W;if(b.y<0)b.y+=H;if(b.y>H)b.y-=H}for(const b of boids){const angle=Math.atan2(b.vy,b.vx);const sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);const len=8+sp*4;const hue=(b.h+performance.now()*0.01)%360;ctx.strokeStyle='hsla('+hue+',80%,60%,0.7)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-Math.cos(angle)*len,b.y-Math.sin(angle)*len);ctx.stroke();ctx.fillStyle='hsla('+hue+',80%,70%,0.9)';ctx.beginPath();ctx.arc(b.x,b.y,2,0,Math.PI*2);ctx.fill();if(sp>1){ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=0.5;for(let i=0;i<boids.length;i+=3){const o=boids[i];const dx=o.x-b.x,dy=o.y-b.y;const d=Math.sqrt(dx*dx+dy*dy);if(d>0&&d<40){ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(o.x,o.y);ctx.stroke()}}}}requestAnimationFrame(step)}step();</script></body></html>
