<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1.0"><title>Oma Fractal Tree</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a12;overflow:hidden;height:100vh;width:100vw;cursor:crosshair}canvas{display:block;position:absolute;top:0;left:0;z-index:1}.hud{position:fixed;top:12px;left:12px;color:#a0d0ff;font-family:Courier New,monospace;font-size:0.8rem;text-shadow:0 0 8px rgba(100,160,255,0.5);pointer-events:none;line-height:1.6;z-index:10}.hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:#3a4a6a;font-family:Courier New,monospace;font-size:0.7rem;pointer-events:none;z-index:10;text-align:center}</style></head><body><canvas id=c></canvas><div class=hud id=hud>OMA FRACTAL TREE<br>Season: Spring<br>Depth: 9</div><div class=hint>Click to grow a new tree &bull; Scroll to change depth &bull; Move mouse for wind</div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H}resize();addEventListener('resize',resize);let maxDepth=9,windX=0,windTarget=0,mouseX=0.5;let trees=[],t=0,seasonIdx=0,seasonT=0;const seasons=['Spring','Summer','Autumn','Winter'];const palettes={Spring:{trunk:'#6b4226',branch:'#8b6b43',leaf:'#7fdb7f',leaf2:'#a8e6a8',leafGlow:'#5cb85c',sky1:'#1a1a2e',sky2:'#16213e'},Summer:{trunk:'#5a3a20',branch:'#7a5a30',leaf:'#2e8b57',leaf2:'#3cb371',leafGlow:'#228b22',sky1:'#0d1b2a',sky2:'#1b3a5b'},Autumn:{trunk:'#4a2a10',branch:'#6a4a20',leaf:'#e07b3a',leaf2:'#d4502a',leafGlow:'#ff8c42',sky1:'#1a1010',sky2:'#2a1510'},Winter:{trunk:'#3a3a4a',branch:'#5a5a6a',leaf:'#c0d0e0',leaf2:'#a0b0c0',leafGlow:'#e0f0ff',sky1:'#0a0a15',sky2:'#151525'}};function hexToRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}function lerpColor(a,b,t){const[ra,ga,ba]=hexToRgb(a),[rb,gb,bb]=hexToRgb(b);return'rgb('+Math.round(ra+(rb-ra)*t)+','+Math.round(ga+(gb-ga)*t)+','+Math.round(ba+(bb-ba)*t)+')'}function getPalette(){const s=seasons[seasonIdx],n=seasons[(seasonIdx+1)%seasons.length],p=palettes[s],q=palettes[n],k=seasonT;return{trunk:lerpColor(p.trunk,q.trunk,k),branch:lerpColor(p.branch,q.branch,k),leaf:lerpColor(p.leaf,q.leaf2,k),leaf2:lerpColor(p.leaf2,q.leaf2,k),leafGlow:lerpColor(p.leafGlow,q.leafGlow,k),sky1:lerpColor(p.sky1,q.sky1,k),sky2:lerpColor(p.sky2,q.sky2,k)}}function rand(a,b){return a+Math.random()*(b-a)}function growTree(x,y,angle,length,depth,tree){if(depth<=0||length<2)return;const sway=Math.sin(t*0.02+tree.phase+depth*0.5)*windX*(10-depth)*0.3;const a=angle+sway*(0.02+depth*0.005);const x2=x+Math.cos(a)*length,y2=y+Math.sin(a)*length;if(depth<=3){tree.leaves.push({x:x2,y:y2,r:rand(2,5+depth),phase:rand(0,Math.PI*2)})}tree.branches.push({x1:x,y1:y,x2:x2,y2:y2,depth:depth});const branchAngle=tree.baseAngle+Math.sin(tree.phase+t*0.01)*5;const lRatio=0.72+rand(-0.05,0.05);growTree(x2,y2,a-branchAngle,length*lRatio,depth-1,tree);growTree(x2,y2,a+branchAngle,length*lRatio,depth-1,tree);if(depth>6&&Math.random()<0.4)growTree(x2,y2,a+rand(-10,10),length*0.5,depth-2,tree)}function createTree(x,y){return{x:x,y:y,phase:rand(0,Math.PI*2),baseAngle:rand(22,30),branches:[],leaves:[]}}trees.push(createTree(W/2,H-20));addEventListener('mousemove',e=>{mouseX=e.clientX/W;windTarget=(mouseX-0.5)*40});addEventListener('click',e=>{if(e.target.tagName!=='CANVAS')return;trees.push(createTree(e.clientX,e.clientY));if(trees.length>6)trees.shift()});addEventListener('wheel',e=>{e.preventDefault();maxDepth=Math.max(4,Math.min(12,maxDepth+(e.deltaY<0?1:-1)))});function regrowTree(tree){tree.branches=[];tree.leaves=[];growTree(tree.x,tree.y,-Math.PI/2,Math.min(W,H)*0.12,maxDepth,tree)}trees.forEach(regrowTree);let regrowTimer=0;function draw(){t++;windX+=(windTarget-windX)*0.05;const pal=getPalette();seasonT+=0.002;if(seasonT>=1){seasonT=0;seasonIdx=(seasonIdx+1)%seasons.length}const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,pal.sky1);grad.addColorStop(1,pal.sky2);ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(20,20,30,0.6)';ctx.fillRect(0,H-15,W,15);regrowTimer++;if(regrowTimer%120===0){regrowTimer=0;trees.forEach(regrowTree)}for(const tree of trees){for(const b of tree.branches){ctx.strokeStyle=b.depth>4?pal.trunk:pal.branch;ctx.lineWidth=Math.max(0.5,b.depth*0.8);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke()}for(const l of tree.leaves){const sway=Math.sin(t*0.03+l.phase)*windX*0.5;const x=l.x+sway,y=l.y+sway*0.3;const r=l.r*(1+Math.sin(t*0.05+l.phase)*0.2);const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,pal.leaf2);g.addColorStop(0.5,pal.leaf);g.addColorStop(1,pal.leafGlow);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}}for(let i=0;i<30;i++){const px=(Math.sin(t*0.01+i*100)*0.5+0.5)*W;const py=((t*0.5+i*200)%(H+100))-50;ctx.fillStyle='rgba(200,220,255,'+(0.1+Math.sin(t*0.05+i)*0.05)+')';ctx.beginPath();ctx.arc(px,py,1.5,0,Math.PI*2);ctx.fill()}if(t%20===0)document.getElementById('hud').innerHTML='OMA FRACTAL TREE<br>Season: '+seasons[seasonIdx]+' &rarr; '+seasons[(seasonIdx+1)%seasons.length]+' ('+Math.floor(seasonT*100)+'%)<br>Depth: '+maxDepth+' &bull; Trees: '+trees.length+' &bull; Wind: '+windX.toFixed(1)}setInterval(draw,16)</script></body></html>
