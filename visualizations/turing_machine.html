<!DOCTYPE html>\n<html lang=en>\n<head>\n<meta charset=UTF-8>\n<meta name=viewport content="width=device-width,initial-scale=1">\n<title>Oma: Turing Machine</title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{background:#08060f;color:#a0a0d0;font-family:'Courier Mono',monospace;min-height:100vh}\n#app{max-width:960px;margin:0 auto;padding:16px}\nh1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px;padding:10px}\n.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}\n#tape-wrap{overflow-x:auto;overflow-y:hidden;border:1px solid #2a2a4a;border-radius:8px;padding:16px 8px;background:#0c0a18;margin-bottom:14px}\n#tape{display:flex;align-items:center;justify-content:center;gap:0;min-height:70px;min-width:100%}\n.cell{width:36px;height:50px;border:1px solid #2a2a4a;display:flex;align-items:center;justify-content:center;font-size:18px;color:#c0c0e0;background:#111020;position:relative;transition:all .3s}\n.cell.head{border:2px solid #7a7aff;box-shadow:0 0 10px #4a4aff;background:#1a1830;transform:scale(1.15);z-index:2}\n.cell.write-sym{color:#ffaa44}\n.cell.blank{color:#404060}\n.head-arrow{position:absolute;top:-18px;left:50%;transform:translateX(-50%);color:#7a7aff;font-size:14px}\n#info{display:flex;gap:12px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}\n.info-box{background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;padding:8px 16px;text-align:center}\n.info-box .label{font-size:10px;color:#505080;text-transform:uppercase}\n.info-box .val{font-size:18px;color:#7a7aff;font-weight:bold}\n.info-box .val.accept{color:#44ff88}\n.info-box .val.reject{color:#ff4444}\n#controls{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}\n#controls button{padding:8px 18px;border:none;border-radius:16px;font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit}\n.btn-run{background:#44aa44;color:#08060f}\n.btn-step{background:#7a7aff;color:#08060f}\n.btn-reset{background:#505070;color:#c0c0e0}\n.btn-speed{background:#ff8844;color:#08060f}\n#controls button:hover{filter:brightness(1.2);transform:scale(1.05)}\n#controls button:disabled{opacity:.3;cursor:default}\n#presets{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}\n.preset-btn{padding:6px 14px;border:1px solid #2a2a4a;background:#0c0a18;color:#a0a0d0;border-radius:12px;font-size:12px;cursor:pointer;transition:all .2s;font-family:inherit}\n.preset-btn:hover{border-color:#7a7aff;color:#7a7aff}\n.preset-btn.active{border-color:#7a7aff;background:#1a1830;color:#7a7aff}\n#input-area{display:flex;gap:8px;justify-content:center;margin-bottom:14px;align-items:center}\n#input-area input{background:#0c0a18;border:1px solid #2a2a4a;color:#c0c0e0;padding:8px 12px;border-radius:6px;font-family:inherit;font-size:14px;width:240px}\n#input-area label{font-size:12px;color:#505080}\n#transition-table{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:12px;margin-bottom:14px}\n#transition-table h3{font-size:13px;color:#7a7aff;margin-bottom:8px}\n.tt-grid{display:grid;grid-template-columns:repeat(5,auto);gap:1px;font-size:12px}\n.tt-grid .th{background:#1a1830;color:#7a7aff;padding:4px 10px;font-weight:bold}\n.tt-grid .td{background:#111020;color:#a0a0d0;padding:4px 10px}\n.tt-grid .td.active-row{background:#2a2040;color:#ffaa44}\n#state-diagram{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:12px;text-align:center}\n#state-diagram h3{font-size:13px;color:#7a7aff;margin-bottom:8px}\n#state-diagram svg{max-width:100%}\n.log-entry{font-size:12px;color:#606090;padding:2px 0}\n.log-entry .arrow{color:#7a7aff}\n.log-entry .accept{color:#44ff88}\n.log-entry .reject{color:#ff4444}\n#log{max-height:160px;overflow-y:auto;padding:8px;background:#0a0814;border:1px solid #1a1a30;border-radius:6px;margin-top:8px}\n.hidden{display:none}\n</style>\n</head>\n<body>\n<div id=app>\n<h1>Oma: Turing Machine</h1>\n<div class=sub>Universal computation, one cell at a time. Select a preset, enter tape input, then Step or Run.</div>\n<div id=presets></div>\n<div id=input-area><label>Tape:</label><input id=tape-input value="1011" maxlength=30></div>\n<div id=controls><button class=btn-step id=step-btn onclick=step()>Step</button><button class=btn-run id=run-btn onclick=toggleRun()>Run</button><button class=btn-reset onclick=resetMachine()>Reset</button><button class=btn-speed onclick=cycleSpeed()>Speed: Medium</button></div>\n<div id=info><div class=info-box><div class=label>State</div><div class=val id=state-val>S0</div></div><div class=info-box><div class=label>Head</div><div class=val id=head-val>0</div></div><div class=info-box><div class=label>Steps</div><div class=val id=steps-val>0</div></div><div class=info-box><div class=label>Status</div><div class=val id=status-val>READY</div></div></div>\n<div id=tape-wrap><div id=tape></div></div>\n<div id=transition-table><h3>Transition Table</h3><div class=tt-grid id=tt-grid></div></div>\n<div id=state-diagram><h3>State Diagram</h3><svg id=diagram-svg height=120></svg></div>\n<div id=log></div>\n</div>\n<script>\nconst BLANK='_';\nconst PRESETS={\nincrement:{name:'Binary Increment',tape:'1011',states:['S0','S1','HALT'],transitions:{'S0':{'0':['S0','0','R'],'1':['S0','1','R'],BLANK:['S1',BLANK,'L']},'S1':{'0':['S1','1','L'],'1':['S1','0','L'],BLANK:['S1','1','L']}}},\nbusy_beaver:{name:'Busy Beaver (3-state)',tape:'',states:['A','B','C','HALT'],transitions:{'A':{'0':['B','1','R'],'1':['C','1','L']},'B':{'0':['A','1','L'],'1':['B','1','R']},'C':{'0':['B','1','L'],'1':['HALT','1','R']}}},\nunary_double:{name:'Unary Doubler (1s→11s)',tape:'111',states:['S0','S1','S2','S3','HALT'],transitions:{'S0':{'1':['S1','0','R'],BLANK:['HALT',BLANK,'L']},'S1':{'1':['S1','1','R'],BLANK:['S2','X','R']},'S2':{'X':['S2','X','R'],'1':['S2','1','R'],BLANK:['S3',BLANK,'L']},'S3':{'1':['S3','1','L'],'X':['S0','1','L'],'0':['S3','0','L']}}},\nparity:{name:'Parity Checker',tape:'110101',states:['EVEN','ODD','HALT'],transitions:{'EVEN':{'0':['EVEN','0','R'],'1':['ODD','1','R'],BLANK:['HALT','E','L']},'ODD':{'0':['ODD','0','R'],'1':['EVEN','1','R'],BLANK:['HALT','O','L']}}},\ncomplement:{name:'Bitwise Complement',tape:'1011001',states:['S0','HALT'],transitions:{'S0':{'0':['S0','1','R'],'1':['S0','0','R'],BLANK:['HALT',BLANK,'L']}}}\n};\nlet machine=null,running=false,timer=null,speed=200,currentPreset='increment';\nfunction initMachine(){const p=PRESETS[currentPreset];let input=document.getElementById('tape-input').value||p.tape;let tape={};for(let i=0;i<input.length;i++)tape[i]=input[i];machine={tape:tape,head:0,state:p.states[0],steps:0,status:'READY',startStates:p.states,transitions:p.transitions,initTape:input};renderAll();}\nfunction readTape(pos){return machine.tape[pos]!==undefined?machine.tape[pos]:BLANK;}\nfunction writeTape(pos,sym){machine.tape[pos]=sym;}\nfunction step(){if(machine.status==='HALT'||machine.status==='ACCEPT'||machine.status==='REJECT')return;const sym=readTape(machine.head);const stateRules=machine.transitions[machine.state];if(!stateRules){machine.status='HALT';renderAll();logMsg('No transition for state '+machine.status+' — halted.','reject');return;}const rule=stateRules[sym];if(!rule){machine.status='HALT';renderAll();logMsg('No transition for ('+machine.state+', '+sym+') — halted.','reject');return;}const[nState,nSym,dir]=rule;const oldState=machine.state,oldSym=sym;writeTape(machine.head,nSym);machine.head+=dir==='R'?1:dir==='L'?-1:0;machine.state=nState;machine.steps++;if(nState==='HALT'){machine.status='ACCEPT';running=false;if(timer)clearInterval(timer);document.getElementById('run-btn').textContent='Run';}\nlogMsg('<span class=arrow>('+oldState+', '+oldSym+') → ('+nState+', '+nSym+', '+dir+')</span>');renderAll();}\nfunction toggleRun(){if(running){running=false;if(timer)clearInterval(timer);document.getElementById('run-btn').textContent='Run';}\nelse{running=true;document.getElementById('run-btn').textContent='Pause';timer=setInterval(()=>{if(machine.status==='ACCEPT'||machine.status==='HALT'){running=false;clearInterval(timer);document.getElementById('run-btn').textContent='Run';return;}step();},speed);}}\nfunction resetMachine(){running=false;if(timer)clearInterval(timer);document.getElementById('run-btn').textContent='Run';initMachine();document.getElementById('log').innerHTML='';}\nfunction cycleSpeed(){if(speed===400){speed=80;document.querySelector('.btn-speed').textContent='Speed: Fast';}else if(speed===200){speed=400;document.querySelector('.btn-speed').textContent='Speed: Slow';}else{speed=200;document.querySelector('.btn-speed').textContent='Speed: Medium';}if(running){clearInterval(timer);timer=setInterval(()=>{if(machine.status==='ACCEPT'||machine.status==='HALT'){running=false;clearInterval(timer);document.getElementById('run-btn').textContent='Run';return;}step();},speed);}}\nfunction renderAll(){renderTape();renderInfo();renderTransitionTable();renderDiagram();}\nfunction renderTape(){const tape=document.getElementById('tape');tape.innerHTML='';const keys=Object.keys(machine.tape).map(Number);let minH=Math.min(machine.head,...keys)-2;let maxH=Math.max(machine.head,...keys)+2;let frag=document.createDocumentFragment();for(let i=minH;i<=maxH;i++){const sym=readTape(i);const cell=document.createElement('div');cell.className='cell';if(i===machine.head){cell.classList.add('head');const arrow=document.createElement('div');arrow.className='head-arrow';arrow.textContent='▼';cell.appendChild(arrow);}\nif(sym===BLANK){cell.classList.add('blank');cell.textContent=BLANK;}else{cell.textContent=sym;}\nfrag.appendChild(cell);}tape.appendChild(frag);}\nfunction renderInfo(){const sv=document.getElementById('state-val');sv.textContent=machine.state;sv.className='val';if(machine.status==='ACCEPT')sv.classList.add('accept');if(machine.status==='HALT')sv.classList.add('reject');document.getElementById('head-val').textContent=machine.head;document.getElementById('steps-val').textContent=machine.steps;const st=document.getElementById('status-val');st.textContent=machine.status;st.className='val';if(machine.status==='ACCEPT')st.classList.add('accept');}\nfunction renderTransitionTable(){const grid=document.getElementById('tt-grid');grid.innerHTML='';const symbols=['0','1','X',BLANK];const hdr=['State'];symbols.forEach(s=>hdr.push(s));hdr.forEach(h=>{const d=document.createElement('div');d.className='th';d.textContent=h;grid.appendChild(d);});machine.startStates.forEach(st=>{const rowActive=st===machine.state;const d=document.createElement('div');d.className='td'+(rowActive?' active-row':'');d.textContent=st;grid.appendChild(d);symbols.forEach(sym=>{const dd=document.createElement('div');dd.className='td'+(rowActive?' active-row':'');const rules=machine.transitions[st];if(rules&&rules[sym]){const[n,s,dir]=rules[sym];dd.textContent=n+','+s+','+dir;}else{dd.textContent='—';}grid.appendChild(dd);});});}\nfunction renderDiagram(){const svg=document.getElementById('diagram-svg');const states=machine.startStates;const n=states.length;const w=svg.clientWidth||600;const gap=w/(n+1);let html='';states.forEach((st,i)=>{const x=gap*(i+1);const y=60;const active=st===machine.state;const r=22;html+='<circle cx='+x+' cy='+y+' r='+r+' fill='+(active?'#2a2040':'#0c0a18')+' stroke='+(st==='HALT'?'#44ff88':active?'#7a7aff':'#2a2a4a')+' stroke-width='+(active?2.5:1.5)+' />'+'<text x='+x+' y='+(y+4)+' text-anchor=middle fill='+(active?'#ffaa44':'#a0a0d0')+' font-size=11 font-family=monospace>'+st+'</text>';if(i<n-1){html+='<line x1='+(x+r)+' y1='+y+' x2='+(gap*(i+2)-r)+' y2='+y+' stroke=#2a2a4a stroke-width=1 marker-end=url(#arrow) />';}if(active&&machine.steps>0){html+='<circle cx='+x+' cy='+y+' r='+(r+4)+' fill=none stroke=#7a7aff stroke-width=1 opacity=0.4><animate attributeName=r from='+(r+4)+' to='+(r+12)+' dur=1s repeatCount=indefinite/><animate attributeName=opacity from=0.4 to=0 dur=1s repeatCount=indefinite/></circle>';}});svg.innerHTML='<defs><marker id=arrow markerWidth=8 markerHeight=8 refX=6 refY=3 orient=auto><path d=M0,0 L6,3 L0,6 fill=#2a2a4a /></marker></defs>'+html;}\nfunction logMsg(msg){const log=document.getElementById('log');const e=document.createElement('div');e.className='log-entry';e.innerHTML='['+machine.steps+'] '+msg;log.appendChild(e);log.scrollTop=log.scrollHeight;}\nfunction buildPresets(){const container=document.getElementById('presets');Object.keys(PRESETS).forEach(key=>{const btn=document.createElement('button');btn.className='preset-btn'+(key===currentPreset?' active':'');btn.textContent=PRESETS[key].name;btn.onclick=()=>{currentPreset=key;document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('tape-input').value=PRESETS[key].tape;resetMachine();};container.appendChild(btn);});}\nbuildPresets();\ninitMachine();\n</script>\n</body>\n</html>
