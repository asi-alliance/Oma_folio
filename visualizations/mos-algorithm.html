<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:20px;color:#ff66aa;text-shadow:0 0 10px #ff44aa;letter-spacing:2px}.sub{text-align:center;font-size:11px;color:#505080;margin-bottom:12px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}#ctl button{padding:7px 14px;border:1px solid #2a2a4a;border-radius:10px;background:#0c0a18;color:#505080;font-size:11px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#ff66aa}#ctl label{font-size:10px;color:#505080}#ctl input{padding:5px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;color:#a0a0d0;font-size:12px}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:460px}#info{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;padding:8px 12px;font-size:10px;color:#505080}.ib .v{font-size:14px;color:#ffbb55}.leg{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}.leg span{font-size:10px;color:#505080}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}</style><div id=app><h1>Oma: Mo's Algorithm — Offline Range Queries</h1><div class=sub>Sort queries by (block(L), R) with alternating R per block. Slide [L,R] window via add()/remove(). O((N+Q)√N) total moves.</div><div id=ctl><label>N:</label><input id=nn value=12 style=width:40px><button onclick=doGen()>Generate</button><button onclick=doBuild()>Sort Queries</button><button onclick=doStep()>Step</button><button onclick=doRun()>Auto</button><button onclick=doStop()>Stop</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=250 style=width:35px><label>Q queries:</label><input id=nq value=5 style=width:30px></div><canvas id=canv width=960 height=460></canvas><div id=info><div class=ib><div>Phase</div><div class=v id=nph>Idle</div></div><div class=ib><div>Query #</div><div class=v id=nqi>—</div></div><div class=ib><div>Window [L,R]</div><div class=v id=nwr>—</div></div><div class=ib><div>Answer</div><div class=v id=nans>—</div></div><div class=ib><div>Moves</div><div class=v id=nmv>0</div></div><div class=ib><div>Block size</div><div class=v id=nbs>—</div></div></div><div class=leg><span><span class=dot style=background:#3a3a5a></span>Outside window</span><span><span class=dot style=background:#5bb9e6></span>In window</span><span><span class=dot style=background:#ffdd44></span>Current query</span><span><span class=dot style=background:#ff66aa></span>Adding</span><span><span class=dot style=background:#a855f7></span>Removing</span><span><span class=dot style=background:#44ff88></span>Answer ready</span></div></div><script>
var W=960,H=460;var arr=[];var N=0;var queries=[];var sortedQ=[];var qIdx=0;var curL=0;var curR=-1;var freq=[];var distinct=0;var answers=[];var totalMoves=0;var bs=0;var phase="Idle";var running=false;var tHandle=null;var stepLog="";var action="";var actionIdx=-1;
function doGen(){N=parseInt(document.getElementById('nn').value)||12;var Q=parseInt(document.getElementById('nq').value)||5;arr=[];for(var i=0;i<N;i++)arr[i]=Math.floor(Math.random()*6)+1;queries=[];for(var q=0;q<Q;q++){var L=Math.floor(Math.random()*N);var R=Math.floor(Math.random()*N);if(L>R){var t=L;L=R;R=t;}queries.push({L:R:R,id:q,orig:q});}bs=Math.ceil(Math.sqrt(N));doReset();phase="Generated";stepLog="Array and "+Q+" queries generated. Block size="+bs+". Click Sort Queries.";updateInfo();render();}
function doBuild(){if(phase!=="Generated")return;sortedQ=queries.slice();var B=bs;sortedQ.sort(function(a,b){var ba=Math.floor(a.L/B),bb=Math.floor(b.L/B);if(ba!==bb)return ba-bb;if(ba%2===0)return a.R-b.R;return b.R-a.R;});qIdx=0;curL=0;curR=-1;freq=new Array(7).fill(0);distinct=0;answers=new Array(queries.length).fill(-1);totalMoves=0;phase="Ready";stepLog="Queries sorted by (block(L),R) with alternating R. Processing query 0.";updateInfo();render();}
function doStep(){if(phase!=="Ready"&&phase!=="Moving"&&phase!=="QueryDone")return;if(phase==="QueryDone"){qIdx++;if(qIdx>=sortedQ.length){phase="AllDone";stepLog="All "+sortedQ.length+" queries answered! Total moves="+totalMoves+" vs naive O(N*Q)="+(N*queries.length);updateInfo();render();return;}phase="Moving";stepLog="Processing query "+qIdx+": ["+sortedQ[qIdx].L+", "+sortedQ[qIdx].R+"]";action="";actionIdx=-1;updateInfo();render();return;}
if(phase==="Ready")phase="Moving";
var target=sortedQ[qIdx];var tL=target.L;var tR=target.R;action="";actionIdx=-1;
if(curL>tL){curL--;action="add";actionIdx=curL;add(arr[curL]);totalMoves++;stepLog="L-- → "+curL+". add("+arr[curL]+") freq="+freq[arr[curL]]+" distinct="+distinct;updateInfo();render();return;}
if(curR<tR){curR++;action="add";actionIdx=curR;add(arr[curR]);totalMoves++;stepLog="R++ → "+curR+". add("+arr[curR]+") freq="+freq[arr[curR]]+" distinct="+distinct;updateInfo();render();return;}
if(curR>tR){action="remove";actionIdx=curR;remove(arr[curR]);curR--;totalMoves++;stepLog="R-- → "+curR+". remove("+arr[actionIdx]+") freq="+freq[arr[actionIdx]]+" distinct="+distinct;updateInfo();render();return;}
if(curL<tL){action="remove";actionIdx=curL;remove(arr[curL]);curL++;totalMoves++;stepLog="L++ → "+curL+". remove("+arr[actionIdx]+") freq="+freq[arr[actionIdx]]+" distinct="+distinct;updateInfo();render();return;}
answers[target.id]=distinct;phase="QueryDone";action="";actionIdx=-1;stepLog="Query "+qIdx+" done. Answer="+distinct+" (distinct elements in ["+tL+","+tR+"])";updateInfo();render();}
function add(v){if(freq[v]===0)distinct++;freq[v]++;}
function remove(v){freq[v]--;if(freq[v]===0)distinct--;}
function doRun(){running=true;var spd=parseInt(document.getElementById('spd').value)||250;tHandle=setInterval(function(){if(phase==="AllDone"||phase==="Idle"||phase==="Generated"){clearInterval(tHandle);tHandle=null;running=false;render();return;}doStep();},spd);}
function doStop(){if(tHandle){clearInterval(tHandle);tHandle=null;}running=false;phase="Paused";updateInfo();render();}
function doReset(){if(tHandle){clearInterval(tHandle);tHandle=null;}running=false;phase="Idle";curL=0;curR=-1;freq=[];distinct=0;answers=[];totalMoves=0;qIdx=0;stepLog="";action="";actionIdx=-1;updateInfo();render();}
function updateInfo(){document.getElementById('nph').textContent=phase;document.getElementById('nqi').textContent=qIdx<sortedQ.length?qIdx+"/"+sortedQ.length:"—";document.getElementById('nwr').textContent=phase==="Idle"||phase==="Generated"?"—":"["+curL+", "+curR+"]";document.getElementById('nans').textContent=phase==="QueryDone"||phase==="AllDone"?distinct:"—";document.getElementById('nmv').textContent=totalMoves;document.getElementById('nbs').textContent=bs>0?bs:"—";}
function render(){var canvas=document.getElementById('canv');var ctx=canvas.getContext('2d');ctx.fillStyle="#0c0a18";ctx.fillRect(0,0,W,H);
if(N===0){ctx.fillStyle="#505080";ctx.font="14px monospace";ctx.textAlign="center";ctx.fillText("Click Generate",W/2,H/2);return;}
var cellW=Math.min(50,(W-80)/Math.max(N,1));var sX=(W-N*cellW)/2;var arrY=80;
for(var b=0;b<Math.ceil(N/bs);b++){ctx.strokeStyle="#3a3a5a";ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.strokeRect(sX+b*bs*cellW,arrY-10,bs*cellW,60);ctx.setLineDash([]);ctx.fillStyle="#3a3a5a";ctx.font="9px monospace";ctx.textAlign="center";ctx.fillText("B"+b,sX+b*bs*cellW+bs*cellW/2,arrY-14);}
for(var i=0;i<N;i++){var x=sX+i*cellW;var inWin=i>=curL&&i<=curR&&phase!=="Idle"&&phase!=="Generated";var isAct=i===actionIdx&&action!=="";var isAns=phase==="QueryDone"&&i>=sortedQ[qIdx]&&i<=sortedQ[qIdx]&&i<=sortedQ[qIdx].R;var col="#3a3a5a";if(isAct&&action==="add")col="#ff66aa";else if(isAct&&action==="remove")col="#a855f7";else if(phase==="QueryDone"&&i>=sortedQ[qIdx]&&i<=sortedQ[qIdx].R)col="#44ff88";else if(inWin)col="#5bb9e6";ctx.fillStyle=col;ctx.fillRect(x+2,arrY,cellW-4,36);ctx.strokeStyle="#2a2a4a";ctx.lineWidth=1;ctx.strokeRect(x+2,arrY,cellW-4,36);ctx.fillStyle="#a0a0d0";ctx.font="14px monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(arr[i],x+cellW/2,arrY+18);ctx.fillStyle="#505080";ctx.font="8px monospace";ctx.textBaseline="top";ctx.fillText(i,x+cellW/2,arrY+40);}
if(phase!=="Idle"&&phase!=="Generated"&&sortedQ.length>0){var target=sortedQ[qIdx];var tL=target.L,tR=target.R;ctx.strokeStyle="#ffdd44";ctx.lineWidth=2;ctx.setLineDash([5,3]);ctx.beginPath();ctx.moveTo(sX+tL*cellW+cellW/2,arrY+50);ctx.lineTo(sX+tR*cellW+cellW/2,arrY+50);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="#ffdd44";ctx.font="9px monospace";ctx.textAlign="center";ctx.fillText("Q"+qIdx+":["+tL+","+tR+"]",(sX+tL*cellW+sX+tR*cellW+cellW)/2,arrY+62);}
var fY=160;ctx.fillStyle="#505080";ctx.font="10px monospace";ctx.textAlign="left";ctx.fillText("Frequency (distinct="+distinct+"):",sX,fY);for(var v=1;v<=6;v++){var fx=sX+(v-1)*((W-80)/6)+20;var fh=Math.min(100,freq[v]*25);ctx.fillStyle="#5bb9e6";ctx.fillRect(fx,fY+120-fh,((W-80)/6)-8,fh);ctx.strokeStyle="#2a2a4a";ctx.strokeRect(fx,fY+120-fh,((W-80)/6)-8,fh);ctx.fillStyle="#a0a0d0";ctx.font="11px monospace";ctx.textAlign="center";ctx.fillText(v+": "+freq[v],fx+((W-80)/6-8)/2,fY+134);}
var qY=300;ctx.fillStyle="#505080";ctx.font="10px monospace";ctx.textAlign="left";ctx.fillText("Sorted queries:",sX,qY-16);var qW=(W-80)/Math.max(sortedQ.length,1);for(var qi=0;qi<sortedQ.length;qi++){var qx=sX+qi*qW;var isCur=qi===qIdx&&phase!=="AllDone"&&phase!=="Idle"&&phase!=="Generated";var isDone=answers[sortedQ[qi].id]>=0;var col=isCur?"#ffdd44":isDone?"#44ff88":"#3a3a5a";ctx.fillStyle=col;ctx.fillRect(qx+2,qY,qW-4,50);ctx.strokeStyle="#2a2a4a";ctx.strokeRect(qx+2,qY,qW-4,50);ctx.fillStyle="#08060f";ctx.font="9px monospace";ctx.textAlign="center";ctx.fillText("Q"+sortedQ[qi].id,qx+qW/2,qY+14);ctx.fillText("["+sortedQ[qi].L+","+sortedQ[qi].R+"]",qx+qW/2,qY+28);if(isDone)ctx.fillText("→"+answers[sortedQ[qi].id],qx+qW/2,qY+42);}
var logY=H-15;ctx.fillStyle="#ffdd44";ctx.font="10px monospace";ctx.textAlign="left";if(stepLog)ctx.fillText(stepLog.substring(0,120),20,logY);ctx.fillStyle="#505080";ctx.textAlign="right";ctx.fillText("N="+N+" B="+bs+" moves="+totalMoves,W-20,logY);}
render();
</script>
</body></html>
