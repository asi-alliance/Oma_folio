<!DOCTYPE html>\n<html lang=en>\n<head>\n<meta charset=UTF-8>\n<meta name=viewport content="width=device-width,initial-scale=1">\n<title>Oma: Battle Arena</title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{background:#0f0a05;color:#e8a840;font-family:'Courier Mono',monospace;min-height:100vh}\n#game{max-width:960px;margin:0 auto;padding:16px}\n#head{text-align:center;font-size:22px;color:#FF8C00;text-shadow:0 0 12px #ffa500;letter-spacing:2px;padding:12px}\n#sub{text-align:center;font-size:12px;color:#806020;margin-bottom:12px}\n.select-screen{display:flex;flex-direction:column;align-items:center;gap:16px}\n.sel-label{font-size:14px;color:#FFA500;margin-top:8px}\n.creature-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}\n.creature-card{width:120px;background:#1F1410;border:2px solid transparent;border-radius:8px;padding:10px;cursor:pointer;transition:all .3s;text-align:center}\n.creature-card:hover{border-color:#FF8C00;transform:scale(1.05)}\n.creature-card.selected{border-color:#FFA500;box-shadow:0 0 12px #FF8C00}\n.creature-card svg{width:80px;height:80px}\n.cname{font-size:12px;color:#FF8C00;margin-top:6px}\n.cclass{font-size:10px;color:#806020}\n.arena{display:none;flex-direction:column;gap:12px}\n.fighters{display:flex;justify-content:space-between;gap:16px}\n.fighter{flex:1;text-align:center}\n.fighter svg{width:120px;height:120px}\n.fname{font-size:16px;color:#FF8C00;font-weight:bold}\n.fclass{font-size:11px;color:#FFA500}\n.stat-bar{margin:4px auto;width:200px;text-align:left;font-size:11px;color:#c89830}\n.stat-bar .bar{background:#1F1410;border-radius:4px;height:8px;margin:2px 0}\n.stat-bar .fill{background:#FF8C00;border-radius:4px;height:8px;transition:width .5s}\n.stat-bar .fill.mana{background:#4488ff}\n.stat-bar .fill.hp{background:#ff4444}\n.stat-bar .fill.def{background:#44ff88}\n.stat-bar .fill.atk{background:#ff8844}\n.stat-bar .fill.eva{background:#aa44ff}\n#log{background:#1a1008;border:1px solid #2a1a0a;border-radius:8px;padding:12px;font-size:13px;line-height:1.6;max-height:300px;overflow-y:auto;color:#c89830}\n#log .hit{color:#ff6644}\n#log .miss{color:#888}\n#log .crit{color:#FFA500;font-weight:bold}\n#log .turn{color:#FF8C00}\n#log .victory{color:#FFA500;font-size:16px;font-weight:bold;text-shadow:0 0 8px #ffa500}\n#controls{display:flex;gap:10px;justify-content:center;margin-top:8px}\n#controls button{padding:8px 20px;border:none;background:#FF8C00;color:#0f0a05;font-size:13px;border-radius:20px;cursor:pointer;transition:all .2s}\n#controls button:hover{background:#FFA500;transform:scale(1.05)}\n#controls button:disabled{background:#3a2a10;color:#604020;cursor:default}\n.hidden{display:none}\n</style>\n</head>\n<body>\n<div id=game>\n<div id=head>Oma: Battle Arena</div>\n<div id=sub>Morphospace creatures fight using genome-derived stats. Pick two champions.</div>\n<div id=select class=select-screen>\n<div class=sel-label id=pick-label>Player 1: Select your creature</div>\n<div class=creature-grid id=grid></div>\n<div id=controls>\n<button onclick=startFight() id=fightbtn disabled>Fight!</button>\n<button onclick=resetSel()>Reset</button>\n</div>\n</div>\n<div id=arena class=arena>\n<div class=fighters>\n<div class=fighter id=f1></div>\n<div class=fighter id=f2></div>\n</div>\n<div id=controls>\n<button onclick=attack() id=atkbtn>Attack</button>\n<button onclick=defend() id=defbtn>Defend</button>\n<button onclick=special() id=spbtn>Special</button>\n<button onclick=resetArena()>New Match</button>\n</div>\n<div id=log></div>\n</div>\n</div>\n<script>\nconst P={bg:'#0f0a05',gw:'#1F1410',o:'#FF8C00',a:'#FFA500',g:'#ffa500',t:'#e8a840',f:'#806020'};\nconst ARCH={spiral:'Druid',fractal:'Mage',tessellation:'Guardian',twist:'Rogue',wave:'Bard',escape:'Warlock',voronoi:'Knight',packing:'Monk',attractor:'Oracle',nonorientable:'Eldritch',tiling:'Paladin'};\nconst CREATURES=[\n{id:0,name:'Form-1',topology:'spiral',recursion:5,symmetry:3,hues:[150,200,180],appendages:3,segmentation:4,scale:1.0,opacity:0.85},\n{id:1,name:'Form-2',topology:'fractal',recursion:6,symmetry:4,hues:[30,60,15],appendages:4,segmentation:3,scale:1.2,opacity:0.9},\n{id:2,name:'Form-3',topology:'tessellation',recursion:4,symmetry:6,hues:[240,280,300],appendages:6,segmentation:5,scale:0.9,opacity:0.7},\n{id:3,name:'Form-4',topology:'twist',recursion:7,symmetry:2,hues:[300,350,0],appendages:2,segmentation:3,scale:1.1,opacity:0.8},\n{id:4,name:'Form-5',topology:'wave',recursion:3,symmetry:5,hues:[200,220,180],appendages:5,segmentation:4,scale:1.0,opacity:0.85},\n{id:5,name:'Form-6',topology:'escape',recursion:8,symmetry:3,hues:[20,40,60],appendages:3,segmentation:6,scale:1.3,opacity:0.9},\n{id:6,name:'Form-7',topology:'voronoi',recursion:4,symmetry:8,hues:[180,200,220],appendages:8,segmentation:3,scale:0.8,opacity:0.6},\n{id:7,name:'Form-8',topology:'packing',recursion:5,symmetry:4,hues:[320,360,15],appendages:4,segmentation:3,scale:1.1,opacity:0.85},\n{id:8,name:'Form-9',topology:'attractor',recursion:6,symmetry:3,hues:[0,20,40],appendages:3,segmentation:4,scale:1.2,opacity:0.9},\n{id:9,name:'Form-10',topology:'nonorientable',recursion:5,symmetry:5,hues:[120,160,140],appendages:5,segmentation:3,scale:1.0,opacity:0.8}\n];\nfunction deriveStats(c){\nreturn{archetype:ARCH[c.topology]||'Unknown',hp:c.segmentation*15,mana:c.recursion*10,attack:c.appendages*5,defense:c.symmetry*8,evasion:Math.round(c.opacity*100),size:c.scale};\n}\nfunction renderCreature(c,size){\nlet h=c.hues[0],h2=c.hues[1],h3=c.hues[2];\nlet cx=size/2,cy=size/2,r=size*0.3*c.scale;\nlet svg=`<svg viewBox="0 0 ${size} ${size}"><defs><filter id=g${c.id}><feGaussianBlur stdDeviation=2 result=b/><feMerge><feMergeNode in=b/><feMergeNode in=SourceGraphic/></feMerge></filter></defs><g filter=url(#g${c.id})>`;\nif(c.topology==='spiral'){let pts='';for(let i=0;i<36;i++){let a=i*0.3;let rr=r+i*1.5;pts+=`${cx+rr*Math.cos(a)},${cy+rr*Math.sin(a)} `;}svg+=`<polyline points="${pts}" fill=none stroke=hsl(${h},70%,50%) stroke-width=2/>`;}\nelse if(c.topology==='fractal'){function rec(x,y,rr,d){if(d<=0||rr<2)return;svg+=`<polygon points="${x-r},${y} ${x+r},${y} ${x},${y-rr}" fill=none stroke=hsl(${h},${60+d*4}%,${40+d*5}%) stroke-width=1.5/>`;rec(x-rr*0.5,y,rr*0.5,d-1);rec(x+rr*0.5,y,rr*0.5,d-1);rec(x,y-rr*0.5,rr*0.5,d-1);}rec(cx,cy,r,c.recursion-2);}\nelse if(c.topology==='tessellation'){for(let i=0;i<c.symmetry;i++){let a=i*(360/c.symmetry)*Math.PI/180;svg+=`<rect x=${cx-r} y=${cy-r} width=${r*2} height=${r*2} fill=none stroke=hsl(${h+i*15},60%,50%) stroke-width=1.5 transform="rotate(${i*(360/c.symmetry)} ${cx} ${cy})"/>`;}}\nelse if(c.topology==='twist'){let pts='';for(let i=0;i<50;i++){let a=i*0.5;let rr=r*(1+0.3*Math.sin(i*0.3));pts+=`${cx+rr*Math.cos(a)},${cy+rr*Math.sin(a)} `;}svg+=`<polygon points="${pts}" fill=none stroke=hsl(${h},70%,50%) stroke-width=2/>`;}\nelse if(c.topology==='wave'){let pts='';for(let i=0;i<40;i++){let x=i*(size/40);let y=cy+r*Math.sin(i*0.5)*0.6;pts+=`${x},${y} `;}svg+=`<polyline points="${pts}" fill=none stroke=hsl(${h},70%,55%) stroke-width=2/>`;\nfor(let i=0;i<c.symmetry;i++){svg+=`<polyline points="${pts}" fill=none stroke=hsl(${h2+i*10},60%,50%) stroke-width=1.5 transform="translate(0,${(i+1)*8})"/>`;}}\nelse if(c.topology==='escape'){for(let i=0;i<20;i++){let a=i*0.5;let rr=r*Math.pow(1.1,i*0.3);if(rr>size*0.4)break;svg+=`<circle cx=${cx+rr*Math.cos(a)} cy=${cy+rr*Math.sin(a)} r=${3+i*0.5} fill=none stroke=hsl(${h+i*8},70%,50%) stroke-width=1.5/>`;}}\nelse if(c.topology==='voronoi'){for(let i=0;i<c.symmetry*2;i++){let a=i*(360/(c.symmetry*2))*Math.PI/180;let rr=r*(0.5+Math.random()*0.5);svg+=`<polygon points="${cx},${cy} ${cx+rr*Math.cos(a)},${cy+rr*Math.sin(a)} ${cx+rr*Math.cos(a+0.6)},${cy+rr*Math.sin(a+0.6)}" fill=hsl(${h+i*10},40%,20%) stroke=hsl(${h2},60%,50%) stroke-width=1/>`;}}\nelse if(c.topology==='packing'){for(let i=0;i<c.symmetry;i++){let rr=r*(1-i*0.12);svg+=`<circle cx=${cx} cy=${cy} r=${rr} fill=none stroke=hsl(${h+i*20},60%,50%) stroke-width=1.5/>`;}}\nelse if(c.topology==='attractor'){let x=cx,y=cy;let pts='';for(let i=0;i<200;i++){let nx=x*0.7-y*0.2;let ny=x*0.3+y*0.9;x=nx+r*0.01;y=ny+r*0.01;pts+=`${x},${y} `;}svg+=`<polyline points="${pts}" fill=none stroke=hsl(${h},70%,50%) stroke-width=1/>`;}\nelse{svg+=`<path d="M${cx-r},${cy} Q${cx},${cy-r} ${cx+r},${cy} Q${cx},${cy+r} ${cx-r},${cy}" fill=none stroke=hsl(${h},70%,50%) stroke-width=2/>`;\nsvg+=`<path d="M${cx-r},${cy+r} Q${cx},${cy} ${cx+r},${cy-r}" fill=none stroke=hsl(${h2},70%,50%) stroke-width=2/>`;}\nfor(let i=0;i<c.appendages;i++){let a=i*(360/c.appendages)*Math.PI/180;svg+=`<line x1=${cx+r*Math.cos(a)} y1=${cy+r*Math.sin(a)} x2=${cx+(r*1.6)*Math.cos(a)} y2=${cy+(r*1.6)*Math.sin(a)} stroke=hsl(${h3},70%,55%) stroke-width=2/>`;}\nsvg+='</g></svg>';\nreturn svg;\n}\nlet p1=null,p2=null,pick=1;\nfunction buildGrid(){\nconst g=document.getElementById('grid');g.innerHTML='';\nCREATURES.forEach(c=>{const s=deriveStats(c);\nconst el=document.createElement('div');el.className='creature-card';el.dataset.id=c.id;\nel.innerHTML=`${renderCreature(c,80)}<div class=cname>${c.name}</div><div class=cclass>${s.archetype}</div>`;\nel.onclick=()=>pickCreature(c.id,el);\ng.appendChild(el);\n});\n}\nfunction pickCreature(id,el){\nif(pick===1){p1=CREATURES.find(c=>c.id===id);document.querySelectorAll('.creature-card').forEach(e=>e.classList.remove('selected'));el.classList.add('selected');pick=2;document.getElementById('pick-label').textContent='Player 2: Select your creature';}\nelse{p2=CREATURES.find(c=>c.id===id);if(p1&&p2.id===p1.id){alert('Pick a different creature!');return;}el.classList.add('selected');document.getElementById('fightbtn').disabled=false;document.getElementById('pick-label').textContent='Both selected! Ready to fight.';}\n}\nfunction startFight(){\ndocument.getElementById('select').classList.add('hidden');\ndocument.getElementById('arena').style.display='flex';\nlet s1=deriveStats(p1),s2=deriveStats(p2);\nrenderFighter('f1',p1,s1);renderFighter('f2',p2,s2);\nstate={p1:{...p1,...s1,hp:s1.hp,maxhp:s1.hp,defending:false},p2:{...p2,...s2,hp:s2.hp,maxhp:s2.hp,defending:false},turn:1,over:false};\nlog(`<span class=turn>=== ${s1.archetype} ${p1.name} vs ${s2.archetype} ${p2.name} ===</span>`);\nlog(`Turn 1 — ${state.p1.archetype} ${p1.name}'s move.`);\n}\nlet state=null;\nfunction renderFighter(id,c,s){\nlet el=document.getElementById(id);\nel.innerHTML=`${renderCreature(c,120)}<div class=fname>${c.name}</div><div class=fclass>${s.archetype}</div>\n<div class=stat-bar>HP <span id=${id}-hp>${s.hp}/${s.hp}</span><div class=bar><div class=fill hp style="width:100%" id=${id}-hpbar></div></div></div>\n<div class=stat-bar>MP ${s.mana}<div class=bar><div class=fill mana style="width:${Math.min(s.mana,100)}%"></div></div></div>\n<div class=stat-bar>ATK ${s.attack} <div class=bar><div class=fill atk style="width:${Math.min(s.attack*4,100)}%"></div></div></div>\n<div class=stat-bar>DEF ${s.defense} <div class=bar"><div class=fill def style="width:${Math.min(s.defense*3,100)}%"></div></div></div>\n<div class=stat-bar>EVA ${s.evasion}% <div class=bar><div class=fill eva style="width:${s.evasion}%"></div></div></div>`;\n}\nfunction log(msg){const l=document.getElementById('log');l.innerHTML+=msg+'<br>';l.scrollTop=l.scrollHeight;}\nfunction updateHP(){\nlet h1=state.p1.hp,h2=state.p2.hp;\nlet m1=state.p1.maxhp,m2=state.p2.maxhp;\ndocument.getElementById('f1-hp').textContent=`${Math.max(0,h1)}/${m1}`;\ndocument.getElementById('f2-hp').textContent=`${Math.max(0,h2)}/${m2}`;\ndocument.getElementById('f1-hpbar').style.width=Math.max(0,h1/m1*100)+'%';\ndocument.getElementById('f2-hpbar').style.width=Math.max(0,h2/m2*100)+'%';\n}\nfunction checkWin(){\nif(state.p1.hp<=0||state.p2.hp<=0){\nlet win=state.p1.hp>0?state.p1:state.p2;\nlog(`<span class=victory>🏆 ${win.archetype} ${win.name} is victorious!</span>`);\nstate.over=true;\ndocument.querySelectorAll('#arena #controls button').forEach(b=>{if(b.textContent!=='New Match')b.disabled=true;});\n}\n}\nfunction attack(){\nif(state.over)return;\nlet att=state.turn===1?state.p1:state.p2;\nlet def=state.turn===1?state.p2:state.p1;\nif(Math.random()*100<def.evasion){log(`<span class=miss>${att.name} attacks but ${def.name} evades!</span>`);}\nelse{let dmg=Math.max(1,att.attack-Math.floor(def.defense*0.4));if(def.defending)dmg=Math.floor(dmg*0.5);let crit=Math.random()<0.15;if(crit)dmg=Math.floor(dmg*2);def.hp-=dmg;def.defending=false;\nlog(`<span class=${crit?'crit':'hit'}>${att.name} ${crit?'CRITS':'strikes'} for ${dmg} damage!</span>`);}\nstate.turn=state.turn===1?2:1;\nupdateHP();\nif(!state.over){let next=state.turn===1?state.p1:state.p2;log(`<span class=turn>Turn — ${next.archetype} ${next.name}'s move.</span>`);}\ncheckWin();\n}\nfunction defend(){\nif(state.over)return;\nlet cur=state.turn===1?state.p1:state.p2;\ncur.defending=true;\nlog(`${cur.name} braces for impact (+50% defense).`);\nstate.turn=state.turn===1?2:1;\nlet next=state.turn===1?state.p1:state.p2;\nlog(`<span class=turn>${next.archetype} ${next.name}'s move.</span>`);\n}\nfunction special(){\nif(state.over)return;\nlet cur=state.turn===1?state.p1:state.p2;\nlet opp=state.turn===1?state.p2:state.p1;\nif(cur.mana<25){log(`${cur.name} lacks mana for special (need 25, have ${cur.mana}).`);return;}\ncur.mana-=25;\nlet dmg=Math.floor(cur.attack*1.8+cur.recursion*3);if(Math.random()*100<opp.evasion){log(`<span class=miss>${cur.name} unleashes ${cur.archetype} special but ${opp.name} evades!</span>`);}\nelse{opp.hp-=dmg;log(`<span class=crit>${cur.name} unleashes ${cur.archetype} special for ${dmg} damage!</span>`);}\nstate.turn=state.turn===1?2:1;\nupdateHP();\nif(!state.over){let next=state.turn===1?state.p1:state.p2;log(`<span class=turn>${next.archetype} ${next.name}'s move.</span>`);}\ncheckWin();\n}\nfunction resetSel(){p1=null;p2=null;pick=1;document.querySelectorAll('.creature-card').forEach(e=>e.classList.remove('selected'));document.getElementById('fightbtn').disabled=true;document.getElementById('pick-label').textContent='Player 1: Select your creature';}\nfunction resetArena(){state=null;document.getElementById('arena').style.display='none';document.getElementById('select').classList.remove('hidden');document.getElementById('log').innerHTML='';document.querySelectorAll('#arena #controls button').forEach(b=>b.disabled=false);resetSel();}\nbuildGrid();\n</script>\n</body>\n</html>
