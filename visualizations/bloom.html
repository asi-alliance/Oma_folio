<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;justify-center:flex-wrap:wrap;margin:12px 0}#ctl input{flex:1;min-width:120px;padding:8px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#7a5adf}#ctl button.active{background:#7a7aff;color:#08060f}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:200px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px}.ib{font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}#hist{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;margin-top:12px;padding:10px 14px;max-height:120px;overflow-y:auto;font-size:11px;color:#505080}</style><div id=app><h1>Oma: Bloom Filter</h1><div class=sub>Watch hash functions set bits in a bit array. Insert elements, then test lookup — including false positives!</div><div id=ctl><input id=inp placeholder="Enter a string..." value=apple><button onclick=insert() class=active>Insert</button><button onclick=lookup()>Lookup</button><button onclick=reset()>Reset</button><button onclick=toggleHash()>Hashes: 3</button></div><canvas id=canv width=960 height=200></canvas><div id=info><div class=ib><div>Bit Array Size</div><div class=v id=bsize>32</div></div><div class=ib><div>Bits Set</div><div class=v id=bset>0</div></div><div class=ib><div>Items Inserted</div><div class=v id=items>0</div></div><div class=ib><div>Fill Ratio</div><div class=v id=ratio>0%</div></div><div class=ib><div>Last Result</div><div class=v id=result>-</div></div></div><div class=leg><span><span class=dot style=background:#7a7aff></span>Unset Bit</span><span><span class=dot style=background:#44ff88></span>Set Bit</span><span><span class=dot style=background:#ffdd44></span>Hash Hit</span><span><span class=dot style=background:#ff4466></span>Miss</span></div><div id=hist>Operations log will appear here...</div></div>
<script>var B={bits:new Array(32).fill(false),size:32,hashes:3,items:0,inserted:{},timer:null,phase:'idle'};function hash(s,i){var h=0;for(var j=0;j<s.length;j++){h=(h*31+s.charCodeAt(j)+i*37)>>>0;}return h%B.size;}function drawBit(highlight){var c=document.getElementById('canv');var ctx=c.getContext('2d');ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,960,200);var bw=920/B.size,bx0=20,by=60;for(var i=0;i<B.size;i++){var x=bx0+i*bw;var col=B.bits[i]?'#44ff88':'#7a7aff';if(highlight&&highlight.indexOf(i)>=0)col='#ffdd44';if(highlight&&highlight.miss&&highlight.miss.indexOf(i)>=0)col='#ff4466';ctx.fillStyle=col;ctx.fillRect(x,by,bw-3,80);ctx.fillStyle='#08060f';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(i,x+bw/2-1,by+42);ctx.fillText(B.bits[i]?'1':'0',x+bw/2-1,by+58);}ctx.fillStyle='#505080';ctx.font='11px monospace';ctx.textAlign='left';ctx.fillText('Bit Array ['+B.size+']',20,by-10);}function updateInfo(){var set=B.bits.filter(function(b){return b;}).length;document.getElementById('bsize').textContent=B.size;document.getElementById('bset').textContent=set;document.getElementById('items').textContent=B.items;document.getElementById('ratio').textContent=(set/B.size*100).toFixed(0)+'%';}function log(msg){var h=document.getElementById('hist');h.innerHTML='<div style=color:#7a5adf;margin-bottom:4px>'+msg+'</div>'+h.innerHTML;}function insert(){clearTimeout(B.timer);var v=document.getElementById('inp').value||'apple';if(B.inserted[v]){log('Already inserted: '+v);return;}var positions=[];for(var i=0;i<B.hashes;i++)positions.push(hash(v,i));B.phase='inserting';var idx=0;B.timer=setInterval(function(){if(idx>=B.hashes){B.inserted[v]=true;B.items++;updateInfo();document.getElementById('result').textContent='Inserted';log('Inserted "'+v+'" → bits '+positions.join(', '));clearTimeout(B.timer);B.phase='idle';return;}var p=positions[idx];B.bits[p]=true;drawBit({hit:[p]});idx++;},250);updateInfo();}function lookup(){var v=document.getElementById('inp').value||'apple';var positions=[];var allSet=true;var missPositions=[];for(var i=0;i<B.hashes;i++){var p=hash(v,i);positions.push(p);if(!B.bits[p]){allSet=false;missPositions.push(p);}}var idx=0;B.timer=setInterval(function(){if(idx>=B.hashes){var fp=B.inserted[v]?false:(allSet?true:false);var msg;if(B.inserted[v])msg='"'+'v'+'" found (true positive)';else if(allSet)msg='"'+v+'" maybe present (FALSE POSITIVE!)';else msg='"'+v+'" definitely not present';document.getElementById('result').textContent=allSet?'Maybe':'Not Present';document.getElementById('result').style.color=allSet?'#ff4466':'#44ff88';log(msg);drawBit({hit:positions,miss:missPositions});clearTimeout(B.timer);return;}drawBit({hit:positions.slice(0,idx+1),miss:missPositions.filter(function(p){return p<=positions[idx];})});idx++;},250);}function reset(){clearTimeout(B.timer);B.bits=new Array(B.size).fill(false);B.items=0;B.inserted={};drawBit();updateInfo();document.getElementById('result').textContent='-';document.getElementById('result').style.color='#ffbb55';log('Filter reset');}function toggleHash(){B.hashes=B.hashes===2?3:B.hashes===3?4:2;document.querySelector('button:nth-child(5)').textContent='Hashes: '+B.hashes;reset();}drawBit();updateInfo();</script></body></html>
