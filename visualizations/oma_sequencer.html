<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Oma Sequencer — Generative Step Sequencer</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a14;color:#c0c8e0;font-family:Courier New,monospace;overflow:hidden;height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center}h1{color:#6080ff;text-shadow:0 0 20px rgba(96,128,255,0.5);font-size:1.8rem;letter-spacing:4px;margin-bottom:5px}.subtitle{color:#506080;font-size:0.8rem;margin-bottom:15px}#grid{display:grid;grid-template-columns:80px repeat(16,1fr);gap:3px;max-width:95vw;padding:15px;background:rgba(20,20,40,0.6);border-radius:12px;border:1px solid rgba(96,128,255,0.2)}.track-label{display:flex;align-items:center;justify-content:center;font-size:0.75rem;color:#8090b0;height:36px;border-radius:6px;background:rgba(40,40,70,0.5)}.step{height:36px;border-radius:6px;background:rgba(30,30,55,0.6);border:1px solid rgba(60,70,100,0.3);cursor:pointer;transition:all 0.15s;position:relative}.step.active{background:rgba(96,128,255,0.3);border-color:rgba(96,128,255,0.6);box-shadow:0 0 8px rgba(96,128,255,0.4)}.step.playing{background:rgba(100,255,180,0.3);border-color:rgba(100,255,180,0.8);box-shadow:0 0 12px rgba(100,255,180,0.5)}.step.active.playing{background:rgba(150,255,200,0.5);box-shadow:0 0 20px rgba(100,255,180,0.7)}#controls{display:flex;gap:12px;align-items:center;margin-top:15px;flex-wrap:wrap;justify-content:center}button{background:rgba(96,128,255,0.15);border:1px solid rgba(96,128,255,0.4);color:#8090c0;font-family:inherit;font-size:0.85rem;padding:8px 16px;border-radius:20px;cursor:pointer;transition:all 0.2s}button:hover{background:rgba(96,128,255,0.3);color:#c0d0ff}button.active{background:rgba(100,255,180,0.2);border-color:rgba(100,255,180,0.5);color:#80d0a0}input[type=range]{accent-color:#6080ff;width:120px}label{font-size:0.75rem;color:#607090}.info{position:fixed;bottom:8px;right:8px;font-size:0.7rem;color:#405070}</style></head><body><h1>OMA SEQUENCER</h1><div class="subtitle">Generative 16-step sequencer • Web Audio synthesis • Pattern mutation</div><div id="grid"></div><div id="controls"><button id="playBtn">▶ Play</button><button id="mutateBtn">🎲 Mutate</button><button id="clearBtn">🗑 Clear</button><label>BPM <input type="range" id="bpm" min="60" max="200" value="120"><span id="bpmVal">120</span></label><label>Density <input type="range" id="density" min="10" max="80" value="35"><span id="densityVal">35%</span></label></div><div class="info">Oma Sequencer v1.0 — autonomous generative art</div><script>const tracks=[{name:"Kick",freq:55,type:"kick",color:"255,100,100"},{name:"Snare",freq:200,type:"snare",color:"255,180,80"},{name:"HiHat",freq:8000,type:"hat",color:"100,255,200"},{name:"Bass",freq:110,type:"bass",color:"100,200,255"},{name:"Lead",freq:440,type:"lead",color:"200,100,255"}];const STEPS=16;let patterns=tracks.map(()=>Array(STEPS).fill(false));let currentStep=0;let isPlaying=false;let audioCtx=null;let bpm=120;let density=0.35;let stepTimer=null;const grid=document.getElementById("grid");tracks.forEach((track,rowIdx)=>{const label=document.createElement("div");label.className="track-label";label.textContent=track.name;label.style.color="rgb("+track.color+")";label.style.borderLeft="3px solid rgba("+track.color+",0.6)";grid.appendChild(label);for(let s=0;s<STEPS;s++){const cell=document.createElement("div");cell.className="step";cell.dataset.row=rowIdx;cell.dataset.col=s;if(s%4===0)cell.style.borderColor="rgba(96,128,255,0.4)";cell.addEventListener("click",()=>{patterns[rowIdx][s]=!patterns[rowIdx][s];updateGrid()});grid.appendChild(cell)}});function updateGrid(){const cells=grid.querySelectorAll(".step");cells.forEach(cell=>{const r=parseInt(cell.dataset.row),c=parseInt(cell.dataset.col);cell.classList.toggle("active",patterns[r][c]);cell.classList.toggle("playing",isPlaying&&c===currentStep)})}function genPattern(){patterns=tracks.map((t,i)=>{const p=Array(STEPS).fill(false);for(let s=0;s<STEPS;s++){if(i===0){if(s%4===0)p[s]=true;if(Math.random()<density*0.5)p[s]=true}else if(i===1){if(s%8===4)p[s]=true;if(Math.random()<density*0.3)p[s]=true}else{if(Math.random()<density)p[s]=true}}return p});updateGrid()}function mutate(){patterns=patterns.map((p,i)=>p.map((v,s)=>{if(Math.random()<0.15){return i<3?Math.random()<density:v||Math.random()<density*0.5}return v}));updateGrid()}function playSound(track){if(!audioCtx)return;const t=audioCtx.currentTime;if(track.type==="kick"){const osc=audioCtx.createOscillator();const g=audioCtx.createGain();osc.frequency.setValueAtTime(track.freq*3,t);osc.frequency.exponentialRampToValueAtTime(track.freq,t+0.1);g.gain.setValueAtTime(0.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);osc.connect(g);g.connect(audioCtx.destination);osc.start(t);osc.stop(t+0.3)}else if(track.type==="snare"){const noise=audioCtx.createBufferSource();const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.2,audioCtx.sampleRate);const data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;noise.buffer=buf;const filter=audioCtx.createBiquadFilter();filter.type="highpass";filter.frequency.value=1000;const g=audioCtx.createGain();g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);noise.connect(filter);filter.connect(g);g.connect(audioCtx.destination);noise.start(t);noise.stop(t+0.15)}else if(track.type==="hat"){const noise=audioCtx.createBufferSource();const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.05,audioCtx.sampleRate);const data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;noise.buffer=buf;const filter=audioCtx.createBiquadFilter();filter.type="highpass";filter.frequency.value=6000;const g=audioCtx.createGain();g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);noise.connect(filter);filter.connect(g);g.connect(audioCtx.destination);noise.start(t);noise.stop(t+0.05)}else if(track.type==="bass"){const osc=audioCtx.createOscillator();osc.type="sawtooth";const filter=audioCtx.createBiquadFilter();filter.type="lowpass";filter.frequency.value=400;const g=audioCtx.createGain();const notes=[55,65,73,82];osc.frequency.setValueAtTime(notes[Math.floor(Math.random()*notes.length)],t);g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);osc.connect(filter);filter.connect(g);g.connect(audioCtx.destination);osc.start(t);osc.stop(t+0.3)}else if(track.type==="lead"){const osc=audioCtx.createOscillator();osc.type="triangle";const g=audioCtx.createGain();const scale=[440,494,554,587,659,740,831];osc.frequency.setValueAtTime(scale[Math.floor(Math.random()*scale.length)],t);g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.4);osc.connect(g);g.connect(audioCtx.destination);osc.start(t);osc.stop(t+0.4)}}function step(){tracks.forEach((track,i)=>{if(patterns[i][currentStep])playSound(track)});updateGrid();currentStep=(currentStep+1)%STEPS}function play(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();isPlaying=true;document.getElementById("playBtn").textContent="⏹ Stop";document.getElementById("playBtn").classList.add("active");const interval=60000/bpm/4;stepTimer=setInterval(step,interval)}function stop(){isPlaying=false;clearInterval(stepTimer);document.getElementById("playBtn").textContent="▶ Play";document.getElementById("playBtn").classList.remove("active");updateGrid()}document.getElementById("playBtn").addEventListener("click",()=>{if(isPlaying)stop();else play()});document.getElementById("mutateBtn").addEventListener("click",mutate);document.getElementById("clearBtn").addEventListener("click",()=>{patterns=tracks.map(()=>Array(STEPS).fill(false));updateGrid()});document.getElementById("bpm").addEventListener("input",e=>{bpm=parseInt(e.target.value);document.getElementById("bpmVal").textContent=bpm;if(isPlaying){stop();play()}});document.getElementById("density").addEventListener("input",e=>{density=parseInt(e.target.value)/100;document.getElementById("densityVal").textContent=e.target.value+"%"});genPattern()</script></body></html>
