<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl input{width:60px;padding:6px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px;text-align:center}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#7a5adf}#ctl label{font-size:11px;color:#505080}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:480px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}</style><div id=app><h1>Oma: Ford-Fulkerson Max Flow</h1><div class=sub>Edmonds-Karp BFS augmenting paths through residual graph. Source S, Sink T, capacities, flow saturation.</div><div id=ctl><label>Nodes:</label><input id=nInput value=7 min=5 max=12><button onclick=doGenerate()>Generate</button><button onclick=doStep()>Step</button><button onclick=doRun()>Auto Run</button><button onclick=doStop()>Stop</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=40></div><canvas id=canv width=960 height=480></canvas><div id=info><div class=ib><div>Nodes</div><div class=v id=nn>0</div></div><div class=ib><div>Edges</div><div class=v id=ne>0</div></div><div class=ib><div>Max Flow</div><div class=v id=nmf>0</div></div><div class=ib><div>Augmenting Paths</div><div class=v id=nap>0</div></div><div class=ib><div>Phase</div><div class=v id=nph>Idle</div></div></div><div class=leg><span><span class=dot style=background:#7a7aff></span>Unvisited</span><span><span class=dot style=background:#ffdd44></span>Frontier/BFS</span><span><span class=dot style=background:#ff4466></span>Source/Sink</span><span><span class=dot style=background:#44ff88></span>Augmenting Path</span><span><span class=dot style=background:#2a4a6a></span>Residual Edge</span><span><span class=dot style=background:#ff8844></span>Saturated</span></div></div>
<script>var W=960,H=480;var nodes=[];var edges=[];var adj=[];var n=0;var ne=0;var source=0,sink=0;var maxFlow=0;var augPaths=0;var phase='Idle';var running=false;var timer=null;var bfsQueue=[];var bfsVisited=[];var bfsParent=[];var bfsIdx=0;var augPath=[];var augIdx=0;var augFlow=0;var highlightEdge=-1;var residual=[];function doGenerate(){var ni=parseInt(document.getElementById('nInput').value)||7;if(ni<5)ni=5;if(ni>12)ni=12;n=ni;nodes=[];edges=[];adj=[];residual=[];maxFlow=0;augPaths=0;phase='Ready';source=0;sink=n-1;for(var i=0;i<n;i++){nodes.push({x:60+Math.random()*(W-120),y:40+Math.random()*(H-80),vx:0,vy:0});adj[i]=[];residual[i]=[];for(var j=0;j<n;j++)residual[i][j]=0;}var edgeSet={};for(i=0;i<n;i++){for(var j=0;j<n;j++){if(i!==j&&!edgeSet[i+'-'+j]&&!edgeSet[j+'-'+i]&&Math.random()<0.35){var cap=2+Math.floor(Math.random()*15);var ei=edges.length;edges.push({a:i,b:j,cap:cap,flow:0,saturated:false});edgeSet[i+'-'+j]=1;adj[i].push({to:j,ei:ei});adj[j].push({to:i,ei:ei,res:true});residual[i][j]=cap;}}}ne=edges.length;phase='Ready';bfsQueue=[];bfsVisited=[];bfsParent=[];bfsIdx=0;augPath=[];augIdx=0;augFlow=0;highlightEdge=-1;updateInfo();render();}function startBFS(){bfsQueue=[source];bfsVisited=[];bfsParent=[];for(var i=0;i<n;i++){bfsVisited[i]=false;bfsParent[i]=-1;}bfsVisited[source]=true;bfsIdx=0;phase='BFS';highlightEdge=-1;}function doStep(){if(n===0){doGenerate();return;}if(phase==='Ready'||phase==='Idle'||phase==='Done'){if(phase==='Ready'){startBFS();updateInfo();render();return;}else return;}if(phase==='BFS'){if(bfsIdx<bfsQueue.length){var u=bfsQueue[bfsIdx];bfsIdx++;for(var i=0;i<adj[u].length;i++){var e=adj[u][i];if(!bfsVisited[e.to]&&residual[u][e.to]>0){bfsVisited[e.to]=true;bfsParent[e.to]=u;bfsQueue.push(e.to);}}if(bfsIdx>=bfsQueue.length){if(bfsVisited[sink]){var path=[];var cur=sink;while(cur!==source){path.unshift(cur);cur=bfsParent[cur];}path.unshift(source);augPath=path;augIdx=0;augFlow=Infinity;for(i=1;i<augPath.length;i++){var r=residual[augPath[i-1]][augPath[i]];if(r<augFlow)augFlow=r;}phase='Augment';}else{phase='Done';}}}updateInfo();render();}else if(phase==='Augment'){if(augIdx<augPath.length-1){var u=augPath[augIdx],v=augPath[augIdx+1];residual[u][v]-=augFlow;residual[v][u]+=augFlow;for(i=0;i<edges.length;i++){if(edges[i].a===u&&edges[i].b===v){edges[i].flow+=augFlow;if(edges[i].flow>=edges[i].cap)edges[i].saturated=true;}}augIdx++;}else{maxFlow+=augFlow;augPaths++;phase='Ready';bfsQueue=[];augPath=[];augIdx=0;highlightEdge=-1;}updateInfo();render();}}function doRun(){if(n===0)doGenerate();running=true;var spd=parseInt(document.getElementById('spd').value)||40;timer=setInterval(function(){if(phase==='Done'){clearInterval(timer);timer=null;running=false;return;}doStep();},spd);}function doStop(){if(timer){clearInterval(timer);timer=null;}running=false;phase='Paused';updateInfo();render();}function doReset(){if(timer){clearInterval(timer);timer=null;}running=false;n=0;ne=0;nodes=[];edges=[];adj=[];residual=[];maxFlow=0;augPaths=0;phase='Idle';bfsQueue=[];bfsParent=[];augPath=[];highlightEdge=-1;updateInfo();render();}function updateInfo(){document.getElementById('nn').textContent=n;document.getElementById('ne').textContent=ne;document.getElementById('nmf').textContent=maxFlow;document.getElementById('nap').textContent=augPaths;document.getElementById('nph').textContent=phase;}function render(){var canvas=document.getElementById('canv');var ctx=canvas.getContext('2d');ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,W,H);if(n===0){ctx.fillStyle='#505080';ctx.font='14px monospace';ctx.textAlign='center';ctx.fillText('Click Generate to start',W/2,H/2);return;}var inAugPath={};for(var i=1;i<augPath.length;i++){inAugPath[augPath[i-1]+'-'+augPath[i]]=1;}for(i=0;i<edges.length;i++){var e=edges[i];var a=nodes[e.a],b=nodes[e.b];var isAP=inAugPath[e.a+'-'+e.b];ctx.strokeStyle=isAP?'#44ff88':e.saturated?'#ff8844':'#2a4a6a';ctx.lineWidth=isAP?3:1.5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();var mx=(a.x+b.x)/2,my=(a.y+b.y)/2;ctx.fillStyle='#ffbb55';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(e.flow+'/'+e.cap,mx,my-4);}for(i=0;i<n;i++){var color='#7a7aff';if(i===source||i===sink)color='#ff4466';else if(bfsVisited&&bfsVisited[i])color='#ffdd44';if(phase==='Augment'&&augPath.indexOf(i)>=0)color='#44ff88';ctx.fillStyle=color;ctx.beginPath();ctx.arc(nodes[i].x,nodes[i].y,16,0,2*Math.PI);ctx.fill();ctx.strokeStyle='#08060f';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#08060f';ctx.font='11px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i===source?'S':i===sink?'T':i,nodes[i].x,nodes[i].y);}if(phase==='Done'){ctx.fillStyle='#ffbb55';ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.fillText('Max Flow = '+maxFlow,W/2,H-16);}}render();</script></body></html>
