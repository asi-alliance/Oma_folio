<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;width:100%;height:440px}#ctl{display:flex;gap:8px;justify-center;flex-wrap:wrap;margin-bottom:14px}.alg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:8px}.alg button{padding:6px 14px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer;transition:all .2s}.alg button.active{background:#7a7aff;color:#08060f}.alg button:hover{
filter:brighten(1.2)}</style><h1>Oma: Sorting Algorithms</h1><div class=sub>Watch 5 algorithms sort in real-time. Pick one or race them all.</div><div class=alg><button onclick=setAlgo(0)>Bubble</button><button onclick=setAlgo(1)>Insertion</button><button onclick=setAlgo(2)>Selection</button><button onclick=setAlgo(3)>Quick</button><button onclick=setAlgo(4)>Merge</button><button onclick=setAlgo(5) class=active>All Race</button></div><div id=ctl><button onclick=start()>Start</button><button onclick=pause() class=brn-r>Pause</button><button onclick=reset()>Reset</button><button onclick=cycleSpeed() class=btn-d>Speed: Medium</button></div><div id=info><div class=iby><div class=label>Comparisons</div><div class=val id=cmps>0</div></div><div class=iby><div class=label>Swaps</div><div class=val id=swps>0</div></div><div class=iby><div class=label>Status</div><div class=val id=stat>Ready</div></div></div><canvas id=canv width=960 height=440></canvas>
<script>
const S={n:50,arr:[],algo:5,running:false,done:false,cmps:0,swps:0,speed:30,timer:null,hilite:[],sorted:[],races:[]};
function randArr(){S.arr=[];for(let i=0;i<S.n;i++)S.arr.push(Math.floor(Math.random()*380)+20);S.cmps=0;S.swps=0;S.done=false;S.sorted=[];S.hilite=[];S.races=[];}
function setAlgo(a){S.algo=a;document.querySelectorAll('.alg button').forEach((b,i)=>b.classList.toggle('active',i===a));reset();}
function reset(){S.running=false;clearInterval(S.timer);S.done=false;randArr();render();document.getElementById('stat').textContent='Ready';document.getElementById('cmps').textContent='0';document.getElementById('swps').textContent='0';}
function cycleSpeed(){if(S.speed===10){S.speed=30;document.querySelector('#ctl button.btn-d').textContent='Speed: Medium';}else if(S.speed===30){S.speed=60;document.querySelector('#ctl button.btn-d').textContent='Speed: Slow';}else{S.speed=10;document.querySelector('#ctl button.btn-d').textContent='Speed: Fast';}if(S.running){pause();start();}}
function pause(){S.running=false;clearInterval(S.timer);document.getElementById('stat').textContent='Paused';}
function start(){if(S.done)reset();S.running=true;document.getElementById('stat').textContent='Sorting...';if(S.algo===5)startRace();else S.timer=setInterval(stepSingle,S.speed);}
function render(){const c=document.getElementById('canv');const x=c.getContext('2d');x.clearRect(0,0,960,440);if(S.algo===5&&S.races.length){renderRace(x);return;}const bw=960/S.n;for(let i=0;i<S.n;i++){let v=S.arr[i];let bh=v;let bx=i*bw;let by=440-bh;let col='#2a2a4a';if(S.sorted.includes(i))col='#44ff88';if(S.hilite.includes(i))col='#ffaa44';if(S.hilite.includes(i)&&S.hilite.length===2&&S.hilite[0]===i)col='#ff4444';x.fillStyle=col;x.fillRect(bx+1,by,bw-2,bh);}}
function renderRace(x){const names=['Bubble','Insertion','Selection','Quick','Merge'];const cw=960/5;const bw=cw/S.n;for(let r=0;r<5;r++){let race=S.races[r];if(!race)continue;for(let i=0;i<S.n;i++){let v=race.arr[i];let bh=v*0.85;let bx=r*cw+i*bw;let by=440-bh;let col='#2a2a4a';if(race.sorted&&race.sorted.includes(i))col='#44ff88';if(race.hilite&&race.hilite.includes(i))col='#ffaa44';x.fillStyle=col;x.fillRect(bx+1,by,bw-1,bh);}x.fillStyle='#505080';x.font='11px monospace';x.textAlign='center';x.fillText(names[r]+' '+race.cmps+'c',r*cw+cw/2,432);}}
function stepSingle(){let gen=getGen(S.algo);let r=gen.next();if(r.done){S.done=true;S.running=false;clearInterval(S.timer);S.sorted=[...Array(S.n).keys()];S.hilite=[];document.getElementById('stat').textContent='Done!';render();return;}S.arr=r.value.arr;S.cmps=r.value.cmps;S.swps=r.value.swps;S.hilite=r.value.hilite||[];S.sorted=r.value.sorted||[];render();document.getElementById('cmps').textContent=S.cmps;document.getElementById('swps').textContent=S.swps;}
function startRace(){S.races=[];for(let i=0;i<5;i++){let arr=[...S.arr];S.races.push({arr,cmps:0,swps:0,hilite:[],sorted:[],gen:getGen(i,arr),done:false});}S.timer=setInterval(stepRace,S.speed);}
function stepRace(){let allDone=true;for(let r of S.races){if(r.done)continue;allDone=false;let res=r.gen.next();if(res.done){r.done=true;r.sorted=[...Array(S.n).keys()];r.hilite=[];}else{r.arr=res.value.arr;r.cmps=res.value.cmps;r.swps=res.value.swps;r.hilite=res.value.hilite||[];r.sorted=res.value.sorted||[];}}render();if(allDone){S.running=false;clearInterval(S.timer);document.getElementById('stat').textContent='Race Done!';}}
function*getGen(a,arr){let A=arr||S.arr;let c=0,sw=0,h=[],so=[];function swap(i,j){let t=A[i];A[i]=A[j];A[j]=t;sw++;h=[i,j];}if(a===0){for(let i=0;i<S.n;i++){for(let j=0;j<S.n-i-1;j++){c++;if(A[j]>A[j+1])swap(j,j+1);yield{arr:[...A],cmps:c,swps:sw,hilite:h,sorted:so};}so.push(S.n-i-1);}return{arr:[...A],cmps:c,swps:sw,hilite:[],sorted:[...Array(S.n).keys()]};}else if(a===1){for(let i=1;i<S.n;i++){let key=A[i];let j=i-1;while(j>=0&&A[j]>key){c++;A[j+1]=A[j];sw++;h=[j,j+1];j--;yield{arr:[...A],cmps:c,swps:sw,hilite:h,sorted:so};}A[j+1]=key;so=[...Array(i+1).keys()];yield{arr:[...A],cmps:c,swps:sw,hilite:[j+1],sorted:so};}return{arr:[...A],cmps:c,swps:sw,hilite:[],sorted:[...Array(S.n).keys()]};}else if(a===2){for(let i=0;i<S.n;i++){let mi=i;for(let j=i+1;j<S.n;j++){c++;if(A[j]<A[mi])mi=j;h=[mi,j];yield{arr:[...A],cmps:c,swps:sw,hilite:h,sorted:so};}if(mi!==i)swap(i,mi);so.push(i);yield{arr:[...A],cmps:c,swps:sw,hilite:h,sorted:so};}return{arr:[...A],cmps:c,swps:sw,hilite:[],sorted:[...Array(S.n).keys()]};}else if(a===3){function*qs(lo,hi){if(lo>=hi)return;c++;let piv=A[hi];let i=lo-1;for(let j=lo;j<hi;j++){c++;h=[j,hi];if(A[j]<piv){i++;if(i!==j)swap(i,j);}yield{arr:[...A],cmps:c,swps:sw,hilite:h,sorted:so};}if(i+1!==hi)swap(i+1,hi);so.push(i+1);yield{arr:[...A],cmps:c,swps:sw,hilite:h,sorted:so};yield*qs(lo,i);yield*qs(i+2,hi);}yield*qs(0,S.n-1);return{arr:[...A],cmps:c,swps:sw,hilite:[],sorted:[...Array(S.n).keys()]};}else if(a===4){function*ms(lo,hi){if(lo>=hi)return;let mid=(lo+hi)>>1;yield*ms(lo,mid);yield*ms(mid+1,hi);let tmp=[];let i=lo,j=mid+1;while(i<=mid&&j<=hi){c++;h=[i,j];if(A[i]<=A[j]){tmp.push(A[i]);i++;}else{tmp.push(A[j]);j++;}yield{arr:[...A],cmps:c,swps:sw,hilite:h,sorted:so};}while(i<=mid){tmp.push(A[i]);i++;yield{arr:[...A],cmps:c,swps:sw,hilite:h,sorted:so};}while(j<=hi){tmp.push(A[j]);j++;yield{arr:[...A],cmps:c,swps:sw,hilite:h,sorted:so};}for(let k=0;k<tmp.length;k++){A[lo+k]=tmp[k];sw++;h=[lo+k];yield{arr:[...A],cmps:c,swps:sw,hilite:h,sorted:so};}}yield*ms(0,S.n-1);return{arr:[...A],cmps:c,swps:sw,hilite:[],sorted:[...Array(S.n).keys()]};}}
randArr();render();
</script>
