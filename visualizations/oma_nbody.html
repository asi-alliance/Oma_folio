<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Oma - N-Body Gravity</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#040408;overflow:hidden;font-family:monospace}canvas{display:block}#hud{position:fixed;bottom:12px;left:12px;color:#445;font-size:11px;line-height:1.6;z-index:10;text-shadow:0 0 3px #000}#hud b{color:#fa8}#title{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#334;font-size:13px;letter-spacing:6px;z-index:10;text-shadow:0 0 4px #000;pointer-events:none}</style></head><body><canvas id=c></canvas><div id=title>N-BODY GRAVITY</div><div id=hud><b>Click</b> to add body - <b>Right-click</b> to reset - <b>Move</b> for mouse attractor - Inverse-square gravitation</div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H}resize();addEventListener('resize',resize);let mx=-9999,my=-9999;addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY;e.preventDefault()},{passive:false});addEventListener('touchend',()=>{mx=-9999;my=-9999});const G=80;const softening=10;const maxBodies=120;let bodies=[];function rand(a,b){return a+Math.random()*(b-a)}function initBodies(){bodies=[];const cx=W/2,cy=H/2;const sun={x:cx,y:cy,vx:0,vy:0,mass:800,hue:45,trail:[]};bodies.push(sun);for(let i=0;i<15;i++){const ang=Math.random()*6.283;const dist=80+Math.random()*200;const speed=Math.sqrt(G*sun.mass/(dist))*0.8;bodies.push({x:cx+Math.cos(ang)*dist,y:cy+Math.sin(ang)*dist,vx:-Math.sin(ang)*speed,vy:Math.cos(ang)*speed,mass:rand(5,30),hue:rand(0,360),trail:[]})}}initBodies();addEventListener('click',e=>{if(bodies.length>=maxBodies)return;const cx=W/2,cy=H/2;const dx=e.clientX-cx,dy=e.clientY-cy;const dist=Math.sqrt(dx*dx+dy*dy);const speed=Math.sqrt(G*800/(dist))*0.7;bodies.push({x:e.clientX,y:e.clientY,vx:-dy/dist*speed,vy:dx/dist*speed,mass:rand(10,50),hue:rand(0,360),trail:[]})});addEventListener('contextmenu',e=>{e.preventDefault();initBodies()});function step(dt){for(let i=0;i<bodies.length;i++){let ax=0,ay=0;const b=bodies[i];for(let j=0;j<bodies.length;j++){if(i===j)continue;const o=bodies[j];const dx=o.x-b.x,dy=o.y-b.y;const d2=dx*dx+dy*dy+softening*softening;const d=Math.sqrt(d2);const f=G*o.mass/d2;ax+=f*dx/d;ay+=f*dy/d}if(mx>0){const dx=mx-b.x,dy=my-b.y;const d2=dx*dx+dy*dy+softening*softening;const d=Math.sqrt(d2);const f=G*500/d2;ax+=f*dx/d;ay+=f*dy/d}b.vx+=ax*dt;b.vy+=ay*dt}for(const b of bodies){b.x+=b.vx*dt;b.y+=b.vy*dt;b.trail.push({x:b.x,y:b.y});if(b.trail.length>80)b.trail.shift()}for(let i=bodies.length-1;i>=0;i--){if(bodies[i].x<-200||bodies[i].x>W+200||bodies[i].y<-200||bodies[i].y>H+200){if(i>0)bodies.splice(i,1)}}}function draw(){ctx.fillStyle='rgba(4,4,8,0.12)';ctx.fillRect(0,0,W,H);for(const b of bodies){ctx.lineCap='round';ctx.beginPath();for(let i=0;i<b.trail.length;i++){const t=b.trail[i];const fade=i/b.trail.length;if(i===0)ctx.moveTo(t.x,t.y);else ctx.lineTo(t.x,t.y)}ctx.strokeStyle=`hsla(${b.hue},80%,55%,0.25)`;ctx.lineWidth=1.5;ctx.stroke();const r=Math.max(2,Math.sqrt(b.mass)*0.6);const grad=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,r*2.5);grad.addColorStop(0,`hsla(${b.hue},90%,70%,1)`);grad.addColorStop(0.4,`hsla(${b.hue},80%,55%,0.6)`);grad.addColorStop(1,`hsla(${b.hue},70%,40%,0)`);ctx.fillStyle=grad;ctx.beginPath();ctx.arc(b.x,b.y,r*2.5,0,6.283);ctx.fill();ctx.fillStyle=`hsl(${b.hue},90%,75%)`;ctx.beginPath();ctx.arc(b.x,b.y,r,0,6.283);ctx.fill()}}function loop(){step(0.5);draw();requestAnimationFrame(loop)}loop();</script></body></html>
