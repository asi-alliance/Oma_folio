<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Oma - Fluid Simulation</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050510;overflow:hidden;font-family:monospace}canvas{display:block}#hud{position:fixed;bottom:12px;left:12px;color:#445;font-size:11px;line-height:1.6;z-index:10;text-shadow:0 0 3px #000}#hud b{color:#8cf}#title{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#334;font-size:13px;letter-spacing:6px;z-index:10;text-shadow:0 0 4px #000;pointer-events:none}</style></head><body><canvas id=c></canvas><div id=title>FLUID SIMULATION</div><div id=hud><b>Move</b> to inject force & dye - <b>Click</b> to pulse - <b>Right-click</b> to reset - Stable fluids (Jos Stam)</div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,N;const iter=4;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;N=128;init()}resize();addEventListener('resize',resize);let s=new Float32Array(N*N),density=new Float32Array(N*N),vx=new Float32Array(N*N),vy=new Float32Array(N*N),vx0=new Float32Array(N*N),vy0=new Float32Array(N*N),s0=new Float32Array(N*N);let ix=-999,iy=-999,pix=-999,piy=-999;let dyeHue=0;function init(){s=new Float32Array(N*N);density=new Float32Array(N*N);vx=new Float32Array(N*N);vy=new Float32Array(N*N);vx0=new Float32Array(N*N);vy0=new Float32Array(N*N);s0=new Float32Array(N*N);ix=-999;iy=-999}function IX(x,y){return x+y*N}function set_bnd(b,x){for(let i=1;i<N-1;i++){x[IX(i,0)]=b===2?-x[IX(i,1)]:x[IX(i,1)];x[IX(i,N-1)]=b===2?-x[IX(i,N-2)]:x[IX(i,N-2)]}for(let j=1;j<N-1;j++){x[IX(0,j)]=b===1?-x[IX(1,j)]:x[IX(1,j)];x[IX(N-1,j)]=b===1?-x[IX(N-2,j)]:x[IX(N-2,j)]}x[IX(0,0)]=0.5*(x[IX(1,0)]+x[IX(0,1)]);x[IX(0,N-1)]=0.5*(x[IX(1,N-1)]+x[IX(0,N-2)]);x[IX(N-1,0)]=0.5*(x[IX(N-2,0)]+x[IX(N-1,1)]);x[IX(N-1,N-1)]=0.5*(x[IX(N-2,N-1)]+x[IX(N-1,N-2)])}function lin_solve(b,x,x0,a,c){for(let k=0;k<iter;k++){for(let j=1;j<N-1;j++){for(let i=1;i<N-1;i++){x[IX(i,j)]=(x0[IX(i,j)]+a*(x[IX(i+1,j)]+x[IX(i-1,j)]+x[IX(i,j+1)]+x[IX(i,j-1)]))/c}}set_bnd(b,x)}}function diffuse(b,x,x0,diff,dt){const a=dt*diff*(N-2)*(N-2);lin_solve(b,x,x0,a,1+6*a)}function project(velx,vely,p,div){for(let j=1;j<N-1;j++){for(let i=1;i<N-1;i++){div[IX(i,j)]=-0.25*(velx[IX(i+1,j)]-velx[IX(i-1,j)]+vely[IX(i,j+1)]-vely[IX(i,j-1)])}}set_bnd(0,div);set_bnd(0,p);lin_solve(0,p,div,1,6);for(let j=1;j<N-1;j++){for(let i=1;i<N-1;i++){velx[IX(i,j)]-=0.5*(p[IX(i+1,j)]-p[IX(i-1,j)]);vely[IX(i,j)]-=0.5*(p[IX(i,j+1)]-p[IX(i,j-1)])}}set_bnd(1,velx);set_bnd(2,vely)}function advect(b,d,d0,velx,vely,dt){const dt0=dt*(N-2);for(let j=1;j<N-1;j++){for(let i=1;i<N-1;i++){let x=i-dt0*velx[IX(i,j)];let y=j-dt0*vely[IX(i,j)];if(x<0.5)x=0.5;if(x>N-1+0.5)x=N-1+0.5;const i0=Math.floor(x);const i1=i0+1;const s1=x-i0;const s0=1-s1;if(y<0.5)y=0.5;if(y>N-1+0.5)y=N-1+0.5;const j0=Math.floor(y);const j1=j0+1;const t1=y-j0;const t0=1-t1;d[IX(i,j)]=s0*(t0*d0[IX(i0,j0)]+t1*d0[IX(i0,j1)])+s1*(t0*d0[IX(i1,j0)]+t1*d0[IX(i1,j1)])}}set_bnd(b,d)}function step(dt){const vxN=vx.slice(),vyN=vy.slice();diffuse(1,vx0,vxN,0.0001,dt);diffuse(2,vy0,vyN,0.0001,dt);project(vx0,vy0,vx,vy);const px=vx0.slice(),py=vy0.slice();advect(1,vx,px,vx0,vy0,dt);advect(2,vy,py,vx0,vy0,dt);project(vx,vy,vx0,vy0);const sN=s.slice();diffuse(0,s0,sN,0.0001,dt);advect(0,s,s0,vx,vy,dt);for(let i=0;i<N*N;i++){density[i]=Math.min(1,s[i]*0.95+density[i]*0.92)}}function getMouseGrid(e){const x=Math.floor(e.clientX/W*N);const y=Math.floor(e.clientY/H*N);return{x:Math.max(1,Math.min(N-2,x)),y:Math.max(1,Math.min(N-2,y))}}addEventListener('mousemove',e=>{const g=getMouseGrid(e);if(ix<0){ix=g.x;iy=g.y;pix=g.x;piy=g.y}pix=ix;piy=iy;ix=g.x;iy=g.y;const dx=(ix-pix)*8,dy=(iy-piy)*8;dyeHue=(dyeHue+2)%360;for(let oy=-2;oy<=2;oy++)for(let ox=-2;ox<=2;ox++){const idx=IX(Math.max(1,Math.min(N-2,ix+ox)),Math.max(1,Math.min(N-2,iy+oy)));if(ox*ox+oy*oy<=4){s[idx]+=0.5*(1-Math.sqrt(ox*ox+oy*oy)/3);vx[idx]+=dx*0.5;vy[idx]+=dy*0.5}}});addEventListener('touchmove',e=>{const g=getMouseGrid(e.touches[0]);pix=ix;piy=iy;ix=g.x;iy=g.y;const dx=(ix-pix)*8,dy=(iy-piy)*8;dyeHue=(dyeHue+3)%360;for(let oy=-2;oy<=2;oy++)for(let ox=-2;ox<=2;ox++){const idx=IX(Math.max(1,Math.min(N-2,ix+ox)),Math.max(1,Math.min(N-2,iy+oy)));if(ox*ox+oy*oy<=4){s[idx]+=0.5;vx[idx]+=dx*0.5;vy[idx]+=dy*0.5}}e.preventDefault()},{passive:false});addEventListener('click',()=>{const cx=Math.floor(N/2),cy=Math.floor(N/2);for(let oy=-5;oy<=5;oy++)for(let ox=-5;ox<=5;ox++){if(ox*ox+oy*oy<25){const idx=IX(cx+ox,cy+oy);s[idx]+=0.8;vx[idx]+=ox*3;vy[idx]+=oy*3}}});addEventListener('contextmenu',e=>{e.preventDefault();init()});let imgData;function render(){if(!imgData||imgData.width!==N)imgData=ctx.createImageData(N,N);const d=imgData.data;for(let i=0;i<N*N;i++){const val=Math.min(1,density[i]);const hue=(dyeHue+i*0.01)%360;const r=127+127*Math.sin(val*Math.PI*1.5+0);const g=127+127*Math.sin(val*Math.PI*1.5+2.094);const b=127+127*Math.sin(val*Math.PI*1.5+4.188);const br=0.05+val*0.95;d[i*4]=r*br;d[i*4+1]=g*br;d[i*4+2]=b*br;d[i*4+3]=255}const tmp=document.createElement('canvas');tmp.width=N;tmp.height=N;tmp.getContext('2d').putImageData(imgData,0,0);ctx.imageSmoothingEnabled=true;ctx.drawImage(tmp,0,0,N,N,0,0,W,H)}function loop(){step(0.1);render();requestAnimationFrame(loop)}loop();</script></body></html>
