<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:24px;color:#ffaa44;text-shadow:0 0 16px #ff8800;letter-spacing:3px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl input{width:60px;padding:6px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px;text-align:center}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#ffaa44}#ctl label{font-size:11px;color:#505080}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:480px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}</style><div id=app><h1>★ Oma: Radix Sort ★</h1><div class=sub>100th Visualization Milestone! LSD digit-by-digit stable sort using counting sort per digit. O(d·(n+k)).</div><div id=ctl><label>Count:</label><input id=nInput value=16 min=5 max=30><label>Max Digits:</label><input id=dInput value=3 min=2 max=5><button onclick=doGenerate()>Generate</button><button onclick=doStep()>Step</button><button onclick=doRun()>Auto Run</button><button onclick=doStop()>Stop</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=35></div><canvas id=canv width=960 height=480></canvas><div id=info><div class=ib><div>Elements</div><div class=v id=nn>0</div></div><div class=ib><div>Digits</div><div class=v id=ndg>0</div></div><div class=ib><div>Current Digit</div><div class=v id=nd>0</div></div><div class=ib><div>Phase</div><div class=v id=nph>Idle</div></div><div class=ib><div>Steps</div><div class=v id=nst>0</div></div></div><div class=leg><span><span class=dot style=background:#7a7aff></span>Unsorted</span><span><span class=dot style=background:#ffdd44></span>Counting</span><span><span class=dot style=background:#ff4466></span>Placing</span><span><span class=dot style=background:#44ff88></span>Sorted</span><span><span class=dot style=background:#ffaa44></span>Milestone</span></div></div>
<script>var W=960,H=480;var arr=[];var n=0;var maxDigits=3;var curDigit=0;var phase='Idle';var running=false;var timer=null;var stepCount=0;var highlightIdx=-1;var highlightBucket=-1;var buckets=[];var output=[];var subPhase='Count';var countArr=[];var subIdx=0;function getDigit(num,d){return Math.floor(num/Math.pow(10,d))%10;}function countDigits(num){var c=0;var v=Math.abs(num);if(v===0)return 1;while(v>=1){c++;v=Math.floor(v/10);}return c;}function doGenerate(){var ni=parseInt(document.getElementById('nInput').value)||16;var di=parseInt(document.getElementById('dInput').value)||3;if(ni<5)ni=5;if(ni>30)ni=30;if(di<2)di=2;if(di>5)di=5;n=ni;maxDigits=di;arr=[];var maxV=Math.pow(10,maxDigits)-1;for(var i=0;i<n;i++){arr.push(Math.floor(Math.random()*(maxV+1)));}curDigit=0;phase='Sorting';subPhase='Count';subIdx=0;stepCount=0;countArr=[];output=[];highlightIdx=-1;highlightBucket=-1;initDigit();updateInfo();render();}function initDigit(){countArr=[];for(var i=0;i<10;i++)countArr[i]=0;output=[];for(var i=0;i<n;i++)output[i]=-1;subIdx=0;subPhase='Count';}function doStep(){if(n===0){doGenerate();return;}if(phase==='Done'||phase==='Idle')return;if(subPhase==='Count'){if(subIdx<n){var d=getDigit(arr[subIdx],curDigit);countArr[d]++;highlightIdx=subIdx;highlightBucket=d;subIdx++;}else{subPhase='Prefix';subIdx=0;highlightIdx=-1;}}else if(subPhase==='Prefix'){if(subIdx<9){if(subIdx>0)countArr[subIdx]+=countArr[subIdx-1];highlightBucket=subIdx;subIdx++;}else{subIdx=n-1;subPhase='Place';highlightBucket=-1;}}else if(subPhase==='Place'){if(subIdx>=0){var d=getDigit(arr[subIdx],curDigit);countArr[d]--;output[countArr[d]]=arr[subIdx];highlightIdx=subIdx;highlightBucket=d;subIdx--;}else{for(var i=0;i<n;i++)arr[i]=output[i];curDigit++;if(curDigit>=maxDigits){phase='Done';highlightIdx=-1;highlightBucket=-1;}else{initDigit();}}}stepCount++;updateInfo();render();}function doRun(){if(n===0)doGenerate();running=true;var spd=parseInt(document.getElementById('spd').value)||35;timer=setInterval(function(){if(phase==='Done'){clearInterval(timer);timer=null;running=false;return;}doStep();},spd);}function doStop(){if(timer){clearInterval(timer);timer=null;}running=false;phase='Paused';updateInfo();render();}function doReset(){if(timer){clearInterval(timer);timer=null;}running=false;n=0;arr=[];curDigit=0;phase='Idle';stepCount=0;highlightIdx=-1;highlightBucket=-1;countArr=[];output=[];updateInfo();render();}function updateInfo(){document.getElementById('nn').textContent=n;document.getElementById('ndg').textContent=maxDigits;document.getElementById('nd').textContent=curDigit<maxDigits?curDigit:'-';document.getElementById('nph').textContent=phase;document.getElementById('nst').textContent=stepCount;}function render(){var canvas=document.getElementById('canv');var ctx=canvas.getContext('2d');ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,W,H);if(n===0){ctx.fillStyle='#505080';ctx.font='14px monospace';ctx.textAlign='center';ctx.fillText('Click Generate to start',W/2,H/2);return;}var barW=W/n;var topH=200;var maxVal=Math.pow(10,maxDigits)-1;for(var i=0;i<n;i++){var val=arr[i];var bh=20+(val/maxVal)*160;var isHi=(i===highlightIdx);var isDone=(phase==='Done');var color=isDone?'#44ff88':isHi?'#ffdd44':'#7a7aff';if(subPhase==='Place'&&output[i]>=0&&subIdx<0)color='#44ff88';ctx.fillStyle=color;ctx.fillRect(i*barW+2,topH-bh,barW-4,bh);ctx.fillStyle='#08060f';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(val,i*barW+barW/2,topH-bh-4);}var ckW=W/10;var ckY=topH+30;for(i=0;i<10;i++){var ch=countArr[i]?countArr[i]*8:2;var isHB=(i===highlightBucket);ctx.fillStyle=isHB?'#ff4466':'#2a4a6a';ctx.fillRect(i*ckW+2,ckY+80-ch,ckW-4,ch);ctx.fillStyle='#505080';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText(i,i*ckW+ckW/2,ckY+92);ctx.fillStyle='#ffbb55';ctx.font='9px monospace';ctx.fillText(countArr[i]||0,i*ckW+ckW/2,ckY+80-ch-4);}ctx.fillStyle='#505080';ctx.font='10px monospace';ctx.textAlign='left';ctx.fillText('Array (digit '+curDigit+' of '+maxDigits+')',8,topH+8);ctx.fillText('Count Array (0-9)',8,ckY-4);if(phase==='Done'){ctx.fillStyle='#ffaa44';ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.fillText('★ 100th Visualization Milestone! ★',W/2,H-16);}}render();</script></body></html>
