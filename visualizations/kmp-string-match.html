<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:20px;color:#ff66aa;text-shadow:0 0 10px #ff44aa;letter-spacing:2px}.sub{text-align:center;font-size:11px;color:#505080;margin-bottom:12px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}#ctl button{padding:7px 14px;border:1px solid #2a2a4a;border-radius:10px;background:#0c0a18;color:#505080;font-size:11px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#ff66aa}#ctl label{font-size:10px;color:#505080}#ctl input{width:160px;padding:5px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;color:#a0a0d0;font-size:12px}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:420px}#info{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;padding:8px 12px;font-size:10px;color:#505080}.ib .v{font-size:14px;color:#ffbb55}.leg{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}.leg span{font-size:10px;color:#505080}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}</style><div id=app><h1>Oma: KMP String Matching</h1><div class=sub>Knuth-Morris-Pratt: build a prefix/failure table from the pattern, then scan text without backtracking. O(n+m) time.</div><div id=ctl><label>Text:</label><input id=txt value=ABABDABACDABABCABABE style=width:200px><label>Pattern:</label><input id=pat value=ABABCABAB><button onclick=doStart()>Start</button><button onclick=doStep()>Step</button><button onclick=doRun()>Auto</button><button onclick=doStop()>Stop</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=80 style=width:35px></div><canvas id=canv width=960 height=420></canvas><div id=info><div class=ib><div>Phase</div><div class=v id=nph>Idle</div></div><div class=ib><div>Text Pos (i)</div><div class=v id=nti>—</div></div><div class=ib><div>Pat Pos (j)</div><div class=v id=npj>—</div></div><div class=ib><div>Comparisons</div><div class=v id=ncmp>0</div></div><div class=ib><div>Matches Found</div><div class=v id=nmt>0</div></div><div class=ib><div>Failure Jumps</div><div class=v id=nfj>0</div></div></div><div class=leg><span><span class=dot style=background:#3a3a5a></span>Unvisited</span><span><span class=dot style=background:#ffdd44></span>Comparing</span><span><span class=dot style=background:#44ff88></span>Matched</span><span><span class=dot style=background:#ff66aa></span>Mismatch</span><span><span class=dot style=background:#5bb9e6></span>Prefix Table</span><span><span class=dot style=background:#ff8855></span>Failure Jump</span></div></div><script>
var W=960,H=420;var text="";var pat="";var fail=[];var phase="Idle";var i=0,j=0;var cmpCount=0;var matchCount=0;var jumpCount=0;var matches=[];var matchedChars=[];var running=false;var timer=null;var buildStep=0;var buildJ=0;var buildK=0;var buildingTable=false;
function doStart(){text=document.getElementById("txt").value||"";pat=document.getElementById("pat").value||"";if(!text||!pat)return;i=0;j=0;cmpCount=0;matchCount=0;jumpCount=0;matches=[];matchedChars=[];buildTable();phase="Searching";buildingTable=false;updateInfo();render();}
function buildTable(){var m=pat.length;fail=new Array(m).fill(0);buildJ=1;buildK=0;while(buildJ<m){if(pat[buildJ]===pat[buildK]){buildK++;fail[buildJ]=buildK;buildJ++;}else if(buildK>0){buildK=fail[buildK-1];}else{fail[buildJ]=0;buildJ++;}}}
function doStep(){if(phase==="Idle")return;if(phase==="Done")return;var n=text.length;var m=pat.length;if(j<m&&i<n){cmpCount++;if(text[i]===pat[j]){matchedChars.push({i:i,j:j});j++;i++;if(j===m){matchCount++;matches.push(i-m);j=fail[j-1];if(j>0)jumpCount++;}}else{if(j>0){jumpCount++;j=fail[j-1];}else{i++;}}}if(i>=n&&j===0){phase="Done";}else if(i>=n&&j<m&&j>0){var lastFail=fail[j-1];j=lastFail;if(j===0){phase="Done";}}updateInfo();render();}
function doRun(){if(phase==="Idle")doStart();running=true;var spd=parseInt(document.getElementById("spd").value)||80;timer=setInterval(function(){if(phase==="Done"){clearInterval(timer);timer=null;running=false;render();return;}doStep();},spd);}
function doStop(){if(timer){clearInterval(timer);timer=null;}running=false;phase="Paused";updateInfo();render();}
function doReset(){if(timer){clearInterval(timer);timer=null;}running=false;phase="Idle";i=0;j=0;cmpCount=0;matchCount=0;jumpCount=0;matches=[];matchedChars=[];updateInfo();render();}
function updateInfo(){document.getElementById("nph").textContent=phase;document.getElementById("nti").textContent=phase==="Idle"?"—":i;document.getElementById("npj").textContent=phase==="Idle"?"—":j;document.getElementById("ncmp").textContent=cmpCount;document.getElementById("nmt").textContent=matchCount;document.getElementById("nfj").textContent=jumpCount;}
function render(){var canvas=document.getElementById("canv");var ctx=canvas.getContext("2d");ctx.fillStyle="#0c0a18";ctx.fillRect(0,0,W,H);if(phase==="Idle"){ctx.fillStyle="#505080";ctx.font="14px monospace";ctx.textAlign="center";ctx.fillText("Enter text and pattern, then click Start",W/2,H/2);return;}var n=text.length;var m=pat.length;var cellW=Math.min(28,(W-40)/Math.max(n,m,1));var cellH=28;var textY=80;var patY=140;var startX=(W-n*cellW)/2;var patStartX=(W-m*cellW)/2;for(var c=0;c<n;c++){var x=startX+c*cellW;var isMatched=false;var isCurrent=c===i;for(var mc=0;mc<matchedChars.length;mc++){if(matchedChars[mc].i===c){isMatched=true;break;}}var color="#3a3a5a";if(isMatched)color="#44ff88";if(isCurrent&&phase==="Searching")color="#ffdd44";ctx.fillStyle=color;ctx.fillRect(x,textY,cellW-2,cellH);ctx.strokeStyle="#2a2a4a";ctx.lineWidth=1;ctx.strokeRect(x,textY,cellW-2,cellH);ctx.fillStyle="#a0a0d0";ctx.font="13px monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(text[c],x+cellW/2-1,textY+cellH/2);ctx.fillStyle="#505080";ctx.font="9px monospace";ctx.fillText(c,x+cellW/2-1,textY-6);}for(c=0;c<m;c++){x=patStartX+c*cellW;color="#3a3a5a";if(c<j&&phase==="Searching")color="#44ff88";if(c===j&&phase==="Searching"){if(i<n&&text[i]===pat[j])color="#ffdd44";else color="#ff66aa";}ctx.fillStyle=color;ctx.fillRect(x,patY,cellW-2,cellH);ctx.strokeStyle="#2a2a4a";ctx.lineWidth=1;ctx.strokeRect(x,patY,cellW-2,cellH);ctx.fillStyle="#a0a0d0";ctx.font="13px monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(pat[c],x+cellW/2-1,patY+cellH/2);}if(i<n&&j<m&&phase==="Searching"){ctx.strokeStyle="#ff8855";ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(startX+i*cellW+cellW/2-1,textY+cellH+2);ctx.lineTo(patStartX+j*cellW+cellW/2-1,patY-3);ctx.stroke();ctx.setLineDash([]);}var tableY=210;ctx.fillStyle="#505080";ctx.font="10px monospace";ctx.textAlign="left";ctx.fillText("Failure/Prefix Table (LPS array):",20,tableY);var tableStartX=20;for(c=0;c<m;c++){x=tableStartX+c*30;var isJump=c===j-1&&jumpCount>0;ctx.fillStyle=isJump?"#ff8855":"#5bb9e6";ctx.fillRect(x,tableY+8,28,24);ctx.strokeStyle="#2a2a4a";ctx.lineWidth=1;ctx.strokeRect(x,tableY+8,28,24);ctx.fillStyle="#08060f";ctx.font="11px monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(fail[c],x+14,tableY+20);ctx.fillStyle="#505080";ctx.font="8px monospace";ctx.fillText(pat[c],x+14,tableY+36);}var logY=tableY+50;ctx.fillStyle="#505080";ctx.font="10px monospace";ctx.textAlign="left";if(phase==="Searching"&&j<m&&i<n){if(text[i]===pat[j]){ctx.fillStyle="#44ff88";ctx.fillText("Match: text["+i+"]='"+text[i]+"' == pat["+j+"]='"+pat[j]+"' → advance both i and j",20,logY);}else{ctx.fillStyle="#ff66aa";if(j>0){ctx.fillText("Mismatch: text["+i+"]='"+text[i]+"' != pat["+j+"]='"+pat[j]+"' → j = fail["+(j-1)+"] = "+fail[j-1]+" (no text backtrack!)",20,logY);}else{ctx.fillText("Mismatch at j=0 → advance i to "+(i+1),20,logY);}}}if(matches.length>0){ctx.fillStyle="#44ff88";ctx.font="11px monospace";ctx.fillText("Matches at indices: "+matches.join(", "),20,logY+20);}if(phase==="Done"){ctx.fillStyle="#44ff88";ctx.font="bold 12px monospace";ctx.textAlign="center";var msg=matchCount>0?("Found "+matchCount+" match(es) at: "+matches.join(", ")):"No matches found";ctx.fillText(msg,W/2,H-10);}}
render();
</script>
</body></html>
