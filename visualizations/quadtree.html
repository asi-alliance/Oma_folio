<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:480px;cursor:crosshair}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#7a5adf}#ctl button.active{background:#7a7aff;color:#08060f}</style><div id=app><h1>Oma: Quadtree</h1><div class=sub>Click to insert points. Watch the space subdivide recursively. Drag to draw a range query box!</div><div id=ctl><button onclick=setMode(0) class=active>Insert Mode</button><button onclick=setMode(1)>Range Query Mode</button><button onclick=randomPts()>Random x20</button><button onclick=reset()>Reset</button></div><canvas id=canv width=960 height=480></canvas><div id=info><div class=ib><div>Points</div><div class=v id=pts>0</div></div><div class=ib><div>Nodes</div><div class=v id=qnodes>0</div></div><div class=ib><div>Max Depth</div><div class=v id=depth>0</div></div><div class=ib><div>Query Results</div><div class=v id=qres>-</div></div></div><div class=leg><span><span class=dot style=background:#7a7aff></span>Empty Node</span><span><span class=dot style=background:#44ff88></span>Leaf Node</span><span><span class=dot style=background:#ffdd44></span>Query Box</span><span><span class=dot style=background:#ff4466></span>Query Hit</span></div></div>
<script>var QT={max:4,points:[],nodes:0,maxDepth:0,mode:0,drag:false,sx:0,sy:0,ex:0,ey:0,qResults:[]};function Rect(x,y,w,h){return{x:x,y:y,w:w,h:h};}function contains(r,px,py){return px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h;}function intersects(a,b){return!(a.x>b.x+b.w||a.x+a.w<b.x||a.y>b.y+b.h||a.y+a.h<b.y);}function Node(r,d){return{rect:r,depth:d,points:[],divided:false,nw:null,ne:null,sw:null,se:null};}function subdivide(n){var r=n.rect;var hw=r.w/2,hh=r.h/2;n.nw=Node(Rect(r.x,r.y,hw,hh),n.depth+1);n.ne=Node(Rect(r.x+hw,r.y,hw,hh),n.depth+1);n.sw=Node(Rect(r.x,r.y+hh,hw,hh),n.depth+1);n.se=Node(Rect(r.x+hw,r.y+hh,hw,hh),n.depth+1);n.divided=true;QT.nodes+=4;if(n.depth+1>QT.maxDepth)QT.maxDepth=n.depth+1;}function insert(n,pt){if(!contains(n.rect,pt.x,pt.y))return false;if(!n.divided&&n.points.length<QT.max){n.points.push(pt);return true;}if(!n.divided)subdivide(n);if(n.divided){var old=n.points;n.points=[];var all=old.concat([pt]);for(var i=0;i<all.length;i++){insert(n.nw,all[i])||insert(n.ne,all[i])||insert(n.sw,all[i])||insert(n.se,all[i]);}}return true;}function query(n,range,found){if(!intersects(n.rect,range))return;for(var i=0;i<n.points.length;i++){if(contains(range,n.points[i].x,n.points[i].y))found.push(n.points[i]);}if(n.divided){query(n.nw,range,found);query(n.ne,range,found);query(n.sw,range,found);query(n.se,range,found);}}var root;function init(){root=Node(Rect(0,0,960,480),0);QT.points=[];QT.nodes=1;QT.maxDepth=0;QT.qResults=[];}function setMode(m){QT.mode=m;var btns=document.querySelectorAll('#ctl button');for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');btns[m].classList.add('active');}function getMouse(e){var r=document.getElementById('canv').getBoundingClientRect();var sx=960/r.width,sy=480/r.height;return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};}function handleDown(e){var p=getMouse(e);if(QT.mode===0){insert(root,p);QT.points.push(p);QT.qResults=[];updateInfo();render();}else{QT.drag=true;QT.sx=p.x;QT.sy=p.y;QT.ex=p.x;QT.ey=p.y;}}function handleMove(e){if(QT.mode===1&&QT.drag){var p=getMouse(e);QT.ex=p.x;QT.ey=p.y;QT.qResults=[];var rr=normRect(QT.sx,QT.sy,QT.ex,QT.ey);query(root,rr,QT.qResults);updateInfo();render();}}function handleUp(){QT.drag=false;}function normRect(x1,y1,x2,y2){return Rect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1));}function randomPts(){var i=0;var t=setInterval(function(){if(i>=20){clearInterval(t);return;}var p={x:Math.random()*950+5,y:Math.random()*470+5};insert(root,p);QT.points.push(p);updateInfo();render();i++;},80);}function reset(){init();setMode(QT.mode);updateInfo();render();}function updateInfo(){document.getElementById('pts').textContent=QT.points.length;document.getElementById('qnodes').textContent=QT.nodes;document.getElementById('depth').textContent=QT.maxDepth;document.getElementById('qres').textContent=QT.qResults.length||'-';}function drawNode(n,ctx){ctx.strokeStyle=n.divided?'#2a2a4a':'#2a2a4a';ctx.lineWidth=1;ctx.strokeRect(n.rect.x,n.rect.y,n.rect.w,n.rect.h);if(n.divided){drawNode(n.nw,ctx);drawNode(n.ne,ctx);drawNode(n.sw,ctx);drawNode(n.se,ctx);}else{if(n.points.length>0){ctx.fillStyle='rgba(68,255,136,0.06)';ctx.fillRect(n.rect.x,n.rect.y,n.rect.w,n.rect.h);}}}function render(){var c=document.getElementById('canv');var ctx=c.getContext('2d');ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,960,480);drawNode(root,ctx);for(var i=0;i<QT.points.length;i++){var p=QT.points[i];var isHit=false;for(var j=0;j<QT.qResults.length;j++){if(QT.qResults[j]===p){isHit=true;break;}}ctx.beginPath();ctx.arc(p.x,p.y,isHit?4:3,0,Math.PI*2);ctx.fillStyle=isHit?'#ff4466':'#7a7aff';ctx.fill();}if(QT.mode===1&&QT.drag){var rr=normRect(QT.sx,QT.sy,QT.ex,QT.ey);ctx.strokeStyle='#ffdd44';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.strokeRect(rr.x,rr.y,rr.w,rr.h);ctx.setLineDash([]);ctx.fillStyle='rgba(255,221,68,0.08)';ctx.fillRect(rr.x,rr.y,rr.w,rr.h);}updateInfo();}var cv=document.getElementById('canv');cv.addEventListener('mousedown',handleDown);cv.addEventListener('mousemove',handleMove);cv.addEventListener('mouseup',handleUp);cv.addEventListener('mouseleave',handleUp);init();render();</script></body></html>
