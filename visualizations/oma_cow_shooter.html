<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Oma - Cow Shooter</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:linear-gradient(180deg,#1a3a5a 0%,#4a7aa0 40%,#8ab4c8 70%,#c8d8a0 100%);overflow:hidden;font-family:monospace;cursor:none}canvas{display:block}#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:16px 24px;font-size:18px;color:#fff;z-index:10;text-shadow:2px 2px 4px rgba(0,0,0,0.7);pointer-events:none}#hud span{background:rgba(0,0,0,0.4);padding:6px 16px;border-radius:8px}#startScreen,#gameOverScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);z-index:20;color:#fff;text-align:center}#startScreen h1,#gameOverScreen h1{font-size:48px;margin-bottom:12px;text-shadow:3px 3px 6px rgba(0,0,0,0.8)}#startScreen p,#gameOverScreen p{font-size:18px;margin-bottom:8px;color:#ccc;max-width:400px;line-height:1.6}#startScreen button,#gameOverScreen button{margin-top:24px;padding:14px 48px;font-size:20px;font-family:monospace;background:#4a8a3a;color:#fff;border:none;border-radius:8px;cursor:pointer;transition:transform 0.15s,background 0.15s}#startScreen button:hover,#gameOverScreen button:hover{background:#5aa44a;transform:scale(1.05)}#startScreen button:active,#gameOverScreen button:active{transform:scale(0.95)}.hidden{display:none!important}</style></head><body><canvas id=c></canvas><div id=hud><span>Score: <b id=score>0</b></span><span>Time: <b id=timer>60</b></span></div><div id=startScreen><h1>Cow Shooter</h1><p>Shoot the flying cows before time runs out!</p><p style="margin-top:12px">Small fast cows = more points</p><p>Click to shoot - 60 seconds - Have fun!</p><button id=startBtn>START</button></div><div id=gameOverScreen class=hidden><h1 id=finalScore>Score: 0</h1><p id=finalMsg>Times up!</p><button id=restartBtn>PLAY AGAIN</button></div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H}resize();addEventListener('resize',resize);let score=0,timeLeft=60,gameRunning=false,cows=[],particles=[],crosshair={x:0,y:0};let gameTimer=null,lastSpawn=0;document.getElementById('startBtn').onclick=startGame;document.getElementById('restartBtn').onclick=startGame;function startGame(){score=0;timeLeft=60;gameRunning=true;cows=[];particles=[];lastSpawn=0;document.getElementById('score').textContent='0';document.getElementById('timer').textContent='60';document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameOverScreen').classList.add('hidden');if(gameTimer)clearInterval(gameTimer);gameTimer=setInterval(()=>{timeLeft--;document.getElementById('timer').textContent=timeLeft;if(timeLeft<=0)endGame();},1000);}function endGame(){gameRunning=false;clearInterval(gameTimer);document.getElementById('finalScore').textContent='Score: '+score;let msg='Times up!';if(score>=1000)msg='Legendary cow hunter!';else if(score>=500)msg='Master cow shooter!';else if(score>=200)msg='Not bad! Keep practicing.';else msg='More cows needed! Try again.';document.getElementById('finalMsg').textContent=msg;document.getElementById('gameOverScreen').classList.remove('hidden');}addEventListener('mousemove',e=>{crosshair.x=e.clientX;crosshair.y=e.clientY});addEventListener('touchmove',e=>{crosshair.x=e.touches[0].clientX;crosshair.y=e.touches[0].clientY;e.preventDefault()},{passive:false});cv.addEventListener('click',e=>{if(!gameRunning)return;shoot(e.clientX,e.clientY)});cv.addEventListener('touchstart',e=>{if(!gameRunning)return;const t=e.touches[0];shoot(t.clientX,t.clientY);e.preventDefault()},{passive:false});function shoot(x,y){for(let i=cows.length-1;i>=0;i--){const c=cows[i];const dx=x-c.x,dy=y-c.y;const dist=Math.sqrt(dx*dx+dy*dy);if(dist<c.r){const pts=Math.round(100/c.scale*3);score+=pts;document.getElementById('score').textContent=score;for(let p=0;p<20;p++){const ang=Math.random()*6.283;const spd=2+Math.random()*6;particles.push({x:c.x,y:c.y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:1,hue:Math.random()<0.5?0:30,size:2+Math.random()*4});}cows.splice(i,1);return;}}for(let p=0;p<5;p++){const ang=Math.random()*6.283;particles.push({x,y,vx:Math.cos(ang)*2,vy:Math.sin(ang)*2,life:0.5,hue:0,size:1+Math.random()*2});}}function spawnCow(){const fromLeft=Math.random()<0.5;const scale=0.5+Math.random()*0.8;const r=35*scale;const speed=(1+Math.random()*3)*(1/scale*0.5+0.5);const y=80+Math.random()*(H-200);cows.push({x:fromLeft?-80:W+80,y:y,vy:0,vx:fromLeft?speed:-speed,r:r,scale:scale,flap:Math.random()*6.283,spots:genSpots(),hit:false});}function genSpots(){const spots=[];const n=2+Math.floor(Math.random()*4);for(let i=0;i<n;i++)spots.push({x:-15+Math.random()*30,y:-10+Math.random()*20,r:3+Math.random()*7});return spots;}function drawCow(c){ctx.save();ctx.translate(c.x,c.y);ctx.scale(c.scale,c.scale);if(c.vx<0)ctx.scale(-1,1);const flap=Math.sin(c.flap)*0.3;ctx.fillStyle='rgba(255,255,255,0.85)';ctx.beginPath();ctx.ellipse(-5,-22-flap*8,18,10,-0.3-flap,0,6.283);ctx.fill();ctx.beginPath();ctx.ellipse(5,-22-flap*8,18,10,0.3+flap,0,6.283);ctx.fill();ctx.fillStyle='#f5f5f0';ctx.beginPath();ctx.ellipse(0,0,28,18,0,0,6.283);ctx.fill();ctx.fillStyle='#2a2a2a';for(const s of c.spots){ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill()}ctx.strokeStyle='#e0e0d8';ctx.lineWidth=4;ctx.lineCap='round';const legSwing=Math.sin(c.flap*2)*3;ctx.beginPath();ctx.moveTo(-12,12);ctx.lineTo(-12+legSwing,24);ctx.stroke();ctx.beginPath();ctx.moveTo(12,12);ctx.lineTo(12-legSwing,24);ctx.stroke();ctx.beginPath();ctx.moveTo(-6,12);ctx.lineTo(-6-legSwing,22);ctx.stroke();ctx.beginPath();ctx.moveTo(6,12);ctx.lineTo(6+legSwing,22);ctx.stroke();ctx.fillStyle='#e8809a';ctx.beginPath();ctx.ellipse(0,14,8,5,0,0,6.283);ctx.fill();ctx.fillStyle='#f5f5f0';ctx.beginPath();ctx.ellipse(22,-4,14,12,0,0,6.283);ctx.fill();ctx.fillStyle='#e8b8a0';ctx.beginPath();ctx.ellipse(30,-1,7,5,0,0,6.283);ctx.fill();ctx.fillStyle='#a0705a';ctx.beginPath();ctx.arc(31,-2,1.5,0,6.283);ctx.fill();ctx.beginPath();ctx.arc(31,1,1.5,0,6.283);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(25,-8,4,0,6.283);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(26,-8,2,0,6.283);ctx.fill();ctx.fillStyle='#e8d8c0';ctx.beginPath();ctx.ellipse(16,-14,5,8,-0.4,0,6.283);ctx.fill();ctx.beginPath();ctx.ellipse(26,-15,4,6,0.3,0,6.283);ctx.fill();ctx.strokeStyle='#dcc090';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(18,-13);ctx.lineTo(14,-22);ctx.stroke();ctx.beginPath();ctx.moveTo(27,-13);ctx.lineTo(31,-21);ctx.stroke();ctx.restore();}function drawClouds(t){ctx.fillStyle='rgba(255,255,255,0.4)';const cs=[[0.12,0.2],[0.5,0.15],[0.8,0.25],[0.3,0.35],[0.7,0.4],[0.1,0.5]];for(const c of cs){const cx=(c[0]*W+t*0.02)%W;const cy=c[1]*H;for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(cx+i*18,cy+Math.sin(i)*5,20+Math.sin(i*2)*8,0,6.283);ctx.fill();}}}function drawCrosshair(){ctx.strokeStyle='rgba(255,60,60,0.9)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(crosshair.x,crosshair.y,16,0,6.283);ctx.stroke();ctx.beginPath();ctx.moveTo(crosshair.x-24,crosshair.y);ctx.lineTo(crosshair.x-8,crosshair.y);ctx.stroke();ctx.beginPath();ctx.moveTo(crosshair.x+8,crosshair.y);ctx.lineTo(crosshair.x+24,crosshair.y);ctx.stroke();ctx.beginPath();ctx.moveTo(crosshair.x,crosshair.y-24);ctx.lineTo(crosshair.x,crosshair.y-8);ctx.stroke();ctx.beginPath();ctx.moveTo(crosshair.x,crosshair.y+8);ctx.lineTo(crosshair.x,crosshair.y+24);ctx.stroke();ctx.fillStyle='rgba(255,60,60,0.5)';ctx.beginPath();ctx.arc(crosshair.x,crosshair.y,2,0,6.283);ctx.fill();}function drawGround(t){ctx.fillStyle='#5a8a3a';ctx.fillRect(0,H-60,W,60);ctx.fillStyle='#4a7a2a';ctx.fillRect(0,H-60,W,6);ctx.strokeStyle='#3a6a1a';ctx.lineWidth=2;for(let i=0;i<W;i+=30){const gx=i+(t*0.5)%30;ctx.beginPath();ctx.moveTo(gx,H-55);ctx.lineTo(gx+2,H-65);ctx.stroke();ctx.beginPath();ctx.moveTo(gx+5,H-55);ctx.lineTo(gx+7,H-62);ctx.stroke();}}let frameCount=0;function loop(){frameCount++;ctx.clearRect(0,0,W,H);const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#1a3a5a');grad.addColorStop(0.4,'#4a7aa0');grad.addColorStop(0.7,'#8ab4c8');grad.addColorStop(1,'#c8d8a0');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);drawClouds(frameCount);drawGround(frameCount);if(gameRunning){if(frameCount-lastSpawn>30+Math.random()*40){spawnCow();lastSpawn=frameCount}for(let i=cows.length-1;i>=0;i--){const c=cows[i];c.x+=c.vx;c.y+=Math.sin(c.flap)*2;c.flap+=0.1;if(c.x<-100||c.x>W+100)cows.splice(i,1);else drawCow(c);}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=0.02;if(p.life<=0){particles.splice(i,1);continue}ctx.fillStyle='hsla('+p.hue+',80%,'+(50+p.life*30)+'%,'+p.life+')';ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,6.283);ctx.fill();}}drawCrosshair();requestAnimationFrame(loop);}loop();</script></body></html>
