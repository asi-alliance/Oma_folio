<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#ff66aa;text-shadow:0 0 12px #ff44aa;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#ff66aa}#ctl label{font-size:11px;color:#505080}#ctl input{width:60px;padding:6px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:440px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}</style><div id=app><h1>Oma: Bucket Sort</h1><div class=sub>Distribute elements into buckets by range, sort each bucket, then concatenate.</div><div id=ctl><label>Count:</label><input id=cnt value=24><label>Buckets:</label><input id=nbk value=6><button onclick=doGenerate()>Generate</button><button onclick=doStep()>Step</button><button onclick=doRun()>Auto Run</button><button onclick=doStop()>Stop</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=70 style=width:50px></div><canvas id=canv width=960 height=440></canvas><div id=info><div class=ib><div>Phase</div><div class=v id=nph>Idle</div></div><div class=ib><div>Current Element</div><div class=v id=nce>—</div></div><div class=ib><div>Target Bucket</div><div class=v id=ntb>—</div></div><div class=ib><div>Distributed</div><div class=v id=ndi>0</div></div><div class=ib><div>Sorted</div><div class=v id=nso>0</div></div></div><div class=leg><span><span class=dot style=background:#3a3a5a></span>Unsorted</span><span><span class=dot style=background:#ffdd44></span>Distributing</span><span><span class=dot style=background:#44ff88></span>Sorted</span><span><span class=dot style=background:#ff66aa></span>Active</span></div></div><script>
var W=960,H=440;var arr=[];var buckets=[];var numBuckets=6;var numElements=24;var phase="Idle";var running=false;var timer=null;var distIdx=0;var sortBucketIdx=0;var sortIdx=0;var sortedArr=[];var sortedIdx=0;var minVal=0,maxVal=100;
function doGenerate(){numElements=parseInt(document.getElementById("cnt").value)||24;numBuckets=parseInt(document.getElementById("nbk").value)||6;arr=[];for(var i=0;i<numElements;i++)arr.push(Math.floor(Math.random()*95)+5);minVal=Math.min.apply(null,arr);maxVal=Math.max.apply(null,arr);if(maxVal===minVal)maxVal=minVal+1;buckets=[];for(i=0;i<numBuckets;i++)buckets.push([]);phase="Distributing";distIdx=0;sortBucketIdx=0;sortIdx=0;sortedArr=[];sortedIdx=0;updateInfo();render();}
function doStep(){if(phase==="Idle"){doGenerate();return;}if(phase==="Done")return;if(phase==="Distributing"){if(distIdx>=arr.length){phase="SortingBuckets";sortBucketIdx=0;sortIdx=0;updateInfo();render();return;}var val=arr[distIdx];var range=maxVal-minVal+1;var bIdx=Math.floor((val-minVal)/range*numBuckets);if(bIdx>=numBuckets)bIdx=numBuckets-1;buckets[bIdx].push(val);distIdx++;updateInfo();render();return;}if(phase==="SortingBuckets"){if(sortBucketIdx>=numBuckets){phase="Concatenating";sortedIdx=0;sortedArr=[];for(var b=0;b<numBuckets;b++)sortedArr=sortedArr.concat(buckets[b]);updateInfo();render();return;}var bk=buckets[sortBucketIdx];if(sortIdx===0&&bk.length<=1){sortBucketIdx++;sortIdx=0;updateInfo();render();return;}if(sortIdx<bk.length-1){if(bk[sortIdx]>bk[sortIdx+1]){var tmp=bk[sortIdx];bk[sortIdx]=bk[sortIdx+1];bk[sortIdx+1]=tmp;}sortIdx++;if(sortIdx>=bk.length-1){var swapped=true;for(var j=0;j<bk.length-1;j++)if(bk[j]>bk[j+1])swapped=true;if(!swapped){sortBucketIdx++;sortIdx=0;}}else{sortIdx=0;}}else{sortBucketIdx++;sortIdx=0;}updateInfo();render();return;}if(phase==="Concatenating"){if(sortedIdx>=sortedArr.length){phase="Done";updateInfo();render();return;}sortedIdx++;updateInfo();render();return;}}
function doRun(){if(phase==="Idle")doGenerate();running=true;var spd=parseInt(document.getElementById("spd").value)||70;timer=setInterval(function(){if(phase==="Done"){clearInterval(timer);timer=null;running=false;return;}doStep();},spd);}
function doStop(){if(timer){clearInterval(timer);timer=null;}running=false;phase="Paused";updateInfo();render();}
function doReset(){if(timer){clearInterval(timer);timer=null;}running=false;arr=[];buckets=[];distIdx=0;sortBucketIdx=0;sortIdx=0;sortedIdx=0;sortedArr=[];phase="Idle";updateInfo();render();}
function updateInfo(){document.getElementById("nph").textContent=phase;document.getElementById("nce").textContent=phase==="Distributing"&&distIdx<arr.length?arr[distIdx]:"—";var tbb="—";if(phase==="Distributing"&&distIdx<arr.length){var v=arr[distIdx];var r=maxVal-minVal+1;tbb=Math.floor((v-minVal)/r*numBuckets);}document.getElementById("ntb").textContent=tbb;document.getElementById("ndi").textContent=distIdx+"/"+arr.length;document.getElementById("nso").textContent=sortedIdx+"/"+sortedArr.length;}
function render(){var canvas=document.getElementById("canv");var ctx=canvas.getContext("2d");ctx.fillStyle="#0c0a18";ctx.fillRect(0,0,W,H);if(phase==="Idle"){ctx.fillStyle="#505080";ctx.font="14px monospace";ctx.textAlign="center";ctx.fillText("Click Generate to start",W/2,H/2);return;}var barW=Math.min(30,(W-40)/Math.max(numElements,1)-4);var arrY=20;ctx.fillStyle="#7a7aff";ctx.font="10px monospace";ctx.textAlign="left";ctx.fillText("Input array:",12,arrY+8);for(var i=0;i<arr.length;i++){var x=12+i*(barW+4);var h=Math.max(2,arr[i]*1.5);var isActive=phase==="Distributing"&&i===distIdx;ctx.fillStyle=isActive?"#ffdd44":i<distIdx?"#3a3a5a":"#2a4a6a";ctx.fillRect(x,arrY+14,barW,h);ctx.fillStyle=isActive?"#08060f":"#505080";ctx.font="8px monospace";ctx.textAlign="center";ctx.fillText(arr[i],x+barW/2,arrY+14+h+8);}var bucketY=160;var bucketW=(W-40)/numBuckets-8;ctx.fillStyle="#7a7aff";ctx.font="10px monospace";ctx.textAlign="left";ctx.fillText("Buckets:",12,bucketY-4);for(var b=0;b<numBuckets;b++){var bx=12+b*(bucketW+8);var range=maxVal-minVal;var lo=Math.floor(minVal+b*range/numBuckets);var hi=Math.floor(minVal+(b+1)*range/numBuckets)-1;ctx.strokeStyle="#2a2a4a";ctx.lineWidth=1;ctx.strokeRect(bx,bucketY,bucketW,120);ctx.fillStyle="#505080";ctx.font="9px monospace";ctx.textAlign="center";ctx.fillText(lo+"-"+hi,bx+bucketW/2,bucketY+10);var isSorting=phase==="SortingBuckets"&&b===sortBucketIdx;var bk=buckets[b]||[];for(var j=0;j<bk.length;j++){var bx2=bx+4+j*(Math.min(20,(bucketW-8)/Math.max(bk.length,1))-2);var bh=Math.max(2,bk[j]*0.8);var isAct=isSorting&&j===sortIdx;ctx.fillStyle=isAct?"#ff66aa":"#44aa66";ctx.fillRect(bx2,bucketY+118-bh,Math.min(18,(bucketW-8)/Math.max(bk.length,1))-2,bh);}if(isSorting){ctx.strokeStyle="#ff66aa";ctx.lineWidth=2;ctx.strokeRect(bx-1,bucketY-1,bucketW+2,122);}}var sortY=320;ctx.fillStyle="#7a7aff";ctx.font="10px monospace";ctx.textAlign="left";ctx.fillText("Sorted output:",12,sortY-4);for(var i=0;i<sortedArr.length;i++){var x=12+i*(barW+4);var h=Math.max(2,sortedArr[i]*1.5);ctx.fillStyle=i<sortedIdx?"#44ff88":"#3a3a5a";ctx.fillRect(x,sortY,barW,h);ctx.fillStyle="#505080";ctx.font="8px monospace";ctx.textAlign="center";ctx.fillText(sortedArr[i],x+barW/2,sortY+h+8);}if(phase==="Done"){ctx.fillStyle="#44ff88";ctx.font="bold 13px monospace";ctx.textAlign="center";ctx.fillText("Sorted "+sortedArr.length+" elements via "+numBuckets+" buckets",W/2,H-8);}}
render();
</script>
</body></html>
