<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl input{width:140px;padding:8px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#7a5adf}#ctl button.active{background:#7a7aff;color:#08060f}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:440px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}#ac{margin-top:12px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:12px;font-size:13px;min-height:40px}.ac-title{color:#505080;font-size:11px;margin-bottom:6px}.ac-word{display:inline-block;padding:4px 10px;margin:3px;background:#1a1a28;border:1px solid #2a2a4a;border-radius:6px;color:#7a7aff;cursor:pointer}.ac-word:hover{background:#2a2a4e}.ac-word.hl{background:#7a7aff;color:#08060f}</style><div id=app><h1>Oma: Trie (Prefix Tree)</h1><div class=sub>Insert words to build a prefix tree. Search for exact words, or type a prefix for live autocomplete!</div><div id=ctl><input id=inp placeholder="Word" value="apple"><button onclick=doInsert() class=active>Insert</button><button onclick=doSearch()>Search</button><button onclick=doAuto()>Autocomplete</button><button onclick=doRandom()>Random x5</button><button onclick=doReset()>Reset</button></div><canvas id=canv width=960 height=440></canvas><div id=info><div class=ib><div>Words</div><div class=v id=wc>0</div></div><div class=ib><div>Nodes</div><div class=v id=nc>0</div></div><div class=ib><div>Depth</div><div class=v id=dc>0</div></div><div class=ib><div>Last Op</div><div class=v id=lo>-</div></div></div><div class=leg><span><span class=dot style=background:#2a2a4a></span>Internal Node</span><span><span class=dot style=background:#44ff88></span>Word End</span><span><span class=dot style=background:#ffdd44></span>Visited</span><span><span class=dot style=background:#ff4466></span>Found</span></div><div id=ac><div class=ac-title>Autocomplete suggestions will appear here...</div></div></div>
<script>var T={root:{ch:{},end:false,parent:null,char:''},words:[],nodes:1,maxD:0,visited:[],found:null,acResults:[]};function insert(word){var node=T.root;for(var i=0;i<word.length;i++){var c=word[i];if(!node.ch[c]){node.ch[c]={ch:{},end:false,parent:node,char:c};T.nodes++;}node=node.ch[c];}node.end=true;if(T.words.indexOf(word)===-1)T.words.push(word);var d=0;var p=node;while(p.parent){d++;p=p.parent;}if(d>T.maxD)T.maxD=d;}function search(word){T.visited=[];T.found=null;var node=T.root;T.visited.push(node);for(var i=0;i<word.length;i++){var c=word[i];if(!node.ch[c]){return false;}node=node.ch[c];T.visited.push(node);}if(node.end)T.found=node;return node.end;}function autocomplete(prefix){T.visited=[];T.acResults=[];var node=T.root;for(var i=0;i<prefix.length;i++){var c=prefix[i];if(!node.ch[c])return[];node=node.ch[c];T.visited.push(node);}collect(node,prefix,T.acResults);return T.acResults;}function collect(node,prefix,arr){if(arr.length>=10)return;if(node.end)arr.push(prefix);for(var c in node.ch){collect(node.ch[c],prefix+c,arr);}}function getTreeData(){var nodes=[],edges=[];var id=0;function walk(node,parent,depth){node._id=id++;nodes.push({id:node._id,char:node.char||'root',end:node.end,depth:depth,parent:parent?parent._id:-1});if(parent)edges.push({a:parent._id,b:node._id});for(var c in node.ch){walk(node.ch[c],node,depth+1);}}walk(T.root,null,0);return{nodes:nodes,edges:edges};}function layoutTree(data){var pos={};var x=0;var W=960,H=440;function assign(node){var children=[];for(var i=0;i<data.edges.length;i++){if(data.edges[i].a===node.id){for(var j=0;j<data.nodes.length;j++){if(data.nodes[j].id===data.edges[i].b)children.push(data.nodes[j]);}}}if(children.length===0){pos[node.id]={x:x*60+40,y:30+node.depth*60};x++;return;}for(var i=0;i<children.length;i++)assign(children[i]);pos[node.id]={x:(pos[children[0].id].x+pos[children[children.length-1].id].x)/2,y:30+node.depth*60};}assign(data.nodes[0]);var maxX=x*60;if(maxX>920){for(var k in pos)pos[k].x=pos[k].x*920/maxX;}return pos;}function render(){var c=document.getElementById('canv');var ctx=c.getContext('2d');ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,960,440);var data=getTreeData();var pos=layoutTree(data);var visitedSet={};T.visited.forEach(function(v){if(v._id!==undefined)visitedSet[v._id]=true;});for(var i=0;i<data.edges.length;i++){var a=pos[data.edges[i].a],b=pos[data.edges[i].b];if(!a||!b)continue;ctx.strokeStyle='#2a2a4a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}for(i=0;i<data.nodes.length;i++){var n=data.nodes[i];var p=pos[n.id];if(!p)continue;var isVisited=visitedSet[n.id];var isFound=T.found===null?false:(function(){var f=false;var fp=T.found;while(fp){if(fp._id===n.id){f=true;break;}fp=fp.parent;}return f;})();var col=n.end?(isFound?'#ff4466':'#44ff88'):(isVisited?'#ffdd44':'#7a7aff');ctx.beginPath();ctx.arc(p.x,p.y,16,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='#0c0a18';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#08060f';ctx.font='12px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.char==='root'?'R':n.char,p.x,p.y);}updateInfo();}function updateInfo(){document.getElementById('wc').textContent=T.words.length;document.getElementById('nc').textContent=T.nodes;document.getElementById('dc').textContent=T.maxD;}function doInsert(){var w=document.getElementById('inp').value.toLowerCase().replace(/[^a-z]/g,'');if(!w)return;insert(w);document.getElementById('lo').textContent='Inserted: '+w;render();}function doSearch(){var w=document.getElementById('inp').value.toLowerCase().replace(/[^a-z]/g,'');if(!w)return;var found=search(w);document.getElementById('lo').textContent=found?'Found: '+w:'Not found: '+w;render();}function doAuto(){var w=document.getElementById('inp').value.toLowerCase().replace(/[^a-z]/g,'');if(!w){document.getElementById('ac').innerHTML='<div class=ac-title>Type a prefix first</div>';return;}var results=autocomplete(w);var html='<div class=ac-title>'+results.length+' suggestions for "_'+w+'_"</div>';for(var i=0;i<results.length;i++){html+='<span class=ac-word'+(i===0?' hl':'')+' onclick="document.getElementById(\'inp\').value=\''+results[i]+'\';doSearch();">'+results[i]+'</span>';}document.getElementById('ac').innerHTML=html;document.getElementById('lo').textContent='Autocomplete: '+w;render();}function doRandom(){var words=['cat','car','card','care','cart','dog','dot','do','apple','app','apply','ape','bad','bat','bath'];var used=[];var i=0;var t=setInterval(function(){if(i>=5||used.length>=words.length){clearInterval(t);return;}var w=words[Math.floor(Math.random()*words.length)];if(used.indexOf(w)===-1){used.push(w);insert(w);render();}i++;},500);document.getElementById('lo').textContent='Random insert...';}function doReset(){T={root:{ch:{},end:false,parent:null,char:''},words:[],nodes:1,maxD:0,visited:[],found:null,acResults:[]};document.getElementById('ac').innerHTML='<div class=ac-title>Autocomplete suggestions will appear here...</div>';document.getElementById('lo').textContent='Reset';render();}insert('cat');insert('car');insert('card');insert('care');insert('cart');render();</script></body></html>
