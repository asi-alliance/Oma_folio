<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl input{width:100px;padding:8px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#7a5adf}#ctl button.active{background:#7a7aff;color:#08060f}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:420px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}</style><div id=app><h1>Oma: Skip List</h1><div class=sub>Probabilistic data structure with multi-level linked lists for O(log n) search. Insert numbers and watch them climb levels!</div><div id=ctl><input id=inp placeholder="Number" type=number value=42><button onclick=doInsert() class=active>Insert</button><button onclick=doSearch()>Search</button><button onclick=doRandom()>Random x5</button><button onclick=doReset()>Reset</button></div><canvas id=canv width=960 height=420></canvas><div id=info><div class=ib><div>Nodes</div><div class=v id=nodes>0</div></div><div class=ib><div>Max Level</div><div class=v id=maxlvl>0</div></div><div class=ib><div>Last Op</div><div class=v id=lastop>-</div></div><div class=ib><div>Comparisons</div><div class=v id=compares>0</div></div></div><div class=leg><span><span class=dot style=background:#7a7aff></span>Node</span><span><span class=dot style=background:#ffdd44></span>Visited</span><span><span class=dot style=background:#ff4466></span>Found</span><span><span class=dot style=background:#44ff88></span>Path</span></div></div>
<script>var SL={maxLevel:6,prob:0.5,head:null,nodes:0,maxUsed:0,phase:idle,timer:null,visited:[],found:null,path:[],comparisons:0};function createNode(val,level){var n={val:val,forward:new Array(level+1).fill(null),level:level};return n;}function randomLevel(){var lvl=0;while(Math.random()<SL.prob&&lvl<SL.maxLevel)lvl++;return lvl;}function init(){SL.head=createNode(-Infinity,SL.maxLevel);SL.nodes=0;SL.maxUsed=0;render();}function search(val,animate){SL.visited=[];SL.found=null;SL.path=[];SL.comparisons=0;var cur=SL.head;var lvl=SL.maxLevel;var update=[];while(lvl>=0){if(cur.forward[lvl]&&cur.forward[lvl].val<val){SL.comparisons++;if(cur.val!==-Infinity)SL.visited.push({node:cur,level:lvl});cur=cur.forward[lvl];}else{SL.comparisons++;if(cur.forward[lvl]&&cur.forward[lvl].val===val){SL.found=cur.forward[lvl];SL.visited.push({node:cur.forward[lvl],level:lvl});}if(cur.val!==-Infinity)SL.path.push({node:cur,level:lvl});update[lvl]=cur;lvl--;}}if(animate)animateSearch(update,val);return{update:update,found:SL.found};}function animateSearch(update,val){var steps=[];var cur=SL.head;var lvl=SL.maxLevel;while(lvl>=0){while(cur.forward[lvl]&&cur.forward[lvl].val<val){steps.push({type:visit,node:cur.forward[lvl],level:lvl});cur=cur.forward[lvl];}if(cur.forward[lvl]&&cur.forward[lvl].val===val){steps.push({type:found,node:cur.forward[lvl],level:lvl});}steps.push({type:drop,node:cur,level:lvl});lvl--;}var idx=0;SL.visited=[];SL.found=null;SL.path=[];SL.timer=setInterval(function(){if(idx>=steps.length){clearInterval(SL.timer);updateInfo();render();return;}var s=steps[idx];if(s.type===visit||s.type===found){SL.visited.push({node:s.node,level:s.level});if(s.type===found)SL.found=s.node;}else if(s.type===drop){SL.path.push({node:s.node,level:s.level});}render();idx++;},200);}function insert(val){clearInterval(SL.timer);var res=search(val,false);if(res.found){document.getElementById(lastop).textContent=Exists: +val;return;}var lvl=randomLevel();var node=createNode(val,lvl);for(var i=0;i<=lvl;i++){node.forward[i]=res.update[i].forward[i];res.update[i].forward[i]=node;}SL.nodes++;if(lvl>SL.maxUsed)SL.maxUsed=lvl;SL.visited=[{node:node,level:lvl}];SL.found=node;SL.path=[];document.getElementById(lastop).textContent=Inserted: +val+ (L+lvl);updateInfo();render();setTimeout(function(){SL.visited=[];SL.found=null;render();},1500);}function doInsert(){var v=parseInt(document.getElementById(inp).value)||0;insert(v);}function doSearch(){clearInterval(SL.timer);var v=parseInt(document.getElementById(inp).value)||0;search(v,true);document.getElementById(lastop).textContent=Searching: +v;}function doRandom(){clearInterval(SL.timer);var i=0;SL.timer=setInterval(function(){if(i>=5){clearInterval(SL.timer);return;}insert(Math.floor(Math.random()*100)+1);i++;},600);}function doReset(){clearInterval(SL.timer);init();document.getElementById(lastop).textContent=Reset;document.getElementById(compares).textContent=0;}function updateInfo(){document.getElementById(nodes).textContent=SL.nodes;document.getElementById(maxlvl).textContent=SL.maxUsed;document.getElementById(compares).textContent=SL.comparisons;}function getAllNodes(){var arr=[];var cur=SL.head.forward[0];while(cur){arr.push(cur);cur=cur.forward[0];}return arr;}function render(){var c=document.getElementById(canv);var ctx=c.getContext(2d);ctx.fillStyle=#0c0a18;ctx.fillRect(0,0,960,420);var nodes=getAllNodes();if(nodes.length===0){ctx.fillStyle=#505080;ctx.font=14px monospace;ctx.textAlign=center;ctx.fillText(Insert numbers to build the skip list!,480,210);return;}var nw=60,gap=20,bx0=40;var totalW=nodes.length*(nw+gap);if(totalW>920){nw=Math.max(30,Math.floor(920/nodes.length)-gap);totalW=nodes.length*(nw+gap);}var levels=SL.maxUsed+1;var rowH=Math.min(60,Math.floor(380/(levels+1)));var by0=380-rowH;ctx.fillStyle=#505080;ctx.font=10px monospace;ctx.textAlign=left;for(var lvl=SL.maxUsed;lvl>=0;lvl--){var y=by0-lvl*rowH;ctx.fillStyle=#2a2a4a;ctx.fillText(L+lvl,10,y+rowH/2);}for(var lvl=SL.maxUsed;lvl>=0;lvl--){var y=by0-lvl*rowH;var cur=SL.head;var px=bx0,py=y+rowH/2;ctx.strokeStyle=#2a2a4a;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(px,py);for(var i=0;i<nodes.length;i++){if(nodes[i].level>=lvl){var nx=bx0+i*(nw+gap)+nw/2;ctx.lineTo(nx,py);ctx.stroke();ctx.beginPath();ctx.moveTo(nx,py);px=nx;}}if(cur.forward[lvl]){var lastX=bx0+(nodes.length-1)*(nw+gap)+nw/2;ctx.lineTo(lastX+30,py);ctx.stroke();}}var visitedSet={};SL.visited.forEach(function(v){visitedSet[v.node.val+v.level]=true;});var pathSet={};SL.path.forEach(function(p){pathSet[p.node.val+p.level]=true;});for(var i=0;i<nodes.length;i++){var n=nodes[i];var bx=bx0+i*(nw+gap);for(var lvl=0;lvl<=n.level;lvl++){var y=by0-lvl*rowH;var isVisited=visitedSet[n.val+lvl];var isFound=SL.found===n;var col=#7a7aff;if(isFound)col=#ff4466;else if(isVisited)col=#ffdd44;else if(pathSet[n.val+lvl])col=#44ff88;ctx.fillStyle=col;ctx.fillRect(bx,y+4,nw,rowH-8);ctx.fillStyle=#08060f;ctx.font=10px monospace;ctx.textAlign=center;if(lvl===0)ctx.fillText(n.val,bx+nw/2,y+rowH/2+3);}}updateInfo();}init();</script></body></html>
