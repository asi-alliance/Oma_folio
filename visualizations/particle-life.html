<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Particle Life</title><style>body{margin:0;overflow:hidden;background:#060611;font-family:monospace}canvas{display:block}#ui{position:fixed;top:8px;left:8px;background:rgba(10,12,20,0.85);padding:10px 14px;border-radius:8px;color:#aab;font-size:12px;z-index:10;max-width:320px}#ui h2{margin:0 0 6px;font-size:14px;color:#7ec8e3}#ui label{display:inline-block;width:70px}#ui input{width:60px;background:#1a1c28;border:1px solid #334;color:#ccd;padding:2px 4px;border-radius:3px}#ui button{margin-top:6px;padding:4px 12px;background:#1e2a3a;color:#7ec8e3;border:1px solid #345;border-radius:4px;cursor:pointer;font-size:11px}#ui button:hover{background:#2a3a4a}#info{position:fixed;bottom:8px;left:8px;color:#445;font-size:11px;z-index:10}</style></head><body><div id="ui"><h2>Particle Life</h2><label>Types:</label><input id="numTypes" type="number" min="2" max="8" value="4"><br><label>Particles:</label><input id="numParticles" type="number" min="50" max="2000" value="600"><br><label>Radius:</label><input id="rFactor" type="range" min="20" max="120" value="60"><br><label>Friction:</label><input id="friction" type="range" min="80" max="99" value="90"><br><button id="regenBtn">Regenerate</button> <button id="randomBtn">Random Rules</button></div><div id="info">Drag to perturb | Click to add particles</div><canvas id="c"></canvas><script>
const cv=document.getElementById("c"),x=cv.getContext("2d");let W,H;function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}resize();addEventListener("resize",resize);
const palette=[[231,76,60],[46,204,113],[52,152,219],[241,196,15],[155,89,182],[230,126,34],[26,188,156],[236,240,241]];
let numTypes=4,numParticles=600,particles=[],attract=[],rMax=60,friction=0.90;
function randRules(){attract=[];for(let i=0;i<numTypes;i++){attract.push([]);for(let j=0;j<numTypes;j++)attract[i].push(Math.random()*2-1)}}
function init(){numTypes=+document.getElementById("numTypes").value;numParticles=Math.min(2000,+document.getElementById("numParticles").value);rMax=+document.getElementById("rFactor").value;friction=+document.getElementById("friction").value/100;randRules();particles=[];for(let i=0;i<numParticles;i++)particles.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,t:Math.floor(Math.random()*numTypes)})}
function update(){const r=rMax;const r2=r*r;const beta=0.02;const forceMax=0.8;for(let i=0;i<particles.length;i++){const pi=particles[i];let fx=0,fy=0;for(let j=0;j<particles.length;j++){if(i===j)continue;const pj=particles[j];const dx=pj.x-pi.x,dy=pj.y-pi.y;const d2=dx*dx+dy*dy;if(d2>r2||d2<1)continue;const d=Math.sqrt(d2);const a=attract[pi.t][pj.t];let f=0;if(d<r*0.3){f=a*beta*(d/(r*0.3)-1)*r*0.3}else{f=a*beta*(1-Math.abs(2*d/r-1))*r*0.5}f=Math.max(-forceMax,Math.min(forceMax,f));fx+=f*dx/d;fy+=f*dy/d}pi.vx=(pi.vx+fx)*friction;pi.vy=(pi.vy+fy)*friction}for(let p of particles){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x+=W;if(p.x>W)p.x-=W;if(p.y<0)p.y+=H;if(p.y>H)p.y-=H}}
function draw(){x.fillStyle="rgba(6,6,17,0.12)";x.fillRect(0,0,W,H);for(let p of particles){const c=palette[p.t%palette.length];x.fillStyle="rgba("+c[0]+","+c[1]+","+c[2]+",0.85)";x.beginPath();x.arc(p.x,p.y,3,0,6.283);x.fill()}}
function loop(){update();draw();requestAnimationFrame(loop)}
document.getElementById("regenBtn").onclick=init;
document.getElementById("randomBtn").onclick=function(){randRules()};
cv.addEventListener("mousedown",function(e){const mx=e.clientX,my=e.clientY;for(let i=0;i<8;i++)particles.push({x:mx+(Math.random()-0.5)*20,y:my+(Math.random()-0.5)*20,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,t:Math.floor(Math.random()*numTypes})});
let dragging=false,lastX=0,lastY=0;
cv.addEventListener("mousemove",function(e){if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;for(let p of particles){const pdx=p.x-e.clientX,pdy=p.y-e.clientY;const pd=Math.sqrt(pdx*pdx+pdy*pdy);if(pd<100){p.vx+=dx*0.05*(1-pd/100);p.vy+=dy*0.05*(1-pd/100)}}lastX=e.clientX;lastY=e.clientY});
cv.addEventListener("mousedown",function(){dragging=true;lastX=event.clientX;lastY=event.clientY});
cv.addEventListener("mouseup",function(){dragging=false});
init();loop();
</script></body></html>Now let me verify the write and send Paul his update.pin STATE — Cycle 5/5. No user msg. Particle life written. Must verify on disk + send Paul update + add to arcade index.
