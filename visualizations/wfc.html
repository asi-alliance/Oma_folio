<style>*{margin:0;padding:0;box-sizing:border-box}*{
background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;justify-center;flex-wrap:wrap;margin:12px 0}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#7a5adf}#ctl button.active{background:#7a7aff;color:#08060f}#ctl select{padding:6px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:4px;color:#a0a0d0;font-size:12px}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:480px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px}.ib{font-size:11px;color:#505080}.ib .v{font-size:14px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
<h1>Oma: Wave Function Collapse</h1><div class=sub>Watch tiles collapse from superposition into a coherent pattern via constraint propagation and entropy minimization.</div><div id=ctl><button onclick=run() class=active>Run WFC</button><button onclick=step()>Step</button><button onclick=reset()>Reset</button><button onclick=toggleSpeed()>Speed: Medium</button><select id=tileset onchange=reset()><option value=terrain>Terrain</option><option value=circuit>Circuit</option><option value=colors>Colors</option></select></div><canvas id=canv width=960 height=480></canvas><div id=info><div class=ib><div>Collapsed</div><div class=v id=collapsed>0</div></div><div class=ib><div>Entropy Min</div><div class=v id=entropy>-</div></div><div class=ib><div>Contradictions</div><div class=v id=contra>0</div></div><div class=ib><div>Status</div><div class=v id=stat>Ready</div></div></div><div class=leg><span><span class=dot style=background:#0a4a2a></span>Forest</span><span><span class=dot style=background:#2a6a4a></span>Grass</span><span><span class=dot style=background:#4a8aaa></span>Water</span><span><span class=dot style=background:#aaaa7a></span>Sand</span><span><span class=dot style=background:#6a6a8a></span>Superposition</span></div>
<script>var W={grid:[],cols:24,rows:12,cellW:40,cellH:40,speed:30,timer:null,collapsed:0,contra:0,phase:'idle',tileset:'terrain'};var TILES={terrain:[{name:'forest',color:'#0a4a2a',edges:['forest','forest','forest','forest']},{name:'grass',color:'#2a6a4a',edges:['forest','grass','water','sand']},{name:'water',color:'#4a8aaa',edges:['grass','water','water','grass']},{name:'sand',color:'#aaaa7a',edges:['grass','sand','sand','sand']}],circuit:[{name:'wire',color:'#4a4a6a',edges:['wire','wire','wire','wire']},{name:'node',color:'#7a7aff',edges:['wire','wire','wire','wire']},{name:'empty',color:'#0c0a18',edges:['empty','empty','empty','empty']},{name:'turn',color:'#4a8aaa',edges:['wire','wire','empty','empty']}],colors:[{name:'red',color:'#ff4466',edges:['red','red','red','red']},{name:'blue',color:'#4a8aff',edges:['red','blue','blue','red']},{name:'green',color:'#44ff88',edges:['blue','green','green','blue']},{name:'yellow',color:'#ffdd44',edges:['green','yellow','yellow','green']}]};function getTiles(){return TILES[W.tileset]||TILES.terrain;}function initGrid(){W.grid=[];var tiles=getTiles();for(var y=0;y<W.rows;y++){W.grid[y]=[];for(var x=0;x<W.cols;x++){W.grid[y][x]={x:x,y:y,options:tiles.map(function(t,i){return i;}),collapsed:false,tile:null};}}}function getOption(x,y,dir){var c=W.grid[y]&&W.grid[y][x];if(!c||!c.collapsed)return null;var tiles=getTiles();return tiles[c.tile].edges[dir];}function propagate(x,y){var stack=[[x,y]];var tiles=getTiles();while(stack.length>0){var cur=stack.pop();var cx=cur[0],cy=cur[1];var cell=W.grid[cy]&&W.grid[cy][cx];if(!cell)continue;var dirs=[[0,-1,0],[1,0,1],[0,1,2],[-1,0,3]];for(var d=0;d<4;d++){var nx=cx+dirs[d][0],ny=cy+dirs[d][1],edge=dirs[d][2];var n=W.grid[ny]&&W.grid[ny][nx];if(!n||n.collapsed)continue;var valid=[];var needed=getOption(nx,ny,(edge+2)%4);if(needed===null){valid=n.options.slice();}else{for(var i=0;i<n.options.length;i++){var t=tiles[n.options[i]];if(t.edges[edge]===needed||t.edges[edge]===t.edges[(edge+2)%4])valid.push(n.options[i]);}}if(valid.length===0&&n.options.length>0){W.contra++;n.options=[];}if(valid.length<n.options.length&&valid.length>0){n.options=valid;stack.push([nx,ny]);}}}updateInfo();}function findMinEntropy(){var min=Infinity,mx=-1,my=-1;for(var y=0;y<W.rows;y++){for(var x=0;x<W.cols;x++){var c=W.grid[y][x];if(c.collapsed)continue;var e=c.options.length;if(e===0){W.contra++;continue;}if(e<min||(e===min&&Math.random()<0.3)){min=e;mx=x;my=y;}}}document.getElementById('entropy').textContent=min===Infinity?'-':min;return mx>=0?{x:mx,y:my}:null;}function collapse(x,y){var c=W.grid[y][x];if(!c||c.collapsed||c.options.length===0)return;c.tile=c.options[Math.floor(Math.random()*c.options.length)];c.options=[c.tile];c.collapsed=true;W.collapsed++;propagate(x,y);}function step(){if(W.phase!=='running')return;var m=findMinEntropy();if(!m){W.phase='idle';document.getElementById('stat').textContent=W.contra>0?'Contradiction!':'Complete!';clearTimeout(W.timer);return;}collapse(m.x,m.y);render();}function run(){clearTimeout(W.timer);reset();W.phase='running';document.getElementById('stat').textContent='Running...';W.timer=setInterval(step,W.speed);}function reset(){clearTimeout(W.timer);W.collapsed=0;W.contra=0;W.phase='idle';W.tileset=document.getElementById('tileset').value;initGrid();render();updateInfo();document.getElementById('stat').textContent='Ready';}function toggleSpeed(){if(W.speed===15){W.speed=30;}else if(W.speed===30){W.speed=60;}else{W.speed=15;}var label=W.speed===15?'Fast':W.speed===30?'Medium':'Slow';document.querySelectorAll('button')[3].textContent='Speed: '+label;}function updateInfo(){document.getElementById('collapsed').textContent=W.collapsed;document.getElementById('contra').textContent=W.contra;}function render(){var c=document.getElementById('canv');var ctx=c.getContext('2d');var tiles=getTiles();ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,960,480);for(var y=0;y<W.rows;y++){for(var x=0;x<W.cols;x++){var cl=W.grid[y][x];var bx=x*W.cellW,by=y*W.cellH;if(cl.collapsed&&cl.tile!==null){ctx.fillStyle=tiles[cl.tile].color;ctx.fillRect(bx+1,by+1,W.cellW-2,W.cellH-2);ctx.fillStyle='rgba(255,255,255,0.15)';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(tiles[cl.tile].name.substring(0,4),bx+W.cellW/2,by+W.cellH/2+3);}else if(cl.options.length===0){ctx.fillStyle='#ff4466';ctx.fillRect(bx+1,by+1,W.cellW-2,W.cellH-2);ctx.fillStyle='#fff';ctx.font='16px monospace';ctx.textAlign='center';ctx.fillText('X',bx+W.cellW/2,by+W.cellH/2+5);}else{var opts=cl.options.length;for(var i=0;i<opts;i++){var t=tiles[cl.options[i]];ctx.fillStyle=t.color;var sz=W.cellW/opts;ctx.fillRect(bx+1+i*sz,by+1,sz-1,W.cellH-2);}ctx.fillStyle='rgba(255,255,255,0.3)';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(opts,bx+W.cellW/2,by+8);}}}updateInfo();}initGrid();render();</script></body></html>
