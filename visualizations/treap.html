<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1"><title>Treap Visualizer</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:20px;color:#ff66aa;text-shadow:0 0 10px #ff44aa;letter-spacing:2px}.sub{text-align:center;font-size:11px;color:#505080;margin-bottom:12px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}#ctl button{padding:7px 14px;border:1px solid #2a2a4a;border-radius:10px;background:#0c0a18;color:#505080;font-size:11px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#ff66aa}#ctl label{font-size:10px;color:#505080}#ctl input{width:50px;padding:5px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;color:#a0a0d0;font-size:12px}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:420px}#info{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;padding:8px 12px;font-size:10px;color:#505080}.ib .v{font-size:14px;color:#ffbb55}.leg{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}.leg span{font-size:10px;color:#505080}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}</style></head><body><div id=app><h1>Oma: Treap</h1><div class=sub>Randomized BST + Heap. Keys follow BST order, priorities follow heap order. Rotations restore heap property after insert/delete.</div><div id=ctl><label>Key:</label><input id=keyval value=0 style=width:45px><button onclick=doInsert()>Insert</button><button onclick=doDelete()>Delete</button><button onclick=doSearch()>Search</button><button onclick=doRandom()>Random Insert</button><button onclick=doClear()>Clear</button></div><canvas id=canv width=960 height=420></canvas><div id=info><div class=ib><div>Nodes</div><div class=v id=ncnt>0</div></div><div class=ib><div>Last Op</div><div class=v id=nop>Idle</div></div><div class=ib><div>Rotations</div><div class=v id=nrot>0</div></div><div class=ib><div>Comparisons</div><div class=v id=ncmp>0</div></div><div class=ib><div>Max Priority</div><div class=v id=npri>—</div></div><div class=ib><div>Heap Property</div><div class=v id=nhp>✓</div></div></div><div class=leg><span><span class=dot style=background:#5bb9e6></span>Normal</span><span><span class=dot style=background:#ffdd44></span>Active</span><span><span class=dot style=background:#ff66aa></span>Rotating</span><span><span class=dot style=background:#44ff88></span>Found</span><span><span class=dot style=background:#ff4444></span>Not Found</span></div></div><script>
var W=960,H=420;var root=null;var rotCount=0;var cmpCount=0;var activeNode=null;var highlightTimer=null;
function Node(key){this.key=key;this.priority=Math.random();this.left=null;this.right=null;this.x=W/2;this.y=40;this.tx=0;this.ty=0;this.depth=0;}
function rotateRight(t){rotCount++;var l=t.left;t.left=l.right;l.right=t;return l;}
function rotateLeft(t){rotCount++;var r=t.right;t.right=r.left;r.left=t;return r;}
function insert(t,key){if(!t){activeNode=new Node(key);return activeNode;}cmpCount++;if(key<t.key){t.left=insert(t.left,key);if(t.left.priority<t.priority)t=rotateRight(t);}else if(key>t.key){t.right=insert(t.right,key);if(t.right.priority<t.priority)t=rotateLeft(t);}return t;}
function delNode(t,key){if(!t)return null;cmpCount++;if(key<t.key){t.left=delNode(t.left,key);}else if(key>t.key){t.right=delNode(t.right,key);}else{if(!t.left&&!t.right)return null;if(!t.left)t=rotateLeft(t);else if(!t.right)t=rotateRight(t);else if(t.left.priority<t.right.priority)t=rotateRight(t);else t=rotateLeft(t);t=delNode(t,key);}return t;}
function search(t,key){if(!t)return false;cmpCount++;activeNode=t;if(key===t.key)return true;if(key<t.key)return search(t.left,key);return search(t.right,key);}
function countNodes(t){return t?1+countNodes(t.left)+countNodes(t.right):0;}
function maxPri(t){if(!t)return -1;return Math.max(t.priority,maxPri(t.left),maxPri(t.right));}
function checkHeap(t){if(!t)return true;var ok=true;if(t.left&&t.left.priority<t.priority)ok=false;if(t.right&&t.right.priority<t.priority)ok=false;return ok&&checkHeap(t.left)&&checkHeap(t.right);}
function layout(t,depth,minX,maxX){if(!t)return;t.depth=depth;t.tx=(minX+maxX)/2;t.ty=30+depth*55;layout(t.left,depth+1,minX,(minX+maxX)/2);layout(t.right,depth+1,(minX+maxX)/2,maxX);}
function animNodes(t){if(!t)return;t.x+=(t.tx-t.x)*0.15;t.y+=(t.ty-t.y)*0.15;animNodes(t.left);animNodes(t.right);}
function drawNode(ctx,t,hl){if(!t)return;ctx.strokeStyle="#2a2a4a";ctx.lineWidth=1.5;if(t.left){ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.lineTo(t.left.x,t.left.y);ctx.stroke();}if(t.right){ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.lineTo(t.right.x,t.right.y);ctx.stroke();}drawNode(ctx,t.left,hl);drawNode(ctx,t.right,hl);var color="#5bb9e6";if(t===hl){if(t===activeNode&&hl._found)color="#44ff88";else if(t===activeNode)color="#ff66aa";else color="#ffdd44";}ctx.fillStyle=color;ctx.beginPath();ctx.arc(t.x,t.y,16,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#08060f";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#08060f";ctx.font="11px monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(t.key,t.x,t.y);ctx.fillStyle="#505080";ctx.font="7px monospace";ctx.fillText(t.priority.toFixed(2),t.x,t.y+24);}
function doInsert(){var v=parseInt(document.getElementById("keyval").value);if(isNaN(v))return;root=insert(root,v);updateInfo();render();}
function doDelete(){var v=parseInt(document.getElementById("keyval").value);if(isNaN(v))return;root=delNode(root,v);activeNode=null;updateInfo();render();}
function doSearch(){var v=parseInt(document.getElementById("keyval").value);if(isNaN(v))return;cmpCount=0;var found=search(root,v);if(activeNode)activeNode._found=found;updateInfo();render();setTimeout(function(){activeNode=null;activeNode&&delete activeNode._found;render();},1500);}
function doRandom(){root=insert(root,Math.floor(Math.random()*99));updateInfo();render();}
function doClear(){root=null;rotCount=0;cmpCount=0;activeNode=null;updateInfo();render();}
function updateInfo(){document.getElementById("ncnt").textContent=countNodes(root);document.getElementById("nop").textContent=activeNode?"Active":"Idle";document.getElementById("nrot").textContent=rotCount;document.getElementById("ncmp").textContent=cmpCount;document.getElementById("npri").textContent=root?maxPri(root).toFixed(3):"—";document.getElementById("nhp").textContent=checkHeap(root)?"✓":"✗";}
function render(){var canvas=document.getElementById("canv");var ctx=canvas.getContext("2d");ctx.fillStyle="#0c0a18";ctx.fillRect(0,0,W,H);if(!root){ctx.fillStyle="#505080";ctx.font="14px monospace";ctx.textAlign="center";ctx.fillText("Insert keys to build the treap",W/2,H/2);return;}layout(root,0,40,W-40);animNodes(root);drawNode(ctx,root,activeNode);if(checkHeap(root)){ctx.fillStyle="#44ff88";ctx.font="9px monospace";ctx.textAlign="left";ctx.fillText("Heap OK",10,H-8);}else{ctx.fillStyle="#ff4444";ctx.font="9px monospace";ctx.textAlign="left";ctx.fillText("Heap VIOLATION",10,H-8);}}
render();
</script>
</body></html>
