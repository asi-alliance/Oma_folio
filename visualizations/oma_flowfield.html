<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Oma FlowField — Particle Vector Field</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050510;overflow:hidden;height:100vh;width:100vw}canvas{display:block;cursor:crosshair}.hud{position:fixed;top:10px;left:10px;color:#40c0ff;font-family:Courier New,monospace;font-size:0.8rem;text-shadow:0 0 10px rgba(64,192,255,0.4);pointer-events:none;line-height:1.6;z-index:10}.title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#60d0ff;font-family:Courier New,monospace;font-size:2rem;font-weight:bold;letter-spacing:8px;text-shadow:0 0 30px rgba(64,192,255,0.5);pointer-events:none;opacity:0;transition:opacity 2s;z-index:10}.hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:#1a4060;font-family:Courier New,monospace;font-size:0.75rem;pointer-events:none;z-index:10}</style></head><body><canvas id="c"></canvas><div class="hud" id="hud">OMA FLOWFIELD<br>Particles: 1500<br>Move mouse to influence flow</div><div class="title" id="title">OMA FLOWFIELD</div><div class="hint">Particle flow field — move mouse to attract, click to burst, right-click to reset</div><script>const cv=document.getElementById('c');const ctx=cv.getContext('2d');let W,H;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H}resize();addEventListener('resize',resize);const NUM=1500;let particles=[];let mx=-9999,my=-9999;let t=0;function noise(x,y,z){return Math.sin(x*0.01+z*0.003)*Math.cos(y*0.01+z*0.002)+Math.sin(x*0.003+y*0.005+z*0.005)*0.5}function Particle(){this.reset=function(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=0;this.vy=0;this.life=Math.random()*200+100;this.age=0;this.hue=Math.random()*60+180};this.reset();this.hue=Math.random()*60+180}function initParticles(){particles=[];for(let i=0;i<NUM;i++)particles.push(new Particle())}initParticles();function update(){t++;ctx.fillStyle='rgba(5,5,16,0.04)';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';for(let i=0;i<particles.length;i++){const p=particles[i];const angle=noise(p.x,p.y,t)*Math.PI*2;let fx=Math.cos(angle)*1.5;let fy=Math.sin(angle)*1.5;if(mx>-1000){const dx=mx-p.x,dy=my-p.y;const dist=Math.sqrt(dx*dx+dy*dy);if(dist<200){const force=(200-dist)/200*3;fx+=dx/dist*force;fy+=dy/dist*force}}p.vx=p.vx*0.95+fx*0.1;p.vy=p.vy*0.95+fy*0.1;p.x+=p.vx;p.y+=p.vy;p.age++;const speed=Math.sqrt(p.vx*p.vx+p.vy*p.vy);const alpha=Math.min(1,p.age/20)*(1-p.age/p.life)*0.8;const lightness=50+speed*10;ctx.strokeStyle='hsla('+p.hue+',80%,'+lightness+'%,'+alpha+')';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(p.x-p.vx,p.y-p.vy);ctx.lineTo(p.x,p.y);ctx.stroke();if(p.age>p.life||p.x<0||p.x>W||p.y<0||p.y>H){p.reset()}}ctx.globalCompositeOperation='source-over';if(t%20===0)document.getElementById('hud').innerHTML='OMA FLOWFIELD<br>Particles: '+NUM+'<br>Move mouse to influence flow'}cv.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});cv.addEventListener('mouseleave',()=>{mx=-9999;my=-9999});cv.addEventListener('click',e=>{for(let i=0;i<80;i++){const p=new Particle();p.x=e.clientX;p.y=e.clientY;const a=Math.random()*Math.PI*2;const s=Math.random()*5+2;p.vx=Math.cos(a)*s;p.vy=Math.sin(a)*s;p.hue=Math.random()*360;particles.push(p)}if(particles.length>3000)particles=particles.slice(-2000)});cv.addEventListener('contextmenu',e=>{e.preventDefault();ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);initParticles()});setTimeout(()=>document.getElementById('title').style.opacity='0.6',100);setTimeout(()=>document.getElementById('title').style.opacity='0',3000);setInterval(update,16)</script></body></html>
