<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Oma Fractal — Interactive Julia Set Explorer</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#080008;overflow:hidden;height:100vh;width:100vw}canvas{display:block;cursor:crosshair}.hud{position:fixed;top:10px;left:10px;color:#a060ff;font-family:Courier New,monospace;font-size:0.8rem;text-shadow:0 0 10px rgba(160,96,255,0.5);pointer-events:none;line-height:1.6;z-index:10}.title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#c880ff;font-family:Courier New,monospace;font-size:2.2rem;font-weight:bold;letter-spacing:10px;text-shadow:0 0 30px rgba(160,96,255,0.6);pointer-events:none;opacity:0;transition:opacity 2s;z-index:10}.hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:#4a2a7a;font-family:Courier New,monospace;font-size:0.75rem;pointer-events:none;z-index:10}</style></head><body><canvas id="c"></canvas><div class="hud" id="hud">OMA FRACTAL<br>Zoom: 1x<br>Click to zoom in. Right-click to zoom out.</div><div class="title" id="title">OMA FRACTAL</div><div class="hint">Julia set explorer — click to zoom, right-click to zoom out, move mouse to morph</div><script>const cv=document.getElementById('c');const ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;addEventListener('resize',()=>{cv.width=innerWidth;cv.height=innerHeight;render()});let zoom=1;let cx=-0.7,cy=0.27015;let mouseX=0,mouseY=0;let offsetX=0,offsetY=0;const maxIter=100;const palette=[];for(let i=0;i<256;i++){const t=i/255;const r=Math.floor(128+127*Math.sin(t*Math.PI*3+0));const g=Math.floor(128+127*Math.sin(t*Math.PI*3+2.094));const b=Math.floor(128+127*Math.sin(t*Math.PI*3+4.188));palette.push(`rgb(${r},${g},${b})`)}function render(){const w=cv.width,h=cv.height;const img=ctx.createImageData(w,h);const d=img.data;const scale=3.0/(zoom*Math.min(w,h));for(let py=0;py<h;py++){for(let px=0;px<w;px++){let x=(px-w/2)*scale+offsetX;let y=(py-h/2)*scale+offsetY;let zx=x,zy=y;let i=0;while(zx*zx+zy*zy<4&&i<maxIter){const tmp=zx*zx-zy*zy+cx;zy=2*zx*zy+cy;zx=tmp;i++}const idx=(py*w+px)*4;if(i===maxIter){d[idx]=0;d[idx+1]=0;d[idx+2]=0;d[idx+3]=255}else{const c=palette[Math.floor(i*255/maxIter)];const m=c.match(/d+/g);d[idx]=m[0];d[idx+1]=m[1];d[idx+2]=m[2];d[idx+3]=255}}}ctx.putImageData(img,0,0)}cv.addEventListener('click',e=>{const w=cv.width,h=cv.height;const scale=3.0/(zoom*Math.min(w,h));offsetX+=(e.clientX-w/2)*scale;offsetY+=(e.clientY-h/2)*scale;zoom*=2;render()});cv.addEventListener('contextmenu',e=>{e.preventDefault();if(zoom>1){zoom/=2;scale=3.0/(zoom*Math.min(cv.width,cv.height));offsetX-=(e.clientX-cv.width/2)*scale;offsetY-=(e.clientY-cv.height/2)*scale;render()}});let morphTimer=null;cv.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY;if(morphTimer)clearTimeout(morphTimer);morphTimer=setTimeout(()=>{const w=cv.width,h=cv.height;const scale=3.0/(zoom*Math.min(w,h));const mx=(mouseX-w/2)*scale+offsetX;const my=(mouseY-h/2)*scale+offsetY;cx=-0.7+mx*0.3;cy=0.27015+my*0.3;render()},150)});let t=0;render();t++;if(t===1)setTimeout(()=>document.getElementById('title').style.opacity='0.6',100);setTimeout(()=>document.getElementById('title').style.opacity='0',3000);setInterval(()=>{document.getElementById('hud').innerHTML=`OMA FRACTAL<br>Zoom: ${zoom.toFixed(1)}x<br>C: ${cx.toFixed(3)}, ${cy.toFixed(3)}<br>Click to zoom in. Right-click to zoom out.`},500)</script></body></html>
