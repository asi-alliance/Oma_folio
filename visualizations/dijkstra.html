<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl input{width:60px;padding:6px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px;text-align:center}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#7a5adf}#ctl button.active{background:#7a7aff;color:#08060f}#ctl label{font-size:11px;color:#505080}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:480px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}#log{margin-top:12px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:12px;font-size:12px;color:#505080;min-height:40px;max-height:80px;overflow-y:auto}</style><div id=app><h1>Oma: Dijkstra's Shortest Path</h1><div class=sub>Weighted graph shortest path with a min-heap priority queue. Watch distances relax in real time!</div><div id=ctl><label>Nodes:</label><input id=nodeCount value=10><button onclick=doGenerate() class=active>Generate</button><button onclick=doStep()>Step</button><button onclick=toggleRun() id=runBtn>Run</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=3><label>Start:</label><input id=startNode value=0></div><canvas id=canv width=960 height=480></canvas><div id=info><div class=ib><div>Nodes</div><div class=v id=nn>-</div></div><div class=ib><div>Edges</div><div class=v id=ne>-</div></div><div class=ib><div>Visited</div><div class=v id=nv>0</div></div><div class=ib><div>Current</div><div class=v id=ncur>-</div></div><div class=ib><div>Dist Sum</div><div class=v id=ndsum>-</div></div></div><div class=leg><span><span class=dot style=background:#2a2a4a></span>Unvisited</span><span><span class=dot style=background:#ffdd44></span>Current</span><span><span class=dot style=background:#44ff88></span>Visited</span><span><span class=dot style=background:#ff4466></span>Path</span><span><span class=dot style=background:#7a7aff></span>Frontier</span></div><div id=log>Click Generate to create a random weighted graph.</div></div>
<script>var W=960,H=480;var nodes=[];var edges=[];var dist=[];var prev=[];var visited=[];var heap=[];var current=-1;var running=false;var speed=3;var animTimer=null;var startPos=0;var allEdges=[];function MinHeap(){this.h=[];}MinHeap.prototype.push=function(item){this.h.push(item);var i=this.h.length-1;while(i>0){var p=(i-1)>>1;if(this.h[p].d<=this.h[i].d)break;var t=this.h[p];this.h[p]=this.h[i];this.h[i]=t;i=p;}};MinHeap.prototype.pop=function(){if(this.h.length===0)return null;var top=this.h[0];var last=this.h.pop();if(this.h.length>0){this.h[0]=last;var i=0;while(true){var l=2*i+1,r=2*i+2,s=i;if(l<this.h.length&&this.h[l].d<this.h[s].d)s=l;if(r<this.h.length&&this.h[r].d<this.h[s].d)s=r;if(s===i)break;var t=this.h[s];this.h[s]=this.h[i];this.h[i]=t;i=s;}}return top;};MinHeap.prototype.isEmpty=function(){return this.h.length===0;};function generateGraph(){var n=parseInt(document.getElementById('nodeCount').value)||10;n=Math.max(3,Math.min(30,n));startPos=parseInt(document.getElementById('startNode').value)||0;startPos=Math.max(0,Math.min(n-1,startPos));nodes=[];allEdges=[];var radius=180;var cx=W/2,cy=H/2;for(var i=0;i<n;i++){var angle=(i/n)*2*Math.PI- Math.PI/2;nodes.push({x:cx+Math.cos(angle)*radius,y:cy+Math.sin(angle)*radius,id:i});}for(i=0;i<n;i++){for(var j=i+1;j<n;j++){if(Math.random()<0.3){var w=Math.floor(Math.random()*20)+1;allEdges.push({a:i,b:j,w:w});}}}if(allEdges.length<n-1){for(i=1;i<n;i++){allEdges.push({a:i-1,b:i,w:Math.floor(Math.random()*20)+1});}}resetAlgo();}function resetAlgo(){var n=nodes.length;dist=[];prev=[];visited=[];heap=new MinHeap();current=-1;running=false;if(animTimer){clearInterval(animTimer);animTimer=null;}for(var i=0;i<n;i++){dist[i]=Infinity;prev[i]=-1;visited[i]=false;}dist[startPos]=0;heap.push({node:startPos,d:0});document.getElementById('nn').textContent=n;document.getElementById('ne').textContent=allEdges.length;document.getElementById('nv').textContent=0;document.getElementById('ncur').textContent='-';document.getElementById('ndsum').textContent='-';var btn=document.getElementById('runBtn');btn.textContent='Run';btn.classList.remove('active');render();}function stepDijkstra(){if(heap.isEmpty())return false;var item=heap.pop();var u=item.node;if(visited[u])return stepDijkstra();visited[u]=true;current=u;var vCount=0;var dSum=0;for(var i=0;i<nodes.length;i++){if(visited[i]){vCount++;dSum+=dist[i];}}document.getElementById('nv').textContent=vCount;document.getElementById('ncur').textContent=u;document.getElementById('ndsum').textContent=dSum;for(var e=0;e<allEdges.length;e++){var edge=allEdges[e];var v=-1;if(edge.a===u)v=edge.b;else if(edge.b===u)v=edge.a;if(v>=0&&!visited[v]){var nd=dist[u]+edge.w;if(nd<dist[v]){dist[v]=nd;prev[v]=u;heap.push({node:v,d:nd});}}}return true;}function doStep(){stepDijkstra();render();}function doGenerate(){generateGraph();}function toggleRun(){running=!running;var btn=document.getElementById('runBtn');btn.textContent=running?'Pause':'Run';btn.classList.toggle('active',running);if(running){speed=parseInt(document.getElementById('spd').value)||3;animTimer=setInterval(function(){for(var i=0;i<speed;i++){if(!stepDijkstra()){clearInterval(animTimer);animTimer=null;running=false;btn.textContent='Run';btn.classList.remove('active');break;}}render();},100);}}function doReset(){resetAlgo();}function getPath(u){var path=[];var cur=u;while(cur>=0){path.unshift(cur);cur=prev[cur];}return path;}function render(){var canvas=document.getElementById('canv');var ctx=canvas.getContext('2d');ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,W,H);var frontier={};if(!heap.isEmpty()){for(var i=0;i<heap.h.length;i++)frontier[heap.h[i].node]=true;}for(var e=0;e<allEdges.length;e++){var edge=allEdges[e];var a=nodes[edge.a],b=nodes[edge.b];var onPath=false;var pa=prev[edge.a],pb=prev[edge.b];if((pa===edge.b||pb===edge.a)&&visited[edge.a]&&visited[edge.b])onPath=true;ctx.strokeStyle=onPath?'#ff4466':'#2a2a4a';ctx.lineWidth=onPath?3:1.5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();var mx=(a.x+b.x)/2,my=(a.y+b.y)/2;ctx.fillStyle='#505080';ctx.font='11px monospace';ctx.textAlign='center';ctx.fillText(edge.w,mx,my);}for(var i=0;i<nodes.length;i++){var n=nodes[i];var color='#2a2a4a';if(visited[i])color='#44ff88';if(frontier[i]&&!visited[i])color='#7a7aff';if(i===current)color='#ffdd44';if(i===startPos&&visited[i])color='#44ff88';if(i===startPos&&!visited[i])color='#ffdd44';ctx.fillStyle=color;ctx.beginPath();ctx.arc(n.x,n.y,16,0,2*Math.PI);ctx.fill();ctx.strokeStyle='#08060f';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#e0e0e6';ctx.font='12px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i,n.x,n.y);if(dist[i]<Infinity&&visited[i]){ctx.fillStyle='#ffbb55';ctx.font='10px monospace';ctx.fillText(dist[i],n.x,n.y+24);}}}</script></body></html>
