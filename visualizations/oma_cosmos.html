<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Oma Cosmos — 3D Particle Field</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#02000a;overflow:hidden;height:100vh;width:100vw}canvas{display:block}.hud{position:fixed;top:10px;left:10px;color:#7c9aff;font-family:Courier New,monospace;font-size:0.8rem;text-shadow:0 0 10px rgba(124,154,255,0.5);pointer-events:none;line-height:1.6}.title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#a0c0ff;font-family:Courier New,monospace;font-size:2.2rem;font-weight:bold;letter-spacing:10px;text-shadow:0 0 30px rgba(124,154,255,0.5);pointer-events:none;opacity:0;transition:opacity 2s}.hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:#4a6a9a;font-family:Courier New,monospace;font-size:0.75rem;pointer-events:none}</style></head><body><div class="hud" id="hud">OMA COSMOS<br>Drag to orbit. Scroll to zoom.</div><div class="title" id="title">OMA COSMOS</div><div class="hint">3D particle field — drag to rotate, scroll to zoom, click to pulse</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from 'three/addons/controls/OrbitControls.js';const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02000a,0.015);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);camera.position.set(0,0,40);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;controls.minDistance=10;controls.maxDistance=100;const groupCount=5;const groups=[];const colors=[0x7c9aff,0xff6bb0,0x6bffb0,0xffb06b,0xb06bff];for(let g=0;g<groupCount;g++){const count=200;const geo=new THREE.BufferGeometry();const pos=new Float32Array(count*3);const colArr=new Float32Array(count*3);const c=new THREE.Color(colors[g]);for(let i=0;i<count;i++){const r=8+g*4+Math.random()*4;const theta=Math.random()*Math.PI*2;const phi=Math.random()*Math.PI;pos[i*3]=r*Math.sin(phi)*Math.cos(theta);pos[i*3+1]=r*Math.sin(phi)*Math.sin(theta);pos[i*3+2]=r*Math.cos(phi);colArr[i*3]=c.r;colArr[i*3+1]=c.g;colArr[i*3+2]=c.b}geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(colArr,3));const mat=new THREE.PointsMaterial({size:0.5,vertexColors:true,transparent:true,opacity:0.8,blending:THREE.AdditiveBlending,depthWrite:false});const pts=new THREE.Points(geo,mat);scene.add(pts);groups.push({points:pts,mat:mat,geo:geo,speed:0.001+g*0.0005})}const coreGeo=new THREE.SphereGeometry(1,16,16);const coreMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.3});const core=new THREE.Mesh(coreGeo,coreMat);scene.add(core);let pulse=0;renderer.domElement.addEventListener('click',()=>{pulse=1.0});let t=0;function animate(){requestAnimationFrame(animate);t++;groups.forEach((g,idx)=>{g.points.rotation.y+=g.speed;g.points.rotation.x+=g.speed*0.5;if(pulse>0){const pos=g.geo.attributes.position.array;for(let i=0;i<pos.length;i+=3){const d=Math.sqrt(pos[i]**2+pos[i+1]**2+pos[i+2]**2);const f=pulse*0.5/d;pos[i]+=pos[i]/d*f;pos[i+1]+=pos[i+1]/d*f;pos[i+2]+=pos[i+2]/d*f}g.geo.attributes.position.needsUpdate=true}});if(pulse>0){pulse*=0.92;if(pulse<0.01)pulse=0}core.scale.setScalar(1+pulse*2);core.material.opacity=0.3+pulse*0.5;controls.update();renderer.render(scene,camera);if(t===30)document.getElementById('title').style.opacity='0.7';if(t===200)document.getElementById('title').style.opacity='0';if(t%30===0)document.getElementById('hud').innerHTML='OMA COSMOS<br>'+groups.length+' particle shells<br>Drag to orbit. Scroll to zoom.'}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});animate();</script></body></html>
