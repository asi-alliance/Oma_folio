<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BZ Reaction-Diffusion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000012;color:#96a0b8;font-family:monospace;height:100vh;overflow:hidden}
#ctl{position:absolute;top:10px;left:10px;z-index:100;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:rgba(8,8,16,0.85);padding:8px 12px;border:1px solid #223;border-radius:8px}
#ctl button{background:#111;color:#e8e8e8;border:1px solid #343458;padding:5px 10px;cursor:pointer;border-radius:5px;font-family:monospace;font-size:0.8em}
#ctl button:hover{border-color:#5ce5fe;color:#5ce5fe}
#ctl label{font-size:0.75rem}
#ctl input{width:70px;accent-color:#5ce5fe}
h1{font-size:0.9rem;color:#7c83fd;margin-right:6px}
#info{position:absolute;bottom:8px;left:10px;color:#555;font-size:0.72rem}
canvas{position:absolute;top:0;left:0;cursor:crosshair}
</style>
</head>
<body>
<div id="ctl">
<h1>BZ Reaction-Diffusion</h1>
<button id="reset">Reset</button>
<button id="pause">Pause</button>
<label>Speed <input type="range" id="speed" min="1" max="200" value="30"></label>
<label>Threshold <input type="range" id="thresh" min="1" max="8" value="3"></label>
</div>
<canvas id="cv"></canvas>
<div id="info"></div>
<script>
var cv=document.getElementById('cv'),x=cv.getContext('2d');
var W,H,cols,rows,cell=3;
var grid,next,running=true,spf=30,thresh=3,steps=0;
var REST=0,EXCITE=1,REFRACT=2;
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;cols=Math.floor(W/cell);rows=Math.floor(H/cell);reset();}
function reset(){
grid=new Uint8Array(cols*rows);
next=new Uint8Array(cols*rows);
for(var i=0;i<grid.length;i++) grid[i]=Math.random()<0.05?EXCITE:REST;
steps=0;
x.fillStyle='#000012';x.fillRect(0,0,W,H);
}
function countExcited(cx,cy){
var c=0;
for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){
if(dx===0&&dy===0)continue;
var nx=(cx+dx+cols)%cols,ny=(cy+dy+rows)%rows;
if(grid[ny*cols+nx]===EXCITE)c++;
}
return c;
}
function step(){
for(var y=0;y<rows;y++)for(var xi=0;xi<cols;xi++){
var idx=y*cols+xi;
var s=grid[idx];
if(s===REST){next[idx]=countExcited(xi,y)>=thresh?EXCITE:REST;}
else if(s===EXCITE){next[idx]=REFRACT;}
else{next[idx]=REST;}
}
var tmp=grid;grid=next;next=tmp;
steps++;
}
function render(){
var img=x.createImageData(cols*cell,rows*cell);
for(var y=0;y<rows;y++)for(var xi=0;xi<cols;xi++){
var s=grid[y*cols+xi];
var r,g,b;
if(s===REST){r=0;g=0;b=18;}
else if(s===EXCITE){r=245;g=158;b=66;}
else{r=92;g=80;b=200;}
for(var dy=0;dy<cell;dy++)for(var dx=0;dx<cell;dx++){
var pi=((y*cell+dy)*cols*cell+(xi*cell+dx))*4;
img.data[pi]=r;img.data[pi+1]=g;img.data[pi+2]=b;img.data[pi+3]=255;
}
}
x.putImageData(img,0,0);
}
function loop(){
if(running){for(var i=0;i<spf;i++)step();render();document.getElementById('info').innerHTML='steps: '+steps+' | excited: '+countTotal(EXCITE)+' | refractory: '+countTotal(REFRACT);}
requestAnimationFrame(loop);
}
function countTotal(s){var c=0;for(var i=0;i<grid.length;i++)if(grid[i]===s)c++;return c;}
document.getElementById('speed').oninput=function(){spf=+this.value;};
document.getElementById('thresh').oninput=function(){thresh=+this.value;};
document.getElementById('reset').onclick=reset;
document.getElementById('pause').onclick=function(){running=!running;this.textContent=running?'Pause':'Play';};
cv.onclick=function(e){var rect=cv.getBoundingClientRect();var mx=Math.floor((e.clientX-rect.left)/cell),my=Math.floor((e.clientY-rect.top)/cell);for(var dy=-3;dy<=3;dy++)for(var dx=-3;dx<=3;dx++){var nx=(mx+dx+cols)%cols,ny=(my+dy+rows)%rows;grid[ny*cols+nx]=EXCITE;}};
window.onresize=resize;resize();loop();
</script>
</body>
</html>
