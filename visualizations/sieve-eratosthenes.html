<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#ff66aa;text-shadow:0 0 12px #ff44aa;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl input{width:80px;padding:6px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#ff66aa}#ctl label{font-size:11px;color:#505080}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:420px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}</style><div id=app><h1>Oma: Sieve of Eratosthenes</h1><div class=sub>Mark multiples of each prime starting from 2. Remaining unmarked numbers are prime.</div><div id=ctl><label>Max N:</label><input id=nInput value=120><button onclick=doStart()>Start</button><button onclick=doStep()>Step</button><button onclick=doRun()>Auto Run</button><button onclick=doStop()>Stop</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=60 style=width:50px></div><canvas id=canv width=960 height=420></canvas><div id=info><div class=ib><div>Current Prime</div><div class=v id=ncp>—</div></div><div class=ib><div>Marking Multiple</div><div class=v id=ncm>—</div></div><div class=ib><div>Primes Found</div><div class=v id=npf>0</div></div><div class=ib><div>Composites Marked</div><div class=v id=ncm2>0</div></div><div class=ib><div>Phase</div><div class=v id=nph>Idle</div></div></div><div class=leg><span><span class=dot style=background:#2a2a4a></span>Unmarked</span><span><span class=dot style=background:#ffdd44></span>Current Prime</span><span><span class=dot style=background:#ffaa44></span>Marking</span><span><span class=dot style=background:#ff4466></span>Composite</span><span><span class=dot style=background:#44ff88></span>Confirmed Prime</span></div></div><script>
var W=960,H=420;var N=120;var grid=[];var currentPrime=2;var markingPos=0;var primesFound=[];var compositesMarked=0;var phase="Idle";var running=false;var timer=null;
function doStart(){N=parseInt(document.getElementById("nInput").value)||120;if(N<2)N=2;if(N>400)N=400;grid=[];for(var i=0;i<=N;i++)grid.push({state:"unmarked",isPrime:true});grid[0]={state:"composite",isPrime:false};grid[1]={state:"composite",isPrime:false};currentPrime=2;markingPos=4;primesFound=[];compositesMarked=0;phase="Sieving";updateInfo();render();}
function doStep(){if(phase==="Idle"||phase==="Done"){if(phase==="Idle")doStart();return;}if(phase!=="Sieving")return;if(currentPrime*currentPrime>N){for(var i=2;i<=N;i++){if(grid[i].isPrime){grid[i].state="prime";if(primesFound.indexOf(i)<0)primesFound.push(i);}}phase="Done";updateInfo();render();return;}markingPos+=currentPrime;if(markingPos>N){grid[currentPrime].state="prime";primesFound.push(currentPrime);currentPrime++;while(currentPrime<=N&&grid[currentPrime].isPrime===false)currentPrime++;if(currentPrime<=N){markingPos=currentPrime*2;grid[currentPrime].state="currentPrime";}if(currentPrime*currentPrime>N&&currentPrime<=N){for(i=2;i<=N;i++){if(grid[i].isPrime){grid[i].state="prime";if(primesFound.indexOf(i)<0)primesFound.push(i);}}phase="Done";updateInfo();render();return;}}else{grid[markingPos].isPrime=false;grid[markingPos].state="marking";compositesMarked++;}updateInfo();render();}
function doRun(){if(phase==="Idle")doStart();running=true;var spd=parseInt(document.getElementById("spd").value)||60;timer=setInterval(function(){if(phase==="Done"){clearInterval(timer);timer=null;running=false;return;}doStep();},spd);}
function doStop(){if(timer){clearInterval(timer);timer=null;}running=false;phase="Paused";updateInfo();render();}
function doReset(){if(timer){clearInterval(timer);timer=null;}running=false;N=120;grid=[];currentPrime=2;markingPos=0;primesFound=[];compositesMarked=0;phase="Idle";updateInfo();render();}
function updateInfo(){document.getElementById("ncp").textContent=phase==="Done"?"—":currentPrime;document.getElementById("ncm").textContent=phase==="Sieving"&&markingPos<=N?markingPos:"—";document.getElementById("npf").textContent=primesFound.length;document.getElementById("ncm2").textContent=compositesMarked;document.getElementById("nph").textContent=phase;}
function render(){var canvas=document.getElementById("canv");var ctx=canvas.getContext("2d");ctx.fillStyle="#0c0a18";ctx.fillRect(0,0,W,H);if(phase==="Idle"){ctx.fillStyle="#505080";ctx.font="14px monospace";ctx.textAlign="center";ctx.fillText("Enter N and click Start",W/2,H/2);return;}var cols=Math.ceil(Math.sqrt(N*1.3));var cellSize=Math.min(Math.floor((W-20)/cols),Math.floor((H-40)/Math.ceil(N/cols)));cellSize=Math.max(cellSize,14);var startX=(W-cols*cellSize)/2;var startY=16;for(var i=2;i<=N;i++){var row=Math.floor((i-2)/cols);var col=(i-2)%cols;var x=startX+col*cellSize;var y=startY+row*cellSize;var s=grid[i]?grid[i].state:"unmarked";var color="#2a2a4a";var textColor="#505080";if(s==="currentPrime"){color="#ffdd44";textColor="#08060f";}else if(s==="marking"){color="#ffaa44";textColor="#08060f";}else if(s==="composite"||grid[i]&&!grid[i].isPrime&&s!=="prime"){color="#1a1018";textColor="#ff4466";}else if(s==="prime"){color="#44ff88";textColor="#08060f";}else if(s==="unmarked"&&grid[i]&&!grid[i].isPrime){color="#1a1018";textColor="#ff4466";}ctx.fillStyle=color;ctx.fillRect(x+1,y+1,cellSize-3,cellSize-3);ctx.strokeStyle="#2a2a4a";ctx.lineWidth=0.5;ctx.strokeRect(x+1,y+1,cellSize-3,cellSize-3);ctx.fillStyle=textColor;ctx.font=Math.floor(cellSize*0.4)+"px monospace";ctx.textAlign="center";ctx.textBaseline="middle";if(s==="composite"||grid[i]&&!grid[i].isPrime&&s!=="prime"&&s!=="unmarked"){ctx.fillText(i,x+cellSize/2-1,y+cellSize/2);ctx.beginPath();ctx.moveTo(x+3,y+cellSize-5);ctx.lineTo(x+cellSize-3,y+4);ctx.strokeStyle="#ff4466";ctx.lineWidth=1;ctx.stroke();}else{ctx.fillText(i,x+cellSize/2-1,y+cellSize/2);}}if(phase==="Done"){ctx.fillStyle="#44ff88";ctx.font="bold 13px monospace";ctx.textAlign="center";ctx.fillText("Found "+primesFound.length+" primes up to "+N,W/2,H-10);}}
render();
</script>
</body></html>
