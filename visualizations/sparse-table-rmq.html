<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:20px;color:#ff66aa;text-shadow:0 0 10px #ff44aa;letter-spacing:2px}.sub{text-align:center;font-size:11px;color:#505080;margin-bottom:12px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}#ctl button{padding:7px 14px;border:1px solid #2a2a4a;border-radius:10px;background:#0c0a18;color:#505080;font-size:11px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#ff66aa}#ctl label{font-size:10px;color:#505080}#ctl input{padding:5px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;color:#a0a0d0;font-size:12px}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:440px}#info{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;padding:8px 12px;font-size:10px;color:#505080}.ib .v{font-size:14px;color:#ffbb55}.leg{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}.leg span{font-size:10px;color:#505080}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}</style><div id=app><h1>Oma: Sparse Table — Range Minimum Query</h1><div class=sub>Precompute st[k][i] = min of arr[i..i+2^k-1]. Query [L,R]: overlap two power-of-two intervals. Build O(n log n), query O(1).</div><div id=ctl><label>Array (comma):</label><input id=arr value=7,2,9,4,1,8,5,3 style=width:200px><button onclick=doStart()>Build</button><button onclick=doStep()>Step</button><button onclick=doRun()>Auto</button><button onclick=doStop()>Stop</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=250 style=width:35px><label>Query L:</label><input id=ql value=2 style=width:30px><label>R:</label><input id=qr value=6 style=width:30px><button onclick=doQuery()>Query</button><button onclick=doRandom()>Random</button></div><canvas id=canv width=960 height=440></canvas><div id=info><div class=ib><div>Phase</div><div class=v id=nph>Idle</div></div><div class=ib><div>K (level)</div><div class=v id=nk>—</div></div><div class=ib><div>I (col)</div><div class=v id=ni>—</div></div><div class=ib><div>Table Size</div><div class=v id=nts>—</div></div><div class=ib><div>Query Result</div><div class=v id=nqr>—</div></div></div><div class=leg><span><span class=dot style=background:#3a3a5a></span>Uncomputed</span><span><span class=dot style=background:#5bb9e6></span>Computed</span><span><span class=dot style=background:#ffdd44></span>Current Cell</span><span><span class=dot style=background:#ff66aa></span>Source Cells</span><span><span class=dot style=background:#44ff88></span>Query Overlap</span><span><span class=dot style=background:#ff4466></span>Query Result</span></div></div><script>
var W=960,H=440;var arr=[];var st=[];var K=0;var N=0;var phase="Idle";var curK=0;var curI=0;var srcCells=[];var running=false;var tHandle=null;var stepLog="";var queryL=-1;var queryR=-1;var queryRes=null;var queryCells=[];
function doStart(){var s=document.getElementById('arr').value;arr=s.split(',').map(function(x){return parseInt(x.trim())});N=arr.length;if(!N)return;doReset();K=Math.floor(Math.log2(N))+1;st=[];for(var k=0;k<K;k++)st[k]=new Array(N).fill(null);for(var i=0;i<N;i++)st[0][i]=arr[i];phase="Build";curK=1;curI=0;stepLog="Level 0 = array values. Now building level 1+";updateInfo();render();}
function doRandom(){var n=6+Math.floor(Math.random()*7);var a=[];for(var k=0;k<n;k++)a.push(1+Math.floor(Math.random()*20));document.getElementById('arr').value=a.join(',');doStart();}
function doStep(){if(phase==="Done"||phase==="Idle")return;if(phase==="Build"){if(curK>=K){phase="Ready";stepLog="Sparse table built. O(1) queries ready.";updateInfo();render();return;}if(curI>=N-(1<<curK)+1){curK++;curI=0;stepLog="Moving to level "+curK;if(curK>=K){phase="Ready";stepLog="Sparse table built. O(1) queries ready.";updateInfo();render();return;}updateInfo();render();return;}var half=1<<(curK-1);srcCells=[{k:curK-1,i:curI},{k:curK-1,i:curI+half}];var a=st[curK-1][curI];var b=st[curK-1][curI+half];st[curK][curI]=Math.min(a,b);stepLog="st["+curK+"]["+curI+"] = min(st["+(curK-1)+"]["+curI+"]="+a+", st["+(curK-1)+"]["+(curI+half)+"]="+b+") = "+st[curK][curI];curI++;updateInfo();render();return;}}
function doRun(){if(phase==="Idle")doStart();running=true;var spd=parseInt(document.getElementById('spd').value)||250;tHandle=setInterval(function(){if(phase==="Ready"||phase==="Done"){clearInterval(tHandle);tHandle=null;running=false;render();return;}doStep();},spd);}
function doStop(){if(tHandle){clearInterval(tHandle);tHandle=null;}running=false;phase="Paused";updateInfo();render();}
function doReset(){if(tHandle){clearInterval(tHandle);tHandle=null;}running=false;phase="Idle";arr=[];st=[];K=0;N=0;curK=0;curI=0;srcCells=[];stepLog="";queryL=-1;queryR=-1;queryRes=null;queryCells=[];updateInfo();render();}
function doQuery(){if(phase!=="Ready"&&phase!=="QueryDone")return;var L=parseInt(document.getElementById('ql').value);var R=parseInt(document.getElementById('qr').value);if(L<0||R>=N||L>R){stepLog="Invalid query range ["+L+","+R+"]";updateInfo();render();return;}queryL=L;queryR=R;var len=R-L+1;var k=Math.floor(Math.log2(len));queryCells=[{k:k,i:L},{k:k,i:R-(1<<k)+1}];queryRes=Math.min(st[k][L],st[k][R-(1<<k)+1]);phase="QueryDone";stepLog="RMQ["+L+","+R+"] = min(st["+k+"]["+L+"]="+st[k][L]+", st["+k+"]["+(R-(1<<k)+1)+"]="+st[k][R-(1<<k)+1]+") = "+queryRes;updateInfo();render();}
function updateInfo(){document.getElementById('nph').textContent=phase;document.getElementById('nk').textContent=phase==="Idle"?"—":curK;document.getElementById('ni').textContent=phase==="Idle"||phase==="Ready"||phase==="QueryDone"?"—":curI;document.getElementById('nts').textContent=N>0?K+"×"+N:"—";document.getElementById('nqr').textContent=queryRes!==null?queryRes:"—";}
function render(){var canvas=document.getElementById('canv');var ctx=canvas.getContext('2d');ctx.fillStyle="#0c0a18";ctx.fillRect(0,0,W,H);if(N===0){ctx.fillStyle="#505080";ctx.font="14px monospace";ctx.textAlign="center";ctx.fillText("Enter array and click Build",W/2,H/2);return;}
var cellW=Math.min(55,(W-120)/Math.max(N,1));var cellH=32;var tblX=80;var tblY=40;var arrY=tblY+K*cellH+20;
for(var i=0;i<N;i++){var x=tblX+i*cellW;var isQ=false;if(queryL>=0&&i>=queryL&&i<=queryR)isQ=true;ctx.fillStyle=isQ?"#2a4a3a":"#1a1a28";ctx.fillRect(x,tblY-2,cellW-2,cellH-4);ctx.strokeStyle="#2a2a4a";ctx.lineWidth=1;ctx.strokeRect(x,tblY-2,cellW-2,cellH-4);ctx.fillStyle="#a0a0d0";ctx.font="11px monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(arr[i],x+cellW/2,tblY+cellH/2-3);}
ctx.fillStyle="#505080";ctx.font="9px monospace";ctx.textAlign="right";ctx.textBaseline="middle";for(var k=0;k<K;k++){var y=tblY+k*cellH+cellH/2-3;ctx.fillText("k="+k,tblX-8,y);for(var i=0;i<N;i++){var x=tblX+i*cellW;var val=st[k]?st[k][i]:null;var isCur=k===curK&&i===curI&&phase==="Build";var isSrc=srcCells.some(function(s){return s.k===k&&s.i===i});var isQCell=queryCells.some(function(s){return s.k===k&&s.i===i});var col="#1a1a28";if(isQCell)col="#44ff88";else if(isCur)col="#ffdd44";else if(isSrc)col="#ff66aa";else if(val!==null&&val!==undefined)col="#5bb9e6";ctx.fillStyle=col;ctx.fillRect(x,y-cellH/2+2,cellW-2,cellH-4);ctx.strokeStyle="#2a2a4a";ctx.lineWidth=1;ctx.strokeRect(x,y-cellH/2+2,cellW-2,cellH-4);if(val!==null&&val!==undefined){ctx.fillStyle="#08060f";ctx.font="11px monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(val,x+cellW/2,y);}if(k===0){ctx.fillStyle="#505080";ctx.font="8px monospace";ctx.textBaseline="top";ctx.fillText(i,x+cellW/2,y+cellH/2+2);}}}
ctx.fillStyle="#505080";ctx.font="10px monospace";ctx.textAlign="left";var logY=H-20;if(stepLog)ctx.fillStyle="#ffdd44";if(stepLog)ctx.fillText(stepLog,20,logY);ctx.fillStyle="#505080";ctx.textAlign="right";ctx.fillText("N="+N+" K="+K+(queryRes!==null?" | RMQ["+queryL+","+queryR+"]="+queryRes:""),W-20,logY);}
render();
</script>
</body></html>
