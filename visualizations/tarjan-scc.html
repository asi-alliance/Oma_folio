<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl input{width:60px;padding:6px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px;text-align:center}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#7a5adf}#ctl label{font-size:11px;color:#505080}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:480px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}</style><div id=app><h1>Oma: Tarjan's SCC</h1><div class=sub>Single-pass strongly connected components via DFS, lowlink, and explicit stack. O(V+E).</div><div id=ctl><label>Nodes:</label><input id=nInput value=8 min=4 max=14><button onclick=doGenerate()>Generate</button><button onclick=doStep()>Step</button><button onclick=doRun()>Auto Run</button><button onclick=doStop()>Stop</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=20></div><canvas id=canv width=960 height=480></canvas><div id=info><div class=ib><div>Nodes</div><div class=v id=nn>0</div></div><div class=ib><div>Edges</div><div class=v id=ne>0</div></div><div class=ib><div>Index</div><div class=v id=nidx>0</div></div><div class=ib><div>SCCs</div><div class=v id=nscc>0</div></div><div class=ib><div>Stack</div><div class=v id=nstk>0</div></div><div class=ib><div>Phase</div><div class=v id=nph>Idle</div></div></div><div class=leg><span><span class=dot style=background:#7a7aff></span>Unvisited</span><span><span class=dot style=background:#ffdd44></span>On Stack</span><span><span class=dot style=background:#ff4466></span>Current</span><span><span class=dot style=background:#44ff88></span>SCC Found</span><span><span class=dot style=background:#2a2a4a></span>Edge</span></div></div>
<script>var W=960,H=480;var nodes=[];var edges=[];var adj=[];var disc=[];var low=[];var onStack=[];var sccId=[];var stack=[];var idx=0;var sccCount=0;var n=0;var phase='Idle';var running=false;var timer=null;var callStack=[];var curNode=-1;var childIdx=[];var sccColors=['#44ff88','#44ddff','#ff8844','#aa44ff','#ff44aa','#4aff4a','#ffaa44','#44aaff'];function doGenerate(){var ni=parseInt(document.getElementById('nInput').value)||8;if(ni<4)ni=4;if(ni>14)ni=14;n=ni;nodes=[];edges=[];adj=[];disc=[];low=[];onStack=[];sccId=[];stack=[];idx=0;sccCount=0;phase='Init';callStack=[];curNode=-1;childIdx=[];for(var i=0;i<n;i++){nodes.push({x:80+Math.random()*(W-160),y:60+Math.random()*(H-120)});adj[i]=[];disc[i]=-1;low[i]=-1;onStack[i]=false;sccId[i]=-1;}var es={};for(i=0;i<n;i++){for(var j=0;j<n;j++){if(i!==j&&Math.random()<0.25){var key=i+'-'+j;if(!es[key]){edges.push({a:i,b:j});adj[i].push(j);es[key]=1;}}}}phase='Ready';updateInfo();render();}function doStep(){if(n===0){doGenerate();return;}if(phase==='Done'||phase==='Idle'||phase==='Ready'){if(phase==='Ready'){callStack.push({node:0,ci:0});disc[0]=idx;low[0]=idx;idx++;stack.push(0);onStack[0]=true;phase='Running';}}if(phase!=='Running')return;if(callStack.length===0){phase='Done';updateInfo();render();return;}var frame=callStack[callStack.length-1];curNode=frame.node;if(frame.ci<adj[curNode].length){var w=adj[curNode][frame.ci];frame.ci++;if(disc[w]===-1){callStack.push({node:w,ci:0});disc[w]=idx;low[w]=idx;idx++;stack.push(w);onStack[w]=true;}else if(onStack[w]){low[curNode]=Math.min(low[curNode],disc[w]);}}else{if(low[curNode]===disc[curNode]){var comp=[];var v;do{v=stack.pop();onStack[v]=false;sccId[v]=sccCount;comp.push(v);}while(v!==curNode);sccCount++;}callStack.pop();if(callStack.length>0){var p=callStack[callStack.length-1].node;low[p]=Math.min(low[p],low[curNode]);}curNode=callStack.length>0?callStack[callStack.length-1].node:-1;}updateInfo();render();}function doRun(){if(n===0)doGenerate();running=true;var spd=parseInt(document.getElementById('spd').value)||20;timer=setInterval(function(){if(phase==='Done'){clearInterval(timer);timer=null;running=false;return;}doStep();},spd);}function doStop(){if(timer){clearInterval(timer);timer=null;}running=false;phase='Paused';updateInfo();render();}function doReset(){if(timer){clearInterval(timer);timer=null;}running=false;n=0;nodes=[];edges=[];adj=[];disc=[];low=[];onStack=[];sccId=[];stack=[];idx=0;sccCount=0;phase='Idle';callStack=[];curNode=-1;updateInfo();render();}function updateInfo(){document.getElementById('nn').textContent=n;document.getElementById('ne').textContent=edges.length;document.getElementById('nidx').textContent=idx;document.getElementById('nscc').textContent=sccCount;document.getElementById('nstk').textContent=stack.length;document.getElementById('nph').textContent=phase;}function render(){var canvas=document.getElementById('canv');var ctx=canvas.getContext('2d');ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,W,H);if(n===0){ctx.fillStyle='#505080';ctx.font='14px monospace';ctx.textAlign='center';ctx.fillText('Click Generate to start',W/2,H/2);return;}for(var i=0;i<edges.length;i++){var e=edges[i];var a=nodes[e.a],b=nodes[e.b];ctx.strokeStyle='#2a2a4a';ctx.lineWidth=1.5;if(sccId[e.a]>=0&&sccId[e.a]===sccId[e.b]){ctx.strokeStyle=sccColors[sccId[e.a]%sccColors.length];ctx.lineWidth=2;}ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}for(i=0;i<n;i++){var color='#7a7aff';if(sccId[i]>=0)color=sccColors[sccId[i]%sccColors.length];else if(onStack[i])color='#ffdd44';if(i===curNode)color='#ff4466';ctx.fillStyle=color;ctx.beginPath();ctx.arc(nodes[i].x,nodes[i].y,16,0,2*Math.PI);ctx.fill();ctx.strokeStyle='#08060f';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#08060f';ctx.font='11px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i,nodes[i].x,nodes[i].y);ctx.fillStyle='#ffbb55';ctx.font='9px monospace';var dv=disc[i]===-1?'-':disc[i];ctx.fillText('d:'+dv,nodes[i].x,nodes[i].y+28);}if(stack.length>0){ctx.fillStyle='#505080';ctx.font='10px monospace';ctx.textAlign='left';ctx.fillText('Stack: ['+stack.join(',')+']',8,H-22);}ctx.fillStyle='#505080';ctx.font='10px monospace';ctx.textAlign='left';ctx.fillText('SCCs: '+sccCount,8,H-8);}render();</script></body></html>
