<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:20px;color:#ff66aa;text-shadow:0 0 10px #ff44aa;letter-spacing:2px}.sub{text-align:center;font-size:11px;color:#505080;margin-bottom:12px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}#ctl button{padding:7px 14px;border:1px solid #2a2a4a;border-radius:10px;background:#0c0a18;color:#505080;font-size:11px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#ff66aa}#ctl label{font-size:10px;color:#505080}#ctl input{padding:5px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;color:#a0a0d0;font-size:12px}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:460px}#info{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;padding:8px 12px;font-size:10px;color:#505080}.ib .v{font-size:14px;color:#ffbb55}.leg{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}.leg span{font-size:10px;color:#505080}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}</style><div id=app><h1>Oma: Manacher — Longest Palindromic Substring</h1><div class=sub>Transform s→#s#...#s#. Expand radius using mirror symmetry: P[i]=min(P[2c-i],r-i). O(n) time.</div><div id=ctl><label>String:</label><input id=str value=abacaba style=width:140px><button onclick=doStart()>Start</button><button onclick=doStep()>Step</button><button onclick=doRun()>Auto</button><button onclick=doStop()>Stop</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=300 style=width:35px></div><canvas id=canv width=960 height=460></canvas><div id=info><div class=ib><div>Phase</div><div class=v id=nph>Idle</div></div><div class=ib><div>Center c</div><div class=v id=nc>—</div></div><div class=ib><div>Right r</div><div class=v id=nr>—</div></div><div class=ib><div>Index i</div><div class=v id=ni>—</div></div><div class=ib><div>Max Radius</div><div class=v id=nmr>—</div></div><div class=ib><div>Best Center</div><div class=v id=nbc>—</div></div><div class=ib><div>Result</div><div class=v id=nrs>—</div></div></div><div class=leg><span><span class=dot style=background:#3a3a5a></span>Unvisited</span><span><span class=dot style=background:#5bb9e6></span>Computed</span><span><span class=dot style=background:#ffdd44></span>Current i</span><span><span class=dot style=background:#ff66aa></span>Mirror</span><span><span class=dot style=background:#a855f7></span>Center c</span><span><span class=dot style=background:#44ff88></span>Best Palindrome</span></div></div><script>
var W=960,H=460;var T=[];var P=[];var N=0;var phase="Idle";var c=0;var r=0;var i=0;var mirror=0;var running=false;var tHandle=null;var stepLog="";var maxRad=0;var bestC=0;var expandMode=false;var origStr="";
function doStart(){var s=document.getElementById("str").value;origStr=s;T=["#"];for(var k=0;k<s.length;k++){T.push(s[k]);T.push("#");}N=T.length;P=new Array(N).fill(0);c=0;r=0;i=1;maxRad=0;bestC=0;phase="Running";stepLog="Transformed: "+T.join("")+". i=1, c=0, r=0.";updateInfo();render();}
function doStep(){if(phase==="Idle"||phase==="Done")return;if(i>=N){phase="Done";var start=Math.floor((bestC-maxRad)/2);var len=maxRad;stepLog="Done! Longest palindrome: \""+origStr.substr(start,len)+"\" (center="+bestC+", radius="+maxRad+")";updateInfo();render();return;}
if(!expandMode){mirror=2*c-i;if(r>i){var pm=P[mirror];var ri=r-i;if(pm<ri){P[i]=pm;stepLog="P["+i+"]=P[mirror="+mirror+"]="+pm+" (<r-i="+ri+"). No expansion needed.";i++;updateInfo();render();return;}else if(pm===ri){P[i]=pm;expandMode=true;stepLog="P["+i+"]="+pm+" (=r-i). Try expanding beyond r.";updateInfo();render();return;}else{P[i]=ri;stepLog="P["+i+"]=r-i="+ri+" (mirror exceeds). No expansion.";i++;updateInfo();render();return;}}else{expandMode=true;stepLog="r<=i, expanding from scratch at i="+i+".";}}
if(expandMode){var rad=P[i];var li=i-rad-1;var ri2=i+rad+1;if(li>=0&&ri2<N&&T[li]===T[ri2]){P[i]++;stepLog="Expand: T["+(li)+"]==T["+(ri2)+"] ("+T[li]+"). P["+i+"]="+P[i];updateInfo();render();return;}else{expandMode=false;stepLog="No more expansion. P["+i+"]="+P[i]+". Update c,r.";if(i+P[i]>r){c=i;r=i+P[i];}if(P[i]>maxRad){maxRad=P[i];bestC=i;}stepLog+=" c="+c+", r="+r; i++;updateInfo();render();return;}}}
function doRun(){running=true;var spd=parseInt(document.getElementById("spd").value)||300;tHandle=setInterval(function(){if(phase==="Done"||phase==="Idle"){clearInterval(tHandle);tHandle=null;running=false;render();return;}doStep();},spd);}
function doStop(){if(tHandle){clearInterval(tHandle);tHandle=null;}running=false;phase="Paused";updateInfo();render();}
function doReset(){if(tHandle){clearInterval(tHandle);tHandle=null;}running=false;phase="Idle";T=[];P=[];N=0;c=0;r=0;i=0;maxRad=0;bestC=0;expandMode=false;stepLog="";updateInfo();render();}
function updateInfo(){document.getElementById("nph").textContent=phase;document.getElementById("nc").textContent=phase==="Idle"?"—":c;document.getElementById("nr").textContent=phase==="Idle"?"—":r;document.getElementById("ni").textContent=phase==="Idle"||phase==="Done"?"—":i;document.getElementById("nmr").textContent=maxRad>0?maxRad:"—";document.getElementById("nbc").textContent=bestC>0||phase==="Done"?bestC:"—";if(phase==="Done"){var start=Math.floor((bestC-maxRad)/2);document.getElementById("nrs").textContent=origStr.substr(start,maxRad);}else{document.getElementById("nrs").textContent="—";}}
function render(){var canvas=document.getElementById("canv");var ctx=canvas.getContext("2d");ctx.fillStyle="#0c0a18";ctx.fillRect(0,0,W,H);if(N===0){ctx.fillStyle="#505080";ctx.font="14px monospace";ctx.textAlign="center";ctx.fillText("Enter a string and click Start",W/2,H/2);return;}
var cellW=Math.min(40,(W-60)/Math.max(N,1));var startX=(W-N*cellW)/2;var arrY=60;var palY=120;var maxP=Math.max.apply(null,P.length>0?P:[1]);var bestStart=bestC-maxRad;var bestEnd=bestC+maxRad;
for(var j=0;j<N;j++){var x=startX+j*cellW;var isCur=j===i&&phase!=="Done"&&phase!=="Idle";var isMirror=j===mirror&&phase==="Running"&&!expandMode;var isCenter=j===c&&phase!=="Idle";var isBest=phase==="Done"&&j>=bestStart&&j<=bestEnd;var isExp=expandMode&&(j===i-P[i]-1||j===i+P[i]+1);var col="#3a3a5a";if(isBest)col="#44ff88";else if(isCur)col="#ffdd44";else if(isExp)col="#ff4466";else if(isMirror)col="#ff66aa";else if(isCenter)col="#a855f7";else if(P[j]>0)col="#5bb9e6";ctx.fillStyle=col;ctx.fillRect(x+2,arrY,cellW-4,36);ctx.strokeStyle="#2a2a4a";ctx.lineWidth=1;ctx.strokeRect(x+2,arrY,cellW-4,36);ctx.fillStyle="#a0a0d0";ctx.font="14px monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(T[j],x+cellW/2,arrY+18);
if(P[j]>0||(j===i&&expandMode)){var bh=Math.min(80,(P[j]||0)/Math.max(maxP,1)*80);if(j===i&&expandMode&&P[i]===0)bh=4;ctx.fillStyle=col;ctx.fillRect(x+4,palY+80-bh,cellW-8,bh);ctx.strokeStyle="#2a2a4a";ctx.lineWidth=1;ctx.strokeRect(x+4,palY+80-bh,cellW-8,bh);}if(j===i&&phase!=="Idle"&&phase!=="Done"){ctx.strokeStyle="#ffdd44";ctx.lineWidth=1.5;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(x+cellW/2,arrY+40);ctx.lineTo(x+cellW/2,palY+90);ctx.stroke();ctx.setLineDash([]);}ctx.fillStyle="#505080";ctx.font="8px monospace";ctx.textAlign="center";ctx.textBaseline="top";ctx.fillText(j,x+cellW/2,arrY+40);}
ctx.fillStyle="#505080";ctx.font="9px monospace";ctx.textAlign="left";ctx.fillText("Transformed String T[]:",startX,arrY-18);ctx.fillText("Palindrome Radius P[]:",startX,palY-18);
if(expandMode){var lx=startX+(i-P[i]-1)*cellW+cellW/2;var rx=startX+(i+P[i]+1)*cellW+cellW/2;ctx.strokeStyle="#ff4466";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(lx,arrY+18);ctx.lineTo(rx,arrY+18);ctx.stroke();}
var logY=H-20;ctx.fillStyle="#ffdd44";ctx.font="10px monospace";ctx.textAlign="left";if(stepLog)ctx.fillText(stepLog.substring(0,120),20,logY);ctx.fillStyle="#505080";ctx.textAlign="right";ctx.fillText("N="+N+" c="+c+" r="+r,W-20,logY);}
render();
</script>
</body></html>
