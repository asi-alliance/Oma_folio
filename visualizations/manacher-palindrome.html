<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:20px;color:#ff66aa;text-shadow:0 0 10px #ff44aa;letter-spacing:2px}.sub{text-align:center;font-size:11px;color:#505080;margin-bottom:12px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}#ctl button{padding:7px 14px;border:1px solid #2a2a4a;border-radius:10px;background:#0c0a18;color:#505080;font-size:11px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#ff66aa}#ctl label{font-size:10px;color:#505080}#ctl input{width:200px;padding:5px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;color:#a0a0d0;font-size:12px}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:380px}#info{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;padding:8px 12px;font-size:10px;color:#505080}.ib .v{font-size:14px;color:#ffbb55}.leg{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}.leg span{font-size:10px;color:#505080}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}</style><div id=app><h1>Oma: Manacher Palindrome</h1><div class=sub>Find longest palindromic substring using center expansion with mirror optimization. Transformed string uses # separators.</div><div id=ctl><label>String:</label><input id=txt value=babad><button onclick=doGenerate()>Generate</button><button onclick=doStep()>Step</button><button onclick=doRun()>Auto Run</button><button onclick=doStop()>Stop</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=90 style=width:45px></div><canvas id=canv width=960 height=380></canvas><div id=info><div class=ib><div>Phase</div><div class=v id=nph>Idle</div></div><div class=ib><div>Center</div><div class=v id=ncn>—</div></div><div class=ib><div>Radius</div><div class=v id=nra>—</div></div><div class=ib><div>Max Palindrome</div><div class=v id=nmp>—</div></div><div class=ib><div>Mirror Used</div><div class=v id=nmu>No</div></div></div><div class=leg><span><span class=dot style=background:#3a3a5a></span>Unvisited</span><span><span class=dot style=background:#ffdd44></span>Current Center</span><span><span class=dot style=background:#ff66aa></span>Expanding</span><span><span class=dot style=background:#44ff88></span>Palindrome Range</span><span><span class=dot style=background:#5bb9e6></span>Mirror</span></div></div><script>
var W=960,H=380;var inputStr="babad";var tStr=[];var P=[];var C=0,R=0;var i=0;var phase="Idle";var running=false;var timer=null;var maxLen=0;var maxCenter=0;var expandL=-1,expandR=-1;var mirrorIdx=-1;
function doGenerate(){inputStr=document.getElementById("txt").value||"babad";tStr=["^"];for(var k=0;k<inputStr.length;k++){tStr.push("#");tStr.push(inputStr[k]);}tStr.push("#");tStr.push("$");P=[];for(k=0;k<tStr.length;k++)P[k]=0;C=0;R=0;i=1;phase="Scanning";maxLen=0;maxCenter=0;expandL=-1;expandR=-1;mirrorIdx=-1;updateInfo();render();}
function doStep(){if(phase==="Idle"){doGenerate();return;}if(phase==="Done")return;var n=tStr.length;if(i>=n-1){phase="Done";updateInfo();render();return;}if(expandL===-1){if(R>i&&P[2*C-i]<R-i){P[i]=P[2*C-i];mirrorIdx=2*C-i;i++;updateInfo();render();return;}var start=Math.max(1,R-i);expandL=i-start;expandR=i+start;phase="Expanding";}var match=tStr[expandL]===tStr[expandR];if(match){P[i]++;expandL--;expandR++;if(expandL<0||expandR>=n)match=false;}if(!match){if(i+P[i]>R){C=i;R=i+P[i];}if(P[i]>maxLen){maxLen=P[i];maxCenter=i;}i++;expandL=-1;expandR=-1;mirrorIdx=-1;phase="Scanning";}updateInfo();render();}
function doRun(){if(phase==="Idle")doGenerate();running=true;var spd=parseInt(document.getElementById("spd").value)||90;timer=setInterval(function(){if(phase==="Done"){clearInterval(timer);timer=null;running=false;return;}doStep();},spd);}
function doStop(){if(timer){clearInterval(timer);timer=null;}running=false;phase="Paused";updateInfo();render();}
function doReset(){if(timer){clearInterval(timer);timer=null;}running=false;phase="Idle";C=0;R=0;i=0;P=[];maxLen=0;maxCenter=0;expandL=-1;expandR=-1;updateInfo();render();}
function updateInfo(){document.getElementById("nph").textContent=phase;document.getElementById("ncn").textContent=i<tStr.length?i:"—";document.getElementById("nra").textContent=expandL>=0?P[i]+1:P[i]||"—";var palStart=Math.floor((maxCenter-maxLen)/2);var palEnd=Math.floor((maxCenter+maxLen)/2);document.getElementById("nmp").textContent=maxLen>0?inputStr.substring(palStart,palEnd):"—";document.getElementById("nmu").textContent=mirrorIdx>=0?"Yes (idx "+mirrorIdx+")":"No";}
function render(){var canvas=document.getElementById("canv");var ctx=canvas.getContext("2d");ctx.fillStyle="#0c0a18";ctx.fillRect(0,0,W,H);if(phase==="Idle"){ctx.fillStyle="#505080";ctx.font="14px monospace";ctx.textAlign="center";ctx.fillText("Enter a string and click Generate",W/2,H/2);return;}var n=tStr.length;var cellW=Math.min(40,(W-20)/n);var startX=(W-(n*cellW))/2;var y=60;for(var k=0;k<n;k++){var x=startX+k*cellW;var isCurrent=k===i;var isCenter=k===C;var isMirror=k===mirrorIdx;var inMaxPal=k>=maxCenter-maxLen&&k<=maxCenter+maxLen&&maxLen>0;var inExpand=expandL>=0&&k>=expandL&&k<=expandR;ctx.fillStyle="#0c0a18";ctx.strokeStyle=isCurrent?"#ffdd44":isMirror?"#5bb9e6":inExpand?"#ff66aa":inMaxPal?"#44ff88":"#2a2a4a";ctx.lineWidth=isCurrent?3:isMirror?2:1;ctx.fillRect(x+1,y,cellW-2,36);ctx.strokeRect(x+1,y,cellW-2,36);ctx.fillStyle=inMaxPal?"#44ff88":inExpand?"#ff66aa":isCurrent?"#ffdd44":"#a0a0d0";ctx.font="13px monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(tStr[k],x+cellW/2,y+18);if(P[k]>0){ctx.fillStyle="#5bb9e6";ctx.font="9px monospace";ctx.fillText(P[k],x+cellW/2,y+50);}if(k===C){ctx.strokeStyle="#ffaa44";ctx.lineWidth=1;ctx.beginPath();ctx.arc(x+cellW/2,y+18,18,0,Math.PI*2);ctx.stroke();}}ctx.fillStyle="#505080";ctx.font="10px monospace";ctx.textAlign="left";ctx.fillText("Transformed: "+tStr.join(""),10,H-28);ctx.fillText("Center="+C+" Right="+R,10,H-12);if(phase==="Done"){var ps=Math.floor((maxCenter-maxLen)/2);var pe=Math.floor((maxCenter+maxLen)/2);ctx.fillStyle="#44ff88";ctx.font="bold 13px monospace";ctx.textAlign="center";ctx.fillText("Longest palindrome: \""+inputStr.substring(ps,pe)+"\" (len="+maxLen+")",W/2,H-4);}}
render();
</script>
</body></html>
