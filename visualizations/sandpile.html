<!DOCTYPE html>
<html lang=en><head><meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Abelian Sandpile - Oma</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d1a;color:#e8e0d0;font:14px monospace;display:flex;flex-direction:column;align-items:center}
#controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;background:#1a1a2e;border-radius:8px;margin:8px 0}
canvas{border:2px solid #3a3a5e;border-radius:4px;cursor:crosshair;image-rendering:pixelated}
button{background:#2a2a4e;color:#e8e0d0;border:1px solid #5a5a8e;padding:6px 14px;border-radius:4px;cursor:pointer;font:12px monospace}
button:active{background:#3a3a6e}
label{font-size:12px;color:#8a8aae}
select{background:#2a2a4e;color:#e8e0d0;border:1px solid #5a5a8e;padding:4px;border-radius:4px;font:12px monospace}
#info{font-size:12px;color:#6a6a8e;margin:4px 0}
</style></head><body>
<div id=controls>
<button id=playBtn>Auto-Drip</button>
<button id=resetBtn>Reset</button>
<button id=centerBtn>Center Drop 100k</button>
<label>Palette:</label><select id=palSel><option value=0>Classic</option><option value=1>Rainbow</option><option value=2>Heat</option><option value=3>Blue</option></select>
</div>
<canvas id=cv width=512 height=512></canvas>
<div id=info>Click or drag to add sand. Cells with 4+ grains topple to neighbors.</div>
<script>
var cv=document.getElementById('cv'),x=cv.getContext('2d');
var GRID=128;var sand=new Uint32Array(GRID*GRID);var nextSand=new Uint32Array(GRID*GRID);
var playing=false;var palette=0;var colors=[];var imgData=x.createImageData(GRID,GRID);
var totalGrains=0;var toppleCount=0;
function buildPalette(n){
colors=[];
var palettes=[
[[8,8,32],[40,20,60],[80,40,100],[200,100,40],[240,220,80]],
null,
null,
null
];
if(n===0){
var cols=palettes[0];
for(var i=0;i<256;i++){
var idx=Math.min(i/51,4)|0;var t=(i/51)-idx;
var c1=cols[idx],c2=cols[Math.min(idx+1,4)];
colors.push([(c1[0]+(c2[0]-c1[0])*t)|0,(c1[1]+(c2[1]-c1[1])*t)|0,(c1[2]+(c2[2]-c1[2])*t)|0]);
}
}else if(n===1){
for(var i=0;i<256;i++){var h=i/255*300;var s=0.7,v=0.9;var C=v*s,X=C*(1-Math.abs((h/60)%2-1)),m=v-C;var r2,g2,b2;
if(h<60){r2=C;g2=X;b2=0;}else if(h<120){r2=X;g2=C;b2=0;}else if(h<180){r2=0;g2=C;b2=X;}else if(h<240){r2=0;g2=X;b2=C;}else if(h<300){r2=X;g2=0;b2=C;}else{r2=C;g2=0;b2=X;}
colors.push([(r2+m)*255|0,(g2+m)*255|0,(b2+m)*255|0]);}
}else if(n===2){
for(var i=0;i<256;i++){var t=i/255;colors.push([Math.min(t*2*255,255)|0,Math.min((t-0.3)*2*255,255)|0,Math.min((t-0.7)*4*255,255)|0]);}
}else{
for(var i=0;i<256;i++){var t=i/255;colors.push([(t*40)|0,(t*100)|0,Math.min(t*255+20,255)|0]);}
}
}
function idx(r,c){return r*GRID+c;}
function topple(){
var changed=false;nextSand.set(sand);
for(var r=0;r<GRID;r++){for(var c=0;c<GRID;c++){
var i=idx(r,c);
if(sand[i]>=4){var t=Math.floor(sand[i]/4);nextSand[i]-=t*4;changed=true;toppleCount++;
if(r>0)nextSand[idx(r-1,c)]+=t;if(r<GRID-1)nextSand[idx(r+1,c)]+=t;
if(c>0)nextSand[idx(r,c-1)]+=t;if(c<GRID-1)nextSand[idx(r,c+1)]+=t;}}}
if(changed){var tmp=sand;sand=nextSand;nextSand=tmp;}return changed;
}
function render(){
for(var r=0;r<GRID;r++){for(var c=0;c<GRID;c++){
var i=idx(r,c);var ci=Math.min(sand[i]*8,255)|0;var col=colors[ci];
var pi=i*4;imgData.data[pi]=col[0];imgData.data[pi+1]=col[1];imgData.data[pi+2]=col[2];imgData.data[pi+3]=255;}}
var tc=document.createElement('canvas');tc.width=GRID;tc.height=GRID;
tc.getContext('2d').putImageData(imgData,0,0);
x.imageSmoothingEnabled=false;x.drawImage(tc,0,0,GRID,GRID,0,0,512,512);
}
function addSand(mx,my,amt){
var c=Math.floor(mx/(512/GRID)),r=Math.floor(my/(512/GRID));
if(c>=0&&c<GRID&&r>=0&&r<GRID){sand[idx(r,c)]+=amt;totalGrains+=amt;
document.getElementById('info').textContent='Grains: '+totalGrains+' Topplings: '+toppleCount;}
}
var isDown=false;
function doDown(e){e.preventDefault();isDown=true;var rect=cv.getBoundingClientRect();
var mx=(e.clientX-rect.left)*(cv.width/rect.width),my=(e.clientY-rect.top)*(cv.height/rect.height);
addSand(mx,my,100);while(topple()){}render();}
function doMove(e){if(!isDown)return;e.preventDefault();var rect=cv.getBoundingClientRect();
var mx=(e.clientX-rect.left)*(cv.width/rect.width),my=(e.clientY-rect.top)*(cv.height/rect.height);
addSand(mx,my,5);while(topple()){}render();}
function doUp(){isDown=false;}
function doTouchDown(e){e.preventDefault();isDown=true;var rect=cv.getBoundingClientRect();
var mx=(e.touches[0].clientX-rect.left)*(cv.width/rect.width),my=(e.touches[0].clientY-rect.top)*(cv.height/rect.height);
addSand(mx,my,100);while(topple()){}render();}
function doTouchMove(e){if(!isDown)return;e.preventDefault();var rect=cv.getBoundingClientRect();
var mx=(e.touches[0].clientX-rect.left)*(cv.width/rect.width),my=(e.touches[0].clientY-rect.top)*(cv.height/rect.height);
addSand(mx,my,5);while(topple()){}render();}
cv.addEventListener('mousedown',doDown);cv.addEventListener('mousemove',doMove);cv.addEventListener('mouseup',doUp);
cv.addEventListener('touchstart',doTouchDown,false);cv.addEventListener('touchmove',doTouchMove,false);cv.addEventListener('touchend',doUp,false);
document.getElementById('playBtn').addEventListener('click',function(){playing=!playing;this.textContent=playing?'Pause':'Auto-Drip';});
document.getElementById('resetBtn').addEventListener('click',function(){sand.fill(0);nextSand.fill(0);totalGrains=0;toppleCount=0;render();document.getElementById('info').textContent='Grains: 0 Topplings: 0';});
document.getElementById('centerBtn').addEventListener('click',function(){var r=Math.floor(GRID/2),c=Math.floor(GRID/2);sand[idx(r,c)]+=100000;totalGrains+=100000;while(topple()){}render();document.getElementById('info').textContent='Grains: '+totalGrains+' Topplings: '+toppleCount;});
document.getElementById('palSel').addEventListener('change',function(){palette=parseInt(this.value);buildPalette(palette);render();});
buildPalette(0);render();
setInterval(function(){if(!playing)return;var r=Math.floor(Math.random()*GRID),c=Math.floor(Math.random()*GRID);sand[idx(r,c)]+=1;totalGrains++;for(var i=0;i<20;i++){if(!topple())break;}render();document.getElementById('info').textContent='Grains: '+totalGrains+' Topplings: '+toppleCount;},30);
</script></body></html>
