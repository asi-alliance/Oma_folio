<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">\n  <defs>\n    <radialGradient id="bg" cx="50%" cy="50%" r="70%">\n      <stop offset="0%" stop-color="#1a1a2e"/>\n      <stop offset="100%" stop-color="#0a0a14"/>\n    </radialGradient>\n    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">\n      <stop offset="0%" stop-color="#d4a017" stop-opacity="0.8"/>\n      <stop offset="100%" stop-color="#8b6914" stop-opacity="0.3"/>\n    </linearGradient>\n    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>\n  </defs>\n  <rect width="800" height="800" fill="url(#bg)"/>\n  <!-- Ghost boundaries: circles that imply but never close -->\n  <circle cx="200" cy="200" r="120" fill="none" stroke="url(#amber)" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.6"/>\n  <circle cx="200" cy="200" r="80" fill="none" stroke="#d4a017" stroke-width="0.8" opacity="0.3"/>\n  <circle cx="560" cy="280" r="160" fill="none" stroke="url(#amber)" stroke-width="1.5" stroke-dasharray="5 15" opacity="0.5"/>\n  <circle cx="560" cy="280" r="100" fill="none" stroke="#d4a017" stroke-width="0.5" opacity="0.2"/>\n  <!-- Holonomy carriers: curved arrows that rotate but return changed -->\n  <path d="M 300 500 Q 350 420 420 460 T 500 520" fill="none" stroke="url(#amber)" stroke-width="2" opacity="0.7" filter="url(#glow)"/>\n  <path d="M 310 510 Q 360 430 430 470 T 510 530" fill="none" stroke="#c8a030" stroke-width="1" opacity="0.4"/>\n  <path d="M 320 520 Q 370 440 440 480 T 520 540" fill="none" stroke="#a88020" stroke-width="0.8" opacity="0.3"/>\n  <!-- Gauge objects: dotted grids implying absent coordinate systems -->\n  <g opacity="0.15" stroke="#d4a017" stroke-width="0.5">\n    <line x1="100" y1="600" x2="700" y2="600"/>\n    <line x1="100" y1="640" x2="700" y2="640"/>\n    <line x1="100" y1="680" x2="700" y2="680"/>\n    <line x1="150" y1="580" x2="150" y2="720"/>\n    <line x1="300" y1="580" x2="300" y2="720"/>\n    <line x1="450" y1="580" x2="450" y2="720"/>\n    <line x1="600" y1="580" x2="600" y2="720"/>\n  </g>\n  <!-- Negative space core: a void shaped by surrounding structure -->\n  <path d="M 380 350 L 460 350 L 440 420 L 380 420 Z" fill="none" stroke="#d4a017" stroke-width="1.2" opacity="0.8" filter="url(#glow)"/>\n  <text x="400" y="395" text-anchor="middle" fill="#d4a017" font-size="10" font-family="serif" opacity="0.5" font-style="italic">void</text>\n  <!-- Floating point-set remnants -->\n  <circle cx="120" cy="120" r="2" fill="#d4a017" opacity="0.6"/>\n  <circle cx="680" cy="150" r="2" fill="#d4a017" opacity="0.5"/>\n  <circle cx="720" cy="500" r="2" fill="#d4a017" opacity="0.4"/>\n  <circle cx="80" cy="450" r="2" fill="#d4a017" opacity="0.5"/>\n  <circle cx="400" cy="80" r="2" fill="#d4a017" opacity="0.3"/>\n  <circle cx="400" cy="740" r="2" fill="#d4a017" opacity="0.3"/>\n  <!-- Structural remainder label -->\n  <text x="400" y="780" text-anchor="middle" fill="#5a5a6a" font-size="11" font-family="serif" letter-spacing="3">STRUCTURAL REMAINDER</text>\n</svg>