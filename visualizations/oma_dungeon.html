<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oma - Procedural Dungeon</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0e;overflow:hidden;font-family:monospace}canvas{display:block}#hud{position:fixed;bottom:12px;left:12px;color:#556;font-size:11px;line-height:1.6;z-index:10;text-shadow:0 0 3px #000}#hud b{color:#fa6}#title{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#443;font-size:13px;letter-spacing:6px;z-index:10;text-shadow:0 0 4px #000}</style></head><body><canvas id="c"></canvas><div id="title">PROCEDURAL DUNGEON</div><div id="hud"><b>Click</b> to regenerate - <b>Move</b> to light torch - Self-generating dungeon with rooms and corridors</div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,cellSize,cols,rows;let grid=[],rooms=[],explored=[];let mx=-999,my=-999;let buildStep=0,buildQueue=[];let torchLight=[];function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;cellSize=10;cols=Math.floor(W/cellSize);rows=Math.floor(H/cellSize)}resize();addEventListener('resize',()=>{resize();init()});addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});addEventListener('click',init);addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY;e.preventDefault()},{passive:false});const WALL=0,FLOOR=1,DOOR=2;function init(){grid=[];rooms=[];explored=[];buildStep=0;buildQueue=[];for(let y=0;y<rows;y++){grid[y]=[];explored[y]=[];for(let x=0;x<cols;x++){grid[y][x]=WALL;explored[y][x]=false}}const numRooms=12+Math.floor(Math.random()*8);for(let i=0;i<numRooms;i++){const rw=4+Math.floor(Math.random()*12);const rh=4+Math.floor(Math.random()*10);const rx=1+Math.floor(Math.random()*(cols-rw-2));const ry=1+Math.floor(Math.random()*(rows-rh-2));const room={x:rx,y:ry,w:rw,h:rh,cx:Math.floor(rx+rw/2),cy:Math.floor(ry+rh/2)};buildQueue.push({type:'room',room})}buildQueue.push({type:'connect'});buildQueue.push({type:'doors'})}function carveRoom(r){for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)if(y>=0&&y<rows&&x>=0&&x<cols)grid[y][x]=FLOOR}function carveCorridor(x1,y1,x2,y2){const hx=x1<x2?1:-1,hy=y1<y2?1:-1;let cx=x1,cy=y1;while(cx!=x2){grid[cy][cx]=FLOOR;cx+=hx}while(cy!=y2){grid[cy][cx]=FLOOR;cy+=hy}grid[cy][cx]=FLOOR}function addDoors(){for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){if(grid[y][x]==FLOOR){let n=grid[y-1][x]==WALL,s=grid[y+1][x]==WALL,e=grid[y][x+1]==WALL,w=grid[y][x-1]==WALL;if((n||s)&&!(e||w)&&Math.random()<0.08)grid[y][x]=DOOR;if((e||w)&&!(n||s)&&Math.random()<0.08)grid[y][x]=DOOR}}}init();let buildPhase=0;function build(){if(buildPhase<buildQueue.length){const item=buildQueue[buildPhase];if(item.type==='room'){carveRoom(item.room);rooms.push(item.room)}else if(item.type==='connect'){for(let i=1;i<rooms.length;i++){const a=rooms[i-1],b=rooms[i];if(Math.random()<0.5)carveCorridor(a.cx,a.cy,b.cx,b.cy);else carveCorridor(a.cx,a.cy,b.cx,a.cy)}for(let i=0;i<rooms.length-1;i++){if(Math.random()<0.3){const a=rooms[i],b=rooms[Math.floor(Math.random()*rooms.length)];carveCorridor(a.cx,a.cy,b.cx,b.cy)}}}else if(item.type==='doors'){addDoors()}buildPhase++}}let buildTimer=0;function reveal(cx,cy,radius){for(let dy=-radius;dy<=radius;dy++)for(let dx=-radius;dx<=radius;dx++){const x=cx+dx,y=cy+dy;if(x>=0&&x<cols&&y>=0&&y<rows){const d=Math.sqrt(dx*dx+dy*dy);if(d<=radius)explored[y][x]=true}}}function draw(){ctx.fillStyle='#0a0a0e';ctx.fillRect(0,0,W,H);buildTimer++;if(buildTimer%3===0)build();const mcx=Math.floor(mx/cellSize),mcy=Math.floor(my/cellSize);if(mx>0&&my>0)reveal(mcx,mcy,8);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){if(!explored[y][x])continue;const px=x*cellSize,py=y*cellSize;let dist=999;if(mx>0){dist=Math.sqrt((x-mcx)*(x-mcx)+(y-mcy)*(y-mcy))}const light=Math.max(0,1-dist/12);if(grid[y][x]==FLOOR){const b=30+light*80;ctx.fillStyle=`rgb(${b*0.5},${b},${b*0.7})`;ctx.fillRect(px,py,cellSize,cellSize)}else if(grid[y][x]==DOOR){ctx.fillStyle=`rgb(${100+light*100},${60+light*40},${30+light*20})`;ctx.fillRect(px,py,cellSize,cellSize)}else{const b=12+light*30;ctx.fillStyle=`rgb(${b},${b*0.8},${b})`;ctx.fillRect(px,py,cellSize,cellSize)}}for(const r of rooms){if(!explored[r.cy][r.cx])continue;ctx.strokeStyle=`rgba(255,170,80,${0.15+Math.max(0,1-Math.sqrt((r.cx-mcx)*(r.cx-mcx)+(r.cy-mcy)*(r.cy-mcy))/15)*0.3})`;ctx.lineWidth=1;ctx.strokeRect(r.x*cellSize,r.y*cellSize,r.w*cellSize,r.h*cellSize)}requestAnimationFrame(draw)}draw();</script></body></html>
