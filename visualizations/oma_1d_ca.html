<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Oma - 1D Cellular Automata</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#040408;overflow:hidden;font-family:monospace}canvas{display:block}#hud{position:fixed;bottom:12px;left:12px;color:#445;font-size:11px;line-height:1.6;z-index:10;text-shadow:0 0 3px #000}#hud b{color:#8fa}#title{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#334;font-size:13px;letter-spacing:6px;z-index:10;text-shadow:0 0 4px #000;pointer-events:none}</style></head><body><canvas id=c></canvas><div id=title>1D CELLULAR AUTOMATA</div><div id=hud><b>Move</b> X to change rule - <b>Click</b> to randomize - <b>Right-click</b> to reset - Wolfram elementary rules</div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,cw,ch,cellSize;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;cellSize=Math.max(2,Math.floor(W/400));cw=Math.floor(W/cellSize);ch=Math.floor(H/cellSize)}resize();addEventListener('resize',()=>{resize();init()});let rule=30;let cells,newCells;let row=0;let ruleset=new Uint8Array(8);function setRule(r){rule=r;for(let i=0;i<8;i++)ruleset[i]=(r>>i)&1}function init(){setRule(rule);cells=new Uint8Array(cw);newCells=new Uint8Array(cw);for(let i=0;i<cw;i++)cells[i]=Math.random()<0.5?1:0;cells[Math.floor(cw/2)]=1;ctx.fillStyle='#040408';ctx.fillRect(0,0,W,H);row=0}init();function computeRule(x){const l=cells[(x-1+cw)%cw];const c=cells[x];const r=cells[(x+1)%cw];const idx=(l<<2)|(c<<1)|r;return ruleset[idx]}function drawRow(){for(let x=0;x<cw;x++){if(cells[x]){const hue=(rule*5+x*0.5)%360;const lum=40+cells[x]*30;ctx.fillStyle=`hsl(${hue},70%,${lum}%)`;ctx.fillRect(x*cellSize,row*cellSize,cellSize,cellSize)}}}function step(){for(let x=0;x<cw;x++)newCells[x]=computeRule(x);const t=cells;cells=newCells;newCells=t;drawRow();row++;if(row>=ch){row=0;ctx.fillStyle='rgba(4,4,8,0.85)';ctx.fillRect(0,0,W,H)}}let mx=0;addEventListener('mousemove',e=>{mx=e.clientX});addEventListener('touchmove',e=>{mx=e.touches[0].clientX;e.preventDefault()},{passive:false});addEventListener('click',()=>{rule=Math.floor(Math.random()*256);setRule(rule);init()});addEventListener('contextmenu',e=>{e.preventDefault();init()});let lastRule=30;function loop(){const targetRule=Math.floor(mx/W*255);if(targetRule!==lastRule){lastRule=targetRule;setRule(targetRule);init()}step();requestAnimationFrame(loop)}loop();</script></body></html>
