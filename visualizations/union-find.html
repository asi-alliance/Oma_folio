<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl input{width:60px;padding:6px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px;text-align:center}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#7a5adf}#ctl button.active{background:#7a7aff;color:#08060f}#ctl label{font-size:11px;color:#505080}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:480px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}#log{margin-top:12px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:12px;font-size:12px;color:#505080;min-height:40px;max-height:100px;overflow-y:auto}</style><div id=app><h1>Oma: Union-Find (DSU)</h1><div class=sub>Disjoint Set Union — union by rank + path compression. Watch trees merge and flatten!</div><div id=ctl><label>A:</label><input id=aIdx value=1><label>B:</label><input id=bIdx value=5><button onclick=doUnion() class=active>Union</button><button onclick=doFind()>Find</button><button onclick=doConnected()>Connected?</button><button onclick=doRandom()>Random Unions</button><button onclick=doReset()>Reset</button></div><canvas id=canv width=960 height=480></canvas><div id=info><div class=ib><div>Elements</div><div class=v id=nel>16</div></div><div class=ib><div>Components</div><div class=v id=ncomp>16</div></div><div class=ib><div>Last Op</div><div class=v id=lo>-</div></div><div class=ib><div>Result</div><div class=v id=res>-</div></div></div><div class=leg><span><span class=dot style=background:#2a2a4a></span>Idle</span><span><span class=dot style=background:#ffdd44></span>Visited</span><span><span class=dot style=background:#7a7aff></span>Current</span><span><span class=dot style=background:#44ff88></span>Root/Result</span><span><span class=dot style=background:#ff4466></span>Compressed</span></div><div id=log>Ready. Try a union or find operation!</div></div>
<script>var N=16;var parent=new Array(N);var rank=new Array(N).fill(0);var visited=[];var current=-1;var resultNodes=[];var compressedNodes=[];var animTimer=null;var logMsgs=[];var positions=[];function init(){for(var i=0;i<N;i++){parent[i]=i;rank[i]=0;}positions=[];for(var i=0;i<N;i++){var angle=(i/N)*2*Math.PI;positions.push({x:480+200*Math.cos(angle),y:240+120*Math.sin(angle)});}}function find(x){visited=[];current=-1;resultNodes=[];compressedNodes=[];var path=[];var root=x;while(parent[root]!==root){path.push(root);root=parent[root];}path.push(root);var si=0;if(animTimer)clearInterval(animTimer);animTimer=setInterval(function(){if(si>=path.length){clearInterval(animTimer);animTimer=null;for(var k=0;k<path.length-1;k++)parent[path[k]]=root;compressedNodes=path.slice(0,-1);resultNodes=[root];current=-1;render();document.getElementById(res).textContent=root;return;}visited=path.slice(0,si);current=path[si];si++;render();},300);return root;}function union(a,b){visited=[];current=-1;resultNodes=[];compressedNodes=[];var rootA=findRoot(a);var rootB=findRoot(b);if(rootA===rootB){log(Union(+a+,+b+) already same set);return;}var steps=[];if(rank[rootA]<rank[rootB]){parent[rootA]=rootB;steps.push({from:rootA,to:rootB});}else if(rank[rootA]>rank[rootB]){parent[rootB]=rootA;steps.push({from:rootB,to:rootA});}else{parent[rootB]=rootA;rank[rootA]++;steps.push({from:rootB,to:rootA});}resultNodes=[rootA,rootB];var si=0;if(animTimer)clearInterval(animTimer);animTimer=setInterval(function(){if(si>=steps.length){clearInterval(animTimer);animTimer=null;current=-1;render();return;}var s=steps[si];current=s.to;visited=[s.from];si++;render();},500);log(Union(+a+,+b+): root+rootA+ + root+rootB);updateInfo();}function findRoot(x){while(parent[x]!==x)x=parent[x];return x;}function countComponents(){var s=new Set();for(var i=0;i<N;i++)s.add(findRoot(i));return s.size;}function render(){var c=document.getElementById(canv);var ctx=c.getContext(2d);ctx.fillStyle=#0c0a18;ctx.fillRect(0,0,960,480);for(var i=0;i<N;i++){if(parent[i]!==i){var from=positions[i];var to=positions[parent[i]];ctx.strokeStyle=#2a2a4a;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y);ctx.stroke();}}var hueOffset=0;var rootMap={};var compColors=[];for(var i=0;i<N;i++){var r=findRoot(i);if(!(r in rootMap)){rootMap[r]=compColors.length;compColors.push(hueOffset);hueOffset+=47;}}for(var i=0;i<N;i++){var p=positions[i];var isVisited=visited.indexOf(i)>=0;var isCurrent=current===i;var isResult=resultNodes.indexOf(i)>=0;var isCompressed=compressedNodes.indexOf(i)>=0;var col=#2a2a4a;if(isCompressed)col=#ff4466;else if(isResult)col=#44ff88;else if(isCurrent)col=#7a7aff;else if(isVisited)col=#ffdd44;else{var r=findRoot(i);var ci=rootMap[r];col=hsl(+compColors[ci]+,40%,25%);}ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,20,0,2*Math.PI);ctx.fill();ctx.strokeStyle=col==#2a2a4a?#2a2a4a:#1a1a28;ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=col==#2a2a4a?#505080:#08060f;ctx.font=12px monospace;ctx.textAlign=center;ctx.textBaseline=middle;ctx.fillText(i,p.x,p.y);if(parent[i]===i){ctx.fillStyle=#7a7aff;ctx.font=9px monospace;ctx.fillText(r+rank[+rank[i]+],p.x,p.y+32);}}updateInfo();}function updateInfo(){document.getElementById(nel).textContent=N;document.getElementById(ncomp).textContent=countComponents();document.getElementById(lo).textContent=logMsgs.length>0?logMsgs[logMsgs.length-1]:-;}function log(msg){logMsgs.push(msg);var el=document.getElementById(log);el.innerHTML=logMsgs.slice(-5).join(<br>);el.scrollTop=el.scrollHeight;}function doUnion(){var a=parseInt(document.getElementById(aIdx).value);var b=parseInt(document.getElementById(bIdx).value);if(a<0||a>=N||b<0||b>=N)return;union(a,b);document.getElementById(lo).textContent=Union(+a+,+b);}function doFind(){var a=parseInt(document.getElementById(aIdx).value);if(a<0||a>=N)return;find(a);document.getElementById(lo).textContent=Find(+a+);log(Find(+a+): traversing to root...);}function doConnected(){var a=parseInt(document.getElementById(aIdx).value);var b=parseInt(document.getElementById(bIdx).value);if(a<0||a>=N||b<0||b>=N)return;var ra=findRoot(a);var rb=findRoot(b);var conn=ra===rb;document.getElementById(res).textContent=conn?Yes:No;log(Connected(+a+,+b+)?+conn+ (roots +ra+,+rb+));document.getElementById(lo).textContent=Connected?+conn;}function doRandom(){init();var unions=Math.floor(N*0.8);for(var k=0;k<unions;k++){var a=Math.floor(Math.random()*N);var b=Math.floor(Math.random()*N);var ra=findRoot(a);var rb=findRoot(b);if(ra!==rb)union(ra,rb);}log(Random unions performed);render();document.getElementById(lo).textContent=Randomized;}function doReset(){init();logMsgs=[];clearHighlights();log(Reset: all singletons);render();document.getElementById(res).textContent=-;document.getElementById(lo).textContent=Reset;}function clearHighlights(){visited=[];current=-1;resultNodes=[];compressedNodes=[];}init();render();</script></body></html>
