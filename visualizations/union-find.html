<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:20px;color:#ff66aa;text-shadow:0 0 10px #ff44aa;letter-spacing:2px}.sub{text-align:center;font-size:11px;color:#505080;margin-bottom:12px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}#ctl button{padding:7px 14px;border:1px solid #2a2a4a;border-radius:10px;background:#0c0a18;color:#505080;font-size:11px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#ff66aa}#ctl label{font-size:10px;color:#505080}#ctl input{padding:5px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;color:#a0a0d0;font-size:12px}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:420px}#info{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;padding:8px 12px;font-size:10px;color:#505080}.ib .v{font-size:14px;color:#ffbb55}.leg{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}.leg span{font-size:10px;color:#505080}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}</style><div id=app><h1>Oma: Union-Find / Disjoint Set Union</h1><div class=sub>Union-Find with path compression and union by rank. Click Union to merge sets, Find to trace roots. Nearly O(1) amortized per operation.</div><div id=ctl><label>Elements:</label><input id=nelem value=12 style=width:50px><button onclick=doInit()>Init</button><label>Union A:</label><input id=ua value=3 style=width:35px><label>B:</label><input id=ub value=7 style=width:35px><button onclick=doUnion()>Union</button><label>Find:</label><input id=fe value=5 style=width:35px><button onclick=doFind()>Find</button><button onclick=doRandom()>Random Unions</button><button onclick=doReset()>Reset</button></div><canvas id=canv width=960 height=420></canvas><div id=info><div class=ib><div>Sets</div><div class=v id=nsets>0</div></div><div class=ib><div>Unions</div><div class=v id=nu>0</div></div><div class=ib><div>Finds</div><div class=v id=nf>0</div></div><div class=ib><div>Path Compressions</div><div class=v id=npc>0</div></div><div class=ib><div>Last Op</div><div class=v id=nlo>None</div></div></div><div class=leg><span><span class=dot style=background:#3a3a5a></span>Node</span><span><span class=dot style=background:#ffdd44></span>Active/Root</span><span><span class=dot style=background:#44ff88></span>Same Set</span><span><span class=dot style=background:#ff66aa></span>Path Traced</span><span><span class=dot style=background:#5bb9e6></span>Root</span></div></div><script>
var W=960,H=420;var parent=[];var rank=[];var n=12;var unions=0;var finds=0;var compressions=0;var lastOp="None";var highlightPath=[];var highlightSet=new Set();var rootHighlight=-1;var nodes=[];
function doInit(){n=parseInt(document.getElementById('nelem').value)||12;parent=[];rank=[];nodes=[];for(var i=0;i<n;i++){parent[i]=i;rank[i]=0;nodes[i]={x:0,y:0,vx:0,vy:0};}layoutNodes();unions=0;finds=0;compressions=0;lastOp="Init "+n+" elements";highlightPath=[];highlightSet=new Set();rootHighlight=-1;updateInfo();render();}
function layoutNodes(){var cols=Math.ceil(Math.sqrt(n));var spacing=Math.min(70,(W-80)/cols);var startX=(W-n*spacing)/2+spacing/2;for(var i=0;i<n;i++){var col=i%cols;var row=Math.floor(i/cols);nodes[i].x=startX+col*spacing;nodes[i].y=80+row*spacing;nodes[i].vx=0;nodes[i].vy=0;}}
function find(x){var path=[];while(parent[x]!==x){path.push(x);x=parent[x];}return {root:x,path:path};}
function findCompress(x){var path=[];var root=x;while(parent[root]!==root){path.push(root);root=parent[root];}for(var i=0;i<path.length;i++){if(parent[path[i]]!==root){compressions++;}parent[path[i]]=root;}return {root:root,path:path};}
function getSetMembers(root){var members=[];for(var i=0;i<n;i++){if(find(i).root===root)members.push(i);}return members;}
function doUnion(){var a=parseInt(document.getElementById('ua').value);var b=parseInt(document.getElementById('ub').value);if(a<0||a>=n||b<0||b>=n)return;var fa=findCompress(a);var fb=findCompress(b);highlightPath=fa.path.concat(fb.path);if(fa.root===fb.root){lastOp="Union("+a+","+b+") - already same set";rootHighlight=fa.root;render();return;}if(rank[fa.root]<rank[fb.root]){parent[fa.root]=fb.root;}else if(rank[fa.root]>rank[fb.root]){parent[fb.root]=fa.root;}else{parent[fb.root]=fa.root;rank[fa.root]++;}unions++;lastOp="Union("+a+","+b+") -> root "+(parent[fa.root]===fb.root?fb.root:fa.root);var newRoot=find(a).root;highlightSet=new Set(getSetMembers(newRoot));rootHighlight=newRoot;updateInfo();render();}
function doFind(){var x=parseInt(document.getElementById('fe').value);if(x<0||x>=n)return;var result=findCompress(x);finds++;highlightPath=result.path;rootHighlight=result.root;highlightSet=new Set(getSetMembers(result.root));lastOp="Find("+x+") -> root "+result.root;updateInfo();render();}
function doRandom(){for(var k=0;k<5;k++){var a=Math.floor(Math.random()*n);var b=Math.floor(Math.random()*n);var fa=findCompress(a);var fb=findCompress(b);if(fa.root!==fb.root){if(rank[fa.root]<rank[fb.root])parent[fa.root]=fb.root;else if(rank[fa.root]>rank[fb.root])parent[fb.root]=fa.root;else{parent[fb.root]=fa.root;rank[fa.root]++;}unions++;}}lastOp="5 random unions";highlightPath=[];highlightSet=new Set();rootHighlight=-1;updateInfo();render();}
function doReset(){doInit();}
function updateInfo(){var sets={};for(var i=0;i<n;i++){var r=find(i).root;if(!sets[r])sets[r]=[];sets[r].push(i);}document.getElementById('nsets').textContent=Object.keys(sets).length;document.getElementById('nu').textContent=unions;document.getElementById('nf').textContent=finds;document.getElementById('npc').textContent=compressions;document.getElementById('nlo').textContent=lastOp;}
function getRoot(x){while(parent[x]!==x)x=parent[x];return x;}
function render(){var canvas=document.getElementById('canv');var ctx=canvas.getContext('2d');ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,W,H);if(n===0)return;var roots={};for(var i=0;i<n;i++){var r=getRoot(i);if(!roots[r])roots[r]=[];roots[r].push(i);}var palette=['#5bb9e6','#ff66aa','#44ff88','#ffbb55','#8b5cf6','#ff8855','#5be8d0','#e85d75','#b5e853','#5b8be6','#ff5bb9','#b5d0e8'];var ri=0;var rootColors={};for(var r in roots){rootColors[r]=palette[ri%palette.length];ri++;}for(i=0;i<n;i++){if(parent[i]!==i){var px=nodes[i].x;var py=nodes[i].y;var px2=nodes[parent[i]].x;var py2=nodes[parent[i]].y;var r=getRoot(i);var col=rootColors[r]||'#3a3a5a';ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px2,py2);ctx.stroke();}}
for(i=0;i<n;i++){var r=getRoot(i);var col=rootColors[r]||'#3a3a5a';var isRoot=parent[i]===i;var isPath=highlightPath.indexOf(i)>=0;var isSet=highlightSet.has(i);var isRootH=rootHighlight===i;var fillColor=col;if(isPath)fillColor='#ff66aa';if(isRootH)fillColor='#5bb9e6';ctx.fillStyle=fillColor;ctx.beginPath();ctx.arc(nodes[i].x,nodes[i].y,isRoot?16:12,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#1a1a28';ctx.lineWidth=2;ctx.stroke();if(isRoot){ctx.strokeStyle='#5bb9e6';ctx.lineWidth=2;ctx.beginPath();ctx.arc(nodes[i].x,nodes[i].y,19,0,Math.PI*2);ctx.stroke();}ctx.fillStyle='#a0a0d0';ctx.font='12px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i,nodes[i].x,nodes[i].y);if(isRoot&&rank[i]>0){ctx.fillStyle='#ffbb55';ctx.font='8px monospace';ctx.fillText('r'+rank[i],nodes[i].x,nodes[i].y+24);}}
var logY=H-30;ctx.fillStyle='#505080';ctx.font='10px monospace';ctx.textAlign='left';var setCount=Object.keys(roots).length;ctx.fillText('Disjoint sets: '+setCount+'  |  Total elements: '+n,20,logY);ctx.textAlign='right';ctx.fillText(lastOp,W-20,logY);}
doInit();
</script>
</body></html>
