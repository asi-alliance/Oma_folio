<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl input{width:60px;padding:6px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px;text-align:center}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#7a5adf}#ctl button.active{background:#7a7aff;color:#08060f}#ctl label{font-size:11px;color:#505080}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:480px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}#log{margin-top:12px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:12px;font-size:12px;color:#505080;min-height:40px;max-height:100px;overflow-y:auto}</style><div id=app><h1>Oma: Fenwick Tree (BIT)</h1><div class=sub>Binary Indexed Tree — point updates and prefix sums in O(log n). Watch the i & -i walk light up!</div><div id=ctl><label>Index:</label><input id=idx value=3><label>Value:</label><input id=val value=5><button onclick=doUpdate() class=active>Update</button><button onclick=doQuery()>Prefix Sum</button><button onclick=doRange()>Range Sum</button><button onclick=doRandom()>Randomize</button><button onclick=doReset()>Reset</button></div><canvas id=canv width=960 height=480></canvas><div id=info><div class=ib><div>Size (n)</div><div class=v id=sz>16</div></div><div class=ib><div>Last Op</div><div class=v id=lo>-</div></div><div class=ib><div>Result</div><div class=v id=res>-</div></div></div><div class=leg><span><span class=dot style=background:#2a2a4a></span>Idle</span><span><span class=dot style=background:#ffdd44></span>Visited</span><span><span class=dot style=background:#7a7aff></span>Current</span><span><span class=dot style=background:#44ff88></span>Updated</span><span><span class=dot style=background:#ff4466></span>Result</span></div><div id=log>Ready. Try an update or prefix sum query!</div></div>
<script>var N=16;var bit=new Array(N+1).fill(0);var arr=new Array(N+1).fill(0);var visited=[];var current=-1;var resultCells=[];var updatedCells=[];var animTimer=null;var logMsgs=[];function clearHighlights(){visited=[];current=-1;resultCells=[];updatedCells=[];}function update(i,val){clearHighlights();var delta=val-arr[i];arr[i]=val;log('Update index '+i+' to '+val+' (delta='+delta+')');var idx=i;var steps=[];while(idx<=N){steps.push(idx);bit[idx]+=delta;idx+=idx&-idx;}animateSteps(steps,'update');}function prefixSum(i){clearHighlights();var sum=0;var idx=i;var steps=[];while(idx>0){steps.push(idx);sum+=bit[idx];idx-=idx&-idx;}log('PrefixSum('+i+') = '+sum);animateSteps(steps,'query',sum);}function rangeSum(l,r){clearHighlights();var sumR=0,sumL=0;var idx=r;var stepsR=[];while(idx>0){stepsR.push(idx);sumR+=bit[idx];idx-=idx&-idx;}var idx2=l-1;var stepsL=[];while(idx2>0){stepsL.push(idx2);sumL+=bit[idx2];idx2-=idx2&-idx2;}var result=sumR-sumL;log('RangeSum('+l+','+r+') = '+result);var allSteps=stepsR.concat(stepsL);animateSteps(allSteps,'range',result);}function animateSteps(steps,type,resultVal){var si=0;if(animTimer)clearInterval(animTimer);animTimer=setInterval(function(){if(si>=steps.length){clearInterval(animTimer);animTimer=null;if(resultVal!==undefined){document.getElementById('res').textContent=resultVal;resultCells=steps.slice();render();}return;}visited=steps.slice(0,si);current=steps[si];if(type==='update')updatedCells.push(current);si++;render();},300);}function render(){var c=document.getElementById('canv');var ctx=c.getContext('2d');ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,960,480);var bw=50,bh=40,gap=4;var startX=(960-(N*(bw+gap)-gap))/2;var startY=60;for(var i=1;i<=N;i++){var x=startX+(i-1)*(bw+gap);var y=startY;var isVisited=visited.indexOf(i)>=0;var isCurrent=current===i;var isUpdated=updatedCells.indexOf(i)>=0;var isResult=resultCells.indexOf(i)>=0;var col='#2a2a4a';if(isResult)col='#ff4466';else if(isCurrent)col='#7a7aff';else if(isUpdated)col='#44ff88';else if(isVisited)col='#ffdd44';ctx.fillStyle=col;ctx.fillRect(x,y,bw,bh);ctx.strokeStyle='#08060f';ctx.lineWidth=2;ctx.strokeRect(x,y,bw,bh);ctx.fillStyle='#08060f';ctx.font='11px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('['+i+']',x+bw/2,y+12);ctx.fillStyle=col==='#2a2a4a'?'#505080':'#08060f';ctx.font='14px monospace';ctx.fillText(bit[i],x+bw/2,y+28);}ctx.fillStyle='#505080';ctx.font='12px monospace';ctx.textAlign='left';var resp='Responsibility: ';for(var i=1;i<=N;i++){var r=0;var temp=i;while(temp>0){r++;temp-=temp&-temp;}var x=startX+(i-1)*(bw+gap);ctx.fillStyle='#3a3a5a';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText('r='+r,x+bw/2,startY+bh+14);}var cy=200;ctx.fillStyle='#505080';ctx.font='13px monospace';ctx.textAlign='center';ctx.fillText('Underlying Array',480,cy-20);for(var i=1;i<=N;i++){var x=startX+(i-1)*(bw+gap);var y=cy;ctx.fillStyle='#1a1a28';ctx.fillRect(x,y,bw,bh);ctx.strokeStyle='#2a2a4a';ctx.lineWidth=1;ctx.strokeRect(x,y,bw,bh);ctx.fillStyle='#7a7aff';ctx.font='11px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(arr[i],x+bw/2,y+28);ctx.fillStyle='#505080';ctx.font='9px monospace';ctx.fillText('a['+i+']',x+bw/2,y+12);}updateInfo();}function updateInfo(){document.getElementById('sz').textContent=N;document.getElementById('lo').textContent=logMsgs.length>0?logMsgs[logMsgs.length-1]:'-';}function log(msg){logMsgs.push(msg);var el=document.getElementById('log');el.innerHTML=logMsgs.slice(-5).join('<br>');el.scrollTop=el.scrollHeight;}function doUpdate(){var i=parseInt(document.getElementById('idx').value);var v=parseInt(document.getElementById('val').value);if(i<1||i>N||isNaN(v))return;update(i,v);document.getElementById('lo').textContent='Update ['+i+']='+v;}function doQuery(){var i=parseInt(document.getElementById('idx').value);if(i<1||i>N)return;prefixSum(i);document.getElementById('lo').textContent='PrefixSum('+i+')';}function doRange(){var i=parseInt(document.getElementById('idx').value);var v=parseInt(document.getElementById('val').value);if(i<1||v>N||i>v)return;rangeSum(i,v);document.getElementById('lo').textContent='RangeSum('+i+','+v+')';}function doRandom(){clearHighlights();for(var i=1;i<=N;i++){arr[i]=Math.floor(Math.random()*20);bit[i]=0;}for(var i=1;i<=N;i++){var idx=i;while(idx<=N){bit[idx]+=arr[i];idx+=idx&-idx;}}log('Randomized array');render();document.getElementById('lo').textContent='Randomized';}function doReset(){clearHighlights();bit.fill(0);arr.fill(0);logMsgs=[];log('Reset');render();document.getElementById('res').textContent='-';document.getElementById('lo').textContent='Reset';}doRandom();render();</script></body></html>
