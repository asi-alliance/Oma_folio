<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:400px;text-align:center;line-height:400px;color:#505080}#text{width:100%;min-height:808px;padding:12px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;margin-top:12px}#tctl{display:flex;gap:8px;align-items:center;justify-center;flex-wrap:wrap;margin:12px 0}#tctl input{flex:1;padding:8px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px}#tctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#tctl button:hover{background:#1a1a28;color:#7a5adf}#tctl button.active{background:#7a7aff;color:#08060f}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px}.ib{font-size:11px;color:#505080}.ib`.k{color:#505080}.ibd.v{font-size:16px;font-family:monospace}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
<h1>Oma: Huffman Coding</h1><div class=sub>Watch Huffman coding build a frequency tree, assign binary codes, encode text, and decode it back.</div><div id=ctl><input id=txt type=text value="abracadabra" placeholder="Enter text..."><button onclick=build() class=active>Build Tree</button><button onclick=encode()>Encode</button><button onclick=decode()>Decode</button><button onclick=toggleSpeed()>Speed: Medium</button></div><canvas id=canv width=960 height=400></canvas><div id=info><div class=ib><div class=lab>Input Length</div><div class=val id=inlen>-</div></div><div class=ib><div class=lab>Encoded Bits</div><div class=val id=bits>-</div></div><div class=ib><div class=lab>Compression</div><div class=val id=comp>-</div></div><div class=ib><div class=lab>Status</div><div class=val id=stat>Ready</div></div></div><div class=leg><span><span class=dot style=background:#44ff88></span>Leaf (char)</span><span><span class=dot style=background:#7a7aff></span>Internal (sum)</span><span><span class=dot style=background:#ffdd44></span>Active merge</span><span><span class=dot style=background:#4a8aff></span>Encoded bit</span></div>
<script>var H={tree:null,codes:{},encoded:[],speed:30,timer:null,phase:'idle',mergeSteps:[],stepIdx:0,animNodes:[],animEdges:[],animHighlight:null};function buildFreq(t){var f={};for(var i=0;i<t.length;i++){var c=t[i];f[c]=(f[c]||0)+1;}return f;}function buildTree(t){var freq=buildFreq(t);var nodes=[];for(var c in freq){nodes.push({char:c,freq:freq[c],left:null,right:null,isLeaf:true});}nodes.sort(function(a,b){return a.freq-b.freq;});var steps=[];while(nodes.length>1){nodes.sort(function(a,b){return a.freq-b.freq;});var a=nodes.shift(),b=nodes.shift();var merged={char:null,freq:a.freq+b.freq,left:a,right:b,isLeaf:false};steps.push({merged:merged,a:a,b:b});nodes.push(merged);}H.mergeSteps=steps;H.tree=nodes[0]||null;return H.tree;}function genCodes(node,code){if(!node)return;if(node.isLeaf){H.codes[node.char]=code||'0';return;}genCodes(node.left,code+'0');genCodes(node.right,code+'1');}function layoutTree(node,x,y,dx,depth,arr){if(!node)return;arr.push({node:node,x:x,y:y,dx:dx,depth:depth});if(!node.isLeaf){layoutTree(node.left,x-dx,y+55,dx/1.6,depth+1,arr);layoutTree(node.right,x+dx,y+55,dx/1.6,depth+1,arr);}}function drawTree(){var c=document.getElementById('canv');var ctx=c.getContext('2d');ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,960,400);if(!H.tree){ctx.fillStyle='#505080';ctx.font='14px monospace';ctx.textAlign='center';ctx.fillText('Click Build Tree',480,200);return;}var arr=[];layoutTree(H.tree,480,30,200,0,arr);for(var i=0;i<arr.length;i++){var n=arr[i];if(!n.node.isLeaf&&n.node.left){var l=arr.find(function(e){return e.node===n.node.left;});if(l){ctx.strokeStyle='#2a2a4a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(l.x,l.y);ctx.stroke();}}if(!n.node.isLeaf&&n.node.right){var r=arr.find(function(e){return e.node===n.node.right;});if(r){ctx.strokeStyle='#2a2a4a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(r.x,r.y);ctx.stroke();}}}for(i=0;i<arr.length;i++){var n=arr[i];var col=n.node.isLeaf?'#44ff88':'#7a7aff';if(H.animHighlight&&(H.animHighlight===n.node||H.animHighlight.left===n.node||H.animHighlight.right===n.node))col='#ffdd44';ctx.fillStyle=col;ctx.strokeStyle='#08060f';ctx.lineWidth=2;ctx.beginPath();ctx.arc(n.x,n.y,16,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#08060f';ctx.font='11px monospace';ctx.textAlign='center';ctx.textBaseline='middle';var label=n.node.isLeaf?(n.node.char+'('+n.node.freq+')'):(n.node.freq+'');ctx.fillText(label,n.x,n.y);}}function build(){clearTimeout(H.timer);var t=document.getElementById('txt').value||'abracadabra';H.codes={};H.encoded=[];H.phase='building';document.getElementById('stat').textContent='Building...';document.getElementById('inlen').textContent=t.length;var freq=buildFreq(t);var nodes=[];for(var c in freq)nodes.push({char:c,freq:freq[c],left:null,right:null,isLeaf:true});nodes.sort(function(a,b){return a.freq-b.freq;});H.mergeSteps=[];H.stepIdx=0;H.allNodes=nodes.slice();H.tempNodes=nodes.slice();H.tree=null;H.timer=setInterval(function(){if(H.stepIdx>=H.mergeSteps.length+1){H.tree=H.tempNodes[0]||null;genCodes(H.tree,'');H.phase='idle';document.getElementById('stat').textContent='Tree Built';drawTree();clearTimeout(H.timer);return;}if(H.stepIdx===0){drawTempNodes();H.stepIdx++;return;}H.tempNodes.sort(function(a,b){return a.freq-b.freq;});var a=H.tempNodes.shift(),b=H.tempNodes.shift();var merged={char:null,freq:a.freq+b.freq,left:a,right:b,isLeaf:false};H.animHighlight=merged;H.tempNodes.push(merged);H.allNodes.push(merged);drawTempNodes();H.stepIdx++;},H.speed*4);}function drawTempNodes(){var c=document.getElementById('canv');var ctx=c.getContext('2d');ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,960,400);var sorted=H.tempNodes.slice().sort(function(a,b){return a.freq-b.freq;});var spacing=Math.min(60,920/Math.max(sorted.length,1));var startX=(960-sorted.length*spacing)/2;for(var i=0;i<sorted.length;i++){var n=sorted[i];var x=startX+i*spacing,y=200;var col=n.isLeaf?'#44ff88':'#7a7aff';if(H.animHighlight&&(n===H.animHighlight.left||n===H.animHighlight.right))col='#ffdd44';ctx.fillStyle=col;ctx.strokeStyle='#08060f';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,16,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#08060f';ctx.font='10px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.isLeaf?(n.char+':'+n.freq):(''+n.freq),x,y);}if(H.animHighlight){ctx.fillStyle='#ffdd44';ctx.font='12px monospace';ctx.textAlign='center';ctx.fillText('Merge: '+H.animHighlight.freq,480,280);}}function encode(){clearTimeout(H.timer);var t=document.getElementById('txt').value||'abracadabra';if(!H.tree){buildTree(t);genCodes(H.tree,'');}H.encoded=[];for(var i=0;i<t.length;i++){var code=H.codes[t[i]]||'0';H.encoded.push({char:t[i],code:code});}var totalBits=H.encoded.reduce(function(s,e){return s+e.code.length;},0);document.getElementById('bits').textContent=totalBits;var orig=t.length*8;var compRatio=((1-totalBits/orig)*100).toFixed(1)+'%';document.getElementById('comp').textContent=compRatio;document.getElementById('stat').textContent='Encoded';H.phase='encoding';var idx=0;var ctx=document.getElementById('canv').getContext('2d');H.timer=setInterval(function(){drawTree();if(idx>=H.encoded.length){clearTimeout(H.timer);H.phase='idle';return;}var e=H.encoded[idx];ctx.fillStyle='#4a8aff';ctx.font='16px monospace';ctx.textAlign='left';var prefix='Encode: ';var text=prefix;for(var j=0;j<=idx&&j<H.encoded.length;j++)text+=H.encoded[j].code+' ';ctx.fillStyle='#0c0a18';ctx.fillRect(0,360,960,40);ctx.fillStyle='#4a8aff';ctx.font='13px monospace';ctx.fillText(text.substring(0,90),10,382);idx++;},H.speed*3);}function decode(){clearTimeout(H.timer);if(!H.tree){var t=document.getElementById('txt').value||'abracadabra';buildTree(t);genCodes(H.tree,'');}var bitStr=H.encoded.map(function(e){return e.code;}).join('');var result='';var node=H.tree;var idx=0;H.phase='decoding';var ctx=document.getElementById('canv').getContext('2d');H.timer=setInterval(function(){if(idx>=bitStr.length){clearTimeout(H.timer);document.getElementById('stat').textContent='Decoded: '+result;H.phase='idle';return;}drawTree();var bit=bitStr[idx];if(bit==='0')node=node.left;else node=node.right;if(node&&node.isLeaf){result+=node.char;node=H.tree;}ctx.fillStyle='#0c0a18';ctx.fillRect(0,360,960,40);ctx.fillStyle='#4a8aff';ctx.font='13px monospace';ctx.textAlign='left';ctx.fillText('Bits: '+bitStr.substring(0,Math.min(idx+1,80)),10,374);ctx.fillText('Output: '+result,10,392);idx++;},H.speed*3);}function toggleSpeed(){if(H.speed===15){H.speed=30;}else if(H.speed===30){H.speed=60;}else{H.speed=15;}var label=H.speed===15?'Fast':H.speed===30?'Medium':'Slow';document.querySelector('button:last-child').textContent='Speed: '+label;}drawTree();</script></body></html>
