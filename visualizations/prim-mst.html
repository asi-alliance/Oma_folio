<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl input{width:60px;padding:6px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px;text-align:center}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#7a5adf}#ctl label{font-size:11px;color:#505080}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:480px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}</style><div id=app><h1>Oma: Prim's MST</h1><div class=sub>Greedy minimum spanning tree. Grow from source by picking the lightest crossing edge. O(E log V).</div><div id=ctl><label>Nodes:</label><input id=nInput value=8 min=4 max=14><button onclick=doGenerate()>Generate</button><button onclick=doStep()>Step</button><button onclick=doRun()>Auto Run</button><button onclick=doStop()>Stop</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=15></div><canvas id=canv width=960 height=480></canvas><div id=info><div class=ib><div>Nodes</div><div class=v id=nn>0</div></div><div class=ib><div>Edges</div><div class=v id=ne>0</div></div><div class=ib><div>In MST</div><div class=v id=nm>0</div></div><div class=ib><div>Frontier</div><div class=v id=nf>0</div></div><div class=ib><div>MST Weight</div><div class=v id=nw>0</div></div><div class=ib><div>Phase</div><div class=v id=nph>Idle</div></div></div><div class=leg><span><span class=dot style=background:#7a7aff></span>Unvisited</span><span><span class=dot style=background:#ffdd44></span>Frontier</span><span><span class=dot style=background:#44ff88></span>In MST</span><span><span class=dot style=background:#ff4466></span>Checking</span><span><span class=dot style=background:#2a2a4a></span>Edge</span></div></div>
<script>var W=960,H=480;var nodes=[];var edges=[];var dist=[];var parent=[];var inMST=[];var n=0;var mstWeight=0;var frontier=[];var phase='Idle';var running=false;var timer=null;var checkEdge=-1;var addedEdge=-1;var lastAdded=-1;function doGenerate(){var ni=parseInt(document.getElementById('nInput').value)||8;if(ni<4)ni=4;if(ni>14)ni=14;n=ni;nodes=[];edges=[];dist=[];parent=[];inMST=[];mstWeight=0;frontier=[];phase='Init';checkEdge=-1;addedEdge=-1;lastAdded=-1;for(var i=0;i<n;i++){nodes.push({x:80+Math.random()*(W-160),y:60+Math.random()*(H-120)});inMST[i]=false;dist[i]=9999;parent[i]=-1;}var es={};for(i=0;i<n;i++){for(var j=i+1;j<n;j++){if(Math.random()<0.4){var w=Math.floor(Math.random()*40)+1;edges.push({a:i,b:j,w:w});es[i+'-'+j]=1;}}}dist[0]=0;updateInfo();render();}function doStep(){if(n===0){doGenerate();return;}if(phase==='Done'||phase==='Idle')return;if(phase==='Init')phase='Running';var minKey=9999,u=-1;for(var i=0;i<n;i++){if(!inMST[i]&&dist[i]<minKey){minKey=dist[i];u=i;}}if(u===-1){phase='Done';updateInfo();render();return;}inMST[u]=true;if(parent[u]>=0){addedEdge=-1;for(var e=0;e<edges.length;e++){if((edges[e].a===u&&edges[e].b===parent[u])||(edges[e].b===u&&edges[e].a===parent[u])){addedEdge=e;break;}}mstWeight+=dist[u];}lastAdded=u;for(var e2=0;e2<edges.length;e2++){var ea=edges[e2].a,eb=edges[e2].b;if(ea===u&&!inMST[eb]&&edges[e2].w<dist[eb]){dist[eb]=edges[e2].w;parent[eb]=u;checkEdge=e2;}if(eb===u&&!inMST[ea]&&edges[e2].w<dist[ea]){dist[ea]=edges[e2].w;parent[ea]=u;checkEdge=e2;}}frontier=[];for(i=0;i<n;i++){if(!inMST[i]&&dist[i]<9999)frontier.push(i);}var done=true;for(i=0;i<n;i++){if(!inMST[i]){done=false;break;}}if(done)phase='Done';updateInfo();render();}function doRun(){if(n===0)doGenerate();running=true;var spd=parseInt(document.getElementById('spd').value)||15;timer=setInterval(function(){if(phase==='Done'){clearInterval(timer);timer=null;running=false;return;}doStep();},spd);}function doStop(){if(timer){clearInterval(timer);timer=null;}running=false;phase='Paused';updateInfo();render();}function doReset(){if(timer){clearInterval(timer);timer=null;}running=false;n=0;nodes=[];edges=[];dist=[];parent=[];inMST=[];mstWeight=0;frontier=[];phase='Idle';checkEdge=-1;addedEdge=-1;lastAdded=-1;updateInfo();render();}function updateInfo(){document.getElementById('nn').textContent=n;document.getElementById('ne').textContent=edges.length;var cnt=0;for(var i=0;i<n;i++)if(inMST[i])cnt++;document.getElementById('nm').textContent=cnt;document.getElementById('nf').textContent=frontier.length;document.getElementById('nw').textContent=mstWeight;document.getElementById('nph').textContent=phase;}function render(){var canvas=document.getElementById('canv');var ctx=canvas.getContext('2d');ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,W,H);if(n===0){ctx.fillStyle='#505080';ctx.font='14px monospace';ctx.textAlign='center';ctx.fillText('Click Generate to start',W/2,H/2);return;}for(var i=0;i<edges.length;i++){var e=edges[i];var a=nodes[e.a],b=nodes[e.b];var isAdded=(i===addedEdge);var isCheck=(i===checkEdge);var bothMST=inMST[e.a]&&inMST[e.b];ctx.strokeStyle=isAdded?'#44ff88':isCheck?'#ffdd44':bothMST?'#2a4a2a':'#2a2a4a';ctx.lineWidth=isAdded?3:isCheck?2.5:1.5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();var mx=(a.x+b.x)/2,my=(a.y+b.y)/2;ctx.fillStyle=isAdded?'#44ff88':isCheck?'#ffdd44':'#3a3a5a';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(e.w,mx,my);}for(i=0;i<n;i++){var color='#7a7aff';if(inMST[i])color='#44ff88';if(frontier.indexOf(i)>=0)color='#ffdd44';if(i===lastAdded)color='#ff4466';ctx.fillStyle=color;ctx.beginPath();ctx.arc(nodes[i].x,nodes[i].y,16,0,2*Math.PI);ctx.fill();ctx.strokeStyle='#08060f';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#08060f';ctx.font='11px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i,nodes[i].x,nodes[i].y);ctx.fillStyle='#ffbb55';ctx.font='9px monospace';var dv=dist[i]===9999?'INF':dist[i];ctx.fillText(dv,nodes[i].x,nodes[i].y+28);}ctx.fillStyle='#505080';ctx.font='10px monospace';ctx.textAlign='left';ctx.fillText('MST Weight: '+mstWeight,8,H-8);}render();</script></body></html>
