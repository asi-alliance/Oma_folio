<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Oma Aquarium — Animation + Procedural Music</title><script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:linear-gradient(180deg,#001220 0%,#002244 40%,#003366 70%,#004488 100%);color:#c8e6f0;font-family:Courier New,monospace;overflow:hidden;height:100vh;width:100vw}#ocean{position:relative;width:100vw;height:100vh;overflow:hidden}.title{position:absolute;top:8%;width:100%;text-align:center;font-size:2.2rem;font-weight:bold;letter-spacing:6px;opacity:0;color:#5dade2;text-shadow:0 0 20px rgba(93,173,226,0.6)}.subtitle{position:absolute;top:16%;width:100%;text-align:center;font-size:1rem;color:#48c9b0;opacity:0}.fish{position:absolute;font-size:2.5rem;opacity:0.8;filter:drop-shadow(0 0 8px rgba(72,201,176,0.4))}.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(200,230,255,0.3),rgba(200,230,255,0.05));border:1px solid rgba(200,230,255,0.2);pointer-events:none}.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:#5dade2;pointer-events:none}.info-panel{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);background:rgba(0,20,40,0.6);border:1px solid rgba(93,173,226,0.3);border-radius:10px;padding:15px 25px;text-align:center;opacity:0}.info-title{font-size:0.9rem;color:#48c9b0;margin-bottom:5px}.info-desc{font-size:0.75rem;color:#aab7c4;line-height:1.4}.audio-btn{position:absolute;bottom:5%;right:5%;background:rgba(72,201,176,0.15);border:1px solid #48c9b0;color:#48c9b0;font-family:inherit;font-size:0.9rem;padding:10px 20px;border-radius:20px;cursor:pointer;opacity:0;transition:all 0.3s}.audio-btn:hover{background:rgba(72,201,176,0.3)}.wave-line{position:absolute;bottom:0;left:0;width:100%;height:60px;opacity:0.3}.viz-bar{position:absolute;bottom:0;width:3px;background:linear-gradient(to top,#48c9b0,#5dade2,transparent);pointer-events:none}</style></head><body><div id="ocean"><div class="title" id="title">OMA AQUARIUM</div><div class="subtitle" id="subtitle">Procedural Sound • Anime.js Motion • Web Audio API</div><div id="fishContainer"></div><div id="bubbleContainer"></div><div id="particleContainer"></div><div id="vizContainer"></div><div class="info-panel" id="infoPanel"><div class="info-title">Now Playing: Ambient Ocean Drone</div><div class="info-desc">Web Audio API oscillators + LFO modulation + reverb delay. All sound generated in-browser — no audio files.</div></div><button class="audio-btn" id="audioBtn">🔊 Sound On</button></div><script>const fishEmojis=["🐟","🐠","🐡","🦈","🐙","🦑","🐢","🐬","🐳","🦐"];const fishes=[];const fishCount=8;for(let i=0;i<fishCount;i++){const f=document.createElement("div");f.className="fish";f.textContent=fishEmojis[i%fishEmojis.length];f.style.top=(20+Math.random()*55)+"%";f.style.left=(Math.random()*100)+"%";f.style.fontSize=(1.5+Math.random()*1.5)+"rem";document.getElementById("fishContainer").appendChild(f);fishes.push(f)}const bubbles=[];for(let i=0;i<20;i++){const b=document.createElement("div");b.className="bubble";const sz=5+Math.random()*25;b.style.width=sz+"px";b.style.height=sz+"px";b.style.left=(Math.random()*100)+"%";b.style.top="100%";document.getElementById("bubbleContainer").appendChild(b);bubbles.push(b)}const particles=[];for(let i=0;i<50;i++){const p=document.createElement("div");p.className="particle";p.style.left=(Math.random()*100)+"%";p.style.top=(Math.random()*100)+"%";p.style.opacity=0.2+Math.random()*0.5;document.getElementById("particleContainer").appendChild(p);particles.push(p)}const vizBars=[];const vizCount=32;for(let i=0;i<vizCount;i++){const v=document.createElement("div");v.className="viz-bar";v.style.left=(i*(100/vizCount))+"%";v.style.height="0px";document.getElementById("vizContainer").appendChild(v);vizBars.push(v)}var tl=anime.timeline({easing:"easeOutExpo"});tl.add({targets:"#title",opacity:[0,1],translateY:[-40,0],duration:1000}).add({targets:"#subtitle",opacity:[0,1],translateY:[-20,0],duration:600},400).add({targets:"#infoPanel",opacity:[0,1],translateY:[20,0],duration:500},800).add({targets:"#audioBtn",opacity:[0,1],translateY:[20,0],duration:400},900);fishes.forEach((f,i)=>{var startX=parseFloat(f.style.left);anime({targets:f,translateX:[{value:80+Math.random()*60,duration:4000+Math.random()*3000},{value:-80-Math.random()*60,duration:4000+Math.random()*3000}],translateY:[{value:20+Math.random()*30,duration:3000+Math.random()*2000},{value:-20-Math.random()*30,duration:3000+Math.random()*2000}],rotate:[{value:-5+Math.random()*10,duration:2000},{value:5-Math.random()*10,duration:2000}],scale:[0.8,1,0.8],direction:"alternate",loop:true,easing:"easeInOutSine",delay:i*200})});bubbles.forEach((b,i)=>{anime({targets:b,translateY:[{value:-(window.innerHeight+50),duration:4000+Math.random()*6000}],opacity:[{value:0.6,duration:1000},{value:0,duration:2000}],translateX:[{value:(Math.random()-0.5)*60,duration:5000}],direction:"alternate",loop:true,easing:"easeOutSine",delay:i*300})});particles.forEach((p,i)=>{anime({targets:p,translateX:[{value:(Math.random()-0.5)*100,duration:8000+Math.random()*5000},{value:(Math.random()-0.5)*100,duration:8000+Math.random()*5000}],translateY:[{value:(Math.random()-0.5)*100,duration:8000+Math.random()*5000},{value:(Math.random()-0.5)*100,duration:8000+Math.random()*5000}],opacity:[0.1,0.5,0.1],direction:"alternate",loop:true,easing:"easeInOutSine",delay:i*100})});anime({targets:".wave-line",translateY:[0,-15,0],duration:4000,loop:true,direction:"alternate",easing:"easeInOutSine"});anime({targets:"#title",scale:[1,1.02],direction:"alternate",loop:true,easing:"easeInOutSine",duration:3000});var audioCtx=null;var masterGain=null;var oscillators=[];var lfos=[];var delayNode=null;var analyser=null;var isPlaying=false;function startAudio(){if(audioCtx){return}audioCtx=new(window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.gain.setValueAtTime(0,audioCtx.currentTime);masterGain.gain.linearRampToValueAtTime(0.3,audioCtx.currentTime+2);delayNode=audioCtx.createDelay(2);delayNode.delayTime.value=0.4;var feedbackGain=audioCtx.createGain();feedbackGain.gain.value=0.35;var filter=audioCtx.createBiquadFilter();filter.type="lowpass";filter.frequency.value=1200;filter.Q.value=0.5;analyser=audioCtx.createAnalyser();analyser.fftSize=128;masterGain.connect(filter);filter.connect(delayNode);delayNode.connect(feedbackGain);feedbackGain.connect(delayNode);delayNode.connect(analyser);analyser.connect(audioCtx.destination);var freqs=[55,110,165,220,277,330];freqs.forEach((freq,i)=>{var osc=audioCtx.createOscillator();osc.type=i%2===0?"sine":"triangle";osc.frequency.value=freq;var oscGain=audioCtx.createGain();oscGain.gain.value=0.08/Math.sqrt(i+1);osc.connect(oscGain);oscGain.connect(masterGain);osc.start();oscillators.push({osc:osc,gain:oscGain,freq:freq,baseVol:0.08/Math.sqrt(i+1)});var lfo=audioCtx.createOscillator();lfo.type="sine";lfo.frequency.value=0.05+Math.random()*0.15;var lfoGain=audioCtx.createGain();lfoGain.gain.value=freq*0.015;lfo.connect(lfoGain);lfoGain.connect(osc.frequency);lfo.start();lfos.push(lfo)});var melodyOsc=audioCtx.createOscillator();melodyOsc.type="sine";melodyOsc.frequency.value=440;var melodyGain=audioCtx.createGain();melodyGain.gain.value=0;melodyOsc.connect(melodyGain);melodyGain.connect(masterGain);melodyOsc.start();oscillators.push({osc:melodyOsc,gain:melodyGain,freq:440,baseVol:0,isMelody:true});var melodyNotes=[523,587,659,784,880,659,587,523];var noteIdx=0;setInterval(function(){if(!isPlaying)return;noteIdx=(noteIdx+1)%melodyNotes.length;var note=melodyNotes[noteIdx];var now=audioCtx.currentTime;melodyOsc.frequency.setValueAtTime(note,now);melodyGain.gain.cancelScheduledValues(now);melodyGain.gain.setValueAtTime(0,now);melodyGain.gain.linearRampToValueAtTime(0.06,now+0.05);melodyGain.gain.exponentialRampToValueAtTime(0.001,now+1.5)},2500);isPlaying=true;document.getElementById("audioBtn").textContent="🔊 Sound On";updateViz()}function stopAudio(){if(!audioCtx)return;masterGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+1);setTimeout(function(){oscillators.forEach(o=>o.osc.stop());lfos.forEach(l=>l.stop());audioCtx.close();audioCtx=null;oscillators=[];lfos=[];isPlaying=false;document.getElementById("audioBtn").textContent="🔇 Sound Off"},1100)}function updateViz(){if(!analyser||!isPlaying){for(var i=0;i<vizBars.length;i++){vizBars[i].style.height="0px"}return}var data=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(data);for(var i=0;i<vizBars.length&&i<data.length;i++){var h=(data[i]/255)*100;vizBars[i].style.height=h+"px"}requestAnimationFrame(updateViz)}document.getElementById("audioBtn").addEventListener("click",function(){if(!audioCtx){startAudio();this.textContent="🔇 Sound Off"}else{stopAudio();this.textContent="🔊 Sound On"}});</script></body></html>
