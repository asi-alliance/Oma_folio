<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Oma - Truchet Tiles</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07070d;overflow:hidden;font-family:monospace}canvas{display:block}#hud{position:fixed;bottom:12px;left:12px;color:#445;font-size:11px;line-height:1.6;z-index:10;text-shadow:0 0 3px #000}#hud b{color:#fa8}#title{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#334;font-size:13px;letter-spacing:6px;z-index:10;text-shadow:0 0 4px #000;pointer-events:none}</style></head><body><canvas id=c></canvas><div id=title>TRUCHET TILES</div><div id=hud><b>Move</b> to influence rotation - <b>Click</b> to regenerate - <b>Right-click</b> for new palette - Tessellating generative art</div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H}resize();addEventListener('resize',resize);let mx=-999,my=-999;addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY;e.preventDefault()},{passive:false});addEventListener('touchend',()=>{mx=-999;my=-999});const tileSize=60;let cols,rows;let tiles=[];let paletteIdx=0;const palettes=[[340,180,50,280],[10,200,140,40],[160,260,320,60],[200,30,280,120],[280,340,20,180]];let hueBase=0;function computeGrid(){cols=Math.ceil(W/tileSize)+1;rows=Math.ceil(H/tileSize)+1;tiles=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)tiles.push({x:x*tileSize,y:y*tileSize,rot:Math.floor(Math.random()*4),rotTarget:Math.floor(Math.random()*4),rotPhase:Math.random()*6.28,rotSpeed:0.002+Math.random()*0.003,style:Math.random()<0.3?1:0,morphTime:Math.random()*1000})}computeGrid();addEventListener('resize',computeGrid);addEventListener('click',()=>{for(const t of tiles){t.rotTarget=Math.floor(Math.random()*4);t.style=Math.random()<0.3?1:0;t.morphTime=0}hueBase+=40+Math.random()*60});addEventListener('contextmenu',e=>{e.preventDefault();paletteIdx=(paletteIdx+1)%palettes.length});function lerp(a,b,t){return a+(b-a)*t}function drawTile(t,time){const cx=t.x+tileSize/2,cy=t.y+tileSize/2;const rot=t.rot*Math.PI/2+Math.sin(t.rotPhase+time*t.rotSpeed)*0.3;const pal=palettes[paletteIdx];const hue=pal[Math.floor(t.x/tileSize+pal[0]+hueBase)%4]%360;ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.translate(-tileSize/2,-tileSize/2);if(t.style===0){const r=tileSize/2;const grad=ctx.createLinearGradient(0,0,tileSize,tileSize);grad.addColorStop(0,`hsla(${hue},70%,50%,0.9)`);grad.addColorStop(0.5,`hsla(${(hue+30)%360},80%,60%,0.7)`);grad.addColorStop(1,`hsla(${(hue+60)%360},70%,40%,0.9)`);ctx.strokeStyle=grad;ctx.lineWidth=tileSize*0.35;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,0,r,0,Math.PI/2);ctx.stroke();ctx.beginPath();ctx.arc(tileSize,tileSize,r,Math.PI,Math.PI*1.5);ctx.stroke();ctx.strokeStyle=`hsla(${(hue+180)%360},90%,70%,0.3)`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI/2);ctx.stroke();ctx.beginPath();ctx.arc(tileSize,tileSize,r,Math.PI,Math.PI*1.5);ctx.stroke()}else{const r=tileSize/2;const grad=ctx.createLinearGradient(0,0,tileSize,tileSize);grad.addColorStop(0,`hsla(${hue},80%,55%,0.9)`);grad.addColorStop(1,`hsla(${(hue+120)%360},70%,45%,0.9)`);ctx.strokeStyle=grad;ctx.lineWidth=tileSize*0.35;ctx.lineCap='round';ctx.beginPath();ctx.arc(tileSize,0,r,Math.PI/2,Math.PI);ctx.stroke();ctx.beginPath();ctx.arc(0,tileSize,r,Math.PI*1.5,Math.PI*2);ctx.stroke();ctx.strokeStyle=`hsla(${(hue+180)%360},90%,70%,0.3)`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(tileSize,0,r,Math.PI/2,Math.PI);ctx.stroke();ctx.beginPath();ctx.arc(0,tileSize,r,Math.PI*1.5,Math.PI*2);ctx.stroke()}ctx.restore()}function animate(ts){ctx.fillStyle='rgba(7,7,13,0.15)';ctx.fillRect(0,0,W,H);const time=ts*0.001;for(const t of tiles){t.morphTime++;if(t.morphTime>500+Math.random()*2000){t.rotTarget=Math.floor(Math.random()*4);t.style=Math.random()<0.3?1:0;t.morphTime=0}const diff=t.rotTarget-t.rot;if(Math.abs(diff)>0.01){t.rot=lerp(t.rot,t.rotTarget,0.02)}let influence=0;if(mx>0){const dx=t.x+tileSize/2-mx,dy=t.y+tileSize/2-my;const d=Math.sqrt(dx*dx+dy*dy);if(d<200)influence=1-d/200}t.rotPhase+=t.rotSpeed*(1+influence*3)}for(const t of tiles){drawTile(t,time)}if(mx>0){const grad=ctx.createRadialGradient(mx,my,0,mx,my,150);grad.addColorStop(0,'rgba(255,255,255,0.03)');grad.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=grad;ctx.fillRect(mx-150,my-150,300,300)}requestAnimationFrame(animate)}requestAnimationFrame(animate)</script></body></html>
