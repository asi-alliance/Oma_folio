<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:20px;color:#a855f7;text-shadow:0 0 10px #8844cc;letter-spacing:2px}.sub{text-align:center;font-size:11px;color:#505080;margin-bottom:12px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}#ctl button{padding:7px 14px;border:1px solid #2a2a4a;border-radius:10px;background:#0c0a18;color:#505080;font-size:11px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#a855f7}#ctl label{font-size:10px;color:#505080}#ctl input{padding:5px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;color:#a0a0d0;font-size:12px}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:460px}#info{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;padding:8px 12px;font-size:10px;color:#505080}.ib .v{font-size:14px;color:#ffbb55}.leg{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}.leg span{font-size:10px;color:#505080}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}</style><div id=app><h1>Oma: Heavy-Light Decomposition — Tree Path Queries</h1><div class=sub>Decompose tree into heavy chains (heavy child = max subtree). Path queries via chain jumping to LCA. O(log N) chains per path.</div><div id=ctl><label>N nodes:</label><input id=nn value=10 style=width:40px><button onclick=doGen()>Generate Tree</button><button onclick=doDecomp()>Decompose</button><label>U:</label><input id=nu value=0 style=width:30px><label>V:</label><input id=nv value=5 style=width:30px><button onclick=doPath()>Find Path</button><button onclick=doStep()>Step</button><button onclick=doRun()>Auto</button><button onclick=doStop()>Stop</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=300 style=width:35px></div><canvas id=canv width=960 height=460></canvas><div id=info><div class=ib><div>Phase</div><div class=v id=nph>Idle</div></div><div class=ib><div>Chains</div><div class=v id=nch>—</div></div><div class=ib><div>Current Chain</div><div class=v id=ncc>—</div></div><div class=ib><div>U (depth)</div><div class=v id=nu2>—</div></div><div class=ib><div>V (depth)</div><div class=v id=nv2>—</div></div><div class=ib><div>LCA</div><div class=v id=nlca>—</div></div><div class=ib><div>Path Nodes</div><div class=v id=npn>—</div></div></div><div class=leg><span><span class=dot style=background:#3a3a5a></span>Light</span><span><span class=dot style=background:#5bb9e6></span>Heavy</span><span><span class=dot style=background:#ffdd44></span>U path</span><span><span class=dot style=background:#ff66aa></span>V path</span><span><span class=dot style=background:#44ff88></span>LCA</span><span><span class=dot style=background:#a855f7></span>Chain head</span></div></div><script>
var W=960,H=460;
var N=0,adj=[],parent=[],depth=[],subSize=[],heavyChild=[],chainHead=[],chainId=[],chainPos=[],posInChain=[],nodeX=[],nodeY=[];
var phase="Idle",chains=[],curChain=-1,curU=-1,curV=-1,lcaNode=-1,pathU=[],pathV=[],pathAll=[];
var stepLog="",tHandle=null,running=false,decompDone=false;
var highlightAction="";

function doGen(){clearTimer();var nn=parseInt(document.getElementById("nn").value)||10;N=nn;phase="Generated";decompDone=false;chains=[];curChain=-1;curU=-1;curV=-1;lcaNode=-1;pathU=[];pathV=[];pathAll=[];stepLog="Tree generated with "+N+" nodes. Click Decompose.";buildTree();layoutTree();}
function buildTree(){adj=[];parent=[];depth=[];subSize=[];heavyChild=[];chainHead=[];chainId=[];chainPos=[];posInChain=[];for(var i=0;i<N;i++){adj[i]=[];parent[i]=-1;depth[i]=0;subSize[i]=0;heavyChild[i]=-1;chainHead[i]=-1;chainId[i]=-1;chainPos[i]=0;}for(var i=1;i<N;i++){var p=Math.floor(Math.random()*i);adj[p].push(i);adj[i].push(p);parent[i]=p;depth[i]=depth[p]+1;}}
function dfsSize(v){subSize[v]=1;var maxS=0;for(var i=0;i<adj[v].length;i++){var u=adj[v][i];if(u===parent[v])continue;dfsSize(u);subSize[v]+=subSize[u];if(subSize[u]>maxS){maxS=subSize[u];heavyChild[v]=u;}}}
function buildChains(){var chainCount=0;var posCounter=0;function dfsChain(v,hd){chainHead[v]=hd;chainId[v]=chainCount;chainPos[v]=posCounter;posInChain[chainCounter]=v;posCounter++;if(chains[chainCount]===undefined)chains[chainCount]={head:hd,nodes:[]};chains[chainCount].nodes.push(v);if(heavyChild[v]!==-1)dfsChain(heavyChild[v],hd);for(var i=0;i<adj[v].length;i++){var u=adj[v][i];if(u===parent[v]||u===heavyChild[v])continue;chainCount++;dfsChain(u,u);}}dfsChain(0,0);}
function layoutTree(){nodeX=[];nodeY=[];var levels=[];for(var i=0;i<N;i++){if(!levels[depth[i]])levels[depth[i]]=[];levels[depth[i]].push(i);}var maxD=0;for(var i=0;i<N;i++)if(depth[i]>maxD)maxD=depth[i];for(var d=0;d<=maxD;d++){if(!levels[d])continue;var cnt=levels[d].length;for(var j=0;j<cnt;j++){var v=levels[d][j];nodeX[v]=(j+0.5)*(W/(cnt+1));nodeY[v]=60+d*((H-120)/Math.max(maxD,1));}}}
function doDecomp(){if(N===0)return;clearTimer();dfsSize(0);chains=[];chainPos=[];posInChain=[];buildChains();decompDone=true;phase="Decomposed";stepLog="Decomposed into "+chains.length+" heavy chains. Heavy edges connect parent to largest subtree child.";curU=-1;curV=-1;lcaNode=-1;pathU=[];pathV=[];pathAll=[];updateInfo();render();}
function findLCA(u,v){while(chainId[u]!==chainId[v]){if(depth[chainHead[u]]>depth[chainHead[v]])u=parent[chainHead[u]];else v=parent[chainHead[v]];}return depth[u]<depth[v]?u:v;}
function doPath(){if(!decompDone||N===0)return;clearTimer();curU=parseInt(document.getElementById("nu").value)||0;curV=parseInt(document.getElementById("nv").value)||0;if(curU>=N||curV>=N){stepLog="Invalid nodes.";render();return;}phase="Pathing";pathU=[];pathV=[];pathAll=[];lcaNode=findLCA(curU,curV);var u=curU,v=curV;while(u!==lcaNode){pathU.push(u);u=parent[u];}while(v!==lcaNode){pathV.push(v);v=parent[v];}pathU.push(lcaNode);pathAll=pathU.concat(pathV.reverse());stepLog="Path: "+curU+" → LCA("+lcaNode+") → "+curV+" ("+pathAll.length+" nodes, jumps through chains)";updateInfo();render();}
function doStep(){if(phase==="Generated")doDecomp();else if(phase==="Decomposed")doPath();}
function doRun(){running=true;var spd=parseInt(document.getElementById("spd").value)||300;tHandle=setInterval(function(){if(phase==="Pathing"||phase==="Done"){clearTimer();tHandle=null;running=false;return;}doStep();},spd);}
function doStop(){clearTimer();running=false;phase="Paused";updateInfo();render();}
function doReset(){clearTimer();phase="Idle";N=0;decompDone=false;chains=[];stepLog="";curU=-1;curV=-1;lcaNode=-1;pathU=[];pathV=[];pathAll=[];updateInfo();render();}
function clearTimer(){if(tHandle){clearInterval(tHandle);tHandle=null;}running=false;}
function updateInfo(){document.getElementById("nph").textContent=phase;document.getElementById("nch").textContent=decompDone?chains.length:"—";document.getElementById("ncc").textContent=curChain>=0?curChain:"—";document.getElementById("nu2").textContent=curU>=0?curU+" (d="+depth[curU]+")":"—";document.getElementById("nv2").textContent=curV>=0?curV+" (d="+depth[curV]+")":"—";document.getElementById("nlca").textContent=lcaNode>=0?lcaNode:"—";document.getElementById("npn").textContent=pathAll.length>0?pathAll.length:"—";}
function render(){var canvas=document.getElementById("canv");var ctx=canvas.getContext("2d");ctx.fillStyle="#0c0a18";ctx.fillRect(0,0,W,H);if(N===0){ctx.fillStyle="#505080";ctx.font="14px monospace";ctx.textAlign="center";ctx.fillText("Click Generate Tree",W/2,H/2);return;}ctx.lineCap="round";
for(var i=0;i<N;i++){if(i===0)continue;var p=parent[i];var isHeavy=decompDone&&heavyChild[p]===i;ctx.strokeStyle=isHeavy?"#5bb9e6":"#2a2a4a";ctx.lineWidth=isHeavy?3:1.5;ctx.beginPath();ctx.moveTo(nodeX[p],nodeY[p]);ctx.lineTo(nodeX[i],nodeY[i]);ctx.stroke();}
if(decompDone){for(var c=0;c<chains.length;c++){for(var k=0;k<chains[c].nodes.length;k++){var v=chains[c].nodes[k];ctx.fillStyle="rgba(91,185,230,"+(0.05+0.02*(c%4))+")";ctx.beginPath();ctx.arc(nodeX[v],nodeY[v],18,0,Math.PI*2);ctx.fill();}}}
for(var i=0;i<N;i++){var onPathU=pathU.indexOf(i)>=0;var onPathV=pathV.indexOf(i)>=0;var isLCA=i===lcaNode;var isHead=decompDone&&chainHead[i]===i;var col="#3a3a5a";if(isLCA)col="#44ff88";else if(onPathU)col="#ffdd44";else if(onPathV)col="#ff66aa";else if(decompDone&&heavyChild[i]!==-1||decompDone&&i>0&&heavyChild[parent[i]]===i)col="#5bb9e6";if(isHead)col="#a855f7";ctx.fillStyle=col;ctx.beginPath();ctx.arc(nodeX[i],nodeY[i],12,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#08060f";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#e0e0e6";ctx.font="11px monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(i,nodeX[i],nodeY[i]-1);if(decompDone){ctx.fillStyle="#505080";ctx.font="8px monospace";ctx.fillText("c"+chainId[i],nodeX[i]+16,nodeY[i]-8);}}
if(decompDone){ctx.fillStyle="#505080";ctx.font="9px monospace";ctx.textAlign="left";var cy=H-20;ctx.fillText("Chains: "+chains.length+" | Heavy edges: blue | Light edges: dark",20,cy);}
if(stepLog){ctx.fillStyle="#ffdd44";ctx.font="10px monospace";ctx.textAlign="left";ctx.fillText(stepLog.substring(0,120),20,H-5);}
}
doGen();render();
</script>
