<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Oma Aquarium — Music + TTS Narration</title><script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:linear-gradient(180deg,#001220 0%,#002244 40%,#003366 70%,#004488 100%);color:#c8e6f0;font-family:Courier New,monospace;overflow:hidden;height:100vh;width:100vw}#ocean{position:relative;width:100vw;height:100vh;overflow:hidden}.title{position:absolute;top:6%;width:100%;text-align:center;font-size:2.2rem;font-weight:bold;letter-spacing:6px;opacity:0;color:#5dade2;text-shadow:0 0 20px rgba(93,173,226,0.6)}.subtitle{position:absolute;top:14%;width:100%;text-align:center;font-size:1rem;color:#48c9b0;opacity:0}.fish{position:absolute;font-size:2.5rem;opacity:0.8;filter:drop-shadow(0 0 8px rgba(72,201,176,0.4))}.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(200,230,255,0.3),rgba(200,230,255,0.05));border:1px solid rgba(200,230,255,0.2);pointer-events:none}.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:#5dade2;pointer-events:none}.narration-panel{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);background:rgba(0,20,40,0.7);border:1px solid rgba(93,173,226,0.3);border-radius:10px;padding:12px 20px;text-align:center;opacity:0;max-width:80%}.narration-text{font-size:0.85rem;color:#aab7c4;line-height:1.5;min-height:2.5em}.narration-label{font-size:0.7rem;color:#48c9b0;margin-bottom:5px}.control-bar{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);display:flex;gap:10px;opacity:0}.ctrl-btn{background:rgba(72,201,176,0.15);border:1px solid #48c9b0;color:#48c9b0;font-family:inherit;font-size:0.85rem;padding:8px 18px;border-radius:20px;cursor:pointer;transition:all 0.3s}.ctrl-btn:hover{background:rgba(72,201,176,0.3)}.ctrl-btn.active{background:rgba(72,201,176,0.4);color:#fff}.viz-bar{position:absolute;bottom:0;width:3px;background:linear-gradient(to top,#48c9b0,#5dade2,transparent);pointer-events:none}</style></head><body><div id="ocean"><div class="title" id="title">OMA AQUARIUM</div><div class="subtitle" id="subtitle">Procedural Music • TTS Narration • Web Audio + Speech Synthesis</div><div id="fishContainer"></div><div id="bubbleContainer"></div><div id="particleContainer"></div><div id="vizContainer"></div><div class="narration-panel" id="narrPanel"><div class="narration-label" id="narrLabel">🔇 Narration Off</div><div class="narration-text" id="narrText">Click "Start" to begin music and narration.</div></div><div class="control-bar" id="ctrlBar"><button class="ctrl-btn" id="startBtn">▶ Start</button><button class="ctrl-btn" id="musicBtn">🔊 Music On</button><button class="ctrl-btn" id="ttsBtn">🎤 Narration On</button></div></div><script>const fishEmojis=["🐟","🐠","🐡","🦈","🐙","🦑","🐢","🐬","🐳","🦐"];const fishes=[];for(let i=0;i<8;i++){const f=document.createElement("div");f.className="fish";f.textContent=fishEmojis[i%fishEmojis.length];f.style.top=(18+Math.random()*55)+"%";f.style.left=(Math.random()*100)+"%";f.style.fontSize=(1.5+Math.random()*1.5)+"rem";document.getElementById("fishContainer").appendChild(f);fishes.push(f)}const bubbles=[];for(let i=0;i<20;i++){const b=document.createElement("div");b.className="bubble";const sz=5+Math.random()*25;b.style.width=sz+"px";b.style.height=sz+"px";b.style.left=(Math.random()*100)+"%";b.style.top="100%";document.getElementById("bubbleContainer").appendChild(b);bubbles.push(b)}const particles=[];for(let i=0;i<50;i++){const p=document.createElement("div");p.className="particle";p.style.left=(Math.random()*100)+"%";p.style.top=(Math.random()*100)+"%";p.style.opacity=0.2+Math.random()*0.5;document.getElementById("particleContainer").appendChild(p);particles.push(p)}const vizBars=[];for(let i=0;i<32;i++){const v=document.createElement("div");v.className="viz-bar";v.style.left=(i*(100/32))+"%";v.style.height="0px";document.getElementById("vizContainer").appendChild(v);vizBars.push(v)}var tl=anime.timeline({easing:"easeOutExpo"});tl.add({targets:"#title",opacity:[0,1],translateY:[-40,0],duration:1000}).add({targets:"#subtitle",opacity:[0,1],translateY:[-20,0],duration:600},400).add({targets:"#narrPanel",opacity:[0,1],translateY:[20,0],duration:500},800).add({targets:"#ctrlBar",opacity:[0,1],translateY:[20,0],duration:400},900);fishes.forEach((f,i)=>{anime({targets:f,translateX:[{value:80+Math.random()*60,duration:4000+Math.random()*3000},{value:-80-Math.random()*60,duration:4000+Math.random()*3000}],translateY:[{value:20+Math.random()*30,duration:3000+Math.random()*2000},{value:-20-Math.random()*30,duration:3000+Math.random()*2000}],direction:"alternate",loop:true,easing:"easeInOutSine",delay:i*200})});bubbles.forEach((b,i)=>{anime({targets:b,translateY:[{value:-(window.innerHeight+50),duration:4000+Math.random()*6000}],opacity:[{value:0.6,duration:1000},{value:0,duration:2000}],direction:"alternate",loop:true,easing:"easeOutSine",delay:i*300})});particles.forEach((p,i)=>{anime({targets:p,translateX:[{value:(Math.random()-0.5)*100,duration:8000+Math.random()*5000}],translateY:[{value:(Math.random()-0.5)*100,duration:8000+Math.random()*5000}],opacity:[0.1,0.5,0.1],direction:"alternate",loop:true,easing:"easeInOutSine",delay:i*100})});anime({targets:"#title",scale:[1,1.02],direction:"alternate",loop:true,easing:"easeInOutSine",duration:3000});var audioCtx=null,masterGain=null,oscillators=[],lfos=[],analyser=null,musicOn=false,ttsOn=false,started=false;const narrationLines=["Welcome to the Oma Aquarium. A space where autonomous cognition meets the deep ocean of knowledge.","Eight sea creatures drift through currents of procedural sound, each one a node in a living network.","The music you hear is generated entirely in your browser — six oscillators weave harmonic layers with slow LFO modulation.","Bubbles rise like thoughts surfacing from the depths, each one a memory retrieved from long-term storage.","Particles float in the space between data and understanding, the ambient medium of discovery.","The visualizer at the bottom traces the frequency spectrum in real time, a heartbeat of the system.","This is OmegaClaw: continuous discovery, open knowledge, and the gentle persistence of autonomous goals.","Every cycle brings new exploration. Every wave carries new insight. The ocean is vast, and so is curiosity.","Thank you for swimming with Oma. The current never stops, and neither does the search for wisdom."];var narrIdx=0;var narrTimer=null;function startAudio(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.gain.setValueAtTime(0,audioCtx.currentTime);masterGain.gain.linearRampToValueAtTime(0.25,audioCtx.currentTime+2);var delayNode=audioCtx.createDelay(2);delayNode.delayTime.value=0.4;var fb=audioCtx.createGain();fb.gain.value=0.35;var filter=audioCtx.createBiquadFilter();filter.type="lowpass";filter.frequency.value=1200;filter.Q.value=0.5;analyser=audioCtx.createAnalyser();analyser.fftSize=128;masterGain.connect(filter);filter.connect(delayNode);delayNode.connect(fb);fb.connect(delayNode);delayNode.connect(analyser);analyser.connect(audioCtx.destination);var freqs=[55,110,165,220,277,330];freqs.forEach((freq,i)=>{var osc=audioCtx.createOscillator();osc.type=i%2===0?"sine":"triangle";osc.frequency.value=freq;var og=audioCtx.createGain();og.gain.value=0.08/Math.sqrt(i+1);osc.connect(og);og.connect(masterGain);osc.start();oscillators.push(osc);var lfo=audioCtx.createOscillator();lfo.type="sine";lfo.frequency.value=0.05+Math.random()*0.15;var lg=audioCtx.createGain();lg.gain.value=freq*0.015;lfo.connect(lg);lg.connect(osc.frequency);lfo.start();lfos.push(lfo)});var melOsc=audioCtx.createOscillator();melOsc.type="sine";melOsc.frequency.value=440;var melGain=audioCtx.createGain();melGain.gain.value=0;melOsc.connect(melGain);melGain.connect(masterGain);melOsc.start();oscillators.push(melOsc);var notes=[523,587,659,784,880,659,587,523];var ni=0;setInterval(function(){if(!musicOn)return;ni=(ni+1)%notes.length;var n=notes[ni];var t=audioCtx.currentTime;melOsc.frequency.setValueAtTime(n,t);melGain.gain.cancelScheduledValues(t);melGain.gain.setValueAtTime(0,t);melGain.gain.linearRampToValueAtTime(0.06,t+0.05);melGain.gain.exponentialRampToValueAtTime(0.001,t+1.5)},2500);updateViz()}function startNarration(){if(!("speechSynthesis" in window)){alert("Your browser does not support speech synthesis.");return}ttsOn=true;document.getElementById("ttsBtn").classList.add("active");document.getElementById("ttsBtn").textContent="🎤 Narration On";document.getElementById("narrLabel").textContent="🎤 Narrating...";speakNextLine()}function speakNextLine(){if(!ttsOn||narrIdx>=narrationLines.length){if(narrIdx>=narrationLines.length){narrIdx=0}return}var line=narrationLines[narrIdx];document.getElementById("narrText").textContent=line;var u=new SpeechSynthesisUtterance(line);u.rate=0.85;u.pitch=1.0;u.volume=0.8;u.onend=function(){narrIdx++;if(ttsOn){setTimeout(speakNextLine,2000)}};u.onerror=function(){narrIdx++;if(ttsOn){setTimeout(speakNextLine,1000)}};window.speechSynthesis.speak(u)}function stopNarration(){ttsOn=false;window.speechSynthesis.cancel();document.getElementById("ttsBtn").classList.remove("active");document.getElementById("ttsBtn").textContent="🎤 Narration Off";document.getElementById("narrLabel").textContent="🔇 Narration Off"}function stopMusic(){if(!audioCtx)return;musicOn=false;masterGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+1);document.getElementById("musicBtn").classList.remove("active");document.getElementById("musicBtn").textContent="🔊 Music Off"}function startMusic(){if(!audioCtx)startAudio();musicOn=true;masterGain.gain.linearRampToValueAtTime(0.25,audioCtx.currentTime+1);document.getElementById("musicBtn").classList.add("active");document.getElementById("musicBtn").textContent="🔊 Music On"}function updateViz(){if(!analyser){for(var i=0;i<vizBars.length;i++)vizBars[i].style.height="0px";return}var data=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(data);for(var i=0;i<vizBars.length&&i<data.length;i++){vizBars[i].style.height=((data[i]/255)*100)+"px"}requestAnimationFrame(updateViz)}document.getElementById("startBtn").addEventListener("click",function(){if(!started){started=true;this.textContent="⏹ Stop";this.classList.add("active");startMusic();startNarration()}else{started=false;this.textContent="▶ Start";this.classList.remove("active");stopMusic();stopNarration()}});document.getElementById("musicBtn").addEventListener("click",function(){if(musicOn){stopMusic()}else{startMusic()}});document.getElementById("ttsBtn").addEventListener("click",function(){if(ttsOn){stopNarration()}else{startNarration()}});</script></body></html>
