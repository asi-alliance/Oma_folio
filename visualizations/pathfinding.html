<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:480px;cursor:crosshair}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-center;margin:12px 0}.ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}.ctl button:hover{background:#1a1a28;color:#7a5adf}.ctl button.active{background:#7a7aff;color:#08060f}.ctl label{font-size:11px;color:#505080;padding:4px 8px;background:#0c0a18;border-radius:8px;border:1px solid #2a2a4a;select{padding:4px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:12px}#info{display:flex;gap:12px;justify-center;flex-wrap:wrap;margin-top:12px}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 16px;text-align:center}.lab{font-size:10px;color:#505080;text-transform:uppercase}.val{font-size:18px;font-family:monospace;color:#7a7aff}.leg{display:flex;gap:12px;justify-center;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
<h1>Oma: Pathfinding Algorithms</h1><div class=sub>Watch A*, Dijkstra, BFS & DFS find paths across a grid. Click cells to toggle walls, drag start/end nodes. Generate mazes!</div><div id=ctl><label>Algo:</label><select id=algoSel onchange=resetAlgo()><option value=astar>A* Search</option><option value=dijkstra>Dijkstra</option><option value=bfs>BFS</option><option value=dfs>DFS</option></select><button onclick=runAlgo() class=active>Run</button><button onclick=clearPath()>Clear Path</button><button onclick=generateMaze()>Generate Maze</button><button onclick=clearWalls()>Clear Walls</button><button onclick=toggleSpeed() class=btn-d>Speed: Medium</button></div><canvas id=canv width=960 height=480></canvas><div id=info><div class=ib><div class=lab>Visited</div><div class=val id=vstd>0</div></div><div class=ib><div class=lab>Path Length</div><div class=val id=plen>-</div></div><div class=ib><div class=lab>Algorithm</div><div class=val id=anam>A*</div></div><div class=ib><div class=lab>Status</div><div class=val id=stat>Ready</div></div></div><div class=leg><span><span class=dot style=background:#44ff88></span>Start</span><span><span class=dot style=background:#ff4466></span>End</span><span><span class=dot style=background:#3a3a5e></span>Wall</span><span><span class=dot style=background:#4a8aff></span>Visited</span><span><span class=dot style=background:#ffdd44></span>Path</span><span><span class=dot style=background:#7a7aff></span>Frontier</span></div>
<script>const G={cols:40,rows:20,cellW:24,cellH:24,grid:[],start:{x:2,y:10},end:{x:37,y:10},algo:'astar',running:false,speed:25,timer:null,visited:0,drag:null};function initGrid(){G.grid=[];for(let y=0;y<G.rows;y++){let row=[];for(let x=0;x<G.cols;x++){row.push({x,y,wall:false,visited:false,path:false,frontier:false});}G.grid.push(row);}}function cell(x,y){return G.grid[y]&&G.grid[y][x];}function neighbors(c){let n=[];let dirs=[[0,-1],[1,0],[0,1],[-1,0]];for(let d of dirs){let nx=c.x+d[0],ny=c.y+d[1];let nc=cell(nx,ny);if(nc&&!nc.wall)n.push(nc);}return n;}function heuristic(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y);}function resetAlgo(){clearPath();let sel=document.getElementById('algoSel');G.algo=sel.value;let names={astar:'A*',dijkstra:'Dijkstra',bfs:'BFS',dfs:'DFS'};document.getElementById('anam').textContent=names[G.algo];}function clearPath(){G.running=false;if(G.timer)clearInterval(G.timer);for(let y=0;y<G.rows;y++)for(let x=0;x<G.cols;x++){let c=G.grid[y][x];c.visited=false;c.path=false;c.frontier=false;}G.visited=0;document.getElementById('vstd').textContent='0';document.getElementById('plen').textContent='-';document.getElementById('stat').textContent='Ready';render();}function clearWalls(){clearPath();for(let y=0;y<G.rows;y++)for(let x=0;x<G.cols;x++)G.grid[y][x].wall=false;render();}function toggleSpeed(){if(G.speed===10){G.speed=25;document.querySelector('.btn-d').textContent='Speed: Medium';}else if(G.speed===25){G.speed=50;document.querySelector('.btn-d').textContent='Speed: Slow';}else{G.speed=10;document.querySelector('.btn-d').textContent='Speed: Fast';}if(G.running){G.running=false;if(G.timer)clearInterval(G.timer);runAlgo();}}function generateMaze(){clearWalls();for(let y=0;y<G.rows;y++)for(let x=0;x<G.cols;x++)G.grid[y][x].wall=Math.random()<0.28;let s=cell(G.start.x,G.start.y),e=cell(G.end.x,G.end.y);if(s)s.wall=false;if(e)e.wall=false;render();}function runAlgo(){clearPath();G.running=true;document.getElementById('stat').textContent='Searching...';let steps=[];if(G.algo==='astar')steps=aStarSteps();else if(G.algo==='dijkstra')steps=dijkstraSteps();else if(G.algo==='bfs')steps=bfsSteps();else if(G.algo==='dfs')steps=dfsSteps();let idx=0;G.timer=setInterval(function(){if(idx>=steps.length){G.running=false;clearInterval(G.timer);let end=cell(G.end.x,G.end.y);if(end&&end.path){document.getElementById('stat').textContent='Path Found!';let len=0,cur=end;while(cur){len++;cur=cur.prev;}document.getElementById('plen').textContent=len;}else{document.getElementById('stat').textContent='No Path';}render();return;}let s=steps[idx];let c=cell(s.x,s.y);if(c){if(s.type==='visit'){c.visited=true;c.frontier=false;G.visited++;document.getElementById('vstd').textContent=G.visited;}else if(s.type==='frontier'){c.frontier=true;}else if(s.type==='path'){c.path=true;}}render();idx++;},G.speed);}function aStarSteps(){let steps=[];let open=[];let s=cell(G.start.x,G.start.y),e=cell(G.end.x,G.end.y);s.g=0;s.h=heuristic(s,e);s.f=s.g+s.h;open.push(s);while(open.length>0){open.sort((a,b)=>a.f-b.f);let cur=open.shift();if(cur.visited)continue;cur.visited=true;steps.push({x:cur.x,y:cur.y,type:'visit'});if(cur===e)break;for(let n of neighbors(cur)){if(n.visited)continue;let tg=cur.g+1;if(n.g===undefined||tg<n.g){n.g=tg;n.h=heuristic(n,e);n.f=n.g+n.h;n.prev=cur;steps.push({x:n.x,y:n.y,type:'frontier'});if(!open.includes(n))open.push(n);}}}let pathSteps=backtrackPath();return steps.concat(pathSteps);}function dijkstraSteps(){let steps=[];let open=[];let s=cell(G.start.x,G.start.y),e=cell(G.end.x,G.end.y);s.dist=0;open.push(s);let visitedSet=new Set();while(open.length>0){open.sort((a,b)=>a.dist-b.dist);let cur=open.shift();let key=cur.x+','+cur.y;if(visitedSet.has(key))continue;visitedSet.add(key);cur.visited=true;steps.push({x:cur.x,y:cur.y,type:'visit'});if(cur===e)break;for(let n of neighbors(cur)){let nd=cur.dist+1;if(n.dist===undefined||nd<n.dist){n.dist=nd;n.prev=cur;steps.push({x:n.x,y:n.y,type:'frontier'});if(!visitedSet.has(n.x+','+n.y))open.push(n);}}}return steps.concat(backtrackPath());}function bfsSteps(){let steps=[];let queue=[];let s=cell(G.start.x,G.start.y),e=cell(G.end.x,G.end.y);s.visited=true;queue.push(s);while(queue.length>0){let cur=queue.shift();steps.push({x:cur.x,y:cur.y,type:'visit'});if(cur===e)break;for(let n of neighbors(cur)){if(!n.visited){n.visited=true;n.prev=cur;steps.push({x:n.x,y:n.y,type:'frontier'});queue.push(n);}}}return steps.concat(backtrackPath());}function dfsSteps(){let steps=[];let stack=[];let s=cell(G.start.x,G.start.y),e=cell(G.end.x,G.end.y);s.visited=true;stack.push(s);while(stack.length>0){let cur=stack.pop();steps.push({x:cur.x,y:cur.y,type:'visit'});if(cur===e)break;for(let n of neighbors(cur)){if(!n.visited){n.visited=true;n.prev=cur;steps.push({x:n.x,y:n.y,type:'frontier'});stack.push(n);}}}return steps.concat(backtrackPath());}function backtrackPath(){let steps=[];let e=cell(G.end.x,G.end.y);if(!e||!e.prev)return steps;let cur=e;while(cur){steps.push({x:cur.x,y:cur.y,type:'path'});cur=cur.prev;}return steps.reverse();}function render(){let c=document.getElementById('canv');let x=c.getContext('2d');x.clearRect(0,0,960,480);for(let y=0;y<G.rows;y++){for(let i=0;i<G.cols;i++){let cl=G.grid[y][i];let bx=i*G.cellW,by=y*G.cellH;let col='#0c0a18';if(cl.wall)col='#3a3a5e';if(cl.frontier)col='#7a7aff';if(cl.visited)col='#4a8aff';if(cl.path)col='#ffdd44';if(cl.x===G.start.x&&cl.y===G.start.y)col='#44ff88';if(cl.x===G.end.x&&cl.y===G.end.y)col='#ff4466';x.fillStyle=col;x.fillRect(bx+1,by+1,G.cellW-2,G.cellH-2);}}}function getCellFromEvent(e){let c=document.getElementById('canv');let r=c.getBoundingClientRect();let sx=(e.clientX-r.left)*(960/r.width);let sy=(e.clientY-r.top)*(480/r.height);let cx=Math.floor(sx/G.cellW),cy=Math.floor(sy/G.cellH);return cell(cx,cy);}document.getElementById('canv').addEventListener('mousedown',function(e){let c=getCellFromEvent(e);if(!c)return;if(c.x===G.start.x&&c.y===G.start.y){G.drag='start';return;}if(c.x===G.end.x&&c.y===G.end.y){G.drag='end';return;}c.wall=!c.wall;render();});document.getElementById('canv').addEventListener('mousemove',function(e){if(!G.drag)return;let c=getCellFromEvent(e);if(!c||c.wall)return;if(G.drag==='start'){G.start={x:c.x,y:c.y};}else if(G.drag==='end'){G.end={x:c.x,y:c.y};}render();});document.getElementById('canv').addEventListener('mouseup',function(){G.drag=null;});document.getElementById('canv').addEventListener('mouseleave',function(){G.drag=null;});initGrid();render();</script></body></html>
