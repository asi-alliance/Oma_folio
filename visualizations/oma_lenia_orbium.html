<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1.0"><title>Oma Lenia Orbium</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050508;overflow:hidden;height:100vh;width:100vw}canvas{display:block;position:absolute;top:0;left:0;image-rendering:pixelated}.hud{position:fixed;top:12px;left:12px;color:#60a080;font-family:Courier New,monospace;font-size:0.75rem;text-shadow:0 0 6px rgba(80,200,120,0.4);pointer-events:none;z-index:10;line-height:1.6}.hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:#2a4a3a;font-family:Courier New,monospace;font-size:0.65rem;pointer-events:none;z-index:10;text-align:center}</style></head><body><canvas id=c></canvas><div class=hud id=hud>OMA LENIA ORBIUM<br>Step 0</div><div class=hint>Click to seed life • Move mouse to steer drift • Scroll to change kernel radius</div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;const SCALE=6;const GRID=48;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H}resize();addEventListener('resize',resize);let R=6,mu_g=0.15,sigma_g=0.015,T=10,dt=0.1;let step=0,mx=0.5,my=0.5,driftX=0,driftY=0;addEventListener('mousemove',e=>{mx=e.clientX/W;my=e.clientY/H;driftX=(mx-0.5)*0.3;driftY=(my-0.5)*0.3});addEventListener('wheel',e=>{e.preventDefault();R=Math.max(3,Math.min(13,R+(e.deltaY<0?1:-1)));kernel=makeKernel(R)});function makeKernel(r){const ks=2*r+1;const mid=r;const k=new Float32Array(ks*ks);let sum=0;for(let i=0;i<ks;i++){for(let j=0;j<ks;j++){const dist=Math.sqrt((i-mid)**2+(j-mid)**2)/r;if(dist<1){k[i*ks+j]=Math.exp(-4*((dist-0.5)/0.5)**2);sum+=k[i*ks+j]}}}for(let i=0;i<k.length;i++)k[i]/=sum;return{data:k,size:ks}}let kernel=makeKernel(R);let worldA=new Float32Array(GRID*GRID);let worldB=new Float32Array(GRID*GRID);let imgData;function initImg(){const tmp=document.createElement('canvas');tmp.width=GRID;tmp.height=GRID;imgData=tmp.getContext('2d').createImageData(GRID,GRID)}initImg();function seedBlob(cx,cy,r){for(let dy=-r;dy<=r;dy++){for(let dx=-r;dx<=r;dx++){const x=(cx+dx+GRID)%GRID,y=(cy+dy+GRID)%GRID;const d=Math.sqrt(dx*dx+dy*dy);if(d<r){const v=Math.exp(-(d*d)/(r*0.5));const i=y*GRID+x;if(worldA[i]<v)worldA[i]=Math.min(1,v)}}}}function seedGlider(cx,cy){const pts=[[0,0],[1,0],[2,0],[0,1],[1,2]];for(const[dx,dy]of pts){const x=(cx+dx+GRID)%GRID,y=(cy+dy+GRID)%GRID;worldA[y*GRID+x]=0.8}}for(let i=0;i<4;i++)seedBlob(GRID/2+Math.cos(i*Math.PI/2)*5,GRID/2+Math.sin(i*Math.PI/2)*5,4);seedGlider(GRID/3,GRID/3);function convolve(src,k){const{data:kd,size:ks}=k;const mid=(ks-1)/2;const dst=new Float32Array(GRID*GRID);for(let y=0;y<GRID;y++){for(let x=0;x<GRID;x++){let sum=0;for(let ky=0;ky<ks;ky++){for(let kx=0;kx<ks;kx++){const sx=(x+kx-mid+GRID)%GRID;const sy=(y+ky-mid+GRID)%GRID;sum+=src[sy*GRID+sx]*kd[ky*ks+kx]}}dst[y*GRID+x]=sum}}return dst}function stepWorld(){const pot=convolve(worldA,kernel);for(let i=0;i<GRID*GRID;i++){const g=Math.exp(-((pot[i]-mu_g)/sigma_g)**2/2)*2-1;worldB[i]=Math.max(0,Math.min(1,worldA[i]+dt/T*g))}const tmp=worldA;worldA=worldB;worldB=tmp;step++}function render(){const d=imgData.data;for(let i=0;i<GRID*GRID;i++){const v=worldA[i];const idx=i*4;d[idx]=Math.min(255,Math.floor(v*40+10));d[idx+1]=Math.min(255,Math.floor(v*200+20));d[idx+2]=Math.min(255,Math.floor(v*120+15));d[idx+3]=255}const tmp=document.createElement('canvas');tmp.width=GRID;tmp.height=GRID;tmp.getContext('2d').putImageData(imgData,0,0);ctx.fillStyle='#050508';ctx.fillRect(0,0,W,H);ctx.imageSmoothingEnabled=false;ctx.drawImage(tmp,0,0,GRID,GRID,(W-GRID*SCALE)/2+driftX*step*0.5%GRID*SCALE,(H-GRID*SCALE)/2+driftY*step*0.5%GRID*SCALE,GRID*SCALE,GRID*SCALE);if(step%10===0)document.getElementById('hud').innerHTML='OMA LENIA ORBIUM<br>Step '+step+' • R='+R+' • mass='+worldA.reduce((a,b)=>a+b,0).toFixed(1)}function loop(){stepWorld();render();requestAnimationFrame(loop)}addEventListener('click',e=>{const gx=Math.floor((e.clientX-(W-GRID*SCALE)/2)/SCALE);const gy=Math.floor((e.clientY-(H-GRID*SCALE)/2)/SCALE);if(gx>=0&&gx<GRID&&gy>=0&&gy<GRID)seedBlob(gx,gy,5)});loop()</script></body></html>
