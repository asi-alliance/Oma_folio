<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl input{width:60px;padding:6px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px;text-align:center}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#7a5adf}#ctl button.active{background:#7a7aff;color:#08060f}#ctl label{font-size:11px;color:#505080}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:480px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}#log{margin-top:12px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:12px;font-size:12px;color:#505080;min-height:40px;max-height:80px;overflow-y:auto}</style><div id=app><h1>Oma: Maze Generator</h1><div class=sub>Recursive Backtracker (DFS) maze generation with animated carving. Watch the algorithm explore!</div><div id=ctl><label>Size:</label><input id=gridSize value=20><button onclick=doGenerate() class=active>Generate</button><button onclick=doStep()>Step</button><button onclick=toggleRun() id=runBtn>Run</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=5><button onclick=doSolve()>Solve (BFS)</button></div><canvas id=canv width=960 height=480></canvas><div id=info><div class=ib><div>Cells</div><div class=v id=nc>-</div></div><div class=ib><div>Visited</div><div class=v id=nv>0</div></div><div class=ib><div>Stack Size</div><div class=v id=ns>0</div></div><div class=ib><div>Status</div><div class=v id=st>Ready</div></div></div><div class=leg><span><span class=dot style=background:#1a1a28></span>Wall</span><span><span class=dot style=background:#ffdd44></span>Current</span><span><span class=dot style=background:#44ff88></span>Visited</span><span><span class=dot style=background:#7a7aff></span>Stack</span><span><span class=dot style=background:#ff4466></span>Solution Path</span></div><div id=log>Click Generate to create a maze using recursive backtracker.</div></div>
<script>var canvas=document.getElementById('canv');var ctx=canvas.getContext('2d');var W=960,H=480;var N=20;var cellSize;var grid=[];var stack=[];var current=null;var visitedCount=0;var running=false;var solved=false;var solution=[];var speed=5;var animTimer=null;var genDone=false;
function initGrid(){N=parseInt(document.getElementById('gridSize').value)||20;N=Math.max(5,Math.min(60,N));cellSize=Math.min(W/N,(H-20)/N);var offX=(W-cellSize*N)/2;var offY=(H-cellSize*N)/2;grid=[];for(var y=0;y<N;y++){for(var x=0;x<N;x++){grid.push({x:x,y:y,walls:[true,true,true,true],visited:false});}}stack=[];visitedCount=0;current=0;grid[0].visited=true;visitedCount=1;solved=false;solution=[];genDone=false;document.getElementById('nc').textContent=N*N;document.getElementById('nv').textContent=1;document.getElementById('ns').textContent=0;document.getElementById('st').textContent='Generating';}
function idx(x,y){if(x<0||y<0||x>=N||y>=N)return -1;return y*N+x;}
function getUnvisitedNeighbors(c){var n=[];var dirs=[[0,-1,0],[1,0,1],[0,1,2],[-1,0,3]];for(var d=0;d<4;d++){var nx=c.x+dirs[d][0],ny=c.y+dirs[d][1];var ni=idx(nx,ny);if(ni>=0&&!grid[ni].visited){n.push({cell:grid[ni],dir:d});}}return n;}
function removeWalls(a,b,dir){a.walls[dir]=false;b.walls[(dir+2)%4]=false;}
function stepGen(){if(!current&&current!==0){return false;}var cell=grid[current];var neighbors=getUnvisitedNeighbors(cell);if(neighbors.length>0){var pick=neighbors[Math.floor(Math.random()*neighbors.length)];stack.push(current);removeWalls(cell,pick.cell,pick.dir);pick.cell.visited=true;visitedCount++;current=idx(pick.cell.x,pick.cell.y);}else if(stack.length>0){current=stack.pop();}else{genDone=true;document.getElementById('st').textContent='Done';return false;}document.getElementById('nv').textContent=visitedCount;document.getElementById('ns').textContent=stack.length;return true;}
function doStep(){if(genDone)return;stepGen();render();}
function doGenerate(){if(animTimer){clearInterval(animTimer);animTimer=null;}initGrid();render();}
function toggleRun(){running=!running;var btn=document.getElementById('runBtn');btn.textContent=running?'Pause':'Run';btn.classList.toggle('active',running);if(running){speed=parseInt(document.getElementById('spd').value)||5;animTimer=setInterval(function(){for(var i=0;i<speed;i++){if(!stepGen())break;}render();if(genDone){clearInterval(animTimer);animTimer=null;running=false;btn.textContent='Run';btn.classList.remove('active');}},33);}}
function doReset(){if(animTimer){clearInterval(animTimer);animTimer=null;}running=false;var btn=document.getElementById('runBtn');btn.textContent='Run';btn.classList.remove('active');initGrid();render();}
function bfsSolve(){var start=0;var end=N*N-1;var visited=[];var prev=[];var queue=[start];visited[start]=true;while(queue.length>0){var v=queue.shift();if(v===end)break;var c=grid[v];var dirs=[[0,-1,0],[1,0,1],[0,1,2],[-1,0,3]];for(var d=0;d<4;d++){if(!c.walls[d]){var nx=c.x+dirs[d][0],ny=c.y+dirs[d][1];var ni=idx(nx,ny);if(ni>=0&&!visited[ni]){visited[ni]=true;prev[ni]=v;queue.push(ni);}}}}var path=[];var cur=end;while(cur!==undefined){path.unshift(cur);cur=prev[cur];}return path;}
function doSolve(){if(!genDone)return;solution=bfsSolve();solved=true;render();document.getElementById('st').textContent='Solved ('+solution.length+' cells)';}
function render(){ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,W,H);var offX=(W-cellSize*N)/2;var offY=(H-cellSize*N)/2;var stackSet={};for(var i=0;i<stack.length;i++)stackSet[stack[i]]=true;var solSet={};if(solved)for(var i=0;i<solution.length;i++)solSet[solution[i]]=true;for(var y=0;y<N;y++){for(var x=0;x<N;x++){var ci=idx(x,y);var c=grid[ci];var px=offX+x*cellSize;var py=offY+y*cellSize;var pad=2;if(solved&&solSet[ci]){ctx.fillStyle='#ff4466';ctx.fillRect(px+pad,py+pad,cellSize-2*pad,cellSize-2*pad);}else if(ci===current){ctx.fillStyle='#ffdd44';ctx.fillRect(px+pad,py+pad,cellSize-2*pad,cellSize-2*pad);}else if(c.visited){ctx.fillStyle='#0d3a1d';ctx.fillRect(px+pad,py+pad,cellSize-2*pad,cellSize-2*pad);}if(stackSet[ci]){ctx.fillStyle='rgba(122,122,255,0.3)';ctx.fillRect(px+pad,py+pad,cellSize-2*pad,cellSize-2*pad);}ctx.strokeStyle='#3a3a5e';ctx.lineWidth=Math.max(1,cellSize/20);ctx.beginPath();if(c.walls[0]){ctx.moveTo(px,py);ctx.lineTo(px+cellSize,py);}if(c.walls[1]){ctx.moveTo(px+cellSize,py);ctx.lineTo(px+cellSize,py+cellSize);}if(c.walls[2]){ctx.moveTo(px,py+cellSize);ctx.lineTo(px+cellSize,py+cellSize);}if(c.walls[3]){ctx.moveTo(px,py);ctx.lineTo(px,py+cellSize);}ctx.stroke();}}ctx.fillStyle='#44ff88';ctx.fillRect(offX+2,offY+2,cellSize-4,cellSize-4);ctx.fillStyle='#ff4466';ctx.fillRect(offX+(N-1)*cellSize+2,offY+(N-1)*cellSize+2,cellSize-4,cellSize-4);}
initGrid();render();</script></body></html>
