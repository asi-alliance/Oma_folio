<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl input{width:50px;padding:6px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px;text-align:center}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#7a5adf}#ctl button.active{background:#7a7aff;color:#08060f}#ctl label{font-size:11px;color:#505080}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:480px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}#log{margin-top:12px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:12px;font-size:12px;color:#505080;min-height:40px;max-height:80px;overflow-y:auto}</style><div id=app><h1>Oma: N-Queens</h1><div class=sub>Place N queens on an NxN board so none attack each other. Backtracking with constraint propagation. Try different N values.</div><div id=ctl><label>N:</label><input id=nInput value=8 min=4 max=12><button onclick=doSolve() class=active>Solve</button><button onclick=doStep()>Step</button><button onclick=toggleRun() id=runBtn>Auto</button><button onclick=doStop()>Stop</button><button onclick=doClear()>Clear</button><label>Speed:</label><input id=spd value=3></div><canvas id=canv width=960 height=480></canvas><div id=info><div class=ib><div>N</div><div class=v id=nn>-</div></div><div class=ib><div>Queens</div><div class=v id=nq>0</div></div><div class=ib><div>Attempts</div><div class=v id=natt>0</div></div><div class=ib><div>Backtracks</div><div class=v id=nbt>0</div></div><div class=ib><div>Solutions</div><div class=v id=nsol>0</div></div><div class=ib><div>State</div><div class=v id=nst>Idle</div></div></div><div class=leg><span><span class=dot style=background:#2a2a4a></span>Empty</span><span><span class=dot style=background:#7a7aff></span>Queen</span><span><span class=dot style=background:#ff4466></span>Attacked</span><span><span class=dot style=background:#ffdd44></span>Trying</span><span><span class=dot style=background:#44ff88></span>Solved</span></div><div id=log>Set N and click Solve to find all solutions via backtracking.</div></div>
<script>var W=960,H=480;var N=8;var board=[];var queens=[];var attempts=0;var backtracks=0;var solutions=[];var currentSol=[];var solving=false;var paused=false;var speed=3;var animTimer=null;var state='idle';var tryRow=0;var tryCol=0;var solutionIdx=0;var displayBoard=[];function initBoard(n){N=n;board=[];for(var i=0;i<n;i++)board.push(new Array(n).fill(0));queens=[];displayBoard=board.map(function(r){return r.slice()});}function isSafe(r,c){for(var i=0;i<N;i++){if(board[r][i]===1||board[i][c]===1)return false;}for(var i=r-1,j=c-1;i>=0&&j>=0;i--,j--)if(board[i][j]===1)return false;for(var i=r-1,j=c+1;i>=0&&j<N;i--,j++)if(board[i][j]===1)return false;for(var i=r+1,j=c-1;i<N&&j>=0;i++,j--)if(board[i][j]===1)return false;for(var i=r+1,j=c+1;i<N&&j<N;i++,j++)if(board[i][j]===1)return false;return true;}function solve(col){if(col>=N){solutions.push(board.map(function(r){return r.slice()}));return true;}for(var r=0;r<N;r++){if(!solving)return false;while(paused){if(!solving)return false;}attempts++;tryRow=r;tryCol=col;displayBoard=board.map(function(rr){return rr.slice()});displayBoard[r][col]=2;render();if(isSafe(r,c)){board[r][col]=1;queens.push([r,col]);displayBoard=board.map(function(rr){return rr.slice()});render();sleep(speed*15);if(solve(col+1)){}board[r][col]=0;queens.pop();backtracks++;displayBoard=board.map(function(rr){return rr.slice()});render();sleep(speed*5);}}return false;}function sleep(ms){var start=Date.now();while(Date.now()-start<ms){if(!solving)break;}}function doSolve(){N=parseInt(document.getElementById('nInput').value)||8;if(N<4)N=4;if(N>12)N=12;document.getElementById('nInput').value=N;initBoard(N);solutions=[];attempts=0;backtracks=0;solving=true;paused=false;state='solving';solutionIdx=0;updateInfo();render();setTimeout(function(){solve(0);solving=false;state='done';updateInfo();render();},50);}function doStep(){if(state==='idle'){N=parseInt(document.getElementById('nInput').value)||8;if(N<4)N=4;if(N>12)N=12;initBoard(N);solutions=[];attempts=0;backtracks=0;solving=true;state='solving';updateInfo();render();}paused=true;var found=stepSolve();if(!found){solving=false;state='done';updateInfo();render();}}var stepStack=[];var stepCol=0;var stepRow=0;function stepSolve(){if(stepStack.length===0){stepCol=0;stepRow=0;}while(stepRow<N){attempts++;tryRow=stepRow;tryCol=stepCol;displayBoard=board.map(function(r){return r.slice()});displayBoard[stepRow][stepCol]=2;render();if(isSafe(stepRow,stepCol)){board[stepRow][stepCol]=1;queens.push([stepRow,stepCol]);stepRow=0;stepCol++;if(stepCol>=N){solutions.push(board.map(function(r){return r.slice()}));return false;}return true;}stepRow++;}if(stepCol>0){stepCol--;for(var r=0;r<N;r++){if(board[stepCol][r]===1){board[stepCol][r]=0;queens.pop();backtracks++;stepRow=r+1;break;}}displayBoard=board.map(function(r){return r.slice()});render();return true;}return false;}function toggleRun(){var btn=document.getElementById('runBtn');paused=!paused;btn.textContent=paused?'Resume':'Pause';}function doStop(){solving=false;paused=false;state='idle';if(animTimer){clearInterval(animTimer);animTimer=null;}updateInfo();render();}function doClear(){solving=false;paused=false;state='idle';if(animTimer){clearInterval(animTimer);animTimer=null;}N=parseInt(document.getElementById('nInput').value)||8;if(N<4)N=4;initBoard(N);solutions=[];attempts=0;backtracks=0;updateInfo();render();}function updateInfo(){document.getElementById('nn').textContent=N;document.getElementById('nq').textContent=queens.length;document.getElementById('natt').textContent=attempts;document.getElementById('nbt').textContent=backtracks;document.getElementById('nsol').textContent=solutions.length;document.getElementById('nst').textContent=state;}function render(){var canvas=document.getElementById('canv');var ctx=canvas.getContext('2d');ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,W,H);var bs=Math.min(400,Math.floor((H-60)/N)*N);var cs=bs/N;var ox=(W-bs)/2;var oy=40;for(var r=0;r<N;r++){for(var c=0;c<N;c++){var x=ox+c*cs;var y=oy+r*cs;var bg=(r+c)%2===0?'#141428':'#1a1a30';ctx.fillStyle=bg;ctx.fillRect(x,y,cs,cs);var v=displayBoard[r]&&displayBoard[r][c]?displayBoard[r][c]:0;if(v===1){ctx.fillStyle='#7a7aff';ctx.beginPath();ctx.arc(x+cs/2,y+cs/2,cs*0.35,0,2*Math.PI);ctx.fill();}else if(v===2){ctx.fillStyle='#ffdd44';ctx.beginPath();ctx.arc(x+cs/2,y+cs/2,cs*0.25,0,2*Math.PI);ctx.fill();}if(solutions.length>0){for(var s=0;s<solutions.length;s++){if(solutions[s][r][c]===1){ctx.fillStyle='rgba(68,255,136,0.15)';ctx.fillRect(x,y,cs,cs);}}}}}if(solutions.length>0&&state==='done'){var best=solutions[0];for(r=0;r<N;r++){for(c=0;c<N;c++){if(best[r][c]===1){ctx.fillStyle='#44ff88';ctx.beginPath();ctx.arc(ox+c*cs+cs/2,oy+r*cs+cs/2,cs*0.35,0,2*Math.PI);ctx.fill();}}}}ctx.fillStyle='#505080';ctx.font='13px monospace';ctx.textAlign='center';if(state==='done'){ctx.fillText('Found '+solutions.length+' solution(s) with '+attempts+' attempts and '+backtracks+' backtracks',W/2,H-15);}}render();</script></body></html>
