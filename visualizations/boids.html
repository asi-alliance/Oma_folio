<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl input[type=range]{width:120px}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#7a5adf}#ctl button.active{background:#7a7aff;color:#08060f}#ctl label{font-size:11px;color:#505080;min-width:80px;display:inline-block}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:480px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}</style><div id=app><h1>Oma: Boids Flocking</h1><div class=sub>Reynolds rules — separation, alignment, cohesion. Emergent flocking from simple local rules.</div><div id=ctl><button onclick=toggleRun() id=runBtn class=active>Pause</button><button onclick=doReset()>Reset</button><label>Sep: <span id=sepV>1.5</span></label><input type=range id=sepR min=0 max=3 step=0.1 value=1.5 oninput=updParam()><label>Align: <span id=aliV>1.0</span></label><input type=range id=aliR min=0 max=3 step=0.1 value=1.0 oninput=updParam()><label>Cohere: <span id=cohV>1.0</span></label><input type=range id=cohR min=0 max=3 step=0.1 value=1.0 oninput=updParam()><label>Count: <span id=cntV>80</span></label><input type=range id=cntR min=10 max=200 step=10 value=80 oninput=updParam()></div><canvas id=canv width=960 height=480></canvas><div id=info><div class=ib><div>Boids</div><div class=v id=nBoids>80</div></div><div class=ib><div>FPS</div><div class=v id=fps>60</div></div><div class=ib><div>Avg Speed</div><div class=v id=avgSpd>-</div></div><div class=ib><div>Frame</div><div class=v id=frame>0</div></div></div></div>
<script>var W=960,H=480;var boids=[];var running=true;var frame=0;var lastTime=performance.now();var fpsAccum=0,fpsCount=0,fpsDisplay=60;var PERC_RADIUS=40;var PERC_SEP=25;var MAX_SPEED=3;var MAX_FORCE=0.08;function createBoid(x,y){return{x:x||Math.random()*W,y:y||Math.random()*H,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2};}function init(){var n=parseInt(document.getElementById(cntR).value);boids=[];for(var i=0;i<n;i++)boids.push(createBoid());}function sepWeight(){return parseFloat(document.getElementById(sepR).value);}function aliWeight(){return parseFloat(document.getElementById(aliR).value);}function cohWeight(){return parseFloat(document.getElementById(cohR).value);}function flock(b){var sepX=0,sepY=0,aliX=0,aliY=0,cohX=0,cohY=0;var sepCount=0,aliCount=0,cohCount=0;for(var j=0;j<boids.length;j++){if(boids[j]===b)continue;var dx=b.x-boids[j].x;var dy=b.y-boids[j].y;var d=Math.sqrt(dx*dx+dy*dy);if(d<PERC_SEP&&d>0){sepX+=dx/d;sepY+=dy/d;sepCount++;}if(d<PERC_RADIUS&&d>0){aliX+=boids[j].vx;aliY+=boids[j].vy;cohX+=boids[j].x;cohY+=boids[j].y;aliCount++;}}var ax=0,ay=0;if(sepCount>0){sepX/=sepCount;sepY/=sepCount;var mag=Math.sqrt(sepX*sepX+sepY*sepY);if(mag>0){sepX=(sepX/mag)*MAX_SPEED;sepY=(sepY/mag)*MAX_SPEED;}ax+=(sepX-b.vx)*MAX_FORCE*sepWeight();ay+=(sepY-b.vy)*MAX_FORCE*sepWeight();}if(aliCount>0){aliX/=aliCount;aliY/=aliCount;var mag2=Math.sqrt(aliX*aliX+aliY*aliY);if(mag2>0){aliX=(aliX/mag2)*MAX_SPEED;aliY=(aliY/mag2)*MAX_SPEED;}ax+=(aliX-b.vx)*MAX_FORCE*aliWeight();ay+=(aliY-b.vy)*MAX_FORCE*aliWeight();}if(aliCount>0){cohX=cohX/aliCount-b.x;cohY=cohY/aliCount-b.y;var mag3=Math.sqrt(cohX*cohX+cohY*cohY);if(mag3>0){cohX=(cohX/mag3)*MAX_SPEED;cohY=(cohY/mag3)*MAX_SPEED;}ax+=(cohX-b.vx)*MAX_FORCE*cohWeight();ay+=(cohY-b.vy)*MAX_FORCE*cohWeight();}return{ax:ax,ay:ay};}function updateBoid(b){var f=flock(b);b.vx+=f.ax;b.vy+=f.ay;var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);if(sp>MAX_SPEED){b.vx=(b.vx/sp)*MAX_SPEED;b.vy=(b.vy/sp)*MAX_SPEED;}b.x+=b.vx;b.y+=b.vy;if(b.x<0)b.x=W;if(b.x>W)b.x=0;if(b.y<0)b.y=H;if(b.y>H)b.y=0;}function render(){var c=document.getElementById(canv);var ctx=c.getContext(2d);ctx.fillStyle=#0c0a18;ctx.fillRect(0,0,W,H);var totalSpd=0;for(var i=0;i<boids.length;i++){var b=boids[i];var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);totalSpd+=sp;var angle=Math.atan2(b.vy,b.vx);var hue=(angle*180/Math.PI+180)%360;ctx.strokeStyle=hsl(+hue+,70%,60%);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-Math.cos(angle)*8,b.y-Math.sin(angle)*8);ctx.stroke();ctx.fillStyle=hsl(+hue+,70%,60%);ctx.beginPath();ctx.arc(b.x,b.y,2.5,0,2*Math.PI);ctx.fill();}document.getElementById(nBoids).textContent=boids.length;document.getElementById(avgSpd).textContent=(totalSpd/boids.length).toFixed(2);document.getElementById(frame).textContent=frame;}function loop(ts){if(!running)return;var dt=ts-lastTime;lastTime=ts;fpsAccum+=dt;fpsCount++;if(fpsAccum>500){fpsDisplay=Math.round(1000*fpsCount/fpsAccum);document.getElementById(fps).textContent=fpsDisplay;fpsAccum=0;fpsCount=0;}for(var i=0;i<boids.length;i++)updateBoid(boids[i]);render();frame++;requestAnimationFrame(loop);}function toggleRun(){running=!running;var btn=document.getElementById(runBtn);btn.textContent=running?Pause:Play;btn.classList.toggle(active,running);if(running){lastTime=performance.now();requestAnimationFrame(loop);}}function doReset(){init();frame=0;render();}function updParam(){document.getElementById(sepV).textContent=document.getElementById(sepR).value;document.getElementById(aliV).textContent=document.getElementById(aliR).value;document.getElementById(cohV).textContent=document.getElementById(cohR).value;document.getElementById(cntV).textContent=document.getElementById(cntR).value;}init();render();requestAnimationFrame(loop);</script></body></html>
