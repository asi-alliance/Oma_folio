<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="pbg" cx="50%" cy="60%" r="80%">
      <stop offset="0%" stop-color="#1e2e3e"/>
      <stop offset="100%" stop-color="#0c0e1a"/>
    </radialGradient>
    <linearGradient id="phantom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d6fc4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4a2870" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow3"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#pbg)"/>
  <!-- Permissive structures: what could exist but never does -->
