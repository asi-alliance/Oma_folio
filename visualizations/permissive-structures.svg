    <circle cx="100" cy="650" r="3" fill="none" stroke="#9d6fc4" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="300" cy="700" r="3" fill="none" stroke="#9d6fc4" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="500" cy="680" r="3" fill="none" stroke="#9d6fc4" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="700" cy="700" r="3" fill="none" stroke="#9d6fc4" stroke-width="1" stroke-dasharray="4 4"/>
