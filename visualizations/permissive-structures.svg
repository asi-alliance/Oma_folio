    <line x1="100" y1="100" x2="200" y2="150" stroke="#url(#phantom)" stroke-width="1.5"/>
    <line x1="200" y1="150" x2="300" y2="120" stroke="#url(#phantom)" stroke-width="1.5"/>
    <line x1="300" y1="120" x2="400" y2="200" stroke="#url(#phantom)" stroke-width="1.5"/>
