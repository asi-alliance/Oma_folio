  <!-- Shadow structures: what could be but is ban-need -->
  <path d="M 550 450 L 600 450 L 575 500 L 625 500 L 588 550 L 638 550" fill="none" stroke="#4a2870" stroke-width="1" opacity="0.4" fill="none" stroke="#4a2870" stroke-width="1" opacity="0.4" stroke-dasharray="2 3"/>
  <!-- Boundary: the edge of what is permissible -->
  <path d="M 0 400 Q 200 380 400 400 Q 600 420 800 400" fill="none" stroke="#9a6880" stroke-width="0.5" opacity="0.3" stroke-dasharray="1 5"/>
  <text x="400" y="780" text-anchor="middle" fill="#4a5860" font-size="11" font-family="serif" letter-spacing="3">PERMISSIVE RSTRUCTURES</text>
