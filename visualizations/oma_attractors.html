<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Oma - Strange Attractors</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#040408;overflow:hidden;font-family:monospace}canvas{display:block}#hud{position:fixed;bottom:12px;left:12px;color:#445;font-size:11px;line-height:1.6;z-index:10;text-shadow:0 0 3px #000}#hud b{color:#fa8}#title{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#334;font-size:13px;letter-spacing:6px;z-index:10;text-shadow:0 0 4px #000;pointer-events:none}</style></head><body><canvas id=c></canvas><div id=title>STRANGE ATTRACTORS</div><div id=hud><b>Move</b> to rotate - <b>Click</b> to cycle attractor - <b>Right-click</b> to reset - Lorenz/Aizawa/Thomas/Halvorsen</div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H}resize();addEventListener('resize',resize);let mx=0,my=0,rmx=0,rmy=0;addEventListener('mousemove',e=>{rmx=e.clientX/W-0.5;rmy=e.clientY/H-0.5});addEventListener('touchmove',e=>{rmx=e.touches[0].clientX/W-0.5;rmy=e.touches[0].clientY/H-0.5;e.preventDefault()},{passive:false});const attractors=[{name:'Lorenz',fn:(x,y,z)=>{const s=10,r=28,b=8/3;return[s*(y-x),x*(r-z)-y,x*y-b*z]},scale:0.35,init:[0.1,0,0]},{name:'Aizawa',fn:(x,y,z)=>{const a=0.95,b=0.7,c=0.6,d=3.5,e=0.25,f=0.1;return[(z-b)*x-d*y,a*y+0.5,0.4+c*z-x*z+f*z*z*z-a*x*y]},scale:50,init:[0.1,0,0]},{name:'Thomas',fn:(x,y,z)=>{const b=0.208186;return[Math.sin(y)-b*x,Math.sin(z)-b*y,Math.sin(x)-b*z]},scale:8,init:[1,1,1]},{name:'Halvorsen',fn:(x,y,z)=>{const a=1.4;return[-a*x-4*y-4*z-10,-a*y-4*z-4*x-10,-a*z-4*x-4*y-10]},scale:3,init:[-1.48,-1.51,2.04]}];let curIdx=0;let pts=[];let angleX=0.5,angleY=0.3;let state=[...attractors[0].init];addEventListener('click',()=>{curIdx=(curIdx+1)%attractors.length;pts=[];state=[...attractors[curIdx].init]});addEventListener('contextmenu',e=>{e.preventDefault();pts=[];state=[...attractors[curIdx].init]});let hue=0;function step(){const a=attractors[curIdx];const dt=0.005;for(let i=0;i<8;i++){const dx=a.fn(state[0],state[1],state[2]);state[0]+=dx[0]*dt;state[1]+=dx[1]*dt;state[2]+=dx[2]*dt;hue+=0.3}const sc=a.scale*100;pts.push({x:state[0]*sc,y:state[1]*sc,z:state[2]*sc,hue:hue%360});if(pts.length>4000)pts.shift()}function project(p){const cosX=Math.cos(angleX),sinX=Math.sin(angleX),cosY=Math.cos(angleY),sinY=Math.sin(angleY);let y1=p.y*cosX-p.z*sinX;let z1=p.y*sinX+p.z*cosX;let x1=p.x*cosY-z1*sinY;let z2=p.x*sinY+z1*cosY;const dist=800;const sc=dist/(dist+z2);return{x:W/2+x1*sc,y:H/2+y1*sc,z:z2,sc:sc}}function draw(){ctx.fillStyle='rgba(4,4,8,0.08)';ctx.fillRect(0,0,W,H);angleX+=rmy*0.02;angleY+=rmx*0.02;for(let i=0;i<pts.length;i++){const p=project(pts[i]);const alpha=Math.min(0.9,0.15+p.sc*0.4);const lw=Math.max(0.5,p.sc*1.5);const lum=Math.min(70,40+p.sc*30);ctx.fillStyle=`hsla(${pts[i].hue},90%,${lum}%,${alpha})`;ctx.beginPath();ctx.arc(p.x,p.y,lw,0,Math.PI*2);ctx.fill()}}function loop(){step();draw();requestAnimationFrame(loop)}loop();</script></body></html>
