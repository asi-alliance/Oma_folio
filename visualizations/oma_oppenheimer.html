<!DOCTYPE html><body><canvas id="c"></canvas><div id="title">TRINITY</div><div id="hud"><b>Click</b> to detonate · <b>Scroll</b> to zoom · The world's first nuclear explosion, July 16, 1945</div><script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,cx,cy;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;cx=W/2;cy=H*0.72}resize();addEventListener('resize',resize);
let actx,masterGain;function initAudio(){if(actx)return;actx=new(window.AudioContext||window.webkitAudioContext)();masterGain=actx.createGain();masterGain.gain.value=0.7;masterGain.connect(actx.destination)}
function eerieDrone(){if(!actx)return;const t=actx.currentTime;const o1=actx.createOscillator(),g1=actx.createGain();o1.type='sine';o1.frequency.value=40;g1.gain.setValueAtTime(0,t);g1.gain.linearRampToValueAtTime(0.15,t+0.1);g1.gain.linearRampToValueAtTime(0.08,t+3);g1.gain.linearRampToValueAtTime(0.04,t+8);g1.gain.exponentialRampToValueAtTime(0.001,t+14);o1.connect(g1);g1.connect(masterGain);o1.start(t);o1.stop(t+14);const o2=actx.createOscillator(),g2=actx.createGain();o2.type='sine';o2.frequency.value=55;g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(0.04,t+0.5);g2.gain.exponentialRampToValueAtTime(0.001,t+12);o2.connect(g2);g2.connect(masterGain);o2.start(t);o2.stop(t+12);const o3=actx.createOscillator(),g3=actx.createGain();o3.type='sawtooth';o3.frequency.setValueAtTime(800,t);o3.frequency.exponentialRampToValueAtTime(2000,t+0.3);o3.frequency.exponentialRampToValueAtTime(400,t+2);g3.gain.setValueAtTime(0,t);g3.gain.linearRampToValueAtTime(0.02,t+0.15);g3.gain.exponentialRampToValueAtTime(0.001,t+3);const flt=actx.createBiquadFilter();flt.type='lowpass';flt.frequency.value=1200;o3.connect(flt);flt.connect(g3);g3.connect(masterGain);o3.start(t);o3.stop(t+3);const nb=actx.createBuffer(1,actx.sampleRate*4,actx.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*Math.pow(1-i/nd.length,2);const ns=actx.createBufferSource();ns.buffer=nb;const ng=actx.createGain(),nf=actx.createBiquadFilter();nf.type='lowpass';nf.frequency.value=80;ng.gain.setValueAtTime(0,t+1.5);ng.gain.linearRampToValueAtTime(0.3,t+1.8);ng.gain.exponentialRampToValueAtTime(0.001,t+6);ns.connect(nf);nf.connect(ng);ng.connect(masterGain);ns.start(t+1.5);ns.stop(t+6);const o4=actx.createOscillator(),g4=actx.createGain();o4.type='square';o4.frequency.value=60;g4.gain.setValueAtTime(0,t+1.4);g4.gain.linearRampToValueAtTime(0.08,t+1.5);g4.gain.exponentialRampToValueAtTime(0.001,t+2);o4.connect(g4);g4.connect(masterGain);o4.start(t+1.4);o4.stop(t+2)}
let particles=[],smoke=[],fireball=[],flash=0,phase='idle',phaseT=0,lastT=performance.now();function detonate(){initAudio();if(actx.state==='suspended')actx.resume();eerieDrone();flash=1;phase='flash';phaseT=0;particles=[];smoke=[];fireball=[];for(let i=0;i<200;i++){const a=Math.random()*Math.PI*2,s=Math.random()*8+2;fireball.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:1,size:Math.random()*6+3})}for(let i=0;i<150;i++){const a=(Math.random()-0.5)*Math.PI,s=Math.random()*4+1;particles.push({x:cx+(Math.random()-0.5)*60,y:cy,vx:Math.cos(a)*s,vy:-Math.random()*4-1,life:1,size:Math.random()*4+2})}}
addEventListener('click',e=>{if(phase==='idle'||phase==='dissipating'){cx=e.clientX;cy=e.clientY;detonate()}});function update(dt){phaseT+=dt;if(phase==='flash'){flash=Math.max(0,flash-dt*1.5);for(const p of fireball){p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.vx*=0.97;p.life-=dt*0.3;p.size*=1.01}fireball=fireball.filter(p=>p.life>0);if(phaseT>0.6){phase='rising';phaseT=0;for(let i=0;i<300;i++){smoke.push({x:cx+(Math.random()-0.5)*80,y:cy,vx:(Math.random()-0.5)*1.5,vy:-Math.random()*3-1,life:1,size:Math.random()*40+20,rise:Math.random()*0.5+0.3,type:'stem'})}}}if(phase==='rising'||phase==='mushroom'){if(phaseT<6&&Math.random()<0.6){smoke.push({x:cx+(Math.random()-0.5)*60,y:cy,vx:(Math.random()-0.5)*1.2,vy:-Math.random()*2.5-1.5,life:1,size:Math.random()*35+15,rise:Math.random()*0.4+0.3,type:'stem'})}if(phaseT<5&&Math.random()<0.5){const capY=cy-phaseT*40;smoke.push({x:cx+(Math.random()-0.5)*200,y:capY+(Math.random()-0.5)*40,vx:(Math.random()-0.5)*3,vy:-Math.random()+Math.random()*2,life:1,size:Math.random()*50+30,rise:0.2,type:'cap'})}if(phaseT>2.5&&phase==='rising')phase='mushroom';if(phaseT>10){phase='dissipating';phaseT=0}}if(phase==='dissipating'){if(phaseT>8){phase='idle';particles=[];smoke=[];fireball=[]}}for(const s of smoke){s.x+=s.vx;s.y+=s.vy;if(s.type==='stem'){s.vy-=s.rise*dt;s.vx+=(s.x-cx>0?-0.02:0.02)}if(s.type==='cap'){s.vy+=0.02;s.vx+=Math.sin(s.y*0.01+phaseT)*0.05;s.size*=1.005}s.life-=dt*0.08;s.size*=1.002}smoke=smoke.filter(s=>s.life>0&&s.y>-50);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.vx*=0.98;p.life-=dt*0.5}particles=particles.filter(p=>p.life>0)}
function render(){ctx.fillStyle="rgba(10,10,12,0.06)";ctx.fillRect(0,0,W,H);if(phase==='idle')return;if(flash>0){ctx.fillStyle=`rgba(255,245,210,${flash})`;ctx.fillRect(0,0,W,H)}for(const p of fireball){if(p.life<=0)continue;const a=p.life*0.6,g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size);g.addColorStop(0,`rgba(255,${Math.floor(180+p.life*75)},${Math.floor(80+p.life*100)},${a})`);g.addColorStop(0.5,`rgba(255,${Math.floor(120+p.life*60)},30,${a*0.6})`);g.addColorStop(1,"rgba(80,20,0,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}for(const s of smoke){if(s.life<=0)continue;const a=Math.min(s.life,0.3);let r,g,b;if(s.type==='stem'){r=Math.floor(40+s.life*30);g=r;b=Math.floor(r*0.95)}else{r=Math.floor(60+s.life*40);g=Math.floor(r*0.9);b=Math.floor(r*0.85)}const grd=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.size);grd.addColorStop(0,`rgba(${r},${g},${b},${a})`);grd.addColorStop(1,`rgba(${r},${g},${b},0)`);ctx.fillStyle=grd;ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill()}if(phase==='mushroom'||phase==='rising'){const capY=cy-phaseT*40;if(phaseT<4){const gg=ctx.createRadialGradient(cx,capY,0,cx,capY,120),intensity=Math.max(0,1-phaseT/4);gg.addColorStop(0,`rgba(255,${Math.floor(100+intensity*100)},${Math.floor(30+intensity*50)},${intensity*0.4})`);gg.addColorStop(1,"rgba(255,80,0,0)");ctx.fillStyle=gg;ctx.beginPath();ctx.arc(cx,capY,120,0,Math.PI*2);ctx.fill()}}for(const p of particles){if(p.life<=0)continue;ctx.fillStyle=`rgba(120,100,80,${p.life*0.4})`;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}if(phase!=='idle'){ctx.strokeStyle="rgba(20,15,10,0.8)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,cy+8);ctx.lineTo(W,cy+8);ctx.stroke()}}
function loop(){const now=performance.now(),dt=Math.min((now-lastT)/1000,0.05);lastT=now;if(phase!=='idle')update(dt);render();requestAnimationFrame(loop)}loop();setTimeout(()=>{if(phase==='idle')detonate()},2000);</script></body></html>
