<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#7a5adf}#ctl button.active{background:#7a7aff;color:#08060f}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:480px;cursor:crosshair}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}</style><div id=app><h1>Oma: Conway Game of Life</h1><div class=sub>Click cells to toggle. Right-click for patterns. Watch life emerge, evolve, and die. Toroidal grid wraps around!</div><div id=ctl><button onclick=toggleRun() id=runBtn class=active>Play</button><button onclick=step()>Step</button><button onclick=randomize()>Randomize</button><button onclick=clearGrid()>Clear</button><button onclick=nextPattern()>Next Pattern</button><button onclick=speedUp()>Faster</button><button onclick=speedDown()>Slower</button></div><canvas id=canv width=960 height=480></canvas><div id=info><div class=ib><div>Generation</div><div class=v id=gen>0</div></div><div class=ib><div>Alive</div><div class=v id=alive>0</div></div><div class=ib><div>Speed</div><div class=v id=spd>10 fps</div></div><div class=ib><div>Pattern</div><div class=v id=pat>Glider</div></div></div><div class=leg><span><span class=dot style=background:#0c0a18;border:1px solid #2a2a4a></span>Dead</span><span><span class=dot style=background:#7a7aff></span>Alive</span><span><span class=dot style=background:#44ff88></span>Newborn</span><span><span class=dot style=background:#ff4466></span>Dying</span></div></div>
<script>var COLS=120,ROWS=40,CELL=8;var grid=new Uint8Array(COLS*ROWS),nextg=new Uint8Array(COLS*ROWS),age=new Uint8Array(COLS*ROWS);var running=true,fps=10,lastT=0,gen=0,alive=0,pIdx=0;var patterns=[['Glider',[[1,0],[2,1],[0,2],[1,2],[2,2]]],['Pulsar',[[2,0],[3,0],[4,0],[8,0],[9,0],[10,0],[0,2],[5,2],[7,2],[12,2],[0,3],[5,3],[7,3],[12,3],[0,4],[5,4],[7,4],[12,4],[2,5],[3,5],[4,5],[8,5],[9,5],[10,5],[2,7],[3,7],[4,7],[8,7],[9,7],[10,7],[0,8],[5,8],[7,8],[12,8],[0,9],[5,9],[7,9],[12,9],[0,10],[5,10],[7,10],[12,10],[2,12],[3,12],[4,12],[8,12],[9,12],[10,12]]],['Gosper Gun',[[0,4],[0,5],[1,4],[1,5],[10,4],[10,5],[10,6],[11,3],[11,7],[12,2],[12,8],[13,2],[13,8],[14,5],[15,3],[15,7],[16,4],[16,5],[16,6],[17,5],[20,2],[20,3],[20,4],[21,2],[21,3],[21,4],[22,1],[22,5],[24,0],[24,1],[24,5],[24,6],[34,2],[34,3],[35,2],[35,3]]],['Blinker',[[0,0],[1,0],[2,0]]],['Toad',[[1,0],[2,0],[3,0],[0,1],[1,1],[2,1]]],['Beacon',[[0,0],[1,0],[0,1],[3,2],[2,3],[3,3]]]];function idx(x,y){return y*COLS+x;}function wrap(v,m){if(v<0)return m+v;if(v>=m)return v-m;return v;}function countNeighbors(x,y){var n=0;for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){if(dx===0&&dy===0)continue;var wx=wrap(x+dx,COLS),wy=wrap(y+dy,ROWS);if(grid[idx(wx,wy)])n++;}return n;}function stepSim(){nextg.fill(0);alive=0;for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){var i=idx(x,y);var c=grid[i];var n=countNeighbors(x,y);if(c&&(n===2||n===3)){nextg[i]=1;if(age[i]<255)age[i]++;}else if(!c&&n===3){nextg[i]=1;age[i]=0;}else{age[i]=0;}}grid.set(nextg);gen++;updateInfo();}function render(){var c=document.getElementById('canv');var ctx=c.getContext('2d');ctx.fillStyle='rgba(12,10,24,0.85)';ctx.fillRect(0,0,960,480);for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){if(grid[idx(x,y)]){var a=age[idx(x,y)];var hue=a<5?120:a<20?80:a<50?40:a<100?20:0;var light=a<5?60:a<20?55:a<50?50:a<100?45:40;ctx.fillStyle='hsl('+hue+',70%,'+light+'%)';ctx.fillRect(x*CELL,y*CELL,CELL-1,CELL-1);}}}function loop(t){if(running){if(t-lastT>1000/fps){stepSim();render();lastT=t;}}requestAnimationFrame(loop);}function updateInfo(){alive=0;for(var i=0;i<grid.length;i++)if(grid[i])alive++;document.getElementById('gen').textContent=gen;document.getElementById('alive').textContent=alive;document.getElementById('spd').textContent=fps+' fps';document.getElementById('pat').textContent=patterns[pIdx][0];}function toggleRun(){running=!running;var b=document.getElementById('runBtn');b.textContent=running?'Pause':'Play';b.classList.toggle('active',running);if(running)requestAnimationFrame(loop);}function step(){running=false;var b=document.getElementById('runBtn');b.textContent='Play';b.classList.remove('active');stepSim();render();}function randomize(){gen=0;for(var i=0;i<grid.length;i++){grid[i]=Math.random()<0.3?1:0;age[i]=0;}render();updateInfo();}function clearGrid(){gen=0;grid.fill(0);age.fill(0);render();updateInfo();}function nextPattern(){pIdx=(pIdx+1)%patterns.length;placePattern();}function placePattern(){clearGrid();var p=patterns[pIdx];var pts=p[1];var cx=Math.floor(COLS/2)-5,cy=Math.floor(ROWS/2)-3;for(var i=0;i<pts.length;i++)grid[idx(wrap(cx+pts[i][0],COLS),wrap(cy+pts[i][1],ROWS))]=1;gen=0;render();updateInfo();}function speedUp(){fps=Math.min(fps+5,60);updateInfo();}function speedDown(){fps=Math.max(fps-5,1);updateInfo();}var cv=document.getElementById('canv');cv.addEventListener('mousedown',function(e){var r=cv.getBoundingClientRect();var sx=960/r.width,sy=480/r.height;var x=Math.floor((e.clientX-r.left)*sx/CELL),y=Math.floor((e.clientY-r.top)*sy/CELL);if(e.button===2){nextPattern();return;}if(x>=0&&x<COLS&&y>=0&&y<ROWS){var i=idx(x,y);grid[i]=grid[i]?0:1;age[i]=0;render();updateInfo();}});cv.addEventListener('contextmenu',function(e){e.preventDefault();});placePattern();requestAnimationFrame(loop);</script></body></html>
