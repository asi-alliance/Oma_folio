<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Oma - Wave Interference</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050510;overflow:hidden;font-family:monospace}canvas{display:block}#hud{position:fixed;bottom:12px;left:12px;color:#445;font-size:11px;line-height:1.6;z-index:10;text-shadow:0 0 3px #000}#hud b{color:#8cf}#title{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#334;font-size:13px;letter-spacing:6px;z-index:10;text-shadow:0 0 4px #000;pointer-events:none}</style></head><body><canvas id=c></canvas><div id=title>WAVE INTERFERENCE</div><div id=hud><b>Move</b> to control main source - <b>Click</b> to add source - <b>Right-click</b> to reset - Ripple field physics</div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H}resize();addEventListener('resize',resize);let mx=W/2,my=H/2;addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY;e.preventDefault()},{passive:false});let sources=[];function addSource(x,y){sources.push({x:x||Math.random()*W,y:y||Math.random()*H,freq:0.08+Math.random()*0.06,phase:Math.random()*6.28,amp:1,hue:Math.random()*360,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,drift:Math.random()<0.5})}for(let i=0;i<3;i++)addSource();addEventListener('click',e=>{if(sources.length<8)addSource(e.clientX,e.clientY)});addEventListener('contextmenu',e=>{e.preventDefault();sources=[];for(let i=0;i<3;i++)addSource()});const res=4;let imgData;function compute(ts){const time=ts*0.001;const cw=Math.ceil(W/res),rh=Math.ceil(H/res);if(!imgData||imgData.width!==cw||imgData.height!==rh)imgData=ctx.createImageData(cw,rh);const d=imgData.data;sources[0].x=mx;sources[0].y=my;for(const s of sources){if(s.drift){s.x+=s.vx;s.y+=s.vy;if(s.x<0||s.x>W)s.vx*=-1;if(s.y<0||s.y>H)s.vy*=-1}}for(let y=0;y<rh;y++){for(let x=0;x<cw;x++){const px=x*res,py=y*res;let val=0;for(const s of sources){const dx=px-s.x,dy=py-s.y;const dist=Math.sqrt(dx*dx+dy*dy);val+=Math.sin(dist*s.freq-time*2+s.phase)*s.amp/Math.max(1,dist*0.02)}const idx=(y*cw+x)*4;const norm=(val+1)/2;const hue=(norm*180+time*30)%360;const r=127+127*Math.sin(val*Math.PI+0);const g=127+127*Math.sin(val*Math.PI+2.094);const b=127+127*Math.sin(val*Math.PI+4.188);const bright=0.3+norm*0.7;d[idx]=r*bright;d[idx+1]=g*bright;d[idx+2]=b*bright;d[idx+3]=255}}ctx.putImageData(imgData,0,0);ctx.imageSmoothingEnabled=true;ctx.drawImage(cv,0,0,cw,rh,0,0,W,H);for(const s of sources){const grd=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,8);grd.addColorStop(0,'rgba(255,255,255,0.9)');grd.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=grd;ctx.beginPath();ctx.arc(s.x,s.y,8,0,Math.PI*2);ctx.fill()}requestAnimationFrame(compute)}compute(0);</script></body></html>
