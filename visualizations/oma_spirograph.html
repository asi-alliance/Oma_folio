<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Oma - Spirograph</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050510;overflow:hidden;font-family:monospace}canvas{display:block}#hud{position:fixed;bottom:12px;left:12px;color:#445;font-size:11px;line-height:1.6;z-index:10;text-shadow:0 0 3px #000}#hud b{color:#f8c}#title{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#334;font-size:13px;letter-spacing:6px;z-index:10;text-shadow:0 0 4px #000;pointer-events:none}</style></head><body><canvas id=c></canvas><div id=title>SPIROGRAPH</div><div id=hud><b>Move</b> to morph parameters - <b>Click</b> to randomize - <b>Right-click</b> to clear - Hypotrochoid & epitrochoid curves</div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;clearBg()}resize();addEventListener('resize',resize);let mx=W/2,my=H/2,pmx=W/2,pmy=H/2;addEventListener('mousemove',e=>{pmx=mx;pmy=my;mx=e.clientX;my=e.clientY});addEventListener('touchmove',e=>{pmx=mx;pmy=my;mx=e.touches[0].clientX;my=e.touches[0].clientY;e.preventDefault()},{passive:false});addEventListener('touchend',()=>{mx=pmx=W/2;my=pmy=H/2});function clearBg(){ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H)}clearBg();let R=120,r=35,d=50;let t=0;let hue=0;let mode=0;const modes=['Hypotrochoid','Epitrochoid','Rose','Lissajous'];let trails=[];const maxTrails=5000;function randomize(){R=80+Math.random()*120;r=10+Math.random()*60;d=20+Math.random()*80;t=0;trails=[];clearBg()}addEventListener('click',randomize);addEventListener('contextmenu',e=>{e.preventDefault();clearBg();trails=[];t=0});function computePoint(t){const cx=W/2,cy=H/2;if(mode===0){const x=(R-r)*Math.cos(t)+d*Math.cos((R-r)/r*t);const y=(R-r)*Math.sin(t)-d*Math.sin((R-r)/r*t);return{x:cx+x,y:cy+y}}else if(mode===1){const x=(R+r)*Math.cos(t)-d*Math.cos((R+r)/r*t);const y=(R+r)*Math.sin(t)-d*Math.sin((R+r)/r*t);return{x:cx+x,y:cy+y}}else if(mode===2){const k=r/10;const rad=R*Math.cos(k*t);return{x:cx+rad*Math.cos(t),y:cy+rad*Math.sin(t)}}else{const a=R,b=r,c=d;return{x:cx+a*Math.sin(t+hue*0.01),y:cy+b*Math.sin(c*t)}}}addEventListener('wheel',e=>{e.preventDefault();mode=(mode+1)%modes.length;clearBg();trails=[];t=0});function morph(){const tx=(mx/W-0.5),ty=(my/H-0.5);R=120+tx*100;r=35+ty*60;d=50+tx*40+ty*30}function draw(){ctx.fillStyle='rgba(5,5,16,0.015)';ctx.fillRect(0,0,W,H);morph();const steps=4;const dt=0.02;for(let i=0;i<steps;i++){const p=computePoint(t);trails.push({x:p.x,y:p.y,hue:hue%360});t+=dt;hue+=0.8}if(trails.length>maxTrails)trails.splice(0,trails.length-maxTrails);ctx.lineCap='round';ctx.lineJoin='round';for(let i=1;i<trails.length;i++){const a=trails[i-1],b=trails[i];const fade=i/trails.length;ctx.strokeStyle=`hsla(${b.hue},90%,60%,${fade*0.6})`;ctx.lineWidth=1+fade*1.5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}ctx.fillStyle='rgba(255,200,255,0.9)';ctx.beginPath();ctx.arc(trails[trails.length-1].x,trails[trails.length-1].y,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(180,180,200,0.4)';ctx.font='11px monospace';ctx.fillText(modes[mode],16,28);requestAnimationFrame(draw)}draw();</script></body></html>
