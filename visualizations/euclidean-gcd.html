<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#44ffaa;text-shadow:0 0 12px #22ff88;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl input{width:80px;padding:6px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px;text-align:center}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#44ffaa}#ctl label{font-size:11px;color:#505080}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:480px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}</style><div id=app><h1>Oma: Euclidean GCD</h1><div class=sub>Euclidean algorithm: gcd(a,b) = gcd(b, a mod b). Visualized as rectangle tiling with remainder stripping. O(log(min(a,b))).</div><div id=ctl><label>A:</label><input id=aInput value=84><label>B:</label><input id=bInput value=36><button onclick=doCompute()>Compute</button><button onclick=doStep()>Step</button><button onclick=doRun()>Auto Run</button><button onclick=doStop()>Stop</button><button onclick=doRandom()>Random</button><label>Speed:</label><input id=spd value=60></div><canvas id=canv width=960 height=480></canvas><div id=info><div class=ib><div>A</div><div class=v id=na>0</div></div><div class=ib><div>B</div><div class=v id=nb>0</div></div><div class=ib><div>Step</div><div class=v id=nst>0</div></div><div class=ib><div>Quotient</div><div class=v id=nq>0</div></div><div class=ib><div>Remainder</div><div class=v id=nr>0</div></div><div class=ib><div>GCD</div><div class=v id=ng>—</div></div></div><div class=leg><span><span class=dot style=background:#7a7aff></span>Larger (A)</span><span><span class=dot style=background:#44ffaa></span>Smaller (B)</span><span><span class=dot style=background:#ffdd44></span>Current Step</span><span><span class=dot style=background:#ff4466></span>GCD Found</span></div></div>
<script>var W=960,H=480;var a=0,b=0,origA=0,origB=0;var step=0;var quotient=0,remainder=0;var gcd=-1;var phase='Idle';var running=false;var timer=null;var tiles=[];var tileIdx=0;var subPhase='Divide';function doCompute(){a=parseInt(document.getElementById('aInput').value)||84;b=parseInt(document.getElementById('bInput').value)||36;origA=a;origB=b;step=0;gcd=-1;tiles=[];tileIdx=0;subPhase='Divide';phase='Running';computeStep();updateInfo();render();}function doRandom(){a=Math.floor(Math.random()*200)+5;b=Math.floor(Math.random()*200)+5;document.getElementById('aInput').value=a;document.getElementById('bInput').value=b;doCompute();}function computeStep(){if(b===0){gcd=a;phase='Done';return;}quotient=Math.floor(a/b);remainder=a%b;tiles=[];var cx=W/2,cy=H/2;var rw=a*2, rh=b*2;var scale=Math.min((W-80)/rw,(H-80)/rh,1);rw*=scale;rh*=scale;var sx=cx-rw/2,sy=cy-rh/2;for(var i=0;i<quotient;i++){tiles.push({x:sx+i*rh,y:sy,w:rh,h:rh,color:i%2===0?'#7a7aff':'#5a5adf'});}if(remainder>0){tiles.push({x:sx+quotient*rh,y:sy,w:remainder*scale*2,h:rh,color:'#44ffaa'});}}function doStep(){if(phase==='Idle'||phase==='Done'){if(phase==='Idle')doCompute();return;}if(subPhase==='Divide'){a=b;b=remainder;step++;computeStep();updateInfo();render();}}function doRun(){if(phase==='Idle')doCompute();running=true;var spd=parseInt(document.getElementById('spd').value)||60;timer=setInterval(function(){if(phase==='Done'){clearInterval(timer);timer=null;running=false;return;}doStep();},spd);}function doStop(){if(timer){clearInterval(timer);timer=null;}running=false;phase='Paused';updateInfo();render();}function updateInfo(){document.getElementById('na').textContent=a;document.getElementById('nb').textContent=b;document.getElementById('nst').textContent=step;document.getElementById('nq').textContent=quotient;document.getElementById('nr').textContent=remainder;document.getElementById('ng').textContent=gcd>=0?gcd:'—';}function render(){var canvas=document.getElementById('canv');var ctx=canvas.getContext('2d');ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,W,H);if(phase==='Idle'){ctx.fillStyle='#505080';ctx.font='14px monospace';ctx.textAlign='center';ctx.fillText('Enter A and B, click Compute',W/2,H/2);return;}for(var i=0;i<tiles.length;i++){var t=tiles[i];ctx.fillStyle=t.color;ctx.fillRect(t.x,t.y,t.w,t.h);ctx.strokeStyle='#08060f';ctx.lineWidth=1;ctx.strokeRect(t.x,t.y,t.w,t.h);}if(tiles.length>0){var last=tiles[tiles.length-1];ctx.fillStyle='#ffdd44';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText('r='+remainder,last.x+last.w/2,last.y-6);}ctx.fillStyle='#ffbb55';ctx.font='12px monospace';ctx.textAlign='left';ctx.fillText('a='+a+', b='+b+', q='+quotient+', r='+remainder,12,H-12);if(phase==='Done'){ctx.fillStyle='#ff4466';ctx.font='bold 18px monospace';ctx.textAlign='center';ctx.fillText('GCD('+origA+', '+origB+') = '+gcd,W/2,H-12);}}render();</script></body></html>
