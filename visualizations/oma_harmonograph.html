<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Oma - Harmonograph</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#06060a;overflow:hidden;font-family:monospace}canvas{display:block}#hud{position:fixed;bottom:12px;left:12px;color:#445;font-size:11px;line-height:1.6;z-index:10;text-shadow:0 0 3px #000}#hud b{color:#8af}#title{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#334;font-size:13px;letter-spacing:6px;z-index:10;text-shadow:0 0 4px #000;pointer-events:none}</style></head><body><canvas id=c></canvas><div id=title>HARMONOGRAPH</div><div id=hud><b>Move</b> to influence damping - <b>Click</b> for new pattern - Parametric pendulum art</div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H}resize();addEventListener('resize',resize);let mx=-999,my=-999;addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY;e.preventDefault()},{passive:false});addEventListener('touchend',()=>{mx=-999;my=-999});let params={f1:2.01,f2:3,f3:3.02,f4:2,d1:0.004,d2:0.0065,d3:0.008,d4:0.019,p1:0,p2:0,p3:Math.PI/2,p4:Math.PI/2,A1:100,A2:100,A3:100,A4:100};function newParams(){params={f1:1+Math.random()*4,f2:1+Math.random()*4,f3:1+Math.random()*4,f4:1+Math.random()*4,d1:0.002+Math.random()*0.008,d2:0.002+Math.random()*0.008,d3:0.002+Math.random()*0.008,d4:0.002+Math.random()*0.015,p1:Math.random()*Math.PI*2,p2:Math.random()*Math.PI*2,p3:Math.random()*Math.PI*2,p4:Math.random()*Math.PI*2,A1:80+Math.random()*60,A2:80+Math.random()*60,A3:80+Math.random()*60,A4:80+Math.random()*60}}addEventListener('click',()=>{newParams();initDraw()});let t=0,points=[],drawing=false,hue=200;function initDraw(){ctx.fillStyle='rgba(6,6,10,1)';ctx.fillRect(0,0,W,H);t=0;points=[];drawing=true;hue=Math.random()*360}initDraw();const cx=W/2,cy=H/2;let frame=0;function draw(){if(drawing){let steps=8;for(let s=0;s<steps;s++){const damping=1-(mx>0?0.3*(1-Math.sqrt((mx-cx)*(mx-cx)+(my-cy)*(my-cy))/300):0);const x=cx+params.A1*Math.sin(params.f1*t+params.p1)*Math.exp(-params.d1*t)+params.A2*Math.sin(params.f2*t+params.p2)*Math.exp(-params.d2*t);const y=cy+params.A3*Math.sin(params.f3*t+params.p3)*Math.exp(-params.d3*t)+params.A4*Math.sin(params.f4*t+params.p4)*Math.exp(-params.d4*t);points.push({x,y,hue:hue+t*0.5});t+=0.02;if(t>800){drawing=false;break}}}ctx.fillStyle='rgba(6,6,10,0.003)';ctx.fillRect(0,0,W,H);if(points.length>1){ctx.lineCap='round';ctx.lineWidth=1.2;for(let i=Math.max(0,points.length-steps*3);i<points.length-1;i++){const p=points[i],n=points[i+1];const h=(p.hue%360);const fade=Math.max(0.15,1-t/800);ctx.strokeStyle=`hsla(${h},80%,60%,${fade*0.6})`;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(n.x,n.y);ctx.stroke()}}frame++;if(frame%300===0&&points.length>100){ctx.fillStyle='rgba(6,6,10,0.5)';ctx.fillRect(0,0,W,H);for(let i=0;i<points.length-1;i++){const p=points[i],n=points[i+1];const h=(p.hue%360);const fade=Math.max(0.1,1-i/points.length);ctx.strokeStyle=`hsla(${h},80%,60%,${fade*0.3})`;ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(n.x,n.y);ctx.stroke()}}if(!drawing&&frame%600===0){newParams();initDraw();frame=0}requestAnimationFrame(draw)}draw();</script></body></html>
