<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Oma - Reaction Diffusion</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#040408;overflow:hidden;font-family:monospace}canvas{display:block}#hud{position:fixed;bottom:12px;left:12px;color:#445;font-size:11px;line-height:1.6;z-index:10;text-shadow:0 0 3px #000}#hud b{color:#f8a}#title{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#334;font-size:13px;letter-spacing:6px;z-index:10;text-shadow:0 0 4px #000;pointer-events:none}</style></head><body><canvas id=c></canvas><div id=title>REACTION DIFFUSION</div><div id=hud><b>Move</b> to seed - <b>Click</b> to add reactant - <b>Right-click</b> to reset - Gray-Scott Turing patterns</div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,cw,rh;const cell=3;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;cw=Math.ceil(W/cell);rh=Math.ceil(H/cell)}resize();addEventListener('resize',resize);let mx=-999,my=-999;addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY;e.preventDefault()},{passive:false});addEventListener('touchend',()=>{mx=-999;my=-999});let u,v,uNext,vNext;function initGrids(){u=new Float32Array(cw*rh);v=new Float32Array(cw*rh);uNext=new Float32Array(cw*rh);vNext=new Float32Array(cw*rh);for(let i=0;i<cw*rh;i++){u[i]=1;v[i]=0}const cc=Math.floor(cw/2),cr=Math.floor(rh/2);for(let y=-4;y<=4;y++)for(let x=-4;x<=4;x++){const idx=((cr+y+rh)%rh)*cw+((cc+x+cw)%cw);v[idx]=1}}initGrids();let feed=0.055,kill=0.062,dA=1.0,dB=0.5;addEventListener('click',e=>{const cx=Math.floor(e.clientX/cell),cy=Math.floor(e.clientY/cell);for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){const gx=(cx+dx+cw)%cw,gy=(cy+dy+rh)%rh;if(dx*dx+dy*dy<25)v[gy*cw+gx]=1}});addEventListener('contextmenu',e=>{e.preventDefault();initGrids()});let imgData;function step(){for(let y=0;y<rh;y++){for(let x=0;x<cw;x++){const i=y*cw+x;let au=0,av=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=(x+dx+cw)%cw,ny=(y+dy+rh)%rh;const ni=ny*cw+nx;au+=u[ni];av+=v[ni]}au=(au-u[i]*4)*0.2;av=(av-v[i]*4)*0.2;const uvv=u[i]*v[i]*v[i];const du=dA*au-uvv+feed*(1-u[i]);const dv=dB*av+uvv-(kill+feed)*v[i];uNext[i]=u[i]+du;vNext[i]=v[i]+dv;if(uNext[i]<0)uNext[i]=0;if(uNext[i]>1)uNext[i]=1;if(vNext[i]<0)vNext[i]=0;if(vNext[i]>1)vNext[i]=1}}const tu=u;u=uNext;uNext=tu;const tv=v;v=vNext;vNext=tv}function draw(){if(!imgData||imgData.width!==cw||imgData.height!==rh)imgData=ctx.createImageData(cw,rh);const d=imgData.data;for(let i=0;i<cw*rh;i++){const val=Math.min(1,v[i]*3);const hue=(val*200+30)%360;const r=127+127*Math.sin(val*Math.PI+0);const g=127+127*Math.sin(val*Math.PI+2.094);const b=127+127*Math.sin(val*Math.PI+4.188);const br=0.2+val*0.8;d[i*4]=r*br;d[i*4+1]=g*br;d[i*4+2]=b*br;d[i*4+3]=255}ctx.putImageData(imgData,0,0);ctx.imageSmoothingEnabled=true;ctx.drawImage(cv,0,0,cw,rh,0,0,W,H)}let frame=0;function loop(){frame++;if(mx>0&&frame%3===0){const cxp=Math.floor(mx/cell),cyp=Math.floor(my/cell);for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const gx=(cxp+dx+cw)%cw,gy=(cyp+dy+rh)%rh;if(dx*dx+dy*dy<9)v[gy*cw+gx]=1}}for(let s=0;s<2;s++)step();draw();requestAnimationFrame(loop)}loop();</script></body></html>
