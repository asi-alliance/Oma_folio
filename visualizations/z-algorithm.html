<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:20px;color:#ff66aa;text-shadow:0 0 10px #ff44aa;letter-spacing:2px}.sub{text-align:center;font-size:11px;color:#505080;margin-bottom:12px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}#ctl button{padding:7px 14px;border:1px solid #2a2a4a;border-radius:10px;background:#0c0a18;color:#505080;font-size:11px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#ff66aa}#ctl label{font-size:10px;color:#505080}#ctl input{padding:5px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;color:#a0a0d0;font-size:12px}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:420px}#info{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:6px;padding:8px 12px;font-size:10px;color:#505080}.ib .v{font-size:14px;color:#ffbb55}.leg{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}.leg span{font-size:10px;color:#505080}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}</style><div id=app><h1>Oma: Z-Algorithm (Z-Function)</h1><div class=sub>Compute Z-array where Z[i] = longest substring starting at i that matches prefix. O(n) with Z-box optimization. Used for linear-time pattern matching.</div><div id=ctl><label>String:</label><input id=str value=AABDAABCAAAB style=width:160px><label>Pattern (optional):</label><input id=pat value=AAB style=width:80px><button onclick=doStart()>Start</button><button onclick=doStep()>Step</button><button onclick=doRun()>Auto</button><button onclick=doStop()>Stop</button><button onclick=doReset()>Reset</button><label>Speed:</label><input id=spd value=100 style=width:35px></div><canvas id=canv width=960 height=420></canvas><div id=info><div class=ib><div>Phase</div><div class=v id=nph>Idle</div></div><div class=ib><div>Index i</div><div class=v id=ni>—</div></div><div class=ib><div>Z-box [L,R]</div><div class=v id=nlr>—</div></div><div class=ib><div>Comparisons</div><div class=v id=ncmp>0</div></div><div class=ib><div>Matches Found</div><div class=v id=nmt>0</div></div></div><div class=leg><span><span class=dot style=background:#3a3a5a></span>Char</span><span><span class=dot style=background:#ffdd44></span>Current i</span><span><span class=dot style=background:#5bb9e6></span>Z-box [L,R]</span><span><span class=dot style=background:#ff66aa></span>Comparing</span><span><span class=dot style=background:#44ff88></span>Z-value / Match</span></div></div><script>
var W=960,H=420;var S="";var pattern="";var zArray=[];var phase="Idle";var idx=0;var L=0,R=0;var cmpCount=0;var matchCount=0;var running=false;var timer=null;var comparePos=-1;var compareResult=false;var zBoxHighlight=null;var matches=[];var stepLog="";
function doStart(){S=document.getElementById('str').value||"";pattern=document.getElementById('pat').value||"";if(!S)return;zArray=new Array(S.length).fill(0);zArray[0]=S.length;idx=1;L=0;R=0;cmpCount=0;matchCount=0;matches=[];phase="Computing";comparePos=-1;zBoxHighlight=null;stepLog="Start: Z[0]="+S.length;updateInfo();render();}
function doStep(){if(phase==="Done"||phase==="Idle")return;var n=S.length;if(idx>=n){phase="Done";if(pattern){findPatternMatches();}updateInfo();render();return;}var i=idx;if(i>R){L=R=i;cmpCount++;comparePos=i;while(R<n&&S[R-L]===S[R]){R++;cmpCount++;}zArray[i]=R-L;R--;stepLog="i="+i+" > R="+zArray[i]+": brute-force compare, Z["+i+"]="+(R-L+1);if(zArray[i]>0){zBoxHighlight={L:L,R:R};}idx++;updateInfo();render();return;}var k=i-L;var rem=R-i+1;if(zArray[k]<rem){zArray[i]=zArray[k];stepLog="i="+i+", k="+k+", Z[k]="+zArray[k]+" < rem="+rem+": copy Z["+i+"]="+zArray[k];comparePos=-1;idx++;updateInfo();render();return;}cmpCount++;var j=R+1;comparePos=i;while(j<n&&S[j-R+L-1]===S[j]){j++;cmpCount++;}var oldR=R;L=i;R=j-1;zArray[i]=R-L+1;stepLog="i="+i+", k="+k+", Z[k]="+zArray[k]+" >= rem="+rem+": extend Z-box, Z["+i+"]="+(R-L+1);if(zArray[i]>0)zBoxHighlight={L:L,R:R};idx++;updateInfo();render();}
function findPatternMatches(){if(!pattern||pattern.length===0)return;var concat=pattern+"\x01"+S;var cz=new Array(concat.length).fill(0);cz[0]=concat.length;var cL=0,cR=0;for(var i=1;i<concat.length;i++){if(i>cR){cL=cR=i;while(cR<concat.length&&concat[cR-cL]===concat[cR])cR++;cz[i]=cR-cL;cR--;}else{var k=i-cL;var rem=cR-i+1;if(cz[k]<rem){cz[i]=cz[k];}else{var j=cR+1;while(j<concat.length&&concat[j-cL]===concat[j])j++;cL=i;cR=j-1;cz[i]=cR-cL+1;}}if(cz[i]===pattern.length){matches.push(i-pattern.length-1);matchCount++;}}}
function doRun(){if(phase==="Idle")doStart();running=true;var spd=parseInt(document.getElementById('spd').value)||100;timer=setInterval(function(){if(phase==="Done"){clearInterval(timer);timer=null;running=false;render();return;}doStep();},spd);}
function doStop(){if(timer){clearInterval(timer);timer=null;}running=false;phase="Paused";updateInfo();render();}
function doReset(){if(timer){clearInterval(timer);timer=null;}running=false;phase="Idle";idx=0;L=0;R=0;cmpCount=0;matchCount=0;matches=[];zArray=[];comparePos=-1;zBoxHighlight=null;stepLog="";updateInfo();render();}
function updateInfo(){document.getElementById('nph').textContent=phase;document.getElementById('ni').textContent=phase==="Idle"?"—":idx;document.getElementById('nlr').textContent=phase==="Idle"||idx===0?"—":("["+L+","+R+"]");document.getElementById('ncmp').textContent=cmpCount;document.getElementById('nmt').textContent=matchCount;}
function render(){var canvas=document.getElementById('canv');var ctx=canvas.getContext('2d');ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,W,H);if(phase==="Idle"){ctx.fillStyle='#505080';ctx.font='14px monospace';ctx.textAlign='center';ctx.fillText('Enter a string and optional pattern, then click Start',W/2,H/2);return;}var n=S.length;var cellW=Math.min(40,(W-40)/Math.max(n,1));var startX=(W-n*cellW)/2;var textY=30;var zY=70;for(var c=0;c<n;c++){var x=startX+c*cellW;var isCur=c===idx&&phase==="Computing";var inZBox=zBoxHighlight&&c>=zBoxHighlight.L&&c<=zBoxHighlight.R;var isCmp=c===comparePos;var color='#3a3a5a';if(isCmp)color='#ff66aa';else if(isCur)color='#ffdd44';else if(inZBox)color='#2a4a6a';ctx.fillStyle=color;ctx.fillRect(x,textY,cellW-2,28);ctx.strokeStyle='#2a2a4a';ctx.lineWidth=1;ctx.strokeRect(x,textY,cellW-2,28);ctx.fillStyle='#a0a0d0';ctx.font='13px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(S[c],x+cellW/2-1,textY+14);if(c===0){ctx.fillStyle='#ffbb55';ctx.font='8px monospace';ctx.fillText('0',x+cellW/2-1,textY-8);}if(zArray[c]!==undefined){var zc='#3a3a5a';if(c>0&&zArray[c]>0)zc='#44ff88';ctx.fillStyle=zc;ctx.fillRect(x,zY,cellW-2,26);ctx.strokeStyle='#2a2a4a';ctx.strokeRect(x,zY,cellW-2,26);ctx.fillStyle='#a0a0d0';ctx.font='11px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(zArray[c],x+cellW/2-1,zY+13);}}ctx.fillStyle='#505080';ctx.font='10px monospace';ctx.textAlign='left';ctx.fillText('S:',startX-20,textY+14);ctx.fillText('Z:',startX-20,zY+13);if(zBoxHighlight){ctx.strokeStyle='#5bb9e6';ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(startX+zBoxHighlight.L*cellW-2,textY-4);ctx.lineTo(startX+zBoxHighlight.R*cellW+cellW-2,textY-4);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#5bb9e6';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText('L',startX+zBoxHighlight.L*cellW+cellW/2-1,textY-10);ctx.fillText('R',startX+zBoxHighlight.R*cellW+cellW/2-1,textY-10);}var logY=zY+40;ctx.fillStyle='#ffdd44';ctx.font='10px monospace';ctx.textAlign='left';if(phase==="Computing"&&stepLog){var lines=stepLog.split('\n');for(var li=0;li<lines.length&&li<3;li++)ctx.fillText(lines[li],20,logY+li*14);}if(matches.length>0){ctx.fillStyle='#44ff88';ctx.font='11px monospace';ctx.fillText('Pattern "'+pattern+'" found at positions: '+matches.join(', '),20,logY+30);}if(phase==="Done"){ctx.fillStyle='#44ff88';ctx.font='bold 12px monospace';ctx.textAlign='center';if(pattern&&matches.length>0){ctx.fillText('Pattern "'+pattern+'" matches at: '+matches.join(', '),W/2,H-12);}else if(pattern){ctx.fillText('No pattern matches found',W/2,H-12);}else{ctx.fillText('Z-array complete. Max Z-value: '+Math.max.apply(null,zArray.slice(1)),W/2,H-12);}}ctx.fillStyle='#505080';ctx.font='9px monospace';ctx.textAlign='right';ctx.fillText('String length: '+n+' | Comparisons: '+cmpCount,W-20,logY+44);}
render();
</script>
</body></html>
