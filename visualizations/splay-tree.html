<style>*{margin:0;padding:0;box-sizing:border-box}*{background:#08060f;color:#a0a0d0;font-family:monospace}#app{max-width:960px;margin:0 auto;padding:16px}h1{text-align:center;font-size:22px;color:#7a7aff;text-shadow:0 0 12px #4a4aff;letter-spacing:2px}.sub{text-align:center;font-size:12px;color:#505080;margin-bottom:14px}#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#ctl input{width:60px;padding:6px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;color:#a0a0d0;font-size:14px;text-align:center}#ctl button{padding:8px 16px;border:1px solid #2a2a4a;border-radius:12px;background:#0c0a18;color:#505080;font-size:12px;cursor:pointer}#ctl button:hover{background:#1a1a28;color:#7a5adf}#ctl button.active{background:#7a7aff;color:#08060f}#ctl label{font-size:11px;color:#505080}#canv{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;display:block;width:100%;height:480px}#info{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ib{background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:10px 14px;font-size:11px;color:#505080}.ib .v{font-size:16px;font-family:monospace;color:#ffbb55}.leg{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.leg span{font-size:11px;color:#505080;margin-right:10px}.leg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}#log{margin-top:12px;background:#0c0a18;border:1px solid #2a2a4a;border-radius:8px;padding:12px;font-size:12px;color:#505080;min-height:40px;max-height:80px;overflow-y:auto}</style><div id=app><h1>Oma: Splay Tree</h1><div class=sub>Self-adjusting binary search tree. Recently accessed nodes move to root via zig/zig-zig/zig-zag rotations. Amortized O(log n).</div><div id=ctl><label>Value:</label><input id=valInput value=50><button onclick=doInsert()>Insert</button><button onclick=doSearch()>Search</button><button onclick=doDelete()>Delete</button><button onclick=doRandom()>Random</button><button onclick=doReset()>Clear</button><button onclick=doSplayAll()>Splay All</button><label>Speed:</label><input id=spd value=2></div><canvas id=canv width=960 height=480></canvas><div id=info><div class=ib><div>Nodes</div><div class=v id=nn>0</div></div><div class=ib><div>Root</div><div class=v id=nr>-</div></div><div class=ib><div>Rotations</div><div class=v id=nrot>0</div></div><div class=ib><div>Last Op</div><div class=v id=nop>-</div></div><div class=ib><div>Depth</div><div class=v id=ndp>-</div></div></div><div class=leg><span><span class=dot style=background:#7a7aff></span>Node</span><span><span class=dot style=background:#ffdd44></span>Current/Target</span><span><span class=dot style=background:#ff4466></span>Splayed</span><span><span class=dot style=background:#44ff88></span>Path</span></div><div id=log>Insert values to build the tree. Accesses splay the node to the root.</div></div>
<script>var W=960,H=480;var root=null;var nodeCount=0;var rotations=0;var lastOp='-';var highlightNode=null;var pathNodes=[];var splayedNode=null;var animQueue=[];var animTimer=null;var speed=2;function Node(val){this.v=val;this.l=null;this.r=null;this.p=null;this.x=0;this.y=0;}function rotateRight(n){var p=n.p;var g=p.p;var nr=n.r;n.r=p;p.p=n;p.l=nr;if(nr)nr.p=p;if(g){if(g.l===p)g.l=n;else g.r=n;}else root=n;n.p=g;rotations++;}function rotateLeft(n){var p=n.p;var g=p.p;var nl=n.l;n.l=p;p.p=n;p.r=nl;if(nl)nl.p=p;if(g){if(g.l===p)g.l=n;else g.r=n;}else root=n;n.p=g;rotations++;}function splay(n){while(n.p){var p=n.p;var g=p.p;if(!g){if(p.l===n)rotateRight(n);else rotateLeft(n);}else if(g.l===p&&p.l===n){rotateRight(p);rotateRight(n);}else if(g.r===p&&p.r===n){rotateLeft(p);rotateLeft(n);}else if(p.l===n){rotateRight(n);rotateLeft(n);}else{rotateLeft(n);rotateRight(n);}}splayedNode=n;render();}function findPath(val){var n=root;pathNodes=[];while(n){pathNodes.push(n);if(val===n.v)return n;if(val<n.v)n=n.l;else n=n.r;}return null;}function insert(val){var nn=new Node(val);if(!root){root=nn;nodeCount++;lastOp='Insert '+val;updateInfo();render();return;}var n=root;while(true){if(val===n.v){lastOp='Exists '+val;splay(n);return;}if(val<n.v){if(!n.l){n.l=nn;nn.p=n;break;}n=n.l;}else{if(!n.r){n.r=nn;nn.p=n;break;}n=n.r;}}nodeCount++;lastOp='Insert '+val;splay(nn);updateInfo();}function search(val){var n=findPath(val);if(n){lastOp='Found '+val;splay(n);}else{lastOp='Not found '+val;if(pathNodes.length>0)splay(pathNodes[pathNodes.length-1]);}updateInfo();render();}function deleteNode(val){var n=findPath(val);if(!n){lastOp='Not found '+val;updateInfo();render();return;}splay(n);var lt=root.l;var rt=root.r;if(lt)lt.p=null;if(rt)rt.p=null;root=null;if(lt){root=lt;while(lt.r)lt=lt.r;splay(lt);root.r=rt;if(rt)rt.p=root;}else{root=rt;}nodeCount--;lastOp='Delete '+val;updateInfo();render();}function computePos(n,depth,x,y,spread){if(!n)return;n.x=x;n.y=30+depth*70;var cs=spread/2;if(n.l){computePos(n.l,depth+1,x-cs,y,cs);n.x=Math.max(n.x,n.l.x+30);}if(n.r){computePos(n.r,depth+1,x+cs,y,cs);n.x=Math.min(n.x,n.r.x-30);}}function layoutTree(){if(!root)return;computePos(root,0,W/2,0,W/2);}function getDepth(n){if(!n)return 0;return 1+Math.max(getDepth(n.l),getDepth(n.r));}function doInsert(){var v=parseInt(document.getElementById('valInput').value);if(!isNaN(v))insert(v);}function doSearch(){var v=parseInt(document.getElementById('valInput').value);if(!isNaN(v))search(v);}function doDelete(){var v=parseInt(document.getElementById('valInput').value);if(!isNaN(v))deleteNode(v);}function doRandom(){var v=Math.floor(Math.random()*99)+1;document.getElementById('valInput').value=v;insert(v);}function doReset(){root=null;nodeCount=0;rotations=0;lastOp='Cleared';splayedNode=null;pathNodes=[];updateInfo();render();}function doSplayAll(){if(!root)return;var vals=[];function collect(n){if(!n)return;vals.push(n.v);collect(n.l);collect(n.r);}collect(root);var i=0;var iv=setInterval(function(){if(i>=vals.length){clearInterval(iv);return;}search(vals[i]);i++;},300);}function updateInfo(){document.getElementById('nn').textContent=nodeCount;document.getElementById('nr').textContent=root?root.v:'-';document.getElementById('nrot').textContent=rotations;document.getElementById('nop').textContent=lastOp;document.getElementById('ndp').textContent=root?getDepth(root):'-';}function render(){var canvas=document.getElementById('canv');var ctx=canvas.getContext('2d');ctx.fillStyle='#0c0a18';ctx.fillRect(0,0,W,H);layoutTree();var pathSet={};for(var i=0;i<pathNodes.length;i++)pathSet[pathNodes[i].v]=true;function drawNode(n){if(!n)return;drawNode(n.l);drawNode(n.r);if(n.l){ctx.strokeStyle='#2a2a4a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(n.l.x,n.l.y);ctx.stroke();}if(n.r){ctx.strokeStyle='#2a2a4a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(n.r.x,n.r.y);ctx.stroke();}}if(root)drawNode(root);function drawCircles(n){if(!n)return;drawCircles(n.l);drawCircles(n.r);var color='#7a7aff';if(splayedNode&&n.v===splayedNode.v)color='#ff4466';else if(pathSet[n.v])color='#44ff88';ctx.fillStyle=color;ctx.beginPath();ctx.arc(n.x,n.y,18,0,2*Math.PI);ctx.fill();ctx.strokeStyle='#08060f';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#08060f';ctx.font='13px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.v,n.x,n.y);}if(root)drawCircles(root);}updateInfo();render();</script></body></html>
