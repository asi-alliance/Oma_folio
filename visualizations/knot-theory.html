<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Knot Theory Visualizer</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#080812;color:#b0b8d0;font-family:monospace;overflow:hidden;height:100vh}canvas{position:absolute;top:0;left:0}#info{position:absolute;top:14px;left:14px;z-index:100;background:rgba(8,8,16,.88);padding:14px 18px;border:1px solid #234;border-radius:8px;max-width:420px}h1{font-size:.85rem;color:#7c83fd;margin-bottom:8px}#info p{font-size:.7rem;color:#667;line-height:1.6;margin-bottom:4px}#hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#334;font-size:.68rem;z-index:100}.ov{color:#5ce5fe}.un{color:#f55}.r1{color:#a0f0a0}.r2{color:#f0a060}.r3{color:#c0a0f0}</style></head><body><div id="info"><h1>Knot Theory Visualizer</h1><p>Select a knot type to render its projection diagram</p><p><span class="ov">Over</span>/<span class="un">under</span> crossings shown with gap technique</p><p>Toggle <span class="r1">R1</span>/<span class="r2">R2</span>/<span class="r3">R3</span> Reidemeister moves</p><p style="margin-top:8px;color:#889">Click and drag strands to deform the knot</p></div><canvas id="c"></canvas><div id="hint">select knot type below · click to toggle crossings · drag to deform</div><script>var c=document.getElementById("c"),x=c.getContext("2d"),W,H;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}resize();addEventListener("resize",resize);var knots={trefoil:[{t:0,x:300,y:200,over:false},{t:1,x:460,y:200,over:false},{t:2,x:560,y:300,over:false},{t:3,x:500,y:420,over:false},{t:4,x:320,y:420,over:false},{t:5,x:260,y:300,over:false},{t:6,x:300,y:200,over:true}],figure8:[{t:0,x:250,y:250,over:false},{t:1,x:400,y:180,over:false},{t:2,x:550,y:250,over:false},{t:3,x:500,y:400,over:false},{t:4,x:350,y:450,over:false},{t:5,x:200,y:400,over:false},{t:6,x:300,y:300,over:true},{t:7,x:400,y:300,over:true},{t:8,x:250,y:250,over:true}],unknot:[{t:0,x:300,y:250,over:false},{t:1,x:500,y:250,over:false},{t:2,x:550,y:350,over:false},{t:3,x:400,y:420,over:false},{t:4,x:250,y:350,over:false},{t:5,x:300,y:250,over:true}]};var current="trefoil";var pts=knots[current].map(function(p){return{x:p.x,y:p.y,over:p.over}});var dragIdx=-1;var crossings=[];var showR1=false,showR2=false,showR3=false;var buttons={};function buildButtons(){var bx=14,bp=H-60;var types=["unknot","trefoil","figure8"];types.forEach(function(name,i){var b=document.createElement("button");b.textContent=name;b.style.cssText="position:absolute;left:"+(bx+i*100)+"px;bottom:14px;z-index:100;background:#1a1a2e;color:#7c83fd;border:1px solid #234;padding:6px 12px;border-radius:4px;font-family:monospace;font-size:.75rem;cursor:pointer";b.onclick=function(){current=name;pts=knots[current].map(function(p){return{x:p.x,y:p.y,over:p.over}});computeCrossings()};document.body.appendChild(b)})}buildButtons();function computeCrossings(){crossings=[];for(var i=0;i<pts.length-1;i++){for(var j=i+2;j<pts.length-1;j++){if(i===0&&j===pts.length-2)continue;var a1=pts[i],a2=pts[i+1],b1=pts[j],b2=pts[j+1];var d=segIntersect(a1,a2,b1,b2);if(d){crossings.push({x:d.x,y:d.y,segA:i,segB:j})}}}}function segIntersect(p1,p2,p3,p4){var d=(p2.x-p1.x)*(p4.y-p3.y)-(p2.y-p1.y)*(p4.x-p3.x);if(Math.abs(d)<0.001)return null;var t=((p3.x-p1.x)*(p4.y-p3.y)-(p3.y-p1.y)*(p4.x-p3.x))/d;var u=((p3.x-p1.x)*(p2.y-p1.y)-(p3.y-p1.y)*(p2.x-p1.x))/d;if(t<0.05||t>0.95||u<0.05||u>0.95)return null;return{x:p1.x+t*(p2.x-p1.x),y:p1.y+t*(p2.y-p1.y),t:t,u:u}}computeCrossings();function getMouse(e){var r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.addEventListener("mousedown",function(e){var m=getMouse(e);for(var i=0;i<pts.length;i++){var dx=m.x-pts[i].x,dy=m.y-pts[i].y;if(dx*dx+dy*dy<400){dragIdx=i;return}}for(var cr of crossings){var dx=m.x-cr.x,dy=m.y-cr.y;if(dx*dx+dy*dy<200){var seg=pts[cr.segA];if(seg.over){seg.over=false}else{seg.over=true}computeCrossings();return}}});c.addEventListener("mousemove",function(e){if(dragIdx>=0){var m=getMouse(e);pts[dragIdx].x=m.x;pts[dragIdx].y=m.y;computeCrossings()}});c.addEventListener("mouseup",function(){dragIdx=-1});function drawStrand(){x.strokeStyle="#5ce5fe";x.lineWidth=3;x.lineCap="round";for(var i=0;i<pts.length-1;i++){var skip=false;for(var cr of crossings){if(cr.segA===i&&cr.t>0.3&&cr.t<0.7){skip=true;break}if(cr.segB===i&&cr.u>0.3&&cr.u<0.7){if(pts[cr.segA].over){skip=true;break}}}if(!skip){x.beginPath();x.moveTo(pts[i].x,pts[i].y);x.lineTo(pts[i+1].x,pts[i+1].y);x.stroke()}}x.strokeStyle="#5ce5fe";for(var i=0;i<pts.length-1;i++){var drawn=false;for(var cr of crossings){if(cr.segA===i&&cr.t>0.3&&cr.t<0.7){if(pts[cr.segA].over){x.beginPath();x.moveTo(pts[i].x,pts[i].y);x.lineTo(cr.x-8,pts[i].y+(cr.y-pts[i].y)*(cr.t-0.15)/(0.3-0.15));x.stroke();x.beginPath();x.moveTo(cr.x+8,pts[i].y+(cr.y-pts[i].y)*(cr.t+0.15)/(0.7-0.15));x.lineTo(pts[i+1].x,pts[i+1].y);x.stroke();drawn=true}break}if(cr.segB===i&&cr.u>0.3&&cr.u<0.7){if(pts[cr.segB].over){x.beginPath();x.moveTo(pts[i].x,pts[i].y);x.lineTo(cr.x-8,pts[i].y+(cr.y-pts[i].y)*(cr.u-0.15)/(0.3-0.15));x.stroke();x.beginPath();x.moveTo(cr.x+8,pts[i].y+(cr.y-pts[i].y)*(cr.u+0.15)/(0.7-0.15));x.lineTo(pts[i+1].x,pts[i+1].y);x.stroke();drawn=true}break}}if(!drawn){x.beginPath();x.moveTo(pts[i].x,pts[i].y);x.lineTo(pts[i+1].x,pts[i+1].y);x.stroke()}}}function tick(){x.fillStyle="#080812";x.fillRect(0,0,W,H);drawStrand();for(var i=0;i<pts.length;i++){x.fillStyle="#7c83fd";x.beginPath();x.arc(pts[i].x,pts[i].y,4,0,7);x.fill()}for(var cr of crossings){x.strokeStyle="rgba(255,85,85,0.6)";x.lineWidth=1;x.beginPath();x.arc(cr.x,cr.y,8,0,7);x.stroke()}x.fillStyle="#7c83fd";x.font="11px monospace";x.textAlign="left";x.fillText("Knot: "+current,14,H-90);x.fillText("Crossings: "+crossings.length,14,H-74);var kc=current==="unknot"?0:current==="trefoil"?3:4;x.fillText("Crossing number: "+kc,14,H-58);requestAnimationFrame(tick)}tick();</script></body></html>
