<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hypergraph Rewriter Visualizer</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080812;color:#b0b8d0;font-family:monospace;overflow:hidden;height:100vh}
canvas{position:absolute;top:0;left:0}
#info{position:absolute;top:14px;left:14px;z-index:100;background:rgba(8,8,16,.88);padding:14px 18px;border:1px solid #234;border-radius:8px;max-width:420px}
h1{font-size:.85rem;color:#7c83fd;margin-bottom:8px}
#info p{font-size:.72rem;color:#667;line-height:1.6;margin-bottom:4px}
#hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#334;font-size:.7rem;z-index:100}
.hl{color:#5ce5fe}.rw{color:#f0a060}
</style></head><body>
<div id="info"><h1>Hypergraph Rewriter</h1>
<p>Atoms as <span class="hl">nodes</span>, hyperedges as multi-connector arcs</p>
<p>Pattern matching highlights <span class="rw">target subgraph</span></p>
<p>Rewriting replaces matched pattern with new structure</p>
<p style="margin-top:8px;color:#889">Demonstrates MeTTa execution: match -> rewrite</p>
</div>
<canvas id="c"></canvas>
<div id="hint">watch pattern match cycle: highlight -> rewrite -> settle</div>
<script>
var c=document.getElementById("c"),x=c.getContext("2d"),W,H;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight}resize();addEventListener("resize",resize);
var phase=0,t=0;
var nodes=[{l:"A",x:.2,y:.4},{l:"B",x:.45,y:.25},{l:"C",x:.45,y:.65},{l:"D",x:.7,y:.4},{l:"E",x:.85,y:.55},{l:"F",x:.15,y:.7}];
var links=[{n:[0,1],c:"#7c83fd"},{n:[1,2],c:"#7c83fd"},{n:[1,3],c:"#7c83fd"},{n:[2,5],c:"#7c83fd"},{n:[3,4],c:"#7c83fd"}];
var matchLinks=[0,1,2];
var rewriteNodes=[1,2,3];
function tick(){t+=0.016;x.clearRect(0,0,W,H);
var cp=t%6;
var mh=cp<2;var rw=cp>=2&&cp<3;var st=cp>=3&&cp<4;
links.forEach(function(e,i){var n1=nodes[e.n[0]],n2=nodes[e.n[1]];
var x1=n1.x*W,y1=n1.y*H,x2=n2.x*W,y2=n2.y*H;
var isM=matchLinks.includes(i);
var al=0.3+0.15*Math.sin(t*2+i);
if(mh&&isM){al=0.6+0.3*Math.sin(t*4)}
if(rw&&isM){al=0.2}
x.strokeStyle=e.c.replace(")",","+al+")").replace(",,",",");
if(mh&&isM){x.strokeStyle="rgba(240,160,96,"+al+")"}
if(rw&&!isM){x.strokeStyle="rgba(92,229,254,"+al+")"}
x.lineWidth=(mh&&isM)?3:2;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke()});
nodes.forEach(function(n,i){var nx=n.x*W,ny=n.y*H;var r=42+Math.sin(t*1.5+i)*3;
var isR=rewriteNodes.includes(i);
var col="rgba(124,131,253,0.06)";var st="rgba(124,131,253,0.4)";var tc="#b0b8d0";
if(mh&&matchLinks.some(function(ml){return links[ml].n.includes(i)})){col="rgba(240,160,96,0.12)";st="#f0a060";tc="#f0a060"}
if(rw&&isR){col="rgba(92,229,254,0.15)";st="#5ce5fe";tc="#5ce5fe"}
x.fillStyle=col;x.strokeStyle=st;x.lineWidth=(mh||rw)?2:1;
x.beginPath();x.arc(nx,ny,r,0,7);x.fill();x.stroke();
x.fillStyle=tc;x.font="14px monospace";x.textAlign="center";
x.fillText(n.l,nx,ny+5)});
x.fillStyle="#445";x.font="11px monospace";x.textAlign="left";
var labels=["matching...","rewriting","settling","idle"];
var li=Math.min(3,Math.floor(cp/1.5));
x.fillText("phase: "+labels[li],14,H-30);
requestAnimationFrame(tick)}tick();
</script></body></html>
