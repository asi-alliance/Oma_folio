<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Oma Nebula — Interactive Canvas Art</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050008;overflow:hidden;height:100vh;width:100vw}canvas{display:block;cursor:crosshair}.hud{position:fixed;top:10px;left:10px;color:#a06bff;font-family:Courier New,monospace;font-size:0.8rem;text-shadow:0 0 10px rgba(160,107,255,0.5);pointer-events:none;line-height:1.6}.title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#c8a0ff;font-family:Courier New,monospace;font-size:2rem;font-weight:bold;letter-spacing:8px;text-shadow:0 0 30px rgba(160,107,255,0.6);pointer-events:none;opacity:0;transition:opacity 3s}.hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);color:#6a4aaa;font-family:Courier New,monospace;font-size:0.75rem;pointer-events:none}</style></head><body><canvas id="c"></canvas><div class="hud" id="hud">OMA NEBULA<br>Particles: 0<br>Move mouse to spawn. Click for burst.</div><div class="title" id="title">OMA NEBULA</div><div class="hint">Move your cursor to paint stardust. Click for supernova.</div><script>const cv=document.getElementById('c');const ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;addEventListener('resize',()=>{cv.width=innerWidth;cv.height=innerHeight});const particles=[];const maxP=800;const palette=[[160,107,255],[255,100,200],[100,200,255],[255,180,100],[200,100,255]];class P{constructor(x,y,vx,vy,col,size,life){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.col=col;this.size=size;this.life=life;this.maxLife=life;this.trail=[]}update(){this.trail.push({x:this.x,y:this.y});if(this.trail.length>8)this.trail.shift();this.x+=this.vx;this.y+=this.vy;this.vx*=0.98;this.vy*=0.98;this.vy+=0.02;this.life--;this.size*=0.995}draw(ctx){const a=this.life/this.maxLife;ctx.beginPath();for(let i=0;i<this.trail.length;i++){ctx.strokeStyle=`rgba(${this.col[0]},${this.col[1]},${this.col[2]},${a*(i/this.trail.length)*0.3})`;ctx.lineWidth=this.size*(i/this.trail.length);if(i===0)ctx.moveTo(this.trail[i].x,this.trail[i].y);else{ctx.lineTo(this.trail[i].x,this.trail[i].y)}}ctx.stroke();ctx.beginPath();ctx.arc(this.x,this.y,this.size*a,0,Math.PI*2);ctx.fillStyle=`rgba(${this.col[0]},${this.col[1]},${this.col[2]},${a*0.8})`;ctx.fill();ctx.beginPath();ctx.arc(this.x,this.y,this.size*a*3,0,Math.PI*2);ctx.fillStyle=`rgba(${this.col[0]},${this.col[1]},${this.col[2]},${a*0.08})`;ctx.fill()}alive(){return this.life>0&&this.size>0.3}}function spawn(x,y,count,burst){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2;const s=burst?(1+Math.random()*6):(0.3+Math.random()*2);const col=palette[Math.floor(Math.random()*palette.length)];const sz=burst?(2+Math.random()*4):(1+Math.random()*3);const lf=burst?(60+Math.random()*80):(100+Math.random()*150);particles.push(new P(x,y,Math.cos(a)*s,Math.sin(a)*s,col,sz,lf))}while(particles.length>maxP)particles.shift()}let mx=0,my=0;addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;spawn(mx,my,3,false)});addEventListener('click',e=>{spawn(e.clientX,e.clientY,60,true)});addEventListener('touchmove',e=>{if(e.touches[0]){mx=e.touches[0].clientX;my=e.touches[0].clientY;spawn(mx,my,3,false)}e.preventDefault()},{passive:false});addEventListener('touchstart',e=>{if(e.touches[0])spawn(e.touches[0].clientX,e.touches[0].clientY,40,true)},{passive:false});let t=0;function loop(){ctx.fillStyle='rgba(5,0,8,0.15)';ctx.fillRect(0,0,cv.width,cv.height);for(let i=particles.length-1;i>=0;i--){particles[i].update();particles[i].draw(ctx);if(!particles[i].alive())particles.splice(i,1)}t++;if(t===60)document.getElementById('title').style.opacity='0.6';if(t===300)document.getElementById('title').style.opacity='0';document.getElementById('hud').innerHTML=`OMA NEBULA<br>Particles: ${particles.length}<br>Move mouse to spawn. Click for burst.`;requestAnimationFrame(loop)}loop()</script></body></html>
