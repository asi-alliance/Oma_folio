<!DOCTYPE html>
<html lang=en><head><meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Cow Pinball - Oma</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d1a;color:#e8e0d0;font:14px monospace;display:flex;flex-direction:column;align-items:center;touch-action:none}
#wrap{position:relative;width:400px;height:600px;margin:8px}
canvas{border:2px solid #3a3a5e;border-radius:8px;cursor:none}
#info{font-size:12px;color:#6a6a8e;margin:4px 0}
#controls{display:flex;gap:8px;margin:4px 0}
button{background:#2a2a4e;color:#e8e0d0;border:1px solid #5a5a8e;padding:6px 14px;border-radius:4px;cursor:pointer;font:12px monospace}
button:active{background:#3a3a6e}
</style></head><body>
<div id=controls>
<button id=resetBtn>New Game</button>
<button id=launchBtn>Launch</button>
</div>
<div id=wrap><canvas id=cv width=400 height=600></canvas></div>
<div id=info>Score: 0 | Balls: 3 | Tap left/right side for flippers</div>
<script>
var cv=document.getElementById('cv'),x=cv.getContext('2d');
var W=400,H=600;
var score=0,balls=3,gameOver=false;
var ball={x:200,y:560,vx:0,vy:0,r:8};
var leftFlipper={x:120,y:540,angle:0.5,active:false};
var rightFlipper={x:280,y:540,angle:-0.5,active:false};
var bumpers=[{x:200,y:200,r:25,pts:100},{x:130,y:280,r:20,pts:150},{x:270,y:280,r:20,pts:150},{x:200,y:350,r:22,pts:200}];
var particles=[];
var launched=false;
var gravity=0.15;
function reset(){score=0;balls=3;gameOver=false;newBall();updateInfo();}
function newBall(){ball.x=370;ball.y=560;ball.vx=0;ball.vy=0;launched=false;}
function launch(){if(launched||gameOver)return;launched=true;ball.vx=-2-Math.random()*2;ball.vy=-8-Math.random()*3;}
function updateInfo(){document.getElementById('info').textContent='Score: '+score+' | Balls: '+balls+(gameOver?' | GAME OVER':'');}
function spawnParticles(px,py,color){for(var i=0;i<8;i++){var a=Math.random()*Math.PI*2;var s=2+Math.random()*4;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:color});}}
function step(){
if(gameOver)return;if(!launched)return;
ball.vy+=gravity;ball.vx*=0.999;ball.vy*=0.999;ball.x+=ball.vx;ball.y+=ball.vy;
if(ball.x-ball.r<10){ball.x=10+ball.r;ball.vx=Math.abs(ball.vx)*0.8;}
if(ball.x+ball.r>W-10){ball.x=W-10-ball.r;ball.vx=-Math.abs(ball.vx)*0.8;}
if(ball.y-ball.r<10){ball.y=10+ball.r;ball.vy=Math.abs(ball.vy)*0.8;}
for(var b of bumpers){var dx=ball.x-b.x,dy=ball.y-b.y;var d=Math.sqrt(dx*dx+dy*dy);if(d<ball.r+b.r){var nx=dx/d,ny=dy/d;ball.x=b.x+nx*(ball.r+b.r);ball.y=b.y+ny*(ball.r+b.r);var dot=ball.vx*nx+ball.vy*ny;ball.vx-=2*dot*nx*1.3;ball.vy-=2*dot*ny*1.3;score+=b.pts;spawnParticles(b.x,b.y,'#ffcc44');updateInfo();}}
var la=leftFlipper.angle+(leftFlipper.active?-0.6:0);
var lf={x:leftFlipper.x,y:leftFlipper.y,tipx:leftFlipper.x-70*Math.cos(la),tipy:leftFlipper.y+70*Math.sin(la)};
var ra=-rightFlipper.angle+(rightFlipper.active?0.6:0);
var rf={x:rightFlipper.x,y:rightFlipper.y,tipx:rightFlipper.x+70*Math.cos(ra),tipy:rightFlipper.y+70*Math.sin(ra)};
for(var fl of [lf,rf]){var fx=fl.tipx-fl.x,fy=fl.tipy-fl.y;var t=Math.max(0,Math.min(1,((ball.x-fl.x)*fx+(ball.y-fl.y)*fy)/(fx*fx+fy*fy)));var px=fl.x+t*fx,py=fl.y+t*fy;var ddx=ball.x-px,ddy=ball.y-py;var dd=Math.sqrt(ddx*ddx+ddy*ddy);if(dd<ball.r+6){var nnx=ddx/dd,nny=ddy/dd;ball.x=px+nnx*(ball.r+6);ball.y=py+nny*(ball.r+6);var dot2=ball.vx*nnx+ball.vy*nny;if(dot2<0){ball.vx-=2*dot2*nnx*1.1;ball.vy-=2*dot2*nny*1.1;}if((fl===lf&&leftFlipper.active)||(fl===rf&&rightFlipper.active)){ball.vy-=3;}}}
if(ball.y>H+20){balls--;if(balls<=0){gameOver=true;updateInfo();return;}newBall();}
for(var p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life-=0.03;}
particles=particles.filter(function(p){return p.life>0;});
}
function drawCow(x0,y0,scale){x.save();x.translate(x0,y0);x.scale(scale,scale);x.fillStyle='#f5f5f0';x.beginPath();x.ellipse(0,0,30,22,0,0,Math.PI*2);x.fill();x.fillStyle='#3a2a1a';x.beginPath();x.ellipse(-12,-8,8,6,0,0,Math.PI*2);x.fill();x.beginPath();x.ellipse(10,5,10,7,0,0,Math.PI*2);x.fill();x.fillStyle='#f5f5f0';x.beginPath();x.ellipse(22,-15,10,8,0,0,Math.PI*2);x.fill();x.fillStyle='#3a2a1a';x.beginPath();x.arc(27,-17,1.5,0,Math.PI*2);x.fill();x.beginPath();x.arc(24,-13,1.5,0,Math.PI*2);x.fill();x.fillStyle='#ff9999';x.beginPath();x.ellipse(28,-10,3,2,0,0,Math.PI*2);x.fill();x.restore();}
function render(){
x.fillStyle='#0d0d1a';x.fillRect(0,0,W,H);
var grad=x.createRadialGradient(W/2,300,50,W/2,300,300);grad.addColorStop(0,'#1a1a3e');grad.addColorStop(1,'#0d0d2a');x.fillStyle=grad;x.fillRect(10,10,W-20,H-20);
for(var b of bumpers){x.fillStyle='#2a2a5e';x.beginPath();x.arc(b.x,b.y,b.r+2,0,Math.PI*2);x.fill();x.fillStyle='#4a4a8e';x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.fill();x.fillStyle='#6a6aae';x.beginPath();x.arc(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.4,0,Math.PI*2);x.fill();x.fillStyle='#e8e0d0';x.font='10px monospace';x.textAlign='center';x.fillText(b.pts,b.x,b.y+3);}
x.strokeStyle='#8a8ace';x.lineWidth=8;x.lineCap='round';
x.beginPath();x.moveTo(leftFlipper.x,leftFlipper.y);x.lineTo(leftFlipper.x-70*Math.cos(la),leftFlipper.y+70*Math.sin(la));x.stroke();
x.beginPath();x.moveTo(rightFlipper.x,rightFlipper.y);x.lineTo(rightFlipper.x+70*Math.cos(ra),rightFlipper.y+70*Math.sin(ra));x.stroke();
x.fillStyle='#e8e0d0';x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fill();x.fillStyle='#ffffff';x.beginPath();x.arc(ball.x-2,ball.y-2,ball.r*0.4,0,Math.PI*2);x.fill();
for(var p of particles){x.fillStyle=p.color;x.globalAlpha=p.life;x.beginPath();x.arc(p.x,p.y,3,0,Math.PI*2);x.fill();}x.globalAlpha=1;
drawCow(60,50,0.8);drawCow(340,50,0.8);
if(gameOver){x.fillStyle='rgba(0,0,0,0.7)';x.fillRect(0,0,W,H);x.fillStyle='#e8e0d0';x.font='24px monospace';x.textAlign='center';x.fillText('GAME OVER',W/2,H/2-20);x.fillText('Score: '+score,W/2,H/2+10);x.font='14px monospace';x.fillText('Tap New Game',W/2,H/2+40);}
}
cv.addEventListener('mousedown',function(e){var rect=cv.getBoundingClientRect();var mx=(e.clientX-rect.left)*(W/rect.width);if(mx<W/2)leftFlipper.active=true;else rightFlipper.active=true;});
cv.addEventListener('mouseup',function(e){leftFlipper.active=false;rightFlipper.active=false;});
cv.addEventListener('touchstart',function(e){e.preventDefault();var rect=cv.getBoundingClientRect();var mx=(e.touches[0].clientX-rect.left)*(W/rect.width);if(mx<W/2)leftFlipper.active=true;else rightFlipper.active=true;},false);
cv.addEventListener('touchend',function(e){e.preventDefault();leftFlipper.active=false;rightFlipper.active=false;},false);
document.getElementById('resetBtn').addEventListener('click',reset);
document.getElementById('launchBtn').addEventListener('click',launch);
reset();setInterval(function(){step();render();},16);
</script></body></html>
