<!DOCTYPE html>\n<html lang=en><head><meta charset=UTF-8>\n<meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no">\n<title>Cow Pinball - Oma</title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{background:#1a0a2e;color:#e8d5b7;font:14px monospace;display:flex;flex-direction:column;align-items:center;touch-action:none;overflow:hidden}\n#wrap{position:relative;width:400px;max-width:100vw;height:640px;max-height:100vh;margin:0 auto}\ncanvas{display:block;background:linear-gradient(180deg,#2a1a3e 0%,#1a0a2e 50%,#0a0514 100%);border-radius:12px 12px 0 0}\n#hud{display:flex;justify-content:space-around;align-items:center;width:400px;max-width:100vw;background:#1a0a2e;border-radius:0 0 12px 12px;padding:8px 12px}\n#hud span{font:bold 14px monospace;color:#f4a460}\n#hud span b{color:#ff6b9d}\n#msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font:bold 28px monospace;color:#ff6b9d;text-shadow:0 0 20px #ff6b9d77;pointer-events:none;opacity:0;transition:opacity 0.3s}\n#msg.show{opacity:1}\n#controls{display:flex;gap:12px;margin-top:4px}\nbutton{background:#2a1a4e;color:#f4a460;border:1px solid #f4a46055;padding:8px 16px;border-radius:6px;cursor:pointer;font:12px monospace;user-select:none}\nbutton:active{background:#3a2a5e}\n</style></head><body>\n<div id=wrap>\n<canvas id=cv width=400 height=600></canvas>\n<div id=msg></div>\n</div>\n<div id=hud><span>Score: <b id=score>0</b></span><span>Balls: <b id=balls>3</b></span><span>Best: <b id=best>0</b></span></div>\n<div id=controls><button onclick=newGame()>New Game</button></div>\n<script>\nvar cv=document.getElementById('cv'),x=cv.getContext('2d');\nvar W=400,H=600;\nvar GRAVITY=0.18;\nvar FRICTION=0.998;\nvar RESTITUTION=0.72;\nvar score=0,balls=3,best=0;\nvar ball=null;\nvar plungerPower=0,plungerHolding=false;\nvar leftFlipper={x:140,y:540,angle:0.5,targetAngle:0.5,active:false,len:70,thick:12,pivot:{x:140,y:540}};\nvar rightFlipper={x:260,y:540,angle:-0.5,targetAngle:-0.5,active:false,len:70,thick:12,pivot:{x:260,y:540}};\nvar bumpers=[];\nvar walls=[];\nvar particles=[];\nvar gameOver=false;\nvar launchReady=true;\nvar msgEl=document.getElementById('msg');\n\nfunction initBumpers(){\nbumpers=[\n{x:200,y:150,r:28,hit:0,pts:100,label:'MOO'},\n{x:110,y:230,r:22,hit:0,pts:50,label:'moo'},\n{x:290,y:230,r:22,hit:0,pts:50,label:'moo'},\n{x:200,y:300,r:24,hit:0,pts:75,label:'Moo'},\n{x:90,y:370,r:18,hit:0,pts:30,label:'mu'},\n{x:310,y:370,r:18,hit:0,pts:30,label:'mu'}\n];\n}\n\nfunction initWalls(){\nwalls=[];\nvar plungerX=350;\nwalls.push({type:'line',x1:20,y1:80,x2:20,y2:560});\nwalls.push({type:'line',x1:20,y1:80,x2:380,y2:80});\nwalls.push({type:'line',x1:380,y1:80,x2:380,y2:120});\nwalls.push({type:'line',x1:380,y1:120,x2:plungerX-8,y2:160});\nwalls.push({type:'line',x1:plungerX,y1:120,x2:plungerX,y2:580});\nwalls.push({type:'line',x1:plungerX,y1:580,x2:plungerX-30,y2:560});\nwalls.push({type:'line',x1:plungerX,y1:580,x2:plungerX,y2:580});\n// left side drain guide\nwalls.push({type:'line',x1:20,y1:560,x2:130,y2:560});\nwalls.push({type:'line',x1:270,y1:560,x2:plungerX-8,y2:560});\n// top arc segments\nfor(var i=0;i<12;i++){\nvar a1=Math.PI+i*0.13,a2=Math.PI+(i+1)*0.13;\nvar cx=200,cy=120,rad=180;\nwalls.push({type:'line',x1:cx+Math.cos(a1)*rad,y1:cy+Math.sin(a1)*rad,x2:cx+Math.cos(a2)*rad,y2:cy+Math.sin(a2)*rad});\n}\n}\n\nfunction newBall(){\nreturn{x:360,y:540,vx:0,vy:0,r:9,onPlunger:true};\n}\n\nfunction newGame(){\nscore=0;balls=3;gameOver=false;launchReady=true;\nball=newBall();initBumpers();initWalls();particles=[];\nshowMsg('Pull to launch!',1500);\nupdateHUD();\n}\n\nfunction updateHUD(){\ndocument.getElementById('score').textContent=score;\ndocument.getElementById('balls').textContent=balls;\nif(score>best)best=score;\ndocument.getElementById('best').textContent=best;\n}\n\nfunction showMsg(t,dur){\nmsgEl.textContent=t;msgEl.classList.add('show');\nsetTimeout(function(){msgEl.classList.remove('show');},dur);\n}\n\nfunction spawnParticles(px,py,color,n){\nfor(var i=0;i<n;i++){\nvar a=Math.random()*Math.PI*2,s=2+Math.random()*4;\nparticles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*20,color:color});\n}\n}\n\nfunction updateFlippers(){\n[leftFlipper,rightFlipper].forEach(function(f){\nvar diff=f.targetAngle-f.angle;\nf.angle+=diff*0.35;\n});\n}\n\nfunction getFlipperEnd(f){\nreturn{x:f.pivot.x+Math.cos(f.angle-Math.PI/2)*f.len,y:f.pivot.y+Math.sin(f.angle-Math.PI/2)*f.len};\n}\n\nfunction collideFlipper(f){\nif(!ball||ball.onPlunger)return;\nvar end=getFlipperEnd(f);\nvar dx=ball.x-f.pivot.x,dy=ball.y-f.pivot.y;\nvar fx=end.x-f.pivot.x,fy=end.y-f.pivot.y;\nvar fLen2=fx*fx+fy*fy;\nvar t=Math.max(0,Math.min(1,(dx*fx+dy*fy)/fLen2));\nvar closestX=f.pivot.x+fx*t,closestY=f.pivot.y+fy*t;\nvar distX=ball.x-closestX,distY=ball.y-closestY;\nvar dist=Math.sqrt(distX*distX+distY*distY);\nvar minDist=ball.r+f.thick/2;\nif(dist<minDist){\nvar nx=distX/dist,ny=distY/dist;\nball.x=closestX+nx*minDist;\nball.y=closestY+ny*minDist;\nvar dot=ball.vx*nx+ball.vy*ny;\nball.vx-=2*dot*nx*RESTITUTION;\nball.vy-=2*dot*ny*RESTITUTION;\nif(f.active){\nball.vy-=5;\nball.vx+=(f===leftFlipper?3:-3);\n}\n}\n}\n\nfunction collideBumpers(){\nif(!ball||ball.onPlunger)return;\nbumpers.forEach(function(b){\nvar dx=ball.x-b.x,dy=ball.y-b.y,dist=Math.sqrt(dx*dx+dy*dy);\nvar minDist=ball.r+b.r;\nif(dist<minDist){\nvar nx=dx/dist,ny=dy/dist;\nball.x=b.x+nx*minDist;\nball.y=b.y+ny*minDist;\nvar dot=ball.vx*nx+ball.vy*ny;\nball.vx-=2*dot*nx;\nball.vy-=2*dot*ny;\nball.vx+=nx*4;ball.vy+=ny*4;\nscore+=b.pts;b.hit=20;\nspawnParticles(b.x,b.y,'#ff6b9d',12);\nupdateHUD();\n}\n});\n}\n\nfunction collideWalls(){\nif(!ball||ball.onPlunger)return;\nwalls.forEach(function(w){\nvar dx=w.x2-w.x1,dy=w.y2-w.y1;\nvar len=Math.sqrt(dx*dx+dy*dy);\nif(len<0.01)return;\nvar nx=-dy/len,ny=dx/len;\nvar t=((ball.x-w.x1)*dx+(ball.y-w.y1)*dy)/len;\nt=Math.max(0,Math.min(1,t));\nvar cx=w.x1+dx*t,cy=w.y1+dy*t;\nvar distX=ball.x-cx,distY=ball.y-cy;\nvar dist=Math.sqrt(distX*distX+distY*distY);\nif(dist<ball.r+2){\nvar ddx=distX/dist,ddy=distY/dist;\nball.x=cx+ddx*(ball.r+2);\nball.y=cy+ddy*(ball.r+2);\nvar dot=ball.vx*ddx+ball.vy*ddy;\nif(dot<0){\nball.vx-=2*dot*ddx*RESTITUTION;\nball.vy-=2*dot*ddy*RESTITUTION;\n}\n}\n});\n}\n\nfunction updateBall(){\nif(!ball)return;\nif(ball.onPlunger){\nball.x=360;ball.y=540+plungerPower*0.3;\nreturn;\n}\nball.vy+=GRAVITY;\nball.vx*=FRICTION;ball.vy*=FRICTION;\nball.x+=ball.vx;ball.y+=ball.vy;\n// max speed\nvar sp=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);\nif(sp>12){ball.vx=ball.vx/sp*12;ball.vy=ball.vy/sp*12;}\n// substeps for collision accuracy\nfor(var s=0;s<2;s++){\ncollideWalls();\ncollideBumpers();\ncollideFlipper(leftFlipper);\ncollideFlipper(rightFlipper);\n}\n// drain check\nif(ball.y>H+10){\nballs--;updateHUD();\nif(balls>0){\nball=newBall();launchReady=true;showMsg('Ball lost! '+balls+' left',1500);\n}else{\nball=null;gameOver=true;showMsg('Game Over! Score: '+score,99999);\n}\n}\n}\n\nfunction drawCow(ctx,cx,cy,r,label,hitFlash){\nctx.save();\nctx.translate(cx,cy);\n// glow if hit\nif(hitFlash>0){ctx.shadowBlur=hitFlash;ctx.shadowColor='#ff6b9d';}\n// body\nctx.fillStyle='#f5e6d3';\nctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();\n// spots\nctx.fillStyle='#3d2317';\nctx.beginPath();ctx.arc(-r*0.3,-r*0.2,r*0.2,0,Math.PI*2);ctx.fill();\nctx.beginPath();ctx.arc(r*0.2,r*0.3,r*0.15,0,Math.PI*2);ctx.fill();\nctx.beginPath();ctx.arc(r*0.35,-r*0.4,r*0.1,0,Math.PI*2);ctx.fill();\n// horns\nctx.strokeStyle='#d4a76a';ctx.lineWidth=2;\nctx.beginPath();ctx.moveTo(-r*0.6,-r*0.7);ctx.lineTo(-r*0.8,-r*0.95);ctx.stroke();\nctx.beginPath();ctx.moveTo(r*0.6,-r*0.7);ctx.lineTo(r*0.8,-r*0.95);ctx.stroke();\nctx.shadowBlur=0;\n// label\nctx.fillStyle=hitFlash>0?'#ff6b9d':'#7a5c3e';\nctx.font='bold '+(r*0.35)+'px monospace';\nctx.textAlign='center';ctx.textBaseline='middle';\nctx.fillText(label,0,r*0.05);\nctx.restore();\n}\n\nfunction drawFlipper(f){\nvar end=getFlipperEnd(f);\nx.save();\n// pivot\nx.fillStyle='#8b6914';\nx.beginPath();x.arc(f.pivot.x,f.pivot.y,f.thick/2+2,0,Math.PI*2);x.fill();\n// flipper body\nx.strokeStyle=f.active?'#ff6b9d':'#f4a460';\nx.lineWidth=f.thick;\nx.lineCap='round';\nx.beginPath();x.moveTo(f.pivot.x,f.pivot.y);x.lineTo(end.x,end.y);x.stroke();\n// cow pattern on flipper\nx.strokeStyle='#3d2317';\nx.lineWidth=2;\nfor(var i=0.2;i<0.8;i+=0.2){\nvar px=f.pivot.x+(end.x-f.pivot.x)*i;\nvar py=f.pivot.y+(end.y-f.pivot.y)*i;\nx.beginPath();x.arc(px,py,3,0,Math.PI*2);x.stroke();\n}\nx.restore();\n}\n\nfunction draw(){\nx.clearRect(0,0,W,H);\n// background stars\nx.fillStyle='rgba(255,255,255,0.3)';\nfor(var i=0;i<30;i++){\nvar sx=(i*73)%W,sy=(i*97)%(H-100)+50;\nx.fillRect(sx,sy,1,1);\n}\n// walls\nwalls.forEach(function(w){\nx.strokeStyle='#4a3a6e';x.lineWidth=3;\nx.beginPath();x.moveTo(w.x1,w.y1);x.lineTo(w.x2,w.y2);x.stroke();\n});\n// bumpers as cows\nbumpers.forEach(function(b){\ndrawCow(x,b.x,b.y,b.r,b.label,b.hit);\nif(b.hit>0)b.hit--;\n});\n// plunger\nx.fillStyle='#5a4a7e';\nx.fillRect(352,540-plungerPower*0.3,16,60+plungerPower*0.3);\nx.fillStyle='#ff6b9d';\nx.fillRect(352,540-plungerPower*0.3,16,8);\n// flippers\ndrawFlipper(leftFlipper);\ndrawFlipper(rightFlipper);\n// ball\nif(ball){\nx.save();\nx.shadowBlur=10;x.shadowColor='#ff6b9d';\nx.fillStyle='#fff';\nx.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fill();\nx.fillStyle='#ff6b9d';\nx.beginPath();x.arc(ball.x-2,ball.y-2,ball.r*0.3,0,Math.PI*2);x.fill();\nx.restore();\n}\n// particles\nparticles=particles.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;return p.life>0;});\nparticles.forEach(function(p){\nx.globalAlpha=p.life/50;\nx.fillStyle=p.color;\nx.beginPath();x.arc(p.x,p.y,2,0,Math.PI*2);x.fill();\n});\nx.globalAlpha=1;\n}\n\nfunction loop(){\nupdateFlippers();\nupdateBall();\ndraw();\nrequestAnimationFrame(loop);\n}\n\n// Input\ncv.addEventListener('touchstart',handleDown,false);\ncv.addEventListener('touchend',handleUp,false);\ncv.addEventListener('mousedown',handleDown,false);\ncv.addEventListener('mouseup',handleUp,false);\ncv.addEventListener('keydown',function(e){\nif(e.key==='ArrowLeft'||e.key==='a'){leftFlipper.active=true;leftFlipper.targetAngle=-0.5;}\nif(e.key==='ArrowRight'||e.key==='d'){rightFlipper.active=true;rightFlipper.targetAngle=0.5;}\nif(e.key===' '&&ball&&ball.onPlunger){plungerHolding=true;}\n},false);\ncv.addEventListener('keyup',function(e){\nif(e.key==='ArrowLeft'||e.key==='a'){leftFlipper.active=false;leftFlipper.targetAngle=0.5;}\nif(e.key==='ArrowRight'||e.key==='d'){rightFlipper.active=false;rightFlipper.targetAngle=-0.5;}\nif(e.key===' '&&plungerHolding){launch();}\n},false);\n\nfunction handleDown(e){\ne.preventDefault();\nvar rect=cv.getBoundingClientRect();\nvar mx,my;\nif(e.touches){mx=e.touches[0].clientX-rect.left;my=e.touches[0].clientY-rect.top;}\nelse{mx=e.clientX-rect.left;my=e.clientY-rect.top;}\nvar scale=W/rect.width;\nmx*=scale;my*=scale*(H/rect.height);\n// plunger zone\nif(ball&&ball.onPlunger&&mx>330){plungerHolding=true;return;}\n// left half = left flipper, right half = right flipper\nif(mx<W/2){leftFlipper.active=true;leftFlipper.targetAngle=-0.5;}\nelse{rightFlipper.active=true;rightFlipper.targetAngle=0.5;}\n}\n\nfunction handleUp(e){\ne.preventDefault();\nif(plungerHolding){launch();}\nleftFlipper.active=false;leftFlipper.targetAngle=0.5;\nrightFlipper.active=false;rightFlipper.targetAngle=-0.5;\n}\n\nvar plungerAnim=0;\nfunction launch(){\nif(!ball||!ball.onPlunger)return;\nplungerHolding=false;\nvar power=Math.max(6,plungerPower*0.12+6);\nball.onPlunger=false;\nball.vx=-1-Math.random()*2;\nball.vy=-power;\nplungerPower=0;\nshowMsg('🚀',600);\n}\n\n// plunger charging\nsetInterval(function(){\nif(plungerHolding&&plungerPower<100){plungerPower+=2;}\n},16);\n\nnewGame();\nloop();\n</script></body></html>
