<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Oma Dragon Flight</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a1a;display:flex;justify-content:center;align-items:center;height:100vh;font-family:monospace}canvas{border:2px solid #333;border-radius:8px}#wrap{position:relative}#hud{position:absolute;top:10px;left:10px;color:#8af;font-size:16px;pointer-events:none;z-index:10;text-shadow:0 0 4px #000}</style><script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script></head><body><div id="wrap"><div id="hud">Score: 0  |  Lives: 3</div><div id="game"></div></div><script>const W=800,H=600;let score=0,lives=3,gs;const hud=document.getElementById("hud");const config={type:Phaser.AUTO,width:W,height:H,parent:"game",physics:{default:"arcade",arcade:{gravity:{y:0},debug:false}},scene:{preload:preload,create:create,update:update}};const game=new Phaser.Game(config);function preload(){let dg=this.make.graphics({x:0,y:0});dg.fillStyle(0x22aa88);dg.fillEllipse(0,0,36,18);dg.fillStyle(0x11ccaa);dg.fillTriangle(-14,-2,-26,-12,-14,-8);dg.fillTriangle(14,-2,26,-12,14,-8);dg.fillStyle(0xff6644);dg.fillCircle(10,-3,3);dg.fillStyle(0xffaa00);dg.fillTriangle(16,0,24,-2,16,2);dg.generateTexture("dragon",52,28);let g=this.make.graphics({x:0,y:0});g.fillStyle(0x44ddff);g.fillTriangle(-6,-6,6,-6,0,6);g.fillStyle(0x88eeff);g.fillTriangle(-4,-4,4,-4,0,3);g.generateTexture("gem",14,14);let r=this.make.graphics({x:0,y:0});r.fillStyle(0x886644);r.fillCircle(0,0,10);r.fillStyle(0xaa8855);r.fillCircle(-3,-3,4);r.generateTexture("rock",22,22);let f=this.make.graphics({x:0,y:0});f.fillStyle(0xff4400);f.fillCircle(0,0,6);f.fillStyle(0xffaa00);f.fillCircle(0,0,3);f.generateTexture("fireball",14,14);let s=this.make.graphics({x:0,y:0});s.fillStyle(0xffffff);s.fillCircle(0,0,1);s.generateTexture("star",2,2)}function create(){gs=this;this.cameras.main.setBackgroundColor("#0a0a2a");this.stars=[];for(let i=0;i<80;i++){let s=this.add.image(Phaser.Math.Between(0,W),Phaser.Math.Between(0,H),"star");s.alpha=Phaser.Math.FloatBetween(0.3,1);this.stars.push(s)}this.player=this.physics.add.sprite(120,H/2,"dragon");this.player.setCollideWorldBounds(true);this.cursors=this.input.keyboard.createCursorKeys();this.input.on("pointerdown",shootFireball,this);this.input.keyboard.on("keydown-SPACE",shootFireball,this);this.gems=this.physics.add.group();this.rocks=this.physics.add.group();this.fireballs=this.physics.add.group();this.physics.add.overlap(this.player,this.gems,collectGem,null,this);this.physics.add.overlap(this.player,this.rocks,hitRock,null,this);this.physics.add.overlap(this.fireballs,this.rocks,destroyRock,null,this);this.time.addEvent({delay:1200,callback:spawnGem,callbackScope:this,loop:true});this.time.addEvent({delay:2000,callback:spawnRock,callbackScope:this,loop:true});this.gameOver=false;updateHUD()}function shootFireball(){if(gs.gameOver)return;if(!gs.lastShot||gs.time.now-gs.lastShot>300){let f=gs.fireballs.create(gs.player.x+20,gs.player.y,"fireball");f.setVelocityX(400);f.body.setAllowGravity(false);f.setDepth(5);gs.lastShot=gs.time.now}}function spawnGem(){if(this.gameOver)return;let g=this.gems.create(W+20,Phaser.Math.Between(50,H-50),"gem");g.setVelocityX(Phaser.Math.Between(-120,-80));g.body.setAllowGravity(false);g.setDepth(3)}function spawnRock(){if(this.gameOver)return;let r=this.rocks.create(W+20,Phaser.Math.Between(30,H-30),"rock");r.setVelocityX(Phaser.Math.Between(-160,-100));r.body.setAllowGravity(false);r.body.setCircle(10);r.setAngularVelocity(Phaser.Math.Between(-80,80));r.setDepth(3)}function collectGem(p,g){g.destroy();score+=10;updateHUD();let pt=gs.add.particles("star");pt.createEmitter({x:g.x,y:g.y,speed:60,lifespan:400,quantity:8,scale:{start:1.5,end:0}});gs.time.delayedCall(400,()=>{pt.destroy()})}function hitRock(p,r){r.destroy();lives--;updateHUD();this.cameras.main.shake(150,0.01);if(lives<=0)endGame()}function destroyRock(f,r){f.destroy();r.destroy();score+=5;updateHUD();let pt=gs.add.particles("star");pt.createEmitter({x:r.x,y:r.y,speed:80,lifespan:300,quantity:6,tint:0xff6600,scale:{start:1.2,end:0}});gs.time.delayedCall(300,()=>{pt.destroy()})}function updateHUD(){hud.textContent="Score: "+score+"  |  Lives: "+lives}function endGame(){gs.gameOver=true;gs.physics.pause();gs.player.setTint(0xff0000);gs.add.text(W/2,H/2-20,"GAME OVER",{fontSize:"48px",fontFamily:"monospace",color:"#ff4444",fontStyle:"bold"}).setOrigin(0.5).setDepth(20);gs.add.text(W/2,H/2+30,"Final Score: "+score+"
Click to restart",{fontSize:"20px",fontFamily:"monospace",color:"#88aaff",align:"center"}).setOrigin(0.5).setDepth(20);gs.input.once("pointerdown",()=>{score=0;lives=3;gs.scene.restart()})}function update(){if(this.gameOver)return;let sp=250;if(this.cursors.up.isDown)this.player.setVelocityY(-sp);else if(this.cursors.down.isDown)this.player.setVelocityY(sp);else this.player.setVelocityY(0);if(this.cursors.left.isDown)this.player.setVelocityX(-sp*0.6);else if(this.cursors.right.isDown)this.player.setVelocityX(sp*0.6);else this.player.setVelocityX(0);this.player.rotation=Math.sin(this.time.now*0.005)*0.05+this.player.body.velocity.y*0.0008;this.stars.forEach(s=>{s.x-=0.5;if(s.x<0){s.x=W;s.y=Phaser.Math.Between(0,H)}});this.gems.children.iterate(g=>{if(g&&g.x<-30)g.destroy()});this.rocks.children.iterate(r=>{if(r&&r.x<-30)r.destroy()});this.fireballs.children.iterate(f=>{if(f&&f.x>W+30)f.destroy()})}</script></body></html>
