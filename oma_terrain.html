<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Oma Terrain — 3D Wireframe Landscape</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#020208;overflow:hidden;height:100vh;width:100vw}canvas{display:block;cursor:grab}.hud{position:fixed;top:10px;left:10px;color:#40ffaa;font-family:Courier New,monospace;font-size:0.8rem;text-shadow:0 0 10px rgba(64,255,170,0.4);pointer-events:none;line-height:1.6;z-index:10}.title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#60ffb0;font-family:Courier New,monospace;font-size:2rem;font-weight:bold;letter-spacing:8px;text-shadow:0 0 30px rgba(64,255,170,0.5);pointer-events:none;opacity:0;transition:opacity 2s;z-index:10}.hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:#1a5040;font-family:Courier New,monospace;font-size:0.75rem;pointer-events:none;z-index:10}</style></head><body><canvas id="c"></canvas><div class="hud" id="hud">OMA TERRAIN<br>Wireframe 3D Landscape<br>Drag to rotate</div><div class="title" id="title">OMA TERRAIN</div><div class="hint" id="hint">3D wireframe terrain — drag to rotate, click to regenerate, scroll to zoom</div><script>const cv=document.getElementById('c');const ctx=cv.getContext('2d');let W,H;function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H}resize();addEventListener('resize',resize);const COLS=48,ROWS=48;const CELL=14;let terrain=[];let rotX=0.5,rotY=0;let zoom=1;let t=0;let seed=Math.random()*1000;let dragging=false,lastX=0,lastY=0;function generateTerrain(){terrain=[];for(let r=0;r<=ROWS;r++){const row=[];for(let c=0;c<=COLS;c++){const x=c/COLS*4-2;const y=r/ROWS*4-2;let h=0;h+=Math.sin(x*1.5+seed)*Math.cos(y*1.5+seed)*0.5;h+=Math.sin(x*3+seed*0.7)*Math.cos(y*3+seed*0.7)*0.25;h+=Math.sin(x*6+seed*0.4)*Math.cos(y*6+seed*0.4)*0.12;h+=Math.sin(Math.sqrt(x*x+y*y)*4+seed)*0.3;row.push(h)}terrain.push(row)}}generateTerrain();function project(x,y,z){const cosY=Math.cos(rotY),sinY=Math.sin(rotY);const cosX=Math.cos(rotX),sinX=Math.sin(rotX);const x1=x*cosY-z*sinY;const z1=x*sinY+z*cosY;const y1=y*cosX-z1*sinX;const z2=y*sinX+z1*cosX;const dist=4;const scale=zoom*200/(dist+z2*0.3);const px=W/2+x1*scale;const py=H/2+y1*scale*0.6-z2*15*zoom;return{x:px,y:py,depth:z2}}function getColor(depth,z){const norm=(depth+2)/4;const hue=150+norm*120;const sat=70;const lum=30+norm*30+Math.min(30,z*40);return`hsl(${hue},${sat}%,${Math.max(10,lum)}%)`}function render(){t++;ctx.fillStyle='rgba(2,2,8,0.15)';ctx.fillRect(0,0,W,H);ctx.lineWidth=1;for(let r=0;r<ROWS;r++){for(let c=0;c<COLS;c++){const x0=c/COLS*4-2;const x1=(c+1)/COLS*4-2;const z0=r/ROWS*4-2;const z1=(r+1)/ROWS*4-2;const wY=0.4*Math.sin(t*0.02+c*0.2)*0.1;const h00=terrain[r][c]+wY;const h10=terrain[r][c+1]+wY;const h01=terrain[r+1][c]+wY;const h11=terrain[r+1][c+1]+wY;const p00=project(x0,h00,z0);const p10=project(x1,h10,z0);const p01=project(x0,h01,z1);const p11=project(x1,h11,z1);const avgDepth=(p00.depth+p10.depth+p01.depth+p11.depth)/4;const color=getColor(avgDepth,h00);ctx.strokeStyle=color;ctx.globalAlpha=Math.max(0.15,Math.min(0.9,0.6+avgDepth*0.3));ctx.beginPath();ctx.moveTo(p00.x,p00.y);ctx.lineTo(p10.x,p10.y);ctx.lineTo(p11.x,p11.y);ctx.lineTo(p01.x,p01.y);ctx.closePath();ctx.stroke();if(c%4===0&&r%4===0){const cx=(p00.x+p10.x+p01.x+p11.x)/4;const cy=(p00.y+p10.y+p01.y+p11.y)/4;ctx.fillStyle=color;ctx.beginPath();ctx.arc(cx,cy,1.5,0,Math.PI*2);ctx.fill()}}}ctx.globalAlpha=1;if(!dragging){rotY+=0.005;rotX=0.5+Math.sin(t*0.005)*0.2}if(t%20===0)document.getElementById('hud').innerHTML='OMA TERRAIN<br>Wireframe 3D Landscape<br>Drag to rotate • Click to regenerate'}cv.addEventListener('mousedown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;cv.style.cursor='grabbing'});addEventListener('mouseup',()=>{dragging=false;cv.style.cursor='grab'});addEventListener('mousemove',e=>{if(dragging){rotY+=(e.clientX-lastX)*0.01;rotX+=(e.clientY-lastY)*0.01;lastX=e.clientX;lastY=e.clientY}});cv.addEventListener('click',e=>{if(Math.abs(e.clientX-lastX)<5&&Math.abs(e.clientY-lastY)<5){seed=Math.random()*1000;generateTerrain()}});cv.addEventListener('contextmenu',e=>{e.preventDefault();seed=Math.random()*1000;generateTerrain()});cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(0.3,Math.min(3,zoom*(1-e.deltaY*0.001))});setTimeout(()=>document.getElementById('title').style.opacity='0.6',100);setTimeout(()=>document.getElementById('title').style.opacity='0',3000);setInterval(render,16)</script></body></html>
